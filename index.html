toidectomia","B":"colectomia","C":"laringectomia","D":"septoplastia","E":"sialoendoscopia com extração do cálculo em casos selecionados"},"answer":"E","topic":"Glândulas Salivares","explanation":"Sialoendoscopia permite diagnóstico e tratamento de obstruções ductais, incluindo retirada de cálculos selecionados e dilatação de estenoses."},{"number":32,"area":"Otorrinolaringologia","stem":"Adulto com AOS leve a moderada não tolera CPAP e possui dentição adequada. Uma alternativa terapêutica possível é:","options":{"A":"benzodiazepínico","B":"aparelho intraoral de avanço mandibular","C":"antibiótico noturno","D":"oxigênio isolado como cura universal","E":"laringectomia"},"answer":"B","topic":"Sono e Via Aérea Superior","explanation":"Aparelhos de avanço mandibular são opção para AOS leve/moderada e para pacientes selecionados que não toleram CPAP, idealmente com acompanhamento odontológico e do sono."},{"number":33,"area":"Otorrinolaringologia","stem":"Criança com AOS grave e síndrome craniofacial será submetida a adenotonsilectomia. No pós-operatório, é particularmente importante:","options":{"A":"dispensar avaliação de saturação","B":"monitorização respiratória adequada pelo maior risco de complicações e doença residual","C":"alta imediata obrigatória","D":"proibir qualquer reavaliação do sono","E":"uso de opioides em altas doses sem monitorização"},"answer":"B","topic":"Sono e Via Aérea Superior","explanation":"AOS grave e comorbidades aumentam risco de complicações respiratórias pós-operatórias; esses pacientes frequentemente necessitam observação hospitalar e seguimento."},{"number":34,"area":"Otorrinolaringologia","stem":"Criança apresenta craniossinostose, hipoplasia do terço médio da face e sindactilia de mãos e pés. O diagnóstico mais provável é:","options":{"A":"síndrome de Ménière","B":"Treacher Collins","C":"síndrome de Apert","D":"síndrome de Frey","E":"Pierre Robin isolada"},"answer":"C","topic":"Craniofacial e Pediatria","explanation":"Apert é síndrome de craniossinostose sindrômica associada a hipoplasia médio-facial e sindactilia característica."},{"number":35,"area":"Otorrinolaringologia","stem":"Paciente com cisto cervical lateral de segunda fenda branquial será operado. Para reduzir recorrência, o princípio cirúrgico é:","options":{"A":"ressecar completamente o cisto e eventual trajeto associado, preservando estruturas neurovasculares","B":"apenas aspirar o conteúdo","C":"drenar repetidamente como tratamento definitivo","D":"realizar radioterapia","E":"deixar deliberadamente parte da parede"},"answer":"A","topic":"Pescoço e Tireoide","explanation":"Exérese completa é tratamento definitivo das anomalias branquiais sintomáticas; infecção aguda deve ser controlada antes da cirurgia quando possível."},{"number":36,"area":"Otorrinolaringologia","stem":"Adulto tem carcinoma papilífero microscópico identificado incidentalmente na parede de um cisto do ducto tireoglosso. Antes de decidir extensão do tratamento, deve-se:","options":{"A":"considerar sempre doença benigna sem investigação","B":"avaliar tireoide, linfonodos cervicais e fatores de risco, além de garantir procedimento de Sistrunk adequado","C":"indicar parotidectomia","D":"realizar apenas punções repetidas","E":"ignorar a tireoide"},"answer":"B","topic":"Pescoço e Tireoide","explanation":"Carcinoma em cisto tireoglosso é raro e geralmente papilífero. O Sistrunk é base do tratamento; tireoidectomia adicional é individualizada conforme tireoide, linfonodos e risco."},{"number":37,"area":"Otorrinolaringologia","stem":"Paciente sofre trauma cervical fechado e apresenta disfonia, enfisema cervical e dor laríngea, porém respira espontaneamente. A prioridade é:","options":{"A":"introduzir sonda nasogástrica às cegas antes de avaliar via aérea","B":"prescrever apenas anti-inflamatório e liberar","C":"realizar manobra de Epley","D":"avaliar e proteger a via aérea, evitando intubação traumática às cegas quando houver suspeita de lesão laríngea significativa","E":"realizar estapedotomia"},"answer":"D","topic":"Trauma e Emergências","explanation":"Trauma laríngeo pode deteriorar rapidamente por edema/hematoma. Manejo de via aérea deve ser planejado com equipe experiente; em lesões graves, via aérea cirúrgica pode ser mais segura."},{"number":38,"area":"Otorrinolaringologia","stem":"Criança previamente saudável apresenta tosse súbita, engasgo e sibilância unilateral após brincar com amendoim. Radiografia pode ser normal. A conduta diagnóstica-terapêutica padrão diante de forte suspeita é:","options":{"A":"observação domiciliar por uma semana","B":"teste calórico","C":"laringoscopia indireta como único exame","D":"broncoscopia rígida","E":"antibiótico oral apenas"},"answer":"D","topic":"Trauma e Emergências","explanation":"Corpo estranho de via aérea em criança pode ter radiografia normal. Broncoscopia rígida permite diagnóstico e remoção, sendo padrão clássico em forte suspeita."},{"number":39,"area":"Otorrinolaringologia","stem":"Adulto com faringite recente evolui com febre alta, dor cervical e edema ao longo do esternocleidomastoideo. TC mostra tromboflebite da veia jugular interna e embolizações pulmonares sépticas. O quadro é:","options":{"A":"síndrome de Eagle","B":"síndrome de Frey","C":"síndrome de Lemierre","D":"síndrome de Horner","E":"síndrome de Ménière"},"answer":"C","topic":"Cavidade Oral e Faringologia","explanation":"Síndrome de Lemierre é tromboflebite séptica da jugular interna, frequentemente após infecção orofaríngea por Fusobacterium necrophorum, com embolizações sépticas."},{"number":40,"area":"Otorrinolaringologia","stem":"Criança com otite média aguda evolui com febre persistente, protrusão do pavilhão e edema retroauricular doloroso. A complicação mais provável e a conduta inicial são:","options":{"A":"paralisia de Bell sem relação com a otite","B":"mastoidite aguda, com antibiótico intravenoso e avaliação para drenagem/mastoidectomia conforme complicações e resposta","C":"rinite alérgica tratada com anti-histamínico","D":"VPPB tratado com Epley","E":"otosclerose tratada com aparelho auditivo apenas"},"answer":"B","topic":"Otologia e Audiologia","explanation":"Mastoidite aguda é complicação de otite média e pode formar abscesso subperiosteal ou complicações intracranianas. Requer antibiótico IV e abordagem cirúrgica quando há coleção, complicação ou falha terapêutica."},{"number":41,"area":"Cirurgia Geral","stem":"Paciente com choque hemorrágico grave após trauma necessita protocolo de transfusão maciça. Uma estratégia moderna busca:","options":{"A":"adiar plasma até 48 horas","B":"grandes volumes de cristaloide como única terapia","C":"evitar cálcio durante transfusão maciça","D":"ressuscitação hemostática com proporções equilibradas de hemocomponentes e controle precoce da hemorragia","E":"corrigir hipotermia apenas após cirurgia"},"answer":"D","topic":"Trauma e Emergências","explanation":"Ressuscitação de controle de danos prioriza sangue e hemocomponentes em proporções equilibradas, minimiza cristaloides, corrige cálcio/hipotermia e controla rapidamente a fonte de sangramento."},{"number":42,"area":"Cirurgia Geral","stem":"Paciente politraumatizado com acidose grave, hipotermia e coagulopatia apresenta múltiplas lesões abdominais. A filosofia de cirurgia de controle de danos consiste em:","options":{"A":"não retornar ao centro cirúrgico","B":"realizar todas as reconstruções complexas apesar da fisiologia crítica","C":"evitar tamponamento","D":"prolongar cirurgia até normalizar lactato na sala","E":"controle rápido de hemorragia e contaminação, fechamento temporário e reanimação em UTI antes da reconstrução definitiva"},"answer":"E","topic":"Trauma e Emergências","explanation":"Controle de danos interrompe o ciclo letal de hipotermia, acidose e coagulopatia, abreviando a primeira operação e adiando reconstruções até recuperação fisiológica."},{"number":43,"area":"Cirurgia Geral","stem":"Paciente com queimadura extensa chega ao pronto atendimento. Na reposição inicial com fórmula de Parkland, o volume calculado deve ser baseado principalmente em:","options":{"A":"peso corporal e porcentagem de superfície corporal queimada de segundo e terceiro graus","B":"altura e idade apenas","C":"circunferência abdominal","D":"nível sérico de amilase","E":"área de primeiro grau isolada"},"answer":"A","topic":"Trauma e Emergências","explanation":"A fórmula de Parkland usa 4 mL × kg × %SCQ com Ringer lactato nas primeiras 24 horas, ajustando pela resposta clínica; metade é administrada nas primeiras 8 horas a partir da queimadura."},{"number":44,"area":"Cirurgia Geral","stem":"Paciente em uso crônico de prednisona em dose supressora do eixo hipotálamo-hipófise-adrenal será submetido a cirurgia de grande porte. A conduta deve:","options":{"A":"suspender abruptamente todo corticoide","B":"ignorar risco de insuficiência adrenal","C":"considerar cobertura perioperatória com glicocorticoide conforme dose crônica, duração e estresse cirúrgico","D":"administrar apenas insulina","E":"dar antibiótico no lugar de corticoide"},"answer":"C","topic":"Perioperatório e Ética","explanation":"Pacientes com provável supressão do eixo podem necessitar suplementação perioperatória de glicocorticoide proporcional ao estresse, evitando crise adrenal e excesso desnecessário."},{"number":45,"area":"Cirurgia Geral","stem":"Paciente com ileostomia de alto débito desenvolve fraqueza, hipotensão e piora renal. Um distúrbio esperado é:","options":{"A":"depleção de sódio e água com risco de hipomagnesemia","B":"hipernatremia por absorção excessiva","C":"hipercalcemia por retenção intestinal","D":"hipervolemia obrigatória","E":"ausência de perdas eletrolíticas"},"answer":"A","topic":"Nutrição e Metabolismo","explanation":"Ileostomias de alto débito causam perdas importantes de água, sódio e magnésio. Manejo inclui reposição dirigida e redução do débito conforme causa."},{"number":46,"area":"Cirurgia Geral","stem":"Durante remodelamento da ferida, o colágeno inicialmente depositado é gradualmente reorganizado. A mudança típica envolve:","options":{"A":"redução contínua da resistência até zero","B":"substituição de tipo I por tipo III indefinidamente","C":"substituição relativa de colágeno tipo III por tipo I e aumento progressivo da resistência tênsil","D":"desaparecimento completo do colágeno","E":"predomínio de elastina sem colágeno"},"answer":"C","topic":"Cicatrização e Feridas","explanation":"A fase de remodelamento reorganiza fibras e aumenta resistência; colágeno tipo III inicial é parcialmente substituído por tipo I, embora a ferida nunca recupere 100% da força original."},{"number":47,"area":"Cirurgia Geral","stem":"No 7º dia após laparotomia, paciente apresenta saída súbita de grande quantidade de líquido serossanguinolento pela incisão e sensação de “estalo”. Deve-se suspeitar de:","options":{"A":"celulite sem risco fascial","B":"deiscência fascial","C":"cicatriz hipertrófica","D":"queloide","E":"seroma simples obrigatoriamente"},"answer":"B","topic":"Cicatrização e Feridas","explanation":"Drenagem serossanguinolenta súbita (“salmon-colored”) e sensação de ruptura no período de maior vulnerabilidade fascial sugerem deiscência, uma emergência cirúrgica se houver evisceração ou falha completa."},{"number":48,"area":"Cirurgia Geral","stem":"Em paciente diabético submetido a cirurgia, controle glicêmico perioperatório adequado é importante porque hiperglicemia está associada a:","options":{"A":"redução obrigatória de trombose","B":"nenhum efeito clínico","C":"proteção contra infecção","D":"melhor cicatrização independentemente do nível","E":"maior risco de infecção e piores desfechos"},"answer":"E","topic":"Inflamação, Infecção e Sepse","explanation":"Hiperglicemia perioperatória associa-se a infecção, complicações e mortalidade. Metas devem evitar tanto hiperglicemia significativa quanto hipoglicemia."},{"number":49,"area":"Cirurgia Geral","stem":"Hérnia inguinal que apresenta componentes direto e indireto simultaneamente, envolvendo ambos os lados dos vasos epigástricos inferiores, é chamada:","options":{"A":"hérnia obturatória","B":"hérnia de Richter","C":"hérnia de Littre","D":"hérnia de Spiegel","E":"hérnia em pantalona"},"answer":"E","topic":"Hérnias e Parede Abdominal","explanation":"Hérnia em pantalona combina saco indireto lateral e defeito direto medial aos vasos epigástricos inferiores."},{"number":50,"area":"Cirurgia Geral","stem":"Atleta apresenta dor inguinal crônica relacionada ao esforço sem hérnia verdadeira palpável, associada a lesão da inserção musculotendínea da parede posterior. O termo “hérnia do esportista” refere-se a:","options":{"A":"hérnia obturatória","B":"hérnia femoral encarcerada","C":"síndrome dolorosa inguinal por lesão musculotendínea, não necessariamente uma hérnia verdadeira","D":"eventração pós-operatória","E":"hérnia de Richter"},"answer":"C","topic":"Hérnias e Parede Abdominal","explanation":"Athletic pubalgia/sports hernia é uma síndrome de dor inguinal por lesão de estruturas musculotendíneas e aponeuróticas, frequentemente sem defeito herniário clássico."},{"number":51,"area":"Cirurgia Geral","stem":"Paciente com grande hérnia incisional mediana e perda de domínio será submetido a reconstrução complexa. O objetivo das técnicas de separação de componentes é:","options":{"A":"realizar apenas sutura cutânea","B":"evitar qualquer reconstrução fascial","C":"substituir toda parede por pele","D":"permitir avanço miofascial e fechamento da linha média com menor tensão","E":"criar deliberadamente outro defeito herniário"},"answer":"D","topic":"Hérnias e Parede Abdominal","explanation":"Separação de componentes, incluindo abordagens posteriores como TAR, mobiliza planos musculofasciais para restaurar a linha média e acomodar tela em reconstruções complexas."},{"number":52,"area":"Cirurgia Geral","stem":"Paciente com hérnia paraestomal sintomática recorrente será avaliado para reparo. Um princípio importante é:","options":{"A":"considerar uso de tela e técnica individualizada, pois simples sutura apresenta alta recorrência","B":"evitar tela em todos os casos","C":"fechar o estoma definitivamente sem reconstrução intestinal em qualquer paciente","D":"realizar apenas punção da hérnia","E":"não operar jamais"},"answer":"A","topic":"Hérnias e Parede Abdominal","explanation":"Reparo por sutura simples tem alta recorrência. Técnicas com tela, reposicionamento do estoma ou abordagens específicas são escolhidas conforme anatomia e contexto."},{"number":53,"area":"Cirurgia Geral","stem":"Paciente com pequena perfuração esofágica cervical iatrogênica, contida, diagnosticada precocemente, sem sepse e com boa drenagem, pode em casos selecionados ser tratado com:","options":{"A":"manejo não operatório intensivo com jejum, antibiótico e drenagem/monitorização adequados","B":"alimentação sólida precoce","C":"esofagectomia obrigatória em todo caso","D":"apenas antiácido","E":"alta imediata sem antibiótico"},"answer":"A","topic":"Esôfago e Estômago","explanation":"Perfurações contidas e precoces, especialmente cervicais, podem ser manejadas não operatoriamente em pacientes cuidadosamente selecionados; instabilidade, contaminação livre ou deterioração favorecem intervenção."},{"number":54,"area":"Cirurgia Geral","stem":"Em acalasia, tanto miotomia de Heller com fundoplicatura parcial quanto POEM podem aliviar disfagia. Uma diferença relevante é:","options":{"A":"nenhum procedimento afeta o esfíncter inferior","B":"POEM não realiza miotomia","C":"Heller não é tratamento da acalasia","D":"POEM exige colectomia simultânea","E":"POEM tende a associar-se a maior incidência de refluxo gastroesofágico pós-procedimento"},"answer":"E","topic":"Esôfago e Estômago","explanation":"POEM permite miotomia endoscópica extensa e é especialmente útil em alguns subtipos, mas refluxo pós-procedimento é mais frequente porque não há fundoplicatura concomitante."},{"number":55,"area":"Cirurgia Geral","stem":"Idoso com hérnia paraesofágica aguda apresenta dor epigástrica intensa, distensão, vômitos improdutivos e impossibilidade de passagem de sonda nasogástrica. Essa tríade sugere:","options":{"A":"síndrome de dumping","B":"síndrome de Mallory-Weiss","C":"volvo gástrico com tríade de Borchardt","D":"acalasia","E":"gastrite atrófica"},"answer":"C","topic":"Esôfago e Estômago","explanation":"Tríade de Borchardt — dor/ distensão epigástrica, vômitos improdutivos e dificuldade de passar sonda — é clássica do volvo gástrico agudo e demanda descompressão/tratamento urgente."},{"number":56,"area":"Cirurgia Geral","stem":"Paciente jovem com história familiar de câncer gástrico difuso apresenta variante germinativa patogênica em CDH1. A proteína afetada é:","options":{"A":"RET","B":"MLH1","C":"E-caderina","D":"APC","E":"KIT"},"answer":"C","topic":"Esôfago e Estômago","explanation":"CDH1 codifica E-caderina e está associado à síndrome de câncer gástrico difuso hereditário; manejo inclui aconselhamento genético e, em portadores selecionados, gastrectomia profilática."},{"number":57,"area":"Cirurgia Geral","stem":"GIST ressecado apresenta alto risco de recorrência e mutação sensível em KIT. Uma terapia adjuvante que pode ser indicada é:","options":{"A":"tamoxifeno","B":"metotrexato intratecal","C":"rituximabe","D":"trastuzumabe para todos os GIST","E":"imatinibe"},"answer":"E","topic":"Esôfago e Estômago","explanation":"Imatinibe inibe KIT/PDGFRA e é padrão adjuvante para GIST de alto risco com mutações sensíveis; perfil molecular influencia resposta."},{"number":58,"area":"Cirurgia Geral","stem":"Paciente com linfoma gástrico MALT localizado e infecção por H. pylori deve inicialmente ser tratado, em muitos casos, com:","options":{"A":"quimioterapia de alta dose para todos","B":"pancreatectomia","C":"gastrectomia total obrigatória","D":"erradicação do H. pylori","E":"radioterapia cerebral"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Muitos linfomas MALT gástricos iniciais associados a H. pylori regridem após erradicação bacteriana, com seguimento endoscópico/histológico."},{"number":59,"area":"Cirurgia Geral","stem":"Paciente pós-bypass em Y de Roux apresenta dor abdominal intermitente, principalmente pós-prandial, com náuseas. TC mostra “swirl sign” dos vasos mesentéricos. Deve-se suspeitar de:","options":{"A":"divertículo de Meckel","B":"hérnia interna","C":"colecistite alitiásica","D":"apendicite obrigatória","E":"úlcera gástrica simples apenas"},"answer":"B","topic":"Cirurgia Bariátrica","explanation":"Hérnia interna, inclusive no espaço de Petersen ou defeito mesentérico, é complicação tardia do bypass; swirl mesentérico em TC é achado sugestivo e suspeita alta pode exigir exploração."},{"number":60,"area":"Cirurgia Geral","stem":"Após gastrectomia vertical, paciente desenvolve taquicardia, dor abdominal e febre no 4º dia. TC mostra coleção próxima ao ângulo de His. A complicação mais provável é:","options":{"A":"divertículo de Zenker","B":"colite isquêmica","C":"fístula da linha de grampeamento proximal","D":"hérnia femoral","E":"síndrome de Frey"},"answer":"C","topic":"Cirurgia Bariátrica","explanation":"Fístulas da sleeve ocorrem frequentemente na porção proximal próxima à junção esofagogástrica e podem se apresentar com taquicardia, dor, febre e coleção."},{"number":61,"area":"Cirurgia Geral","stem":"TC de paciente com obstrução intestinal mostra alça em “C”, dois pontos de transição próximos, edema mesentérico e redução do realce. O padrão sugere:","options":{"A":"íleo paralítico simples","B":"síndrome de Ogilvie","C":"constipação funcional","D":"gastrite","E":"obstrução em alça fechada com risco de estrangulamento"},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Dois pontos de obstrução isolando um segmento formam alça fechada, com rápida progressão para congestão venosa, isquemia e perfuração; exige avaliação cirúrgica urgente."},{"number":62,"area":"Cirurgia Geral","stem":"Paciente submetido a extensa ressecção de íleo terminal apresenta diarreia e deficiência de vitamina B12. Isso ocorre porque:","options":{"A":"íleo terminal é principal local de absorção do complexo vitamina B12–fator intrínseco e de sais biliares","B":"jejuno distal é único local de absorção de sais biliares","C":"cólon produz fator intrínseco","D":"estômago absorve toda B12 diretamente","E":"duodeno absorve exclusivamente B12"},"answer":"A","topic":"Coloproctologia e Intestino","explanation":"Ressecção ileal compromete reabsorção de sais biliares e absorção de B12, contribuindo para diarreia, esteatorreia e deficiência vitamínica."},{"number":63,"area":"Cirurgia Geral","stem":"Paciente com trombose venosa mesentérica, sem peritonite ou necrose intestinal, está hemodinamicamente estável. O tratamento de base é:","options":{"A":"colectomia total obrigatória","B":"neostigmina","C":"antibiótico tópico","D":"fundoplicatura","E":"anticoagulação sistêmica"},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Na trombose venosa mesentérica sem necrose, anticoagulação é pilar do tratamento; cirurgia é necessária quando há peritonite, infarto ou perfuração."},{"number":64,"area":"Cirurgia Geral","stem":"Paciente com diverticulite recorrente apresenta pneumaturia e infecções urinárias de repetição. A complicação mais provável é:","options":{"A":"fístula arteriovenosa","B":"fístula colovesical","C":"cisto tireoglosso","D":"síndrome de dumping","E":"hérnia de hiato"},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"Pneumatúria e fecalúria são altamente sugestivas de fístula colovesical, frequentemente causada por diverticulite, doença de Crohn ou câncer."},{"number":65,"area":"Cirurgia Geral","stem":"Paciente com retocolite ulcerativa extensa refratária ao tratamento clínico deseja terapia cirúrgica definitiva. A operação restauradora mais utilizada em paciente adequado é:","options":{"A":"gastrectomia","B":"hemicolectomia direita isolada","C":"apendicectomia","D":"ressecção segmentar limitada como cura definitiva","E":"proctocolectomia total com bolsa ileal e anastomose ileoanal"},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Proctocolectomia remove a mucosa doente e cura a colite; IPAA preserva continência em pacientes selecionados. A doença de Crohn, ao contrário, pode recorrer após ressecção."},{"number":66,"area":"Cirurgia Geral","stem":"Paciente com doença de Crohn perianal apresenta abscesso doloroso e flutuante. Antes de intensificar terapia imunobiológica, a prioridade é:","options":{"A":"prescrever laxante","B":"realizar apenas colonoscopia","C":"drenar adequadamente o abscesso e controlar a sepse local","D":"aumentar imunossupressão sem drenagem","E":"iniciar radioterapia"},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"Abscesso perianal é foco séptico e deve ser drenado. Imunossupressão significativa diante de abscesso não drenado aumenta risco infeccioso."},{"number":67,"area":"Cirurgia Geral","stem":"Paciente apresenta dor intensa ao evacuar, seguida de dor persistente por horas e pequeno sangramento vivo. Exame mostra fissura linear posterior. O tratamento inicial inclui:","options":{"A":"fibras, hidratação, banhos de assento e relaxamento farmacológico do esfíncter interno quando indicado","B":"nenhum cuidado com constipação","C":"esplenectomia","D":"antibiótico intravenoso obrigatório","E":"hemicolectomia"},"answer":"A","topic":"Coloproctologia e Intestino","explanation":"Fissura anal típica é posterior e associa-se a hipertonia do esfíncter interno. Tratamento conservador e vasodilatadores tópicos são primeira linha; cirurgia é reservada a refratários."},{"number":68,"area":"Cirurgia Geral","stem":"Uma fissura anal lateral múltipla deve levantar suspeita de:","options":{"A":"pancreatite","B":"doença de Ménière","C":"fissura idiopática típica","D":"doença secundária, como Crohn, infecção ou neoplasia","E":"apenas constipação funcional obrigatória"},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Fissuras idiopáticas são predominantemente posteriores (ou anteriores em menor proporção). Lesões laterais, múltiplas ou atípicas exigem investigação de causas secundárias."},{"number":69,"area":"Cirurgia Geral","stem":"Paciente com câncer de cólon direito pode apresentar inicialmente:","options":{"A":"icterícia obstrutiva","B":"anemia ferropriva e sintomas constitucionais, com obstrução menos precoce que tumores esquerdos","C":"disfagia","D":"hematêmese","E":"obstrução precoce obrigatória em todos"},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"Tumores de cólon direito frequentemente crescem de forma exofítica e podem sangrar cronicamente, causando anemia; tumores esquerdos tendem a causar alteração do hábito e obstrução mais cedo."},{"number":70,"area":"Cirurgia Geral","stem":"Paciente com pancreatite aguda biliar apresenta icterícia progressiva e colangite. Nesse contexto, está indicada:","options":{"A":"apenas colecistectomia em 6 meses sem drenagem","B":"CPRE de rotina em toda pancreatite biliar leve sem obstrução","C":"CPRE precoce para descompressão biliar","D":"pancreatectomia total","E":"nenhuma intervenção biliar"},"answer":"C","topic":"Hepatobiliopancreática","explanation":"CPRE urgente/precoce está indicada em pancreatite biliar associada a colangite ou obstrução persistente; não é indicada de rotina na pancreatite biliar leve sem essas condições."},{"number":71,"area":"Cirurgia Geral","stem":"Paciente com colecistite aguda calculosa, estável e com condições cirúrgicas, procura atendimento nas primeiras 48 horas. A estratégia preferencial é:","options":{"A":"apenas dieta sem cirurgia","B":"colecistectomia laparoscópica precoce durante a mesma internação","C":"CPRE em todos","D":"antibiótico e cirurgia obrigatoriamente após 6 meses","E":"colecistostomia percutânea em todo paciente jovem saudável"},"answer":"B","topic":"Hepatobiliopancreática","explanation":"Colecistectomia laparoscópica precoce é padrão para a maioria dos pacientes operáveis com colecistite aguda, reduzindo recorrência e internação."},{"number":72,"area":"Cirurgia Geral","stem":"Carcinoma incidental de vesícula restrito à mucosa/lâmina própria (T1a), encontrado após colecistectomia simples com margens livres, geralmente requer:","options":{"A":"colectomia","B":"Whipple","C":"hepatectomia direita obrigatória","D":"nenhuma ressecção hepática adicional","E":"transplante hepático"},"answer":"D","topic":"Hepatobiliopancreática","explanation":"T1a de vesícula é adequadamente tratado por colecistectomia simples. T1b/T2 e estágios maiores exigem discussão de re-ressecção oncológica conforme contexto."},{"number":73,"area":"Cirurgia Geral","stem":"Paciente com abscesso hepático piogênico de 8 cm apresenta febre persistente. Além de antibióticos, a conduta usual é:","options":{"A":"gastrectomia","B":"nenhuma investigação de fonte","C":"apendicectomia em todos","D":"drenagem percutânea guiada por imagem quando factível","E":"observação sem antibiótico"},"answer":"D","topic":"Hepatobiliopancreática","explanation":"Abscessos hepáticos grandes ou com resposta inadequada geralmente requerem drenagem percutânea, além de antibióticos e investigação da origem biliar, portal ou hematogênica."},{"number":74,"area":"Cirurgia Geral","stem":"Paciente com cirrose e carcinoma hepatocelular único de 3 cm, sem invasão vascular ou metástases, pode enquadrar-se em critérios clássicos para transplante hepático conhecidos como:","options":{"A":"critérios de Wells","B":"critérios de Ranson","C":"critérios de Milão","D":"critérios de Ottawa","E":"critérios de Centor"},"answer":"C","topic":"Oncologia Cirúrgica","explanation":"Critérios de Milão clássicos incluem tumor único ≤5 cm ou até 3 tumores cada ≤3 cm, sem invasão macrovascular ou metástases, para seleção de transplante em HCC."},{"number":75,"area":"Cirurgia Geral","stem":"Paciente com icterícia progressiva indolor, perda ponderal e vesícula palpável apresenta massa ressecável na cabeça do pâncreas. A operação oncológica padrão é:","options":{"A":"colectomia de Hartmann","B":"fundoplicatura","C":"pancreatectomia distal","D":"procedimento de Sistrunk","E":"pancreatoduodenectomia (procedimento de Whipple)"},"answer":"E","topic":"Oncologia Cirúrgica","explanation":"Tumores ressecáveis da cabeça pancreática são tratados por pancreatoduodenectomia; tumores de corpo/cauda geralmente requerem pancreatectomia distal."},{"number":76,"area":"Cirurgia Geral","stem":"Cisto pancreático de ramo principal apresenta dilatação ductal importante, nódulo mural e icterícia. Esses achados em IPMN são:","options":{"A":"sem relevância clínica","B":"achados que excluem malignidade","C":"típicos de pseudocisto simples","D":"indicação de alta sem seguimento","E":"características de alto risco que indicam avaliação para ressecção em paciente operável"},"answer":"E","topic":"Hepatobiliopancreática","explanation":"IPMN com sinais de alto risco, como icterícia obstrutiva, nódulo mural realçado e grande dilatação do ducto principal, tem maior risco de carcinoma e deve ser avaliado para cirurgia."},{"number":77,"area":"Cirurgia Geral","stem":"Criança após trauma abdominal fechado apresenta hematoma intramural duodenal, sem perfuração e estável. O tratamento inicial frequentemente é:","options":{"A":"colectomia","B":"duodenopancreatectomia imediata","C":"manejo não operatório com descompressão, suporte nutricional e observação","D":"nenhum acompanhamento","E":"esplenectomia"},"answer":"C","topic":"Trauma e Emergências","explanation":"Hematoma duodenal intramural traumático em paciente estável costuma resolver com tratamento conservador; perfuração, deterioração ou obstrução persistente podem exigir intervenção."},{"number":78,"area":"Cirurgia Geral","stem":"Paciente estável com trauma pancreático apresenta transecção do corpo e lesão do ducto pancreático principal à esquerda dos vasos mesentéricos. O tratamento geralmente envolve:","options":{"A":"apenas drenagem sem considerar ducto","B":"colectomia total","C":"Whipple obrigatoriamente","D":"pancreatectomia distal, com preservação esplênica quando possível e apropriado","E":"observação simples em toda lesão ductal"},"answer":"D","topic":"Trauma e Emergências","explanation":"Lesão do ducto principal é determinante da conduta no trauma pancreático. Transecções distais com lesão ductal geralmente requerem ressecção distal."},{"number":79,"area":"Cirurgia Geral","stem":"Paciente inconsciente chega com hemorragia intra-abdominal ameaçadora à vida, sem familiares disponíveis e sem diretiva antecipada conhecida. A cirurgia emergencial necessária pode ser realizada com base em:","options":{"A":"consentimento presumido para tratamento necessário à preservação da vida","B":"recusa presumida","C":"nenhum tratamento até o paciente acordar","D":"assinatura do cirurgião como substituto de consentimento sem justificativa","E":"necessidade obrigatória de aguardar decisão judicial mesmo com risco imediato"},"answer":"A","topic":"Perioperatório e Ética","explanation":"Em emergência com incapacidade decisória e ausência de representante, tratamentos necessários para evitar morte ou dano grave podem ser realizados sob consentimento presumido, documentando a situação."},{"number":80,"area":"Cirurgia Geral","stem":"Paciente com câncer de cólon obstrutivo apresenta lesão sincrônica não avaliável por colonoscopia devido à estenose. Após controle da urgência, a estratégia oncológica deve incluir:","options":{"A":"não fazer seguimento após ressecção","B":"dispensar qualquer estadiamento","C":"realizar apenas endoscopia alta","D":"assumir que não existem outras lesões","E":"avaliação de todo o cólon para excluir lesões sincrônicas, por método apropriado assim que possível"},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Neoplasias colorretais sincrônicas existem em proporção relevante; quando a colonoscopia pré-operatória é incompleta, o cólon remanescente deve ser avaliado por método apropriado no peri ou pós-operatório."}]},"simulado_ccp_04":{"id":"simulado_ccp_04","label":"Simulado 4 — ENARE CCP","subtitle":"Nível ENARE — intermediário/avançado · 80 questões","order":"1–40 Otorrinolaringologia · 41–80 Cirurgia Geral","localKey":"simulado_ccp_04_v1","sourceNote":"Itens autorais ou fortemente adaptados, calibrados pela matriz das provas ENARE Cabeça e Pescoço 2024/2025 e 2025/2026, pelo acervo ENARE 2023/2024 e por provas de Otorrinolaringologia R4 e Cirurgia Geral R+; não são transcrições literais de provas externas.","questions":[{"number":1,"area":"Otorrinolaringologia","stem":"Paciente com VPPB de canal posterior confirmado por Dix-Hallpike mantém vertigem após tratamento medicamentoso isolado. A intervenção de primeira escolha é:","options":{"A":"corticoterapia sistêmica por 30 dias","B":"manobra de reposicionamento canalicular, como a manobra de Epley","C":"uso crônico de benzodiazepínico","D":"labirintectomia imediata","E":"restrição absoluta ao leito por uma semana"},"answer":"B","topic":"Vestibulologia","explanation":"VPPB é causada por debris otoconiais. O tratamento mais efetivo é mecânico, com manobras de reposicionamento; supressores vestibulares não corrigem a causa e devem ser usados apenas por curto período quando necessários."},{"number":2,"area":"Otorrinolaringologia","stem":"Após neurite vestibular aguda, paciente permanece com instabilidade por várias semanas, sem sinais centrais. A medida que mais favorece compensação vestibular é:","options":{"A":"repouso absoluto até desaparecer toda tontura","B":"reabilitação vestibular com mobilização e exercícios progressivos","C":"manter supressor vestibular continuamente por meses","D":"evitar movimentos cefálicos","E":"realizar timpanostomia bilateral"},"answer":"B","topic":"Vestibulologia","explanation":"Supressores vestibulares podem ser úteis nos primeiros dias, mas seu uso prolongado atrasa compensação central. Reabilitação vestibular acelera adaptação e recuperação funcional."},{"number":3,"area":"Otorrinolaringologia","stem":"Paciente com doença de Ménière incapacitante, audição ainda útil e crises persistentes apesar de medidas clínicas. Uma opção intratimpânica que busca preservar melhor a audição antes de terapia ablativa é:","options":{"A":"gentamicina intratimpânica como primeira escolha obrigatória em todo caso","B":"lidocaína diária indefinidamente","C":"corticosteroide intratimpânico","D":"tuberculostático intratimpânico","E":"álcool absoluto intratimpânico"},"answer":"C","topic":"Vestibulologia","explanation":"Esteroide intratimpânico pode reduzir crises com menor risco cocleotóxico. Gentamicina é vestibulotóxica e pode ser eficaz em refratários, mas tem maior risco de perda auditiva e é uma estratégia mais ablativa."},{"number":4,"area":"Otorrinolaringologia","stem":"Paciente de 73 anos apresenta schwannoma vestibular intracanalicular pequeno, audição funcional e ausência de crescimento em exames seriados. Uma estratégia aceitável é:","options":{"A":"mastoidectomia simples","B":"implante coclear sem considerar o tumor","C":"quimioterapia sistêmica","D":"ressecção radical obrigatória imediata","E":"observação com ressonâncias e avaliação auditiva seriadas"},"answer":"E","topic":"Otologia e Audiologia","explanation":"Pequenos schwannomas, especialmente em idosos ou pacientes com comorbidades e crescimento lento, podem ser acompanhados. Cirurgia ou radiocirurgia dependem de crescimento, sintomas, tamanho e perfil do paciente."},{"number":5,"area":"Otorrinolaringologia","stem":"Paciente com perda auditiva neurossensorial súbita recebe corticoide sistêmico, mas mantém perda significativa após o tratamento inicial. Uma estratégia de resgate recomendada é:","options":{"A":"ceruminolítico","B":"antibiótico tópico","C":"estapedectomia","D":"drenagem transtimpânica sem medicamento","E":"corticoterapia intratimpânica"},"answer":"E","topic":"Otologia e Audiologia","explanation":"Corticoide intratimpânico é opção de salvage em perda auditiva súbita com recuperação incompleta, especialmente nas primeiras semanas."},{"number":6,"area":"Otorrinolaringologia","stem":"Paciente em tratamento prolongado com aminoglicosídeo desenvolve oscilopsia e desequilíbrio, sobretudo ao caminhar no escuro, bilateralmente. O mecanismo mais provável é:","options":{"A":"perfuração timpânica traumática","B":"otosclerose","C":"ototoxicidade vestibular bilateral","D":"VPPB unilateral típica","E":"otite média secretora"},"answer":"C","topic":"Otologia e Audiologia","explanation":"Aminoglicosídeos, especialmente gentamicina, podem lesar células ciliadas vestibulares e causar hipofunção bilateral, com oscilopsia e piora importante no escuro ou em superfícies irregulares."},{"number":7,"area":"Otorrinolaringologia","stem":"Em timpanometria, uma curva tipo B com volume de meato normal é mais compatível com:","options":{"A":"neurite vestibular","B":"audição normal em todos os casos","C":"efusão em orelha média","D":"otosclerose obrigatoriamente","E":"deiscência de canal semicircular superior"},"answer":"C","topic":"Otologia e Audiologia","explanation":"Curva B é plana. Com volume do meato normal, sugere efusão; com volume aumentado, pode indicar perfuração timpânica ou tubo de ventilação pérvio."},{"number":8,"area":"Otorrinolaringologia","stem":"Após traumatismo craniano, paciente apresenta hipoacusia condutiva persistente, membrana timpânica íntegra e grande gap aéreo-ósseo. Deve-se suspeitar particularmente de:","options":{"A":"descontinuidade da cadeia ossicular","B":"doença de Ménière","C":"neurite vestibular","D":"presbiacusia","E":"schwannoma vestibular"},"answer":"A","topic":"Otologia e Audiologia","explanation":"Trauma pode causar luxação incudoestapediana ou outras interrupções ossiculares, levando a perda condutiva persistente apesar de membrana íntegra."},{"number":9,"area":"Otorrinolaringologia","stem":"Paciente com otalgia intensa, paralisia facial periférica, vesículas no pavilhão e conduto auditivo externo apresenta quadro compatível com:","options":{"A":"otosclerose","B":"síndrome de Ramsay Hunt por reativação do vírus varicela-zóster","C":"colesteatoma congênito","D":"síndrome de Eagle","E":"doença de Ménière"},"answer":"B","topic":"Otologia e Audiologia","explanation":"Herpes-zóster ótico com paralisia facial caracteriza Ramsay Hunt. O prognóstico facial costuma ser pior que na paralisia de Bell e o tratamento precoce combina antiviral e corticoide em pacientes apropriados."},{"number":10,"area":"Otorrinolaringologia","stem":"Fratura de osso temporal acompanhada de otorreia liquórica exige, inicialmente, em paciente estável e sem complicações infecciosas:","options":{"A":"lavagem do ouvido sob pressão","B":"tamponamento profundo do ouvido com material não absorvível","C":"anticoagulação plena","D":"exploração cirúrgica imediata em 100% dos casos","E":"observação, medidas para reduzir pressão liquórica e acompanhamento, pois muitas fístulas fecham espontaneamente"},"answer":"E","topic":"Otologia e Audiologia","explanation":"Muitas fístulas traumáticas de LCR fecham espontaneamente. Persistência, meningite recorrente, defeito importante ou outras complicações podem indicar reparo cirúrgico."},{"number":11,"area":"Otorrinolaringologia","stem":"Epistaxe posterior persistente em adulto, sem controle com medidas locais e tamponamento adequado, pode ser tratada de forma definitiva por:","options":{"A":"ligadura ou cauterização endoscópica da artéria esfenopalatina","B":"amigdalectomia","C":"drenagem de mastoide","D":"laringectomia","E":"parotidectomia"},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"A artéria esfenopalatina é a principal fonte de muitas epistaxes posteriores. Abordagem endoscópica apresenta alta taxa de controle quando tamponamento falha ou não é desejável."},{"number":12,"area":"Otorrinolaringologia","stem":"Paciente com epistaxes recorrentes desde a juventude, telangiectasias em lábios e mucosa oral e história familiar semelhante deve ser investigado para:","options":{"A":"VPPB","B":"otosclerose","C":"telangiectasia hemorrágica hereditária","D":"granulomatose eosinofílica obrigatoriamente","E":"síndrome de Sjögren"},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"A combinação de epistaxe recorrente, telangiectasias mucocutâneas, malformações arteriovenosas e história familiar é característica de telangiectasia hemorrágica hereditária (Osler-Weber-Rendu)."},{"number":13,"area":"Otorrinolaringologia","stem":"Após trauma nasal, criança apresenta obstrução bilateral e abaulamento flutuante de ambos os lados do septo. A conduta é:","options":{"A":"redução de cornetos","B":"nenhuma intervenção porque regride sempre","C":"observação por 30 dias","D":"drenagem urgente do hematoma septal e antibioticoterapia quando indicada","E":"apenas corticoide nasal"},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"Hematoma septal deve ser drenado para evitar necrose da cartilagem, deformidade em sela e abscesso."},{"number":14,"area":"Otorrinolaringologia","stem":"Adulto com rinossinusite crônica apresenta secreção purulenta unilateral, odor fétido e dor maxilar, além de tratamento odontológico recente. Uma etiologia especialmente provável é:","options":{"A":"rinossinusite odontogênica","B":"paralisia de Bell","C":"VPPB","D":"rinite vasomotora bilateral","E":"doença de Ménière"},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"Rinossinusite maxilar unilateral, sobretudo com odor fétido e história dentária, deve levantar forte suspeita de origem odontogênica e requer avaliação da fonte dentária."},{"number":15,"area":"Otorrinolaringologia","stem":"Paciente com rinossinusites de repetição, bronquiectasias e situs inversus apresenta síndrome relacionada a:","options":{"A":"papilomatose laríngea","B":"deficiência isolada de ferro","C":"discinesia ciliar primária","D":"otosclerose","E":"síndrome de Ramsay Hunt"},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Discinesia ciliar primária pode cursar com infecções sinopulmonares crônicas, bronquiectasias e situs inversus (síndrome de Kartagener)."},{"number":16,"area":"Otorrinolaringologia","stem":"Em rinossinusite crônica com pólipos nasais grave, recorrente após cirurgia, associada a asma e inflamação tipo 2, uma opção terapêutica contemporânea em pacientes selecionados é:","options":{"A":"radioterapia nasal","B":"septoplastia como única terapia obrigatória","C":"antibiótico intravenoso vitalício","D":"biológico direcionado à inflamação tipo 2","E":"nenhum tratamento além de lavagem salina"},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"Biológicos como anti-IgE, anti-IL-5/IL-5R e anti-IL-4R podem ser indicados em CRSwNP grave e não controlada, conforme critérios clínicos e fenotípicos."},{"number":17,"area":"Otorrinolaringologia","stem":"Paciente com celulite orbitária secundária à sinusite evolui com redução visual, proptose e coleção subperiosteal. A conduta mais apropriada é:","options":{"A":"antibiótico intravenoso e drenagem cirúrgica urgente da coleção, com avaliação oftalmológica","B":"adiar qualquer intervenção por 30 dias","C":"somente anti-histamínico","D":"alta com analgésico","E":"apenas descongestionante nasal"},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"Deterioração visual, abscesso, oftalmoplegia importante ou complicações intracranianas são indicações fortes de intervenção cirúrgica associada a antibióticos."},{"number":18,"area":"Otorrinolaringologia","stem":"Massa expansiva de seio frontal que causa remodelamento ósseo e proptose lentamente progressiva, associada a obstrução de drenagem do seio, é sugestiva de:","options":{"A":"mucocele","B":"tonsilite","C":"paralisia de prega vocal","D":"otosclerose","E":"VPPB"},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"Mucocele é uma lesão expansiva preenchida por muco resultante de obstrução de drenagem sinusal. Pode erodir/remodelar osso e causar sintomas orbitários ou intracranianos."},{"number":19,"area":"Otorrinolaringologia","stem":"Paciente apresenta disfonia e insuficiência glótica importante por paralisia unilateral recente de prega vocal, com possibilidade de recuperação neural. Para melhora temporária da voz e proteção da deglutição, pode-se realizar:","options":{"A":"traqueostomia obrigatória","B":"ressecção do nervo recorrente","C":"injeção de medialização temporária da prega vocal","D":"laringectomia total","E":"cordectomia bilateral"},"answer":"C","topic":"Laringologia e Voz","explanation":"Injeção de medialização é útil enquanto se aguarda possível recuperação, reduzindo gap glótico, disfonia e aspiração. Procedimentos permanentes podem ser considerados quando prognóstico neural está definido."},{"number":20,"area":"Otorrinolaringologia","stem":"Após intubação traumática, paciente mantém rouquidão e imobilidade de uma prega vocal. Para diferenciar paralisia neural de luxação de aritenoide, um exame útil é:","options":{"A":"teste de Schirmer","B":"Dix-Hallpike","C":"timpanometria","D":"eletromiografia laríngea, associada à avaliação endoscópica","E":"audiometria tonal isolada"},"answer":"D","topic":"Laringologia e Voz","explanation":"Luxação aritenoidea pode mimetizar paralisia. Endoscopia e eletromiografia laríngea ajudam a avaliar função neuromuscular e orientar o diagnóstico."},{"number":21,"area":"Otorrinolaringologia","stem":"Professor com disfonia crônica apresenta edema difuso bilateral da camada superficial da lâmina própria, fortemente associado ao tabagismo. O diagnóstico é:","options":{"A":"rinite alérgica","B":"granuloma de Wegener obrigatório","C":"papiloma invertido","D":"colesteatoma","E":"edema de Reinke"},"answer":"E","topic":"Laringologia e Voz","explanation":"Edema de Reinke é uma lesão fonotraumática/tabaco-relacionada do espaço de Reinke, geralmente bilateral, causando voz grave e rouca."},{"number":22,"area":"Otorrinolaringologia","stem":"Criança com papilomatose respiratória recorrente apresenta múltiplas lesões laríngeas exofíticas. Os tipos de HPV mais associados são:","options":{"A":"HPV 6 e 11","B":"HSV-1 e HSV-2","C":"HPV 1 e 2","D":"EBV e CMV","E":"HPV 16 e 18 exclusivamente"},"answer":"A","topic":"Laringologia e Voz","explanation":"Papilomatose respiratória recorrente está fortemente relacionada a HPV 6 e 11. O tratamento é predominantemente cirúrgico, visando preservar via aérea e voz, com terapias adjuvantes em casos selecionados."},{"number":23,"area":"Otorrinolaringologia","stem":"Paciente com odinofagia intensa, voz abafada, febre e aspecto tóxico apresenta epiglotite/supraglotite com estridor e esforço respiratório. A prioridade é:","options":{"A":"prescrever apenas anti-histamínico","B":"realizar teste de Dix-Hallpike","C":"assegurar a via aérea em ambiente controlado por equipe experiente","D":"aguardar radiografia em casa","E":"insistir em exame agressivo da orofaringe antes de qualquer medida"},"answer":"C","topic":"Laringologia e Voz","explanation":"Em supraglotite com sinais de obstrução, manejo da via aérea é prioritário. Manipulação desnecessária pode precipitar obstrução completa."},{"number":24,"area":"Otorrinolaringologia","stem":"Paciente com apneia obstrutiva do sono apresenta eventos quase exclusivamente em decúbito dorsal e índice muito menor em posição lateral. Em casos selecionados, pode-se considerar:","options":{"A":"repouso absoluto","B":"terapia posicional como componente do tratamento","C":"antibiótico crônico","D":"laringectomia","E":"tonsilectomia obrigatória em todo adulto"},"answer":"B","topic":"Sono e Via Aérea Superior","explanation":"OSA posicional pode responder a estratégias que reduzem o sono supino. A seleção depende da gravidade, anatomia, adesão e presença de outras opções eficazes como CPAP."},{"number":25,"area":"Otorrinolaringologia","stem":"Paciente adulto com OSA moderada, IMC elevado e sonolência diurna pergunta qual intervenção modifica um importante fator de risco e pode reduzir a gravidade da doença. A resposta é:","options":{"A":"perda ponderal sustentada, quando houver sobrepeso ou obesidade","B":"antibiótico profilático","C":"nenhuma modificação de peso tem efeito","D":"ganho ponderal programado","E":"restrição de líquidos sem indicação"},"answer":"A","topic":"Sono e Via Aérea Superior","explanation":"Obesidade é importante fator de risco para OSA. Perda de peso pode reduzir AHI e melhorar sintomas, embora não substitua automaticamente terapias específicas quando necessárias."},{"number":26,"area":"Otorrinolaringologia","stem":"Em paciente com OSA que não tolera CPAP, a endoscopia do sono induzido por droga (DISE) é utilizada principalmente para:","options":{"A":"diagnosticar Ménière","B":"medir limiar auditivo","C":"substituir a polissonografia em todo paciente","D":"avaliar efusão de ouvido médio","E":"identificar padrão e nível de colapso da via aérea superior e orientar terapias selecionadas"},"answer":"E","topic":"Sono e Via Aérea Superior","explanation":"DISE fornece avaliação dinâmica do colapso durante sono farmacologicamente induzido, podendo ajudar na seleção de cirurgia ou estimulação do hipoglosso em contextos apropriados."},{"number":27,"area":"Otorrinolaringologia","stem":"Criança com hipertrofia adenotonsilar e OSA importante é submetida a adenotonsilectomia. Qual fator aumenta o risco de OSA residual pós-operatória?","options":{"A":"obesidade","B":"amígdalas pequenas após cirurgia","C":"ausência de rinite","D":"idade escolar isoladamente sempre elimina o risco","E":"peso normal"},"answer":"A","topic":"Sono e Via Aérea Superior","explanation":"Obesidade, OSA grave, idade maior e algumas condições craniofaciais/neuromusculares aumentam o risco de persistência após adenotonsilectomia."},{"number":28,"area":"Otorrinolaringologia","stem":"Lesão eritroplásica persistente de cavidade oral em fumante deve ser encarada como:","options":{"A":"lesão invariavelmente benigna","B":"otite externa","C":"lesão de alto risco para displasia/carcinoma, com indicação de biópsia","D":"VPPB","E":"candidíase que dispensa exame"},"answer":"C","topic":"Cavidade Oral e Faringologia","explanation":"Eritroplasia possui maior taxa de displasia grave ou carcinoma que leucoplasia e exige avaliação histopatológica."},{"number":29,"area":"Otorrinolaringologia","stem":"Paciente com carcinoma de orofaringe relacionado ao HPV apresenta linfonodo cervical cístico. Um marcador substituto amplamente utilizado para essa associação é:","options":{"A":"troponina","B":"PTH","C":"positividade para p16 por imuno-histoquímica em contexto apropriado","D":"HER2 em todos","E":"CD117"},"answer":"C","topic":"Cavidade Oral e Faringologia","explanation":"p16 é usado como marcador substituto de associação ao HPV em carcinomas escamosos de orofaringe e possui implicações prognósticas e de estadiamento."},{"number":30,"area":"Otorrinolaringologia","stem":"Paciente apresenta febre, odinofagia, trismo e abaulamento peritonsilar com desvio da úvula. A conduta inclui:","options":{"A":"CPAP como tratamento da infecção","B":"apenas observação por semanas","C":"lavagem nasal isolada","D":"manobra de Epley","E":"drenagem do abscesso e antibioticoterapia adequada"},"answer":"E","topic":"Cavidade Oral e Faringologia","explanation":"Abscesso peritonsilar requer controle do foco por aspiração ou incisão/drenagem, além de antibióticos, analgesia e avaliação da via aérea/hidratação."},{"number":31,"area":"Otorrinolaringologia","stem":"Paciente com tromboflebite séptica da veia jugular interna após faringite, com êmbolos pulmonares sépticos, apresenta síndrome de:","options":{"A":"Cogan","B":"Frey","C":"Ménière","D":"Lemierre","E":"Kartagener"},"answer":"D","topic":"Cavidade Oral e Faringologia","explanation":"Síndrome de Lemierre é tipicamente causada por Fusobacterium necrophorum após infecção orofaríngea e envolve tromboflebite séptica jugular com metástases infecciosas."},{"number":32,"area":"Otorrinolaringologia","stem":"Massa parotídea de crescimento rápido associada a paralisia facial deve aumentar a suspeita de:","options":{"A":"neoplasia maligna de parótida","B":"VPPB","C":"rinite alérgica","D":"otosclerose","E":"tumor benigno obrigatório"},"answer":"A","topic":"Glândulas Salivares","explanation":"Dor, crescimento acelerado, fixação, adenopatia e déficit do nervo facial são sinais de alerta para malignidade em tumor parotídeo."},{"number":33,"area":"Otorrinolaringologia","stem":"Na investigação inicial de massa sólida de parótida, um método útil para obtenção de diagnóstico citológico com baixa morbidade é:","options":{"A":"Dix-Hallpike","B":"timpanometria","C":"punção aspirativa por agulha fina, frequentemente guiada por ultrassom","D":"biópsia aberta transcutânea de rotina","E":"laringoscopia sem examinar a glândula"},"answer":"C","topic":"Glândulas Salivares","explanation":"PAAF é amplamente utilizada na avaliação de massas salivares. Core biopsy pode ser alternativa em cenários selecionados; biópsia aberta geralmente é evitada por risco de violação tumoral e lesão do facial."},{"number":34,"area":"Otorrinolaringologia","stem":"Tumor de glândula salivar caracterizado por forte tendência a invasão perineural e recorrência tardia é:","options":{"A":"carcinoma adenoide cístico","B":"cisto dermoide","C":"lipoma","D":"adenoma pleomórfico benigno","E":"tumor de Warthin"},"answer":"A","topic":"Glândulas Salivares","explanation":"Carcinoma adenoide cístico apresenta notável tropismo perineural e pode desenvolver recorrências e metástases tardias, especialmente pulmonares."},{"number":35,"area":"Otorrinolaringologia","stem":"Paciente com sialadenite submandibular recorrente por cálculo ductal distal palpável no assoalho da boca pode ser tratado, conforme tamanho/localização, com:","options":{"A":"nenhuma abordagem do cálculo","B":"remoção transoral do cálculo ou sialendoscopia, buscando preservar a glândula quando possível","C":"parotidectomia total","D":"laringectomia","E":"mastoidectomia"},"answer":"B","topic":"Glândulas Salivares","explanation":"Tratamentos minimamente invasivos e transorais permitem preservar glândulas em muitos casos de sialolitíase. Ressecção glandular fica para situações selecionadas."},{"number":36,"area":"Otorrinolaringologia","stem":"Massa cervical lateral cística nova em adulto com mais de 40 anos, especialmente sem história infecciosa clara, deve ser considerada:","options":{"A":"adenite viral sem necessidade de investigação","B":"metástase cervical até prova em contrário, com investigação de primário de vias aerodigestivas superiores","C":"cisto branquial benigno obrigatório","D":"normal para a idade","E":"lipoma em 100% dos casos"},"answer":"B","topic":"Pescoço e Tireoide","explanation":"Em adultos, massa cervical persistente e sobretudo cística pode representar metástase de carcinoma orofaríngeo HPV-relacionado ou outro câncer de cabeça e pescoço; deve ser investigada de forma oncológica."},{"number":37,"area":"Otorrinolaringologia","stem":"Criança apresenta massa cervical macia, transiluminável, infiltrativa e que aumenta durante infecção respiratória. O diagnóstico mais provável é:","options":{"A":"malformação linfática","B":"cisto tireoglosso obrigatório","C":"otosclerose","D":"VPPB","E":"paralisia de Bell"},"answer":"A","topic":"Pescoço e Tireoide","explanation":"Malformações linfáticas são frequentemente compressíveis, multiloculadas e podem crescer com infecção ou hemorragia. Ultrassom/RM auxiliam na definição de extensão."},{"number":38,"area":"Otorrinolaringologia","stem":"Infecção cervical recorrente do lado esquerdo em criança, com abscesso próximo ao polo inferior da tireoide, deve levantar suspeita de anomalia de terceira/quarta fenda branquial com trajeto para:","options":{"A":"seio frontal","B":"canal semicircular posterior","C":"conduto auditivo externo","D":"seio piriforme","E":"ducto nasolacrimal"},"answer":"D","topic":"Pescoço e Tireoide","explanation":"Fístulas/sinus de quarta bolsa/fenda podem comunicar-se com o ápice do seio piriforme e causar tireoidite supurativa ou abscessos cervicais recorrentes, frequentemente à esquerda."},{"number":39,"area":"Otorrinolaringologia","stem":"Recém-nascido com micrognatia, glossoptose e obstrução de via aérea apresenta sequência de Pierre Robin. Uma medida inicial em casos leves pode ser:","options":{"A":"laringectomia total imediata","B":"septoplastia neonatal","C":"posicionamento e estratégias não invasivas para manter a via aérea, com escalonamento conforme gravidade","D":"antibiótico como tratamento anatômico","E":"nenhuma monitorização"},"answer":"C","topic":"Craniofacial e Pediatria","explanation":"O manejo é graduado: posicionamento/prona em ambiente monitorado, cânula nasofaríngea ou CPAP em casos selecionados; glossopexia, distração mandibular ou traqueostomia nos mais graves."},{"number":40,"area":"Otorrinolaringologia","stem":"Criança com síndrome de Treacher Collins costuma apresentar, além de hipoplasia malar e mandibular:","options":{"A":"ausência de alterações craniofaciais","B":"surdez neurossensorial profunda em 100%","C":"situs inversus","D":"anomalias de orelha externa/média com possível perda auditiva condutiva","E":"macroglossia isolada obrigatória"},"answer":"D","topic":"Craniofacial e Pediatria","explanation":"Treacher Collins envolve estruturas derivadas dos primeiros arcos faríngeos, com hipoplasia zigomático-mandibular e malformações auriculares, frequentemente causando perda condutiva."},{"number":41,"area":"Cirurgia Geral","stem":"Paciente politraumatizado apresenta choque hemorrágico e necessidade de transfusão maciça. Uma estratégia moderna de ressuscitação hemostática inclui:","options":{"A":"evitar cálcio durante transfusão maciça","B":"adiar controle do foco hemorrágico","C":"grandes volumes de cristalóide como única terapia","D":"controle rápido da hemorragia, uso equilibrado de hemocomponentes e correção de hipotermia, acidose e hipocalcemia","E":"manter hipotermia terapêutica"},"answer":"D","topic":"Trauma e Emergências","explanation":"Ressuscitação de controle de danos busca hemostasia precoce e prevenção da tríade/tétrade letal. Protocolos de transfusão maciça utilizam componentes de forma balanceada e monitoram cálcio e coagulação."},{"number":42,"area":"Cirurgia Geral","stem":"Paciente com choque séptico por perfuração intestinal recebe antibiótico e vasopressor. Qual medida é essencial para controle definitivo da sepse?","options":{"A":"controle precoce do foco infeccioso por drenagem ou cirurgia conforme o caso","B":"adiar cirurgia por vários dias em todos","C":"apenas aumentar vasopressor sem abordar a perfuração","D":"alimentação oral imediata apesar de peritonite","E":"suspender antibiótico"},"answer":"A","topic":"Inflamação, Infecção e Sepse","explanation":"Antibióticos e suporte não substituem source control. Perfuração, abscesso ou tecido necrótico devem ser tratados prontamente quando o paciente e a anatomia permitem."},{"number":43,"area":"Cirurgia Geral","stem":"Paciente com alto risco cirúrgico usa apixabana e será submetido a cirurgia eletiva com alto risco de sangramento. Em geral, a conduta perioperatória envolve:","options":{"A":"suspender por 30 dias em qualquer cirurgia","B":"interromper o anticoagulante por intervalo apropriado à função renal e ao risco hemorrágico, sem ponte rotineira na maioria dos casos","C":"substituir por AAS em todos","D":"manter apixabana até a incisão em todo procedimento","E":"fazer ponte com heparina obrigatoriamente para todos"},"answer":"B","topic":"Perioperatório e Ética","explanation":"DOACs têm meia-vida curta e, na maioria dos pacientes, não requerem ponte. O intervalo depende do fármaco, função renal, risco de sangramento e tipo de procedimento."},{"number":44,"area":"Cirurgia Geral","stem":"Paciente em uso crônico de betabloqueador bem tolerado será operado. A conduta usual é:","options":{"A":"administrar apenas após alta","B":"suspender sempre no dia anterior","C":"dobrar a dose sem indicação","D":"manter o betabloqueador no perioperatório, evitando suspensão abrupta","E":"substituir por antibiótico"},"answer":"D","topic":"Perioperatório e Ética","explanation":"Betabloqueadores crônicos geralmente devem ser continuados. Iniciar doses altas imediatamente antes da cirurgia em paciente não selecionado pode ser prejudicial."},{"number":45,"area":"Cirurgia Geral","stem":"Paciente com desnutrição grave precisa de cirurgia oncológica eletiva que pode ser adiada com segurança por curto período. A melhor estratégia é:","options":{"A":"prescrever apenas vitaminas sem calorias/proteína","B":"manter jejum prolongado","C":"adiar indefinidamente sem tratar o tumor","D":"operar imediatamente sem considerar desnutrição em qualquer cenário","E":"oferecer suporte nutricional pré-operatório por cerca de 7–14 dias quando possível"},"answer":"E","topic":"Nutrição e Metabolismo","explanation":"Em desnutrição grave, breve suporte nutricional pré-operatório pode reduzir complicações se a cirurgia puder ser adiada sem comprometer oncologia ou segurança."},{"number":46,"area":"Cirurgia Geral","stem":"Paciente com síndrome do intestino curto após extensa ressecção ileal apresenta diarreia e deficiência de vitaminas lipossolúveis. Um mecanismo importante é:","options":{"A":"hipersecreção de fator intrínseco","B":"aumento obrigatório da absorção de B12","C":"produção excessiva de vitamina D","D":"ausência de qualquer alteração biliar","E":"má absorção de sais biliares e redução do pool de ácidos biliares"},"answer":"E","topic":"Nutrição e Metabolismo","explanation":"Íleo terminal absorve sais biliares e B12. Ressecções extensas alteram circulação entero-hepática, podendo causar esteatorreia e deficiência de vitaminas A, D, E e K."},{"number":47,"area":"Cirurgia Geral","stem":"Paciente no 7º dia após laparotomia apresenta saída súbita de líquido serossanguinolento pela ferida e sensação de “estalo”. Deve-se suspeitar de:","options":{"A":"fissura anal","B":"seroma simples obrigatoriamente","C":"colecistite","D":"deiscência fascial","E":"otite externa"},"answer":"D","topic":"Cicatrização e Feridas","explanation":"Drenagem serossanguinolenta (“salmon-colored”) pode preceder evisceração. Deiscência fascial é emergência cirúrgica quando completa ou com evisceração."},{"number":48,"area":"Cirurgia Geral","stem":"Paciente com dor desproporcional, edema, bolhas e choque por infecção rapidamente progressiva de partes moles deve ser tratado com:","options":{"A":"apenas antibiótico oral e observação","B":"corticosteroide isolado","C":"esperar cultura por vários dias antes de operar","D":"nenhum controle do foco","E":"desbridamento cirúrgico urgente e amplo associado a antibióticos de amplo espectro"},"answer":"E","topic":"Inflamação, Infecção e Sepse","explanation":"Fasceíte necrosante é emergência cirúrgica. A sobrevida depende de diagnóstico precoce e desbridamento imediato, além de antibióticos e suporte intensivo."},{"number":49,"area":"Cirurgia Geral","stem":"Paciente apresenta hérnia inguinal cujo saco contém o apêndice vermiforme. Essa condição é chamada de:","options":{"A":"hérnia obturatória","B":"hérnia de Richter","C":"hérnia de Amyand","D":"hérnia de Spigel","E":"hérnia de Littre"},"answer":"C","topic":"Hérnias e Parede Abdominal","explanation":"Hérnia de Amyand contém o apêndice; hérnia de Littre contém divertículo de Meckel; Richter envolve apenas parte da circunferência intestinal."},{"number":50,"area":"Cirurgia Geral","stem":"Hérnia cujo saco contém divertículo de Meckel é denominada:","options":{"A":"hérnia hiatal","B":"hérnia de Amyand","C":"hérnia de Richter","D":"hérnia de Littre","E":"hérnia de Petersen"},"answer":"D","topic":"Hérnias e Parede Abdominal","explanation":"Hérnia de Littre contém divertículo de Meckel e pode ocorrer em região inguinal, femoral ou umbilical."},{"number":51,"area":"Cirurgia Geral","stem":"Paciente obeso apresenta dor e massa na linha semilunar, lateral ao reto abdominal, sem hérnia inguinal. O diagnóstico sugerido é:","options":{"A":"hérnia obturatória","B":"hérnia de Spigel","C":"diástase sem defeito","D":"hérnia de hiato","E":"hérnia perineal"},"answer":"B","topic":"Hérnias e Parede Abdominal","explanation":"Hérnia de Spigel ocorre na fáscia de Spigel, frequentemente próxima à linha arqueada, e pode ser difícil de detectar clinicamente."},{"number":52,"area":"Cirurgia Geral","stem":"Idosa magra e multípara apresenta obstrução intestinal e dor irradiada para face medial da coxa, pior à extensão do quadril. Deve-se suspeitar de:","options":{"A":"hérnia incisional","B":"diástase dos retos","C":"hérnia obturatória","D":"hérnia de hiato","E":"hérnia umbilical"},"answer":"C","topic":"Hérnias e Parede Abdominal","explanation":"Sinal de Howship-Romberg (dor medial da coxa por compressão do nervo obturador) é clássico de hérnia obturatória, que pode causar obstrução em idosas magras."},{"number":53,"area":"Cirurgia Geral","stem":"Paciente submetido a reparo de hérnia inguinal apresenta dor neuropática crônica. Entre os nervos que podem estar envolvidos estão:","options":{"A":"facial, trigêmeo e acessório","B":"ilioinguinal, ilio-hipogástrico e ramo genital do genitofemoral","C":"radial, mediano e ulnar","D":"frênico, vago e hipoglosso","E":"ciático, tibial e fibular apenas"},"answer":"B","topic":"Hérnias e Parede Abdominal","explanation":"Dor crônica pós-herniorrafia pode decorrer de lesão/encarceramento de nervos inguinais. Conhecimento anatômico é essencial para prevenção e manejo."},{"number":54,"area":"Cirurgia Geral","stem":"Paciente com ingestão cáustica intencional chega estável. Para avaliar extensão da lesão gastrointestinal em janela adequada, o exame-chave é:","options":{"A":"neutralizar com ácido ou base oposta","B":"endoscopia digestiva alta precoce em paciente selecionado e estável","C":"aguardar estenose por meses antes de avaliar","D":"passar sonda às cegas em todos","E":"induzir vômito"},"answer":"B","topic":"Esôfago e Estômago","explanation":"EDA nas primeiras 12–24(–48) horas é usualmente empregada para graduar lesão em pacientes adequados. Deve-se evitar neutralização, vômito induzido e procedimentos às cegas."},{"number":55,"area":"Cirurgia Geral","stem":"Paciente com acalásia apresenta perda ponderal acentuada e início recente dos sintomas aos 68 anos. Antes de tratamento definitivo, é essencial excluir:","options":{"A":"VPPB","B":"colelitíase","C":"hérnia femoral","D":"apendicite","E":"pseudoacalásia por neoplasia da junção esofagogástrica"},"answer":"E","topic":"Esôfago e Estômago","explanation":"Idade avançada, perda ponderal rápida e sintomas de curta duração levantam suspeita de pseudoacalásia maligna; endoscopia e imagem são importantes."},{"number":56,"area":"Cirurgia Geral","stem":"No estadiamento locorregional de câncer de esôfago potencialmente ressecável, o exame especialmente útil para avaliar profundidade tumoral e linfonodos regionais é:","options":{"A":"teste de Schirmer","B":"ultrassom de tireoide isolado","C":"Dix-Hallpike","D":"ultrassonografia endoscópica","E":"timpanometria"},"answer":"D","topic":"Esôfago e Estômago","explanation":"EUS é valiosa para T e N locorregional quando não há estenose intransponível e quando a informação modifica a estratégia. TC/PET complementam estadiamento sistêmico."},{"number":57,"area":"Cirurgia Geral","stem":"Paciente com perfuração esofágica torácica livre, sepse e contaminação pleural importante deve ser manejado com:","options":{"A":"alta com dieta normal","B":"nenhuma drenagem mesmo com coleção","C":"apenas inibidor de bomba","D":"controle urgente da perfuração e da contaminação, frequentemente por abordagem cirúrgica/endoscópica associada a drenagem e antibióticos","E":"esperar semanas em todos os casos"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Manejo depende de localização, tempo, contenção e estado clínico. Perfuração livre com sepse exige controle rápido do vazamento e drenagem; casos contidos selecionados podem ser não operatórios."},{"number":58,"area":"Cirurgia Geral","stem":"Paciente com adenocarcinoma gástrico precoce, bem diferenciado, superficial e sem sinais de risco linfonodal, em critérios apropriados, pode ser candidato a:","options":{"A":"apenas quimioterapia","B":"ressecção endoscópica em centro experiente","C":"gastrectomia total obrigatória em todo T1","D":"pancreatectomia","E":"colectomia"},"answer":"B","topic":"Esôfago e Estômago","explanation":"ESD/EMR pode curar câncer gástrico precoce dentro de critérios bem definidos, baseados em profundidade, diferenciação, ulceração e tamanho, com baixo risco nodal."},{"number":59,"area":"Cirurgia Geral","stem":"Paciente com espessamento difuso e rigidez de toda parede gástrica, com aspecto de “garrafa de couro”, apresenta quadro denominado:","options":{"A":"linite plástica","B":"pólipo hiperplásico simples","C":"síndrome de Boerhaave","D":"acalásia","E":"síndrome de Mallory-Weiss"},"answer":"A","topic":"Esôfago e Estômago","explanation":"Linita plástica é padrão infiltrativo difuso, frequentemente associado a adenocarcinoma pouco coeso/células em anel de sinete, causando estômago rígido e pouco distensível."},{"number":60,"area":"Cirurgia Geral","stem":"Paciente com síndrome hereditária por mutação germinativa em CDH1 possui alto risco de:","options":{"A":"colelitíase apenas","B":"adenoma hipofisário isolado","C":"VPPB","D":"câncer gástrico difuso hereditário","E":"carcinoma basocelular obrigatório"},"answer":"D","topic":"Esôfago e Estômago","explanation":"CDH1 codifica E-caderina e está relacionado a câncer gástrico difuso hereditário e também a risco aumentado de carcinoma lobular de mama."},{"number":61,"area":"Cirurgia Geral","stem":"Após bypass gástrico em Y de Roux, paciente apresenta dor abdominal intermitente e TC com sinal de redemoinho dos vasos mesentéricos. A hipótese é:","options":{"A":"colecistite sem cálculos em todos","B":"otite externa","C":"divertículo de Zenker","D":"hérnia interna","E":"apendicite obrigatória"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Hérnia interna por defeitos mesentéricos é complicação importante após RYGB e pode causar obstrução em alça fechada e isquemia. O swirl sign aumenta a suspeita."},{"number":62,"area":"Cirurgia Geral","stem":"Adulto com intussuscepção de intestino delgado e massa identificada na TC deve ser manejado considerando que, em adultos:","options":{"A":"é quase sempre idiopática e nunca requer cirurgia","B":"não se associa a tumores","C":"sempre desaparece sem investigação","D":"é tratada apenas com enema em todos","E":"é comum existir ponto de liderança estrutural, inclusive neoplasia, e frequentemente há indicação cirúrgica"},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Ao contrário da pediatria, intussuscepção do adulto costuma ter uma causa anatômica. A estratégia depende do segmento e suspeita de malignidade, mas cirurgia é frequente."},{"number":63,"area":"Cirurgia Geral","stem":"Paciente apresenta massa mesentérica desmoplásica, rubor e diarreia, com tumor primário em íleo. O diagnóstico provável é:","options":{"A":"linfoma de Hodgkin cervical","B":"carcinoma papilífero de tireoide","C":"adenoma pleomórfico","D":"tumor neuroendócrino de intestino delgado","E":"GIST gástrico necessariamente"},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Tumores neuroendócrinos ileais podem produzir reação desmoplásica mesentérica e síndrome carcinoide quando há metástases hepáticas permitindo passagem sistêmica de mediadores."},{"number":64,"area":"Cirurgia Geral","stem":"Paciente com pólipo maligno de cólon removido endoscopicamente apresenta margem livre ampla, tumor bem diferenciado e ausência de invasão linfovascular. Uma conduta possível é:","options":{"A":"esplenectomia","B":"colectomia total obrigatória em qualquer pólipo maligno","C":"seguimento endoscópico/oncológico sem colectomia adicional em caso de baixo risco adequadamente ressecado","D":"radioterapia craniana","E":"nenhum seguimento"},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"Pólipos T1 de baixo risco com ressecção completa podem ser tratados endoscopicamente. Margem comprometida, má diferenciação, invasão linfovascular ou invasão profunda aumentam indicação de colectomia oncológica."},{"number":65,"area":"Cirurgia Geral","stem":"Paciente com câncer de reto médio localmente avançado deve ter, para estadiamento local de alta qualidade:","options":{"A":"ultrassom de tireoide","B":"ressonância magnética de pelve com protocolo para reto","C":"Dix-Hallpike","D":"timpanometria","E":"radiografia simples de crânio"},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"RM de pelve avalia fáscia mesorretal, margem circunferencial, relação com esfíncteres, EMVI e linfonodos, sendo central no planejamento de câncer de reto."},{"number":66,"area":"Cirurgia Geral","stem":"Paciente com retocolite ulcerativa desenvolve distensão colônica >6 cm, toxicidade sistêmica e piora apesar de tratamento intensivo. A complicação é:","options":{"A":"pancreatite crônica","B":"toxic megacolon, com indicação de cirurgia se houver perfuração, deterioração ou falha terapêutica","C":"hérnia de Amyand","D":"síndrome de dumping","E":"acalásia"},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"Megacólon tóxico é emergência grave de colite. Manejo inicial inclui suporte e terapia da causa; perfuração, sangramento maciço, piora ou refratariedade exigem colectomia."},{"number":67,"area":"Cirurgia Geral","stem":"Paciente com polipose adenomatosa familiar clássica tem centenas de adenomas colorretais. A estratégia de prevenção de câncer envolve:","options":{"A":"radioterapia profilática","B":"nenhuma investigação familiar","C":"colectomia/proctocolectomia profilática em momento apropriado e vigilância de manifestações extracolônicas","D":"antibiótico crônico","E":"apenas repetir colonoscopia indefinidamente sem considerar cirurgia"},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"FAP decorre tipicamente de mutação APC e confere risco quase inevitável de câncer colorretal sem colectomia. Tipo de cirurgia depende de carga retal, idade e contexto."},{"number":68,"area":"Cirurgia Geral","stem":"Paciente com lesão iatrogênica complexa de via biliar principal reconhecida tardiamente, sem experiência hepatobiliar disponível no serviço. A melhor estratégia é:","options":{"A":"ignorar a lesão","B":"fazer apenas colecistectomia novamente","C":"drenar coleções/controlar sepse e referenciar precocemente para centro hepatobiliar experiente, evitando tentativas repetidas de reparo","D":"prescrever antiácido","E":"realizar múltiplas reconstruções improvisadas"},"answer":"C","topic":"Hepatobiliopancreática","explanation":"Reparos definitivos têm melhores resultados em centros experientes. Tentativas malsucedidas aumentam fibrose, lesão vascular e complexidade da reconstrução."},{"number":69,"area":"Cirurgia Geral","stem":"Paciente após colecistectomia apresenta coleção sub-hepática e saída biliar por dreno, sem lesão completa de ducto principal. A conduta frequentemente inclui:","options":{"A":"CPRE com esfinterotomia e/ou prótese para reduzir pressão e favorecer fechamento do vazamento, além de drenar coleções","B":"colectomia total","C":"nenhum tratamento","D":"apenas dieta","E":"hepatectomia direita em todos"},"answer":"A","topic":"Hepatobiliopancreática","explanation":"Vazamentos do coto cístico ou pequenos ductos frequentemente respondem a terapia endoscópica e drenagem. Lesões maiores requerem abordagem especializada."},{"number":70,"area":"Cirurgia Geral","stem":"Carcinoma incidental de vesícula T2, em paciente operável e sem metástases, geralmente requer após colecistectomia simples:","options":{"A":"re-ressecção oncológica com ressecção hepática do leito/segmentos IVb-V e linfadenectomia regional conforme anatomia e centro","B":"Whipple obrigatório em todos","C":"apendicectomia","D":"colectomia total","E":"nenhum tratamento adicional em todos"},"answer":"A","topic":"Hepatobiliopancreática","explanation":"T2 invade tecido conjuntivo perimuscular e tem risco linfonodal. Re-ressecção radical em pacientes apropriados melhora estadiamento e controle oncológico."},{"number":71,"area":"Cirurgia Geral","stem":"Paciente submetido a esplenectomia eletiva deve receber vacinação contra organismos encapsulados, incluindo:","options":{"A":"nenhuma vacina após esplenectomia","B":"somente BCG","C":"vacina antirrábica como única prevenção","D":"apenas influenza e nenhuma vacina encapsulada","E":"pneumococo, meningococo e Haemophilus influenzae tipo b"},"answer":"E","topic":"Hepatobiliopancreática","explanation":"Asplenia aumenta risco de sepse fulminante por bactérias encapsuladas. Vacinação e educação sobre febre são essenciais; idealmente vacinas são feitas antes de esplenectomia eletiva quando possível."},{"number":72,"area":"Cirurgia Geral","stem":"Paciente com pancreatite crônica calcificada, ducto pancreático principal dilatado e dor intratável, sem massa inflamatória dominante na cabeça. Uma operação de drenagem adequada é:","options":{"A":"Sistrunk","B":"pancreatojejunostomia longitudinal (Partington-Rochelle/Puestow modificado)","C":"colectomia de Hartmann","D":"Whipple obrigatório em todos","E":"fundoplicatura"},"answer":"B","topic":"Hepatobiliopancreática","explanation":"Quando o ducto está dilatado e não há massa de cabeça dominante, drenagem longitudinal pode aliviar dor. Procedimentos como Frey são úteis quando há componente inflamatório na cabeça."},{"number":73,"area":"Cirurgia Geral","stem":"Paciente com adenocarcinoma de cabeça de pâncreas sem metástases apresenta contato vascular que pode permitir ressecção após tratamento neoadjuvante em centro especializado. Esse cenário pode ser classificado como:","options":{"A":"pseudocisto","B":"doença borderline ressecável","C":"cisto simples","D":"doença sempre incurável sem avaliação multidisciplinar","E":"tumor benigno"},"answer":"B","topic":"Oncologia Cirúrgica","explanation":"Borderline ressecável descreve relação vascular que aumenta risco de margem positiva, mas pode permitir cirurgia após terapia sistêmica e reavaliação, em estratégia multidisciplinar."},{"number":74,"area":"Cirurgia Geral","stem":"Paciente hemodinamicamente estável com ferimento por arma branca em abdome anterior, sem peritonite e sem evisceração importante, pode ser candidato em centro adequado a:","options":{"A":"apenas radiografia de mão","B":"antibiótico oral como única investigação","C":"laparotomia obrigatória para todo ferimento penetrante","D":"manejo seletivo não operatório com exame seriado e imagem conforme indicação","E":"alta sem avaliação"},"answer":"D","topic":"Trauma e Emergências","explanation":"Em pacientes selecionados e estáveis, ferimentos penetrantes podem ser manejados seletivamente, reduzindo laparotomias não terapêuticas. Instabilidade, peritonite ou outras indicações exigem cirurgia."},{"number":75,"area":"Cirurgia Geral","stem":"Paciente com trauma abdominal fechado, instável, FAST positivo e sem outra fonte evidente de choque deve ser encaminhado para:","options":{"A":"laparotomia de emergência","B":"alta domiciliar","C":"colonoscopia","D":"tomografia antes de qualquer medida obrigatoriamente","E":"observação sem ressuscitação"},"answer":"A","topic":"Trauma e Emergências","explanation":"FAST positivo em paciente instável sugere hemoperitônio clinicamente relevante; após ressuscitação inicial, cirurgia imediata é indicada, sem atrasar para TC."},{"number":76,"area":"Cirurgia Geral","stem":"Paciente competente recusa transfusão por convicção pessoal após compreender risco de morte. A equipe deve:","options":{"A":"transfundir à força em toda situação eletiva","B":"ignorar a decisão porque o médico sempre decide","C":"pedir que um familiar anule automaticamente a decisão de adulto capaz","D":"omitir informações para obter consentimento","E":"respeitar a recusa informada, documentar capacidade e discussão, e oferecer alternativas aceitáveis"},"answer":"E","topic":"Perioperatório e Ética
