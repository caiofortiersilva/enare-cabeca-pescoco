.exam-layout{display:grid;grid-template-columns:1fr 305px;gap:18px}@media(max-width:900px){.exam-layout{grid-template-columns:1fr}.side{order:-1;position:static!important}}.question{padding:24px}.qmeta{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.qnum{font-weight:900}.area{font-size:13px;font-weight:700;color:var(--accent);margin-top:3px}.topic{font-size:12px;color:var(--muted);margin-top:2px}.stem{font-size:17px;line-height:1.58;white-space:pre-wrap;margin:18px 0}.opt{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin:10px 0;cursor:pointer;background:#fff}.opt:hover{border-color:#9eace2}.opt.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(49,94,251,.08)}.letter{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent)}.finished .opt{cursor:default}.finished .opt.correct{border-color:var(--ok);background:#f1fbf7}.finished .opt.wrong{border-color:var(--bad);background:#fff4f5}.finished .opt.correct .letter{background:var(--ok);color:#fff;border-color:var(--ok)}.finished .opt.wrong .letter{background:var(--bad);color:#fff;border-color:var(--bad)}.banner{background:#fff7e8;border:1px solid #f0d29a;padding:10px 12px;border-radius:10px;color:#7e5200;font-size:13px;margin-bottom:16px}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}

const EXAMS={"enare_ccp_2024_2025":{"id":"enare_ccp_2024_2025","label":"ENARE 2024/2025","subtitle":"Tipo 1 · 80 questões","order":"1–40 Otorrinolaringologia · 41–80 Cirurgia Geral","localKey":"enare_ccp_2024_2025_v1","questions":[{"number":1,"area":"Otorrinolaringologia","stem":"Uma paciente de 50 anos apresenta queixa de tontura e instabilidade nos últimos 5 meses, que são desencadeadas por privação do sono, ambientes com muito movimento e estímulos visuais intensos. Relata possuir transtorno de ansiedade, sem tratamento no último ano. Nega hipoacusia ou zumbido. Ao exame otorrinolaringológico, constatam-se os seguintes resultados: ausência de nistagmo espontâneo, ausência de nistagmo semi espontâneo, manobra de Dix Hallpike negativa, head impulse test negativo e teste de Skew normal. Frente ao quadro descrito, a principal hipótese diagnóstica é:","options":{"A":"vertigem posicional paroxística benigna","B":"neurite vestibular","C":"tontura perceptual postural persistente","D":"doença de Ménière","E":"schwanoma do acústico."},"answer":"C","topic":"Vestibulologia"},{"number":2,"area":"Otorrinolaringologia","stem":"Um adolescente de 15 anos, com história de obstrução nasal à direita associada a epistaxes à direita, de repetição e de grande intensidade, já tendo sido submetido a 3 tamponamentos nasais anteroposteriores à direita no último ano, realiza uma tomografia computadorizada de seios paranasais para investigação diagnóstica. O laudo revela massa na nasofaringe à direita, alargando a fossa pterigopalatina e deslocando anteriormente a parede posterior do antro maxilar. Com base na história clínica e nos achados tomográficos, o diagnóstico desse paciente é:","options":{"A":"rinossinusite fúngica invasiva","B":"hipertrofia de tonsila faríngea","C":"pólipo nasossinusal antrocoanal","D":"mucopiocele","E":"nasoangiofibroma."},"answer":"E","topic":"Rinologia e Rinossinusites"},{"number":3,"area":"Otorrinolaringologia","stem":"Um paciente de 45 anos HIV positivo, apresenta lesões brancas e difusas na mucosa oral, removíveis à raspagem com espátula e que, ao serem removidas, evidenciam uma mucosa eritematosa. Essas lesões são sugestivas de:","options":{"A":"papiloma escamoso","B":"candidíase oral","C":"herpes simplex","D":"sífilis","E":"carcinoma epidermoide."},"answer":"B","topic":"Cavidade Oral e Faringologia"},{"number":4,"area":"Otorrinolaringologia","stem":"Uma paciente de 60 anos, tabagista desde os 35 anos, 1 maço/dia, vem em consulta de otorrinolaringologia devido a disfonia progressiva, voz “masculinizada” e pigarro. O exame de videolaringoscopia evidencia pregas vocais edemaciadas com edema em franja grau III e motilidade laríngea preservada. O diagnóstico dessa paciente é:","options":{"A":"câncer de laringe","B":"laringite catarral aguda","C":"laringite espasmódica","D":"edema de Reinke","E":"papilomatose laríngea."},"answer":"D","topic":"Laringologia e Voz"},{"number":5,"area":"Otorrinolaringologia","stem":"Um paciente de 35 anos, cantor profissional, procura o otorrinolaringologista com queixa de disfonia e dificuldade em alcançar determinadas notas no canto. A videolaringoscopia evidencia a presença de lesão nodular na transição entre o terço anterior e terço médio de ambas as pregas vocais, com presença de fenda em ampulheta à fonação. O tratamento recomendado para esse paciente é:","options":{"A":"imunoterapia","B":"fonoterapia","C":"tratamento com inibidor de bomba de próton","D":"afastamento profissional definitivo","E":"microcirurgia de laringe."},"answer":"B","topic":"Laringologia e Voz"},{"number":6,"area":"Otorrinolaringologia","stem":"Um paciente de 50 anos, sem doenças crônicas, apresenta história de obstrução nasal, secreção nasal e hiposmia há mais de 12 semanas. Realizou tratamento com antibiótico sem resposta adequada. A tomografia computadorizada de cavidades paranasais evidenciou presença de velamento em seio maxilar esquerdo com material hiperdenso de permeio com calcificações lineares em seu interior. Com base na história clínica e nos achados tomográficos, a hipótese diagnóstica mais provável é:","options":{"A":"rinossinusite fúngica alérgica","B":"polipose nasossinusal","C":"rinossinusite fúngica não invasiva – bola fúngica","D":"nasoangiofibroma","E":"rinossinusite fúngica invasiva aguda – mucormicose."},"answer":"C","topic":"Rinologia e Rinossinusites"},{"number":7,"area":"Otorrinolaringologia","stem":"Um paciente de 49 anos, com quadro de rinopatia alérgica e asma, apresenta um quadro de obstrução nasal crônica e rinorreia escurecida tipo mucina. A videoendoscopia nasal evidenciou a presença de pólipos em ambas as fossas nasais e secreção nasal amarronzada. Diante do exposto acima, a hipótese diagnóstica mais provável é:","options":{"A":"rinossinusite fúngica alérgica","B":"mucormicose","C":"rinossinusite aguda complicada","D":"discenesia ciliar primária","E":"síndrome de Kartagener."},"answer":"A","topic":"Rinologia e Rinossinusites"},{"number":8,"area":"Otorrinolaringologia","stem":"Um paciente de 42 anos iniciou quadro de febre, cefaleia, artralgia, lesões cutâneas (máculas eritematosa, pápulas e vesículas) e lesões vesicobolhosas em mucosa oral e lábios, que rapidamente se ulceraram e formaram crostas sangrantes. Ela relata que estava com quadro viral respiratório e que fez uso de dipirona antes do aparecimento das lesões. Diante do exposto, o quadro clínico sugere:","options":{"A":"eritema multiforme","B":"candidíase oral","C":"afta minor","D":"doença de Behcet","E":"síndrome de Peutz-Jeghers."},"answer":"A","topic":"Cavidade Oral e Faringologia"},{"number":9,"area":"Otorrinolaringologia","stem":"Um paciente de 45 anos compareceu a consulta otorrinolaringológica devido ao aparecimento de lesão no assoalho da boca. Negava tabagismo. Ao exame, constataram-se a presença de lesão cística de consistência amolecida no assoalho bucal à esquerda e ausência de linfonodomegalia cervical. Frente ao quadro descrito acima, a principal hipótese diagnóstica é:","options":{"A":"litíase submandibular","B":"rânula","C":"carcinoma oral","D":"adenoma pleomorfo","E":"torus mandibular."},"answer":"B","topic":"Cavidade Oral e Faringologia"},{"number":10,"area":"Otorrinolaringologia","stem":"Um paciente de 73 anos, branco, comparece à consulta com um otorrinolaringologista queixando-se de lesão no lábio inferior há cerca de 5 meses. Relata que a lesão não cicatrizou mesmo com o uso de pomadas Ao exame, o médico identificou a presença de lesão ulcerada, endurecida, no lábio inferior, com cerca de 2 cm, e a ausência de linfonodomegalia cervical. Foi realizada a exérese completa da lesão e enviada a peça cirúrgica para exame histopatológico. O resultado mais provável desse exame é:","options":{"A":"melanoma","B":"carcinoma basocelular","C":"linfoma","D":"carcinoma epidermoide","E":"cancro duro."},"answer":"D","topic":"Cavidade Oral e Faringologia"},{"number":11,"area":"Otorrinolaringologia","stem":"Uma paciente de 30 anos chega à emergência com queixa de odinofagia unilateral e halitose. Ao exame, constatam-se dentes com más condições de higiene, úvula centrada e amígdala direita com lesões ulcero-necróticas, recoberta por exsudato tipo pseudomembranoso. O médico sugere a hipótese diagnóstica de angina de Plaut-Vincent. Nesse caso, o tratamento recomendado é:","options":{"A":"amigdalectomia de urgência","B":"amoxicilina associada a metronidazol","C":"soro antidiftérico","D":"corticoterapia venosa","E":"aciclovir."},"answer":"B","topic":"Faringologia e Deglutição"},{"number":12,"area":"Otorrinolaringologia","stem":"Um paciente de 55 anos, diabético e com insuficiência renal crônica, chega à emergência com quadro de febre, prostração, toxemia e hiperemia acentuada em região submandibular. Tem história de infecção dentária no molar inferior, sem tratamento adequado devido a dificuldades financeiras. Ao exame, verifica-se a presença de abaulamento em região submandibular com hiperemia acentuada e calor local. O quadro descrito acima é compatível com:","options":{"A":"abscesso retrofaríngeo","B":"síndrome de Bezold","C":"adenoma pleomórfico","D":"angina de Plaut Vincent","E":"angina de Ludwig."},"answer":"E","topic":"Faringologia e Deglutição"},{"number":13,"area":"Otorrinolaringologia","stem":"Um paciente de 50 anos foi encaminhado ao otorrinolaringologista para a realização de uma videoendoscopia da deglutição devido a uma queixa de disfagia para alimentos sólidos e líquidos, tosse e engasgos. O exame de videoendoscopia da deglutição revelou sensibilidade laríngea diminuída, escape precoce, estase de material ofertado em seios piriformes, sem limpeza eficaz com deglutições subsequentes e com presença de aspiração e penetração laríngea. O laudo desse exame é compatível com:","options":{"A":"exame normal","B":"disfagia","C":"disfagia leve","D":"disfagia moderada","E":"disfagia severa."},"answer":"E","topic":"Faringologia e Deglutição"},{"number":14,"area":"Otorrinolaringologia","stem":"Uma paciente de 45 anos comparece à consulta médica com queixa de globus faríngeo, pigarro e disfonia leve. Uma videolaringoscopia revela hiperemia de aritenoide, espessamento interaritenoideo e edema retrocricoide. O diagnóstico mais provável dessa paciente é:","options":{"A":"refluxo laringofaríngeo","B":"granuloma vocal","C":"cisto de prega vocal","D":"estenose subglótica","E":"papilomatose laríngea."},"answer":"A","topic":"Laringologia e Voz"},{"number":15,"area":"Otorrinolaringologia","stem":"Um paciente de 50 anos, com IMC 37 e história de roncos noturnos altos e sonolência excessiva diurna, leva para consulta um exame de polissonografia tipo I, com IAH de 54. O resultado da polissonografia indica que esse paciente apresenta:","options":{"A":"exame normal","B":"apneia leve","C":"apneia moderada","D":"apneia grave","E":"apneia central."},"answer":"D","topic":"Sono e Via Aérea Superior"},{"number":16,"area":"Otorrinolaringologia","stem":"Um paciente de 35 anos comparece à consulta com um otorrinolaringologista com queixa de obstrução nasal à esquerda e roncos noturnos que incomodam a esposa. Nega sonolência excessiva diurna ou apneia presenciada. Traz polissonografia tipo I com IAH de 3. O exame otorrinolaringológico evidencia desvio septal à esquerda, hipertrofia de cornetos, amígdala grau 4 e palato normal. A escala de Mallampati modificada aponta grau I, e o IMC é de 23. A conduta mais adequada para esse paciente é:","options":{"A":"septoplastia, turbinectomia e amigdalectomia","B":"septoplastia e CPAP","C":"CPAP","D":"aparelho intraoral","E":"cirurgia ortognática."},"answer":"A","topic":"Sono e Via Aérea Superior"},{"number":17,"area":"Otorrinolaringologia","stem":"Uma criança de 6 anos comparece à consulta com um otorrinolaringologista apresentando história de roncos noturnos altos, sono agitado, apneia noturna presenciada pelos pais e hiperatividade durante o dia. Ao exame, são constatados IMC 20, fácies alongada, palato ogival e amígdala grau IV. Uma endoscopia nasal evidencia hipertrofia de tonsila faríngea ocupando 90% da luz do cavum. Nesse cenário clínico, o tratamento indicado para essa criança deve ser:","options":{"A":"aparelho intraoral","B":"adenotonsilectomia","C":"CPAP","D":"expectante","E":"fonoterapia."},"answer":"B","topic":"Sono e Via Aérea Superior"},{"number":18,"area":"Otorrinolaringologia","stem":"Um paciente de 65 anos, com quadro de roncos e apneia noturna presenciada, hipertenso e portador de doença pulmonar obstrutiva crônica, leva para a consulta uma polissonografia com IAH de 40. Ao exame, o paciente é identificado com IMC de 40, circunferência cervical de 47, fossas nasais permeáveis e amígdala grau 1. Nesse caso, o tratamento preconizado é:","options":{"A":"uvulopalatofaringoplastia","B":"CPAP","C":"septoplastia e turbinectomia","D":"aparelho intraoral","E":"avanço maxilomandibular."},"answer":"B","topic":"Sono e Via Aérea Superior"},{"number":19,"area":"Otorrinolaringologia","stem":"Um paciente de 12 anos, com queixa de baixo rendimento escolar em língua portuguesa, apresentando dificuldade em leitura, interpretação de texto e na escrita, não apresenta dificuldade em matemática. Esse relato indica que a criança sofre de:","options":{"A":"dislexia","B":"discalculia","C":"apraxia de fala","D":"transtorno do desenvolvimento de linguagem","E":"transtorno do espectro do autismo."},"answer":"A","topic":"Fonoaudiologia e Linguagem"},{"number":20,"area":"Otorrinolaringologia","stem":"Uma criança comparece a uma consulta médica apresentando craniossinostose bicoronal, proptose ocular, hipoplasia do terço médio da face e sindactilia simétrica de mãos e pés. O exame da cavidade oral apresenta má oclusão dentária tipo III de Angle, palato ogival e fissura palatina. O exame diagnóstico evidencia uma mutação do gene FGFR2 (receptor 2 do fator de crescimento dos fibroblatos) Com base nos dados apresentados, o diagnóstico mais provável é:","options":{"A":"síndrome de Crouzon","B":"síndrome de Pfeiffer","C":"síndrome de Down","D":"síndrome de Apert","E":"síndrome de Goldenhar."},"answer":"D","topic":"Craniofacial e Pediatria"},{"number":21,"area":"Otorrinolaringologia","stem":"Um recém-nascido com fissura labiopalatina foi encaminhado para avaliação crâniomaxilofacial logo após a alta hospitalar da maternidade. Os pais estavam muito ansiosos e necessitavam de orientação quanto à correção cirúrgica. Ao exame, confirma-se que o recém-nascido de 3 dias de vida e com 2,1 kg apresentava uma fissura labiopalatina. A cirurgia deve ser conduzida da seguinte forma:","options":{"A":"correção cirúrgica em conjunto do lábio e palato aos 3 meses ou quando atingir 5 kg","B":"correção cirúrgica inicialmente do palato aos 6 meses ou quando o paciente atingir 10 kg","C":"correção cirúrgica inicialmente do lábio aos 9 meses ou quando o paciente atingir 10 kg","D":"correção cirúrgica inicialmente do palato aos 3 meses ou quando o paciente atingir 5 kg","E":"correção cirúrgica inicialmente do lábio aos 3 meses ou quando o paciente atingir 5 kg."},"answer":"E","topic":"Craniofacial e Pediatria"},{"number":22,"area":"Otorrinolaringologia","stem":"Um menino de 2 anos compareceu a uma consulta com o otorrinolaringologista para esclarecimento diagnóstico. Possui hipoplasia mandibular e do complexo zigomaticomalar, além de malformação de orelha externa (microtia), olhos com inclinação para baixo e fissuras palatinas. O quadro clínico descrito é compatível com:","options":{"A":"síndrome de Rett","B":"síndrome de Down","C":"síndrome de Angelman","D":"síndrome de Treacher Collins","E":"síndrome de Williams."},"answer":"D","topic":"Craniofacial e Pediatria"},{"number":23,"area":"Otorrinolaringologia","stem":"Um paciente de 35 anos, vítima de agressão física (soco), sofreu trauma facial. Foi encaminhado ao serviço de emergência e avaliado por um cirurgião craniomaxilofacial. Ao exame físico, apresentava edema em terço inferior da face, dor intensa, salivação abundante, dificuldade de deglutição, alteração da mordida e impossibilidade de abrir ou fechar a boca. Apresentava, também, parestesia de lábio inferior. Com base no descrito acima, há que se suspeitar de fratura:","options":{"A":"tipo Le Fort I","B":"tipo Le Fort II","C":"de mandíbula","D":"do assoalho de órbita","E":"do arco zigomático."},"answer":"C","topic":"Craniofacial e Pediatria"},{"number":24,"area":"Otorrinolaringologia","stem":"Um paciente de 45 anos, com paralisia facial periférica à direita, compareceu a consulta otorrinolaringológica para avaliação. Ao exame, apresentou teste de Schirmer normal, ausência de reflexo estapédico e alteração da gustação à direita. Com relação ao topodiagnóstico, a lesão do nervo facial está localizada:","options":{"A":"antes da saída do ramo grande petroso superficial","B":"depois da saída do ramo corda do tímpano","C":"antes do gânglio geniculado","D":"depois da saída do ramo grande petroso superficial e antes da saída do ramo estapédico","E":"depois da saída do ramo estapédico e antes da saída do ramo corda do tímpano."},"answer":"E","topic":"Otologia e Audiologia"},{"number":25,"area":"Otorrinolaringologia","stem":"Um paciente de 45 anos comparece à consulta com um otorrinolaringologista com queixa de obstrução nasal à esquerda. Ao exame, constata-se a presença de um abaulamento liso na região do assoalho nasal esquerdo próximo à cartilagem alar nasal. A tomografia computadorizada de face evidencia lesão arredondada cística, bem delimitada na região nasal. Diante do apresentado, o diagnóstico mais provável é:","options":{"A":"granuloma piogênico","B":"rinolito","C":"displasia fibrosa","D":"osteoma maxilar","E":"cisto nasolabial."},"answer":"E","topic":"Rinologia e Rinossinusites"},{"number":26,"area":"Otorrinolaringologia","stem":"Um adolescente de 12 anos, com queixa de obstrução nasal à direita, sem queixa de epistaxe, faz uma endoscopia nasal, que evidenciou um pólipo na região do óstio do maxilar direito que se estende para o cavum, ocasionando obstrução total de nasofaringe. A tomografia computadorizada de cavidades paranasais revelou um material com densidade de partes moles ocupando o seio maxilar direito, levando ao alargamento do complexo osteomeatal e estendendo-se para cavidade nasal e cavum. Com base na anamnese e nos exames descritos acima, a principal hipótese para esse caso é:","options":{"A":"rinossinusite fúngica alérgica","B":"síndrome de Woakes","C":"pólipo antrocoanal","D":"estesioneuroblastoma","E":"meningoencefalocele."},"answer":"C","topic":"Rinologia e Rinossinusites"},{"number":27,"area":"Otorrinolaringologia","stem":"Uma paciente de 54 anos, com quadro de rinossinusite crônica com polipose nasossinusal e asma de difícil controle, já realizou 2 cirurgias endoscópicas nasossinusais há 4 anos atrás, mas houve retorno dos pólipos nasais. Constatou-se fenótipo eosinofílico. Diante do exposto acima, a paciente tem indicação de:","options":{"A":"tratamento com imunobiológico","B":"internação hospitalar","C":"anti-histamínico oral","D":"cauterização dos pólipos","E":"alta."},"answer":"A","topic":"Rinologia e Rinossinusites"},{"number":28,"area":"Otorrinolaringologia","stem":"Um paciente de 30 anos compareceu à consulta médica relatando ter notado uma lesão na boca, indolor, na região da úvula. Ao exame, verificou-se a presença de lesão verrucosa na úvula, mas o restante da cavidade oral estava sem anormalidade. Identificou-se ausência de linfonodomegalias. Com base na anamnese e no exame físico, a hipótese diagnóstica é:","options":{"A":"herpes simples","B":"papiloma de úvula","C":"herpangina","D":"líquen plano","E":"hematoma."},"answer":"B","topic":"Cavidade Oral e Faringologia"},{"number":29,"area":"Otorrinolaringologia","stem":"Um paciente de 4 anos realizou cirurgia para correção de fissura palatina aos 2 anos, mas a mãe relata que a criança tem hipernasalidade na fala e alteração da deglutição. A principal hipótese para esse caso é:","options":{"A":"hipertrofia de amígdala","B":"nódulo vocal","C":"insuficiência velofaríngea","D":"pólipo vocal","E":"paralisia de prega vocal."},"answer":"C","topic":"Faringologia e Deglutição"},{"number":30,"area":"Otorrinolaringologia","stem":"Uma paciente de 55 anos comparece à consulta médica com queixa de sensação de queimação na boca e língua que surgiu após o início da menopausa. Relata ser muito ansiosa e sentir a boca muito ressecada. Ao exame, verifica-se a ausência de lesões na língua ou na mucosa oral, cuja coloração é normal. Diante do exposto, a principal hipótese diagnóstica é:","options":{"A":"glossite","B":"carcinoma oral","C":"síndrome da boca ardente","D":"candidíase oral","E":"língua geográfica."},"answer":"C","topic":"Cavidade Oral e Faringologia"},{"number":31,"area":"Otorrinolaringologia","stem":"Um paciente de 50 anos apresenta história de intubação orotraqueal prolongada devido a insuficiência respiratória causada por covid há 3 meses. Logo após melhora do quadro clínico, teve alta e notou disfonia, que não regrediu. Ao exame de videolaringoscopia, foi evidenciada uma lesão lisa, arredondada, no terço posterior da prega vocal direita, próxima ao processo vocal da aritenoide direita. A mobilidade laríngea foi preservada. Diante dessa história clínica e da videolaringoscopia, a principal hipótese diagnóstica é:","options":{"A":"nódulo vocal","B":"granuloma vocal","C":"edema de Reinke","D":"papilomatose laríngea","E":"membrana laríngea."},"answer":"B","topic":"Laringologia e Voz"},{"number":32,"area":"Otorrinolaringologia","stem":"Um paciente de 40 anos, com história de aumento de volume em região cervical anterior há cerca de 1 ano, de forma lenta e gradual, comparece ao otorrinolaringologista. Nega disfagia, disfonia e também tabagismo. Ao exame, verificam-se o aumento do volume da tireoide, não sendo palpável nenhum nódulo, e ausência de linfonodomegalia cervical. De acordo com o descrito acima, a principal hipótese diagnóstica para o caso é:","options":{"A":"carcinoma papilífero de tireoide","B":"cisto do ducto tireoglosso","C":"cisto branquial","D":"bócio multinodular","E":"bócio difuso."},"answer":"E","topic":"Pescoço e Tireoide"},{"number":33,"area":"Otorrinolaringologia","stem":"Uma paciente de 65 anos apresenta aumento do volume da tireoide, com invasão torácica parcial, ocasionando disfagia, dispneia e cansaço. A radiografia de tórax evidencia uma massa na região superior de mediastino. Diante do exposto, a principal hipótese diagnóstica para esse caso é:","options":{"A":"tireoidite de Hashimoto","B":"cisto branquial","C":"nódulo tireoidiano","D":"bócio mergulhante","E":"doença de Graves."},"answer":"D","topic":"Pescoço e Tireoide"},{"number":34,"area":"Otorrinolaringologia","stem":"Uma paciente de 65 anos comparece à consulta de otorrinolaringologia com queixa de zumbido pulsátil em orelha direita há 3 anos, sincrônico aos batimentos cardíacos. Relata plenitude aural à direita e hipoacusia à direita. Tem vertigem ocasionalmente. Ao exame, verificam-se otoscopia direita com tumoração avermelhada retrotimpânica e otoscopia esquerda normal. De acordo com o descrito, a principal hipótese diagnóstica para o caso é:","options":{"A":"colesteatoma adquirido","B":"granuloma de conduto","C":"malformação de cadeia ossicular","D":"timpanoesclerose","E":"glomus timpânico."},"answer":"E","topic":"Otologia e Audiologia"},{"number":35,"area":"Otorrinolaringologia","stem":"Um paciente de 8 anos, com síndrome de Treacher Collins, microtia bilateral importante e atresia de conduto auditivo externo bilateralmente, apresenta hipoacusia condutiva moderada com gap aéreo ósseo maior que 30 dB e índice de reconhecimento de fala de 80% em ambas as orelhas. A forma de reabilitação auditiva indicada para esse paciente é:","options":{"A":"prótese total de cadeia ossicular","B":"aparelho de amplificação sonora individual","C":"prótese auditiva osteoancorada","D":"implante coclear","E":"prótese parcial de cadeia ossicular."},"answer":"C","topic":"Otologia e Audiologia"},{"number":36,"area":"Otorrinolaringologia","stem":"Um paciente de 57 anos realizou extração a dentária do primeiro molar superior esquerdo e notou, no pós-operatório, que, ao bochechar, havia saída de líquido pela fossa nasal esquerda. Cerca de 2 semanas após o procedimento dentário, o paciente evoluiu com quadro de sinusite maxilar esquerda, sendo necessário o uso de antibiótico. Frente à anamnese descrita, a principal hipótese para esse caso é:","options":{"A":"fístula oroantral","B":"rinopatia alérgica","C":"displasia fibrosa","D":"pólipo antrocoanal","E":"carcinoma de seio maxilar."},"answer":"A","topic":"Rinologia e Rinossinusites"},{"number":37,"area":"Otorrinolaringologia","stem":"Um paciente de 4 anos comparece a consulta ambulatorial com um quadro de hiperemia e edema na região pré-auricular direita e saída de secreção purulenta através de um pequeno orifício na região anterior da hélice à direita. A mãe relata um episódio semelhante a esse, há cerca de 1 ano. Com base na história clínica, o provável diagnóstico é:","options":{"A":"parotidite aguda","B":"higroma cístico","C":"cisto tireoglosso","D":"coloboma auris infectado","E":"linfadenite tuberculosa."},"answer":"D","topic":"Craniofacial e Pediatria"},{"number":38,"area":"Otorrinolaringologia","stem":"Um paciente de 8 anos queixa-se de pescoço inchado à direita. Ao exame, verifica-se uma massa na região lateral do pescoço, indolor, não endurecida, localizada ao longo da borda anterior do músculo esternocleidomastoideo, próximo ao ângulo da mandíbula à direita. Essa descrição é compatível com:","options":{"A":"abscesso de Bezold","B":"angina de Ludwig","C":"linfoadenite aguda","D":"cisto tireoglosso","E":"cisto branquial."},"answer":"E","topic":"Pescoço e Tireoide"},{"number":39,"area":"Otorrinolaringologia","stem":"Um paciente de 74 anos com quadro de tontura e instabilidade há 6 meses, sem náuseas, leva um exame de vectoeletronistagmografia com nistagmo espontâneo multidirecional, sem efeito inibitório da fixação ocular e com rastreio tipo IV. Com base nos dados apresentados, a hipótese diagnóstica é de:","options":{"A":"síndrome vestibular periférica irritativa","B":"síndrome vestibular periférica deficitária","C":"síndrome central","D":"exame normal","E":"vertigem posicional."},"answer":"C","topic":"Vestibulologia"},{"number":40,"area":"Otorrinolaringologia","stem":"Uma paciente de 40 anos, previamente hígida, apresentou quadro de meningite bacteriana grave, com intubação orotraqueal e internação hospitalar por 3 semanas. Relatou que, assim que melhorou do quadro infeccioso, notou hipoacusia bilateral que impedia o entendimento das palavras, realizando comunicação por leitura labial. Ao exame, verifica-se que a otoscopia está normal e que a audiometria revela hipoacusia neurossensorial bilateral profunda. Diante do exposto, o tratamento indicado é:","options":{"A":"timpanotomia com inserção de tubo de ventilação","B":"timpanomastoidectomia conservadora","C":"timpanomastoidectomia radical","D":"prótese auditiva osteoancorada","E":"implante coclear."},"answer":"E","topic":"Otologia e Audiologia"},{"number":41,"area":"Cirurgia Geral","stem":"Sabe-se que a inflamação é uma resposta protetora para que possamos nos livrar de agentes lesivos, remover células necrosadas e reparar tecidos lesados. A síndrome da resposta inflamatória sistêmica (SIRS) está associada a um conjunto de sinais e sintomas resultantes de um complexo mecanismo de defesa imunológico, endócrino e metabólico, que é desencadeado primariamente:","options":{"A":"pela acidose metabólica","B":"por interferência do cortisol","C":"por ação das catecolaminas","D":"pelas proteínas de choque térmico","E":"por ação da interleucina 1 e fator de necrose tumoral."},"answer":"E","topic":"Inflamação, Infecção e Sepse"},{"number":42,"area":"Cirurgia Geral","stem":"O estado nutricional do paciente é fundamental para o prognóstico do tratamento cirúrgico. Assim, a reposição de vitaminas faz-se necessária para o bom prognóstico. As características funcionais de ser antioxidante, proteger contra os danos de radicais livres, atuar na ligação cruzada de colágeno, participar da hidroxilação da lisina e da prolina durante a formação de colágeno, desempenhar funções antibacterianas mediadas pelo sistema imune dos leucócitos e ser importante na replicação de DNA e RNA e na função de linfócitos, são próprias da vitamina:","options":{"A":"A","B":"C","C":"D","D":"E","E":"K."},"answer":"B","topic":"Nutrição e Metabolismo"},{"number":43,"area":"Cirurgia Geral","stem":"Em uma cirurgia eletiva de grande porte, faz-se necessária uma avaliação nutricional rigorosa, pois esta vai determinar um preparo pré-operatório muito importante para o prognóstico cirúrgico. Assim, um paciente que pesa 55 kg e mede 1,78 metro é classificado pelo índice de massa corporal como:","options":{"A":"gravemente abaixo do peso","B":"abaixo do peso","C":"peso normal","D":"acima do peso","E":"obesidade de grau 1."},"answer":"B","topic":"Nutrição e Metabolismo"},{"number":44,"area":"Cirurgia Geral","stem":"A compreensão das fases do processo cicatricial de uma ferida cirúrgica é importante para a prática médica. Nesse sentido, é correto afirmar que:","options":{"A":"macrófagos e neutrófilos são predominantes na fase de maturação","B":"neutrófilos e linfócitos são predominantes na fase de maturação","C":"fibroblastos e neutrófilos são predominantes na fase de proliferação","D":"macrófagos e neutrófilos são predominantes na fase inflamatória","E":"macrófagos e linfócitos são predominantes na fase inflamatória."},"answer":"D","topic":"Cicatrização e Feridas"},{"number":45,"area":"Cirurgia Geral","stem":"Antibióticos profiláticos, cujo uso está bem documentado para a redução da infecção no sítio cirúrgico, devem ser ministrados sempre que a ferida for classificada como limpa-contaminada. Na prática médica, porém, observa-se que alguns pacientes são alérgicos aos antibióticos betalactâmicos. Nesses casos, os betalactâmicos devem ser substituídos por:","options":{"A":"cefazolina","B":"metronidazol","C":"ampicilina-sulbactam","D":"gentamicina","E":"clindamicina."},"answer":"E","topic":"Inflamação, Infecção e Sepse"},{"number":46,"area":"Cirurgia Geral","stem":"A perspectiva de vida aumentou significativamente nas últimas décadas, e, com isso, um maior número de cirurgias é realizado em pacientes idosos. Esses pacientes trazem um déficit orgânico e comorbidades que devem ser considerados na avaliação pré-operatória. Nesse sentido, o mais importante fator de risco para o desenvolvimento de delirium no pós-operatório é:","options":{"A":"a presença prévia de um déficit cognitivo","B":"o comprometimento funcional","C":"o tipo de cirurgia a ser realizada","D":"a presença de doença grave","E":"a má nutrição."},"answer":"A","topic":"Perioperatório e Ética"},{"number":47,"area":"Cirurgia Geral","stem":"Um paciente de 34 anos apresenta-se na consulta com histórico de obesidade grave há mais de 10 anos. Ele tem um índice de massa corporal (IMC) de 44 kg/m² e sofre de várias comorbidades relacionadas à obesidade, incluindo diabetes tipo 2, hipertensão arterial e apneia do sono. Ele já tentou vários tratamentos, incluindo dietas supervisionadas, programas de exercícios e medicações para perda de peso, sem sucesso. Relata que essas condições estão afetando seriamente sua qualidade de vida e capacidade de trabalho. Após uma avaliação completa, ele é considerado um bom candidato para cirurgia bariátrica. A técnica considerada o “padrão ouro” para esse paciente é:","options":{"A":"gastrectomia vertical (sleeve gastrectomy)","B":"banda gástrica ajustável","C":"duodenal switch (DS)","D":"balão intragástrico","E":"bypass gástrico em Y de Roux (RYGB)."},"answer":"E","topic":"Cirurgia Bariátrica"},{"number":48,"area":"Cirurgia Geral","stem":"Um paciente de 81 anos, com diagnóstico de doença pulmonar obstrutiva crônica e insuficiência cardíaca congestiva, é internado para tratamento de pneumonia. Após alguns dias de tratamento com antibióticos e repouso no leito, ele começa a apresentar distensão abdominal significativa, dor leve e náuseas, mas sem vômitos. Não apresenta sinais clínicos de peritonite aos exames físico e laboratorial. Radiografias do abdômen mostram dilatação importante dos cólons, principalmente no ceco e cólon ascendente, porém sem evidência de obstrução mecânica. Diante desse quadro clínico, o diagnóstico mais provável e a melhor abordagem inicial para o manejo desse paciente são, respectivamente:","options":{"A":"síndrome de Ogilvie e tratamento com neostigmina","B":"colite pseudomembranosa e tratamento com metronidazol","C":"obstrução intestinal por brida e tratamento com cirurgia exploratória","D":"volvo de sigmoide e tratamento com sigmoidoscopia descompressiva","E":"íleo paralítico e tratamento com reposição de eletrólitos e mobilização precoce."},"answer":"A","topic":"Coloproctologia e Intestino"},{"number":49,"area":"Cirurgia Geral","stem":"Uma paciente de 54 anos se queixa de dor abdominal crônica e sensação de plenitude gástrica após as refeições. Uma endoscopia digestiva alta revela massa submucosa no corpo do estômago, e a biópsia confirma a presença de um tumor estromal gastrointestinal (GIST). A respeito do diagnóstico, prognóstico e tratamento dos tumores GIST, é correto afirmar que:","options":{"A":"os tumores GIST são frequentemente benignos e de baixo potencial metastático","B":"a mutação no gene KIT é um marcador prognóstico negativo em pacientes com tumores GIST","C":"a imuno-histoquímica positiva para CD117 (c-KIT) é uma característica comum dos tumores GIST","D":"os tumores GIST produzem metástases para linfonodos com muita frequência","E":"a ressecção cirúrgica radical é o único tratamento eficaz para os tumores GIST, independentemente do tamanho ou localização."},"answer":"C","topic":"Esôfago e Estômago"},{"number":50,"area":"Cirurgia Geral","stem":"Uma paciente se queixa de boca seca por diminuição da saliva e olhos secos devido à diminuição da produção de lágrimas. Esse quadro clínico é característico da:","options":{"A":"síndrome de Williams","B":"síndrome de Peutz-Jeghers","C":"síndrome de Kleine-Levin","D":"síndrome Sjögren","E":"síndrome de Down."},"answer":"D","topic":"Cabeça e Pescoço / Salivar"},{"number":51,"area":"Cirurgia Geral","stem":"Um paciente de 58 anos, com histórico de uso contínuo de anti-inflamatórios não esteroidais (AINEs), queixa-se de dor abdominal intensa, principalmente após as refeições, e episódios de vômito com sangue. Relata, também, fezes escuras e pastosas, como piche, nas últimas 48 horas. Ao exame físico, o paciente está hipotenso, taquicárdico e apresenta abdômen distendido e sensível à palpação. A endoscopia digestiva alta revela úlcera gástrica com classificação de Forrest IB, que foi tratada adequadamente. O tratamento concomitante é:","options":{"A":"realizar angiografia para localizar o vaso sangrante","B":"realizar teste respiratório para detecção de Helicobacter pylori","C":"iniciar infusão de proton pump inhibitor (PPI) e transfusão de sangue","D":"iniciar antibioticoterapia empírica para erradicação de Helicobacter pylori","E":"encaminhar o paciente para cirurgia de emergência para ressecção do segmento gástrico afetado."},"answer":"C","topic":"Esôfago e Estômago"},{"number":52,"area":"Cirurgia Geral","stem":"A técnica Lichtenstein tem sido associada a baixas taxas de recorrência e é considerada uma abordagem padrão para o tratamento das hérnias. Em relação a essa técnica, é correto afirmar que:","options":{"A":"é utilizada para o tratamento de hérnias lombares","B":"envolve o uso de uma malha sintética para reforçar a parede abdominal, sem tensão, após a correção da hérnia inguinal","C":"utiliza suturas com fio inabsorvível para fechar o defeito herniário sem o uso de uma malha","D":"é mais comumente utilizada para reparo de hérnias umbilicais","E":"requer a remoção da hérnia e a reconstrução da parede abdominal utilizando tecido do próprio paciente."},"answer":"B","topic":"Hérnias e Parede Abdominal"},{"number":53,"area":"Cirurgia Geral","stem":"Um paciente de 20 anos chega ao serviço de emergência de um grande hospital com história de anorexia e náuseas que se iniciaram há 24 horas. Agora apresenta dor abdominal intensa no quadrante inferior direito, febre e vômitos. O exame físico revela rigidez abdominal localizada no quadrante inferior direito e dor à palpação profunda na fossa ilíaca direita. Os exames laboratoriais mostram leucocitose de 15.400/mm3 com desvio à esquerda. A tomografia computadorizada de abdômen confirma o diagnóstico de abscesso apendicular. A próxima etapa no manejo desse paciente será:","options":{"A":"realização de ultrassonografia abdominal para confirmar o diagnóstico","B":"tratamento conservador com analgésicos e observação clínica","C":"antibioticoterapia intravenosa empírica e observação clínica","D":"cirurgia laparoscópica de urgência para apendicectomia","E":"drenagem percutânea do abscesso apendicular."},"answer":"E","topic":"Coloproctologia e Intestino"},{"number":54,"area":"Cirurgia Geral","stem":"Um homem de 36 anos chega ao pronto-socorro após atropelamento. Ele se queixa de dor abdominal intensa no lado direito do abdômen. Quando do exame físico, está hipotenso e taquicárdico, com dor à palpação no quadrante superior direito do abdômen. Os exames laboratoriais revelam queda da hemoglobina e elevação das enzimas hepáticas. Uma tomografia computadorizada mostra uma lesão no lobo hepático direito com hematoma subcapsular com 30% da superfície e uma laceração estimada em 4 cm de profundidade com 8 cm de comprimento. A classificação mais provável dessa lesão hepática e a conduta inicial correta de tratamento são, respectivamente:","options":{"A":"classificação I e tratamento conservador com monitoramento clínico e radiológico","B":"classificação II e intervenção cirúrgica para controle do sangramento com reparo hepático","C":"classificação III e esplenectomia para controle do sangramento com reparo hepático","D":"classificação IV e tratamento com terapia endovascular para embolização da lesão hepática","E":"classificação V e tratamento com transfusão sanguínea e monitoramento clínico."},"answer":"D","topic":"Trauma e Emergências"},{"number":55,"area":"Cirurgia Geral","stem":"Durante endoscopia realizada em um paciente com sangramento gastrointestinal agudo, uma úlcera é identificada. O sistema de classificação comumente utilizado para descrever essa úlcera de acordo com a gravidade do sangramento é a classificação de:","options":{"A":"Forrest","B":"Rockall","C":"Blatchford","D":"Glasgow-Blatchford","E":"Johnson-Lapidus."},"answer":"A","topic":"Esôfago e Estômago"},{"number":56,"area":"Cirurgia Geral","stem":"Um paciente de 68 anos queixa-se de dor abdominal intermitente e perda de peso inexplicada. Apresenta anemia ferropriva. Ele relata um histórico de síndrome do intestino irritável, mas observou um aumento na frequência e na gravidade dos sintomas nos últimos quatro meses. O exame físico revela uma massa palpável, com certa mobilidade, no quadrante inferior direito do abdômen. Diante desse quadro clínico, a hipótese diagnóstica principal é:","options":{"A":"doença celíaca","B":"síndrome do intestino irritável","C":"tumor carcinoide do intestino delgado","D":"adenocarcinoma do intestino delgado","E":"doença de Crohn."},"answer":"D","topic":"Coloproctologia e Intestino"},{"number":57,"area":"Cirurgia Geral","stem":"Uma mulher jovem, 19 anos, chega ao serviço de emergência com dor abdominal intensa e súbita. O exame físico mostra sinais de choque hipovolêmico, como taquicardia e hipotensão. Revela ainda rigidez abdominal difusa, sensibilidade e dor à palpação. A hipótese mais provável para esse quadro clínico é:","options":{"A":"apendicite aguda","B":"prenhez tubária rota","C":"diverticulite perfurada","D":"diverticulite de Meckel","E":"cisto ovariano hemorrágico roto."},"answer":"B","topic":"Trauma e Emergências"},{"number":58,"area":"Cirurgia Geral","stem":"No consultório, dá entrada um paciente de 38 anos, com suspeita clínica de síndrome de Lynch, que precisa de confirmação do diagnóstico. O método que pode confirmar a hipótese é:","options":{"A":"teste genético para mutações no gene BRCA1","B":"colonoscopia de rotina a cada 10 anos","C":"colonoscopia com exérese do pólipo e estudo histopatológico","D":"tomografia computadorizada (TC) abdominal anual","E":"teste genético para mutações nos genes MLH1, MSH2, MSH6 e PMS2."},"answer":"E","topic":"Coloproctologia e Intestino"},{"number":59,"area":"Cirurgia Geral","stem":"O conhecimento da embriologia, histologia, anatomia e patologia é importante para a compreensão do divertículo de Meckel e para o diagnóstico diferencial da apendicite. Em relação ao divertículo de Meckel, é correto afirmar que:","options":{"A":"caracteriza-se por múltiplos divertículos no cólon descendente","B":"localiza-se preferencialmente na segunda porção do duodeno","C":"geralmente afeta pacientes idosos e é mais comum no sexo masculino, que apresenta pior prognóstico","D":"é uma complicação da diverticulose do cólon e pode causar sintomas como dor abdominal, febre e leucocitose","E":"resulta de uma persistência do ducto onfalomesentérico e pode levar à inflamação e complicações como sangramento intestinal."},"answer":"E","topic":"Coloproctologia e Intestino"},{"number":60,"area":"Cirurgia Geral","stem":"Uma paciente de 45 anos, com histórico de dor abdominal no quadrante superior direito, icterícia intermitente e elevação moderada das enzimas hepáticas, é diagnosticada com coledocolitíase. A melhor abordagem para o diagnóstico e tratamento dessa paciente é:","options":{"A":"endoscopia digestiva alta, seguida de cirurgia aberta de vias biliares","B":"ressonância magnética de abdômen, seguida de drenagem biliar percutânea","C":"tomografia computadorizada do abdômen, seguida de ressonância magnética","D":"colangiografia por ressonância magnética, seguida de colangiopancreatografia retrógrada endoscópica","E":"ultrassonografia das vias biliares, seguida de colangiopancreatografia retrógrada endoscópica com papilotomia e litotripsia."},"answer":"D","topic":"Hepatobiliopancreática"},{"number":61,"area":"Cirurgia Geral","stem":"Um paciente de 52 anos tem diagnóstico de úlcera gástrica, classificada com Johnson III e complicada por sangramento persistente com classificação Forrest 1A, apresentando sucessivas recidivas do sangramento. Após estabilização hemodinâmica do paciente, o cirurgião planeja realizar uma antrectomia. Para isso, ele reflete sobre as principais diferenças entre as técnicas de Billroth I e Billroth II. Em relação a essas técnicas, é correto afirmar que:","options":{"A":"Billroth I envolve anastomose do estômago com o jejuno, enquanto Billroth II envolve anastomose do estômago com o duodeno. Billroth I é preferível em casos de úlcera gástrica complicada","B":"Billroth I envolve anastomose do estômago com o duodeno, enquanto Billroth II envolve anastomose do estômago com o jejuno. Billroth I é preferível, em casos de úlcera gástrica complicada","C":"Billroth I envolve ressecção do estômago e anastomose com o duodeno, enquanto Billroth II envolve ressecção do estômago e anastomose com o íleo. Billroth II é preferível em casos de úlcera gástrica complicada","D":"Billroth I e Billroth II não diferem na técnica de anastomose, sendo ambas apropriadas para úlcera gástrica complicada","E":"Billroth I envolve ressecção do estômago e anastomose com o duodeno, enquanto Billroth II envolve ressecção do estômago e anastomose com o jejuno. Billroth II é preferível em casos de úlcera gástrica complicada."},"answer":"E","topic":"Esôfago e Estômago"},{"number":62,"area":"Cirurgia Geral","stem":"Um homem de 54 anos apresenta-se no consultório com história de disfagia progressiva para sólidos e líquidos, regurgitação noturna de alimentos não digeridos e perda de peso significativa nos últimos oito meses. Ele não relata dor torácica, mas menciona uma sensação de \"comida parada\" no meio do peito. Não há história de doenças crônicas ou cirurgias prévias. O exame físico revela um paciente emagrecido, sem outras alterações significativas. A endoscopia digestiva alta mostra retenção de alimentos no esôfago sem lesões obstrutivas evidentes. Uma esofagografia com contraste revela um esôfago dilatado com afilamento distal, que sugere um \"bico de pássaro\". A manometria esofágica confirma aperistalse do corpo esofágico e ausência de relaxamento adequado do esfíncter esofágico inferior. O tratamento cirúrgico mais indicado para esse paciente é:","options":{"A":"fundoplicatura a Nissen","B":"dilatação pneumática","C":"miotomia de Heller","D":"esofagectomia","E":"injeção de toxina botulínica."},"answer":"C","topic":"Esôfago e Estômago"},{"number":63,"area":"Cirurgia Geral","stem":"Durante o pneumoperitônio para realização de cirurgias por acesso videolaparoscópico, algumas alterações hemodinâmicas podem ocorrer no paciente. Em relação a essas alterações, é correto afirmar que:","options":{"A":"há diminuição do débito cardíaco, com aumento do retorno venoso","B":"ocorre hipotensão por compressão mecânica da aorta abdominal","C":"a oligúria ocorre devido à hipercapnia e retenção de bicarbonato pelos rins","D":"a bradicardia ocorre por estímulo vasovagal pela distensão abdominal","E":"arritmias cardíacas e outros distúrbios de ritmo cardíaco são raros."},"answer":"D","topic":"Perioperatório e Ética"},{"number":64,"area":"Cirurgia Geral","stem":"Em relação à anatomia das vias biliares extra-hepáticas, bem como à vascularização do pedículo biliar, é correto afirmar que:","options":{"A":"em cerca de 50% da população, os ductos biliar e pancreático desembocam no duodeno por orifícios distintos","B":"anomalias da artéria hepática e da artéria cística são extremamente raras, ocorrendo em menos de 10% da população","C":"a artéria cística normalmente se origina da artéria hepática direita, cruzando o ducto hepático anteriormente","D":"em cerca de 20% dos pacientes, a artéria hepática direita se origina da artéria mesentérica superior","E":"na maioria das pessoas, o ducto biliar e o ducto pancreático se unem no interior da parede duodenal."},"answer":"E","topic":"Hepatobiliopancreática"},{"number":65,"area":"Cirurgia Geral","stem":"Um paciente de 52 anos, com sintomas dispépticos, realizou endoscopia digestiva alta, que mostrou lesão ulcerada de 3 cm em grande curvatura na transição do fundo para o corpo gástrico. A gastrina sérica estava normal. A biópsia revelou se tratar de tumor neuroendócrino G2, índice mitótico de 15 e índice Ki-67 de 25%. O estadiamento por USG endoscópico e a TC de abdômen mostraram invasão até a muscular própria, sem evidências de metástases linfonodais e à distância. A conduta mais apropriada é:","options":{"A":"quimioterapia exclusiva","B":"ressecção endoscópica","C":"gastrectomia total com linfadenectomia a D1","D":"gastrectomia total com linfadenectomia a D2","E":"bioterapia com octreotide."},"answer":"D","topic":"Esôfago e Estômago"},{"number":66,"area":"Cirurgia Geral","stem":"Uma paciente de 48 anos, IMC = 35 kg/m2, foi submetida a colecistectomia eletiva por colecistolitíase crônica. Após o procedimento, a vesícula biliar foi aberta, evidenciando cálculo único de 3 cm e mucosa de aspecto macroscópico de “vesícula biliar em morango”. O provável diagnóstico anatomopatológico macroscópico é de:","options":{"A":"adenomiomatose de vesícula biliar","B":"pólipos granulomatosos","C":"colesterolose de vesícula biliar","D":"carcinoma de vesícula biliar","E":"linfoma MALT."},"answer":"C","topic":"Hepatobiliopancreática"},{"number":67,"area":"Cirurgia Geral","stem":"Uma paciente de 60 anos apresentou lesão de 1,5 cm em pele perianal, cuja biópsia mostrou carcinoma epidermoide. A ultrassonografia endoanal e a ressonância magnética não mostraram metástases linfonodais e/ou à distância. Também não há evidências de invasão do complexo esfincteriano, bem como de estruturas adjacentes. Nesse caso, a conduta mais apropriada é:","options":{"A":"excisão local com margens negativas","B":"radioterapia exclusiva","C":"quimiorradioterapia exclusiva","D":"amputação abdominoperineal","E":"quimiorradioterapia neoadjuvante."},"answer":"A","topic":"Coloproctologia e Intestino"},{"number":68,"area":"Cirurgia Geral","stem":"Sobre as afecções cirúrgicas do baço, é correto afirmar que:","options":{"A":"o tamanho do baço deve estar aumentado no mínimo em quatro vezes para que seja palpável abaixo do rebordo costal","B":"o tumor maligno que mais comumente envia metástases para o baço é o carcinoma colorretal","C":"baços acessórios podem estar presentes em até 20% da população em geral","D":"a principal indicação de esplenectomia eletiva é a leucemia mieloide aguda","E":"os principais germes envolvidos na infecção fulminante pós-esplenectomia são Staphylococcus aureus e H. influenzae tipo B."},"answer":"C","topic":"Trauma e Emergências"},{"number":69,"area":"Cirurgia Geral","stem":"Um paciente de 35 anos com IMC = 26 kg/m2 apresenta lesão por arma branca em região anterior do abdômen, 7 cm acima e à esquerda da cicatriz umbilical, de cerca de 2 cm de diâmetro. Apresenta-se hemodinamicamente estável, e o exame físico do abdômen é normal. A próxima conduta a ser tomada nesse caso é:","options":{"A":"lavado peritoneal diagnóstico","B":"exploração local da ferida","C":"alta domiciliar","D":"reavaliação clínica após 24 horas","E":"laparotomia exploradora."},"answer":"B","topic":"Trauma e Emergências"},{"number":70,"area":"Cirurgia Geral","stem":"Existem importantes marcos anatômicos durante a correção cirúrgica de uma hérnia da região da virilha pelo acesso minimamente invasivo por via transperitoneal (TAPP). Sobre esses marcos, é correto afirmar que:","options":{"A":"o “triângulo da dor” se localiza lateralmente e abaixo do trato iliopúbico","B":"as hérnias indiretas se localizam entre os vasos epigástricos e o ligamento umbilical","C":"o trato iliopúbico divide os compartimentos inguinais anterior e posterior","D":"o “triângulo da desgraça” (triangle of doom) fica lateralmente aos vasos espermáticos","E":"as hérnias femorais se originam lateralmente ao ducto deferente e abaixo do trato iliopúbico."},"answer":null,"topic":"Hérnias e Parede Abdominal"},{"number":71,"area":"Cirurgia Geral","stem":"Um paciente de 40 anos está internado em unidade de terapia intensiva, em estado grave, há 15 dias devido a sepse de origem pulmonar. A despeito de doses altas de aminas vasoativas, mantém PAM de 60 mmHg e FC de 112 bpm (ritmo regular). Há 24 horas evoluiu com piora significativa do quadro clínico, com distensão abdominal e hipertimpanismo. Ao toque retal, evidenciou-se presença de moderada quantidade de muco e sangue. Nesse caso, o diagnóstico mais provável é:","options":{"A":"trombose arterial mesentérica","B":"trombose venosa mesentérica","C":"embolia da artéria mesentérica superior","D":"isquemia intestinal não oclusiva","E":"intussuscepção de intestino delgado."},"answer":"D","topic":"Coloproctologia e Intestino"},{"number":72,"area":"Cirurgia Geral","stem":"Um paciente de 17 anos chega ao pronto-socorro com dor em hipocôndrio esquerdo após queda de bicicleta há cerca de 6 horas. Ao exame, está hipocorado +/4, com PA: 120 x 80 mmHg e FC: 88 bpm. Realiza tomografia computadorizada de abdômen, que mostra presença de pouca a moderada quantidade de líquido em hipocôndrio esquerdo com laceração grau III, em baço, sem extravasamento (blush) de contraste arterial. Apresenta hematócrito de 30% e hemoglobina de 9,5 mg/dL. A melhor conduta nesse caso é:","options":{"A":"observação por 12 horas na sala de emergência","B":"cristaloides intravenosos e observação clínica em UTI","C":"transfusão de concentrado de hemácias e embolização arterial por arteriografia","D":"cristaloides intravenosos e embolização arterial por arteriografia","E":"transfusão de concentrado de hemácias e laparotomia exploradora."},"answer":"B","topic":"Trauma e Emergências"},{"number":73,"area":"Cirurgia Geral","stem":"Uma paciente de 59 anos, diabética, hipertensa e dislipidêmica, em uso de metformina, rosuvastatina e captopril, relata também uso de escitalopram e clonazepam para tratamento de transtorno de ansiedade. Encontra-se em pré-operatório de colecistectomia eletiva. A medicação de uso regular da paciente que deve ser suspensa em até 48 horas do procedimento é:","options":{"A":"metformina","B":"rosuvastatina","C":"captopril","D":"escitalopram","E":"clonazepam."},"answer":"A","topic":"Perioperatório e Ética"},{"number":74,"area":"Cirurgia Geral","stem":"Um paciente de 47 anos, etilista, apresenta emagrecimento, esteatorreia e diabetes mellitus e dor tipo barra de forte intensidade de difícil controle com opioides. Realizou tomografia de abdômen, que mostrou pâncreas atrófico, com calcificações, e ducto de Wirsung dilatado (1,5 cm) e tortuoso em toda a sua extensão, com estenoses e saculações. A melhor conduta terapêutica nesse caso é:","options":{"A":"alcoolização do plexo mesentérico","B":"papilotomia endoscópica com drenagem do Wirsung","C":"Wirsung-jejuno anastomose (Partington-Rochelle)","D":"pancreatectomia cefálica com preservação duodenal (Beger)","E":"pancreatectomia corpo-caudal."},"answer":"C","topic":"Hepatobiliopancreática"},{"number":75,"area":"Cirurgia Geral","stem":"A técnica de Sistrunk é utilizada no tratamento do(a):","options":{"A":"tumor de parótida","B":"síndrome do desfiladeiro torácico","C":"tumor de Warthin","D":"cisto branquial","E":"cisto tireoglosso."},"answer":"E","topic":"Cabeça e Pescoço / Salivar"},{"number":76,"area":"Cirurgia Geral","stem":"No que diz respeito às fístulas anorretais, é correto afirmar que:","options":{"A":"cerca de 50% dos pacientes que tiveram abscessos anorretais drenados irão desenvolver uma fístula","B":"as fístulas anteriores, segundo a regra de Goodsall, têm um trajeto curvado, enquanto as posteriores têm trajeto retilíneo","C":"as fístulas extraesfincterianas são as mais comuns, e são tratadas com esfincterotomia lateral","D":"fístulas transesfinctéricas altas, que envolvem uma grande quantidade de músculo, são mais bem tratadas com fistulotomia","E":"o uso de fio (seton) só está indicado em fístulas interesfinctéricas simples."},"answer":"A","topic":"Coloproctologia e Intestino"},{"number":77,"area":"Cirurgia Geral","stem":"Um paciente de 30 anos, portador de síndrome de Down, chega ao ambulatório de cirurgia para avaliação cirúrgica de hérnia umbilical. Embora possua visível déficit cognitivo e mental, o paciente compreende de forma parcial as informações acerca da cirurgia. Em relação ao termo de consentimento livre e esclarecido, é correto afirmar que:","options":{"A":"deve ser assinado apenas pela mãe e lido em voz alta para o paciente","B":"deve ser assinado pela mãe e pelo paciente, visto que ele é maior de idade","C":"deve ser assinado apenas pelo paciente, visto que ele é maior de idade","D":"deve ser assinado pela mãe e deve ser apresentado termo de assentimento livre e esclarecido ao paciente","E":"não é necessário, pois se trata de procedimento de baixa complexidade."},"answer":"D","topic":"Perioperatório e Ética"},{"number":78,"area":"Cirurgia Geral","stem":"Em relação à cicatrização de feridas, é correto afirmar que:","options":{"A":"a principal célula envolvida no processo cicatricial é o linfócito T-helper, pois ele orquestra todas as fases de cicatrização","B":"o colágeno tipo I constitui a matriz inicial, dando lugar ao colágeno tipo III posteriormente","C":"a fase de maturação dura até cerca de 3 semanas após o início do processo cicatricial","D":"a angiogênese é o marco principal da fase inflamatória, ocorrendo nas primeiras 72 horas após a lesão","E":"a taxa de síntese de colágeno declina após 4 semanas, sendo equilibrada por sua degradação."},"answer":"E","topic":"Cicatrização e Feridas"},{"number":79,"area":"Cirurgia Geral","stem":"Em relação aos sarcomas de retroperitônio, é correto afirmar que:","options":{"A":"o tipo histológico mais comum é o rabdomiossarcoma","B":"dois terços dos tumores são sarcomas de baixo grau","C":"o linfoma e a metástase de tumores testiculares são diagnósticos diferenciais possíveis","D":"a invasão de grandes vasos do retroperitônio é contraindicação para a ressecção cirúrgica","E":"a ressecção cirúrgica com linfadenectomia intercavoaórtica e de ilíacas é o tratamento de escolha."},"answer":"C","topic":"Oncologia Cirúrgica"},{"number":80,"area":"Cirurgia Geral","stem":"Um paciente de 35 anos foi submetido a apendicectomia videolaparoscópica por diagnóstico de apendicite aguda. Durante o intraoperatório, foi visto tumor de ponta de apêndice, cujo resultado histopatológico foi tumor carcinoide de 1,5 cm com margens livres de doença neoplásica. A melhor conduta nesse caso é:","options":{"A":"observação clínica e radiológica","B":"hemicolectomia direita","C":"ileotiflectomia","D":"ressecção do trajeto dos trocartes","E":"quimioterapia adjuvante."},"answer":"A","topic":"Coloproctologia e Intestino"}]},"enare_ccp_2025_2026":{"id":"enare_ccp_2025_2026","label":"ENARE 2025/2026","subtitle":"Tipo 1 · 80 questões","order":"1–40 Cirurgia Geral · 41–80 Otorrinolaringologia","localKey":"enare_ccp_2025_2026_v1","questions":[{"number":1,"area":"Cirurgia Geral","stem":"Você recebe, em seu hospital, um paciente do sexo masculino, 58 anos, previamente hígido, que é encaminhado por médico assistente de uma clínica da família, após queixas inespecíficas de desconforto abdominal e sensação de massa no flanco esquerdo. Ao exame físico, apresenta abaulamento em flanco esquerdo, indolor, profundo e mal delimitado. Tomografia computadorizada de abdome e pelve evidencia massa retroperitoneal de grandes dimensões, heterogênea, com áreas de necrose central, deslocando estruturas adjacentes, sem sinais claros de invasão de órgãos. Não há metástases à distância identificadas. Diante desse quadro, a conduta mais apropriada será","options":{"A":"biópsia percutânea guiada por TC para diagnóstico histológico e posterior quimioterapia.","B":"ressecção cirúrgica ampla com margens negativas, sem biópsia prévia.","C":"início de radioterapia externa com controle radiológico seriado","D":"quimioterapia neoadjuvante antes da cirurgia para reduzir o volume tumoral.","E":"ressecção cirúrgica limitada ao tumor visível, poupando estruturas adjacentes."},"answer":"A","topic":"Oncologia Cirúrgica"},{"number":2,"area":"Cirurgia Geral","stem":"No ambulatório de um grande hospital, dá entrada uma mulher de 37 anos. Ela apresenta hipertensão arterial resistente ao uso de três anti-hipertensivos, associada a episódios de fraqueza muscular e câimbras. Os exames laboratoriais revelam hipocalemia e alcalose metabólica. A dosagem da atividade de renina plasmática está suprimida e a aldosterona plasmática encontra-se elevada. A tomografia computadorizada de abdome mostra nódulo de 1,5 cm na glândula adrenal esquerda. Nesse caso, a melhor conduta para confirmação diagnóstica é","options":{"A":"iniciar espironolactona e monitorar resposta clínica, sem necessidade de confirmação adicional.","B":"realizar cintilografia com MIBG para avaliar atividade funcional do tumor.","C":"proceder à amostragem venosa adrenal bilateral antes de indicar cirurgia.","D":"realizar adrenalectomia laparoscópica esquerda baseada no achado tomográfico.","E":"repetir dosagem hormonal após suspensão dos antihipertensivos por 30 dias."},"answer":"C","topic":"Endócrino e Tireoide"},{"number":3,"area":"Cirurgia Geral","stem":"Paciente do sexo feminino, 29 anos, apresenta quadro progressivo de irregularidade menstrual, hirsutismo acentuado, acne de difícil controle e aumento de massa muscular nos últimos 6 meses. Ao exame físico, observa-se voz grossa, alopecia frontal e clitoromegalia. Os exames laboratoriais mostram elevação importante de androgênios séricos (DHEA-S e testosterona total), além de níveis elevados de 17-hidroxiprogesterona. Tomografia computadorizada de abdome revela massa adrenal direita de 8,1 cm, heterogênea, com áreas de necrose e calcificações. Diante desse quadro, a conduta mais apropriada será","options":{"A":"aguardar avaliação genética para hiperplasia adrenal congênita antes de intervir.","B":"iniciar tratamento com anticoncepcionais e antiandrogênicos e reavaliar em 6 meses.","C":"realizar biópsia percutânea da massa para confirmar o diagnóstico histológico.","D":"indicar ressecção cirúrgica aberta da adrenal com margem oncológica ampla.","E":"realizar adrenalectomia laparoscópica para ressecção tumoral."},"answer":"D","topic":"Endócrino e Tireoide"},{"number":4,"area":"Cirurgia Geral","stem":"Uma mulher de 52 anos, apresenta nódulo sólido na região anterior do pescoço detectado em exame clínico de rotina. Ultrassonografia de tireoide revela nódulo de 2,8 cm, sólido, hipoecoico, com bordas regulares, sem calcificações. PAAF guiada por USG foi realizada, com resultado compatível com Bethesda IV (neoplasia folicular). Os níveis de TSH são normais, e não há linfonodomegalias cervicais. A conduta mais apropriada nesse caso será","options":{"A":"observação clínica com repetição da PAAF em 6 a 12 meses.","B":"tireoidectomia total com esvaziamento cervical terapêutico.","C":"lobectomia da glândula tireoide para diagnóstico definitivo.","D":"Iodoterapia empírica seguida de monitoramento hormonal.","E":"biópsia por agulha grossa para confirmar invasão capsular antes da cirurgia."},"answer":"C","topic":"Endócrino e Tireoide"},{"number":5,"area":"Cirurgia Geral","stem":"Homem de 62 anos, com história de aumento progressivo de volume em região inguinal direita há mais de dois anos, procura atendimento ambulatorial. Refere que o abaulamento desce até o escroto, é indolor, aumentava com esforço físico e se reduz espontaneamente ao deitar-se. Nega episódios de dor súbita, náuseas ou sinais de obstrução intestinal. Ao exame físico, observa-se hérnia inguinoescrotal direita, com anel inguinal interno alargado e conteúdo redutível. O restante do exame físico e os exames laboratoriais pré-operatórios são normais. A conduta mais adequada para esse paciente será","options":{"A":"observar clinicamente, pois não há sinais de encarceramento ou obstrução.","B":"indicar hernioplastia eletiva, preferencialmente por via anterior com tela.","C":"iniciar antibioticoterapia e repetir avaliação em 30 dias.","D":"solicitar tomografia antes de indicar cirurgia, pois a clínica é inconclusiva.","E":"realizar cirurgia de urgência por risco iminente de estrangulamento."},"answer":"B","topic":"Hérnias e Parede Abdominal"},{"number":6,"area":"Cirurgia Geral","stem":"Mulher de 68 anos, com história prévia de hérnia crural direita não tratada, é levada ao pronto-socorro com dor em fossa ilíaca direita, náuseas e sensação de distensão abdominal há 24 horas. Nega vômitos ou parada total de eliminação de gases e fezes. Ao exame físico, apresenta massa dolorosa e pouco reduzível em região inguinal direita, com dor localizada, sem sinais francos de peritonite. Ruídos hidroaéreos presentes. Exames laboratoriais mostram leucocitose (14.000/mm³) e PCR elevada. A tomografia evidenciou alça intestinal com parede espessada herniando parcialmente pelo canal femoral, sem dilatação significativa de alças proximais. Nesse caso, a conduta mais apropriada será","options":{"A":"tratamento conservador com analgesia e vigilância clínica.","B":"redução manual da hérnia com sedação e reavaliação ambulatorial.","C":"cirurgia de urgência com abordagem da hérnia e avaliação de viabilidade intestinal.","D":"antibioticoterapia de amplo espectro e dieta zero por 72 horas.","E":"CPRE urgente para alívio da compressão mecânica intestinal."},"answer":"C","topic":"Hérnias e Parede Abdominal"},{"number":7,"area":"Cirurgia Geral","stem":"Homem de 71 anos, com antecedentes de duas cirurgias prévias para correção de hérnia inguinal direita, apresenta novamente abaulamento em região inguinal ipsilateral, que aumenta ao esforço e reduz parcialmente ao repouso. Relata desconforto local progressivo, mas nega sintomas obstrutivos ou dor aguda. Ao exame físico, observa-se hérnia recidivada inguinal direita, que se estende parcialmente até o escroto. A tomografia de abdome confirma hérnia inguinal recorrente com componentes direto e indireto, sem sinais de encarceramento. Funções pulmonar e cardíaca estão compensadas. Para esse paciente, a melhor abordagem terapêutica será","options":{"A":"indicar correção cirúrgica por via posterior (pré-peritoneal), preferencialmente videolaparoscópica.","B":"realizar nova hernioplastia anterior com tela pela técnica de Lichtenstein.","C":"optar por tratamento conservador com suporte inguinal e vigilância semestral.","D":"indicar ressecção intestinal profilática, dado o risco de estrangulamento.","E":"utilizar sistema de plugue e tela pela via anterior para evitar manipulação peritoneal."},"answer":"A","topic":"Hérnias e Parede Abdominal"},{"number":8,"area":"Cirurgia Geral","stem":"Homem de 47 anos, previamente saudável, procura o prontosocorro com dor epigástrica intensa irradiando para dorso, associada a náuseas e vômitos. Relata episódio semelhante leve há 2 meses. Exame físico mostra dor epigástrica à palpação profunda, sem sinais de irritação peritoneal. Temperatura 37,5 C, FC 102 bpm, PA 110/70 mmHg. Exames laboratoriais mostram: amilase 1.200 U/L (VR < 120), lipase 1.800 U/L (VR < 160), leucócitos 13.000/mm³. Ultrassonografia abdominal revela vesícula biliar com múltiplos cálculos e colédoco de 8 mm, sem sinais de dilatação intra-hepática. Das condutas a seguir, a mais apropriada nesse momento será","options":{"A":"realizar CPRE de urgência para desobstrução biliar.","B":"iniciar antibiótico e programar colecistectomia eletiva em 3 meses","C":"iniciar nutrição parenteral total e jejum prolongado até normalização das enzimas pancreáticas.","D":"encaminhar para ressonância magnética e repetir exames laboratoriais em 72 horas.","E":"internar para suporte clínico e programar colecistectomia laparoscópica durante a mesma internação."},"answer":"E","topic":"Hepatobiliopancreática"},{"number":9,"area":"Cirurgia Geral","stem":"Uma mulher de 52 anos apresenta-se com icterícia leve, colúria, prurido e dor em hipocôndrio direito, intermitente, com duração de cerca de 2 horas por episódio, geralmente após refeições gordurosas. Refere episódios semelhantes há mais de um ano, mas sem febre ou sinais de infecção sistêmica. Ao exame físico, há dor à palpação do quadrante superior direito, sem sinal de Murphy positivo. Exames laboratoriais mostram bilirrubina total de 3,5 mg/dL (fração direta 2,8), elevação de GGT, FA e discreto aumento de transaminases. Ultrassonografia abdominal revela vesícula biliar com paredes espessadas, múltiplos cálculos e colédoco com 10 mm. A melhor conduta para essa paciente, nesse momento, será","options":{"A":"realizar colecistectomia videolaparoscópica imediata e alta hospitalar precoce.","B":"solicitar colangiopancreatografia por ressonância magnética (CPRM) para avaliação de coledocolitíase.","C":"iniciar antibioticoterapia empírica e aguardar resolução espontânea da icterícia.","D":"realizar CPRE imediata com retirada de cálculo, seguida de colecistectomia eletiva.","E":"indicar drenagem percutânea da vesícula biliar para descompressão urgente."},"answer":"D","topic":"Hepatobiliopancreática"},{"number":10,"area":"Cirurgia Geral","stem":"Um paciente de 60 anos apresenta icterícia progressiva, colúria e prurido há duas semanas. Nega febre ou dor abdominal intensa. Ao exame físico, encontra-se ictérico, eupneico e normotenso. A ultrassonografia mostra dilatação das vias biliares intra e extra-hepáticas. A tomografia computadorizada de abdome evidencia massa de 2,5 cm na região ampular, sem invasão vascular, linfonodos aumentados ou metástases. A colangiopancreatografia por ressonância magnética (CPRM) e a ecoendoscopia confirmam lesão localizada na papila de Vater. Biópsia endoscópica sugere adenocarcinoma bem diferenciado. Diante desse quadro clínico, a conduta terapêutica mais apropriada será","options":{"A":"colocação de stent biliar endoscópico e acompanhamento ambulatorial.","B":"radioterapia exclusiva com intenção curativa.","C":"duodenopancreatectomia (procedimento de Whipple) com linfadenectomia regional.","D":"pancreatectomia total com esplenectomia, por ser tumor de alto risco.","E":"quimioterapia neoadjuvante antes da cirurgia para reduzir o volume tumoral."},"answer":"C","topic":"Hepatobiliopancreática"},{"number":11,"area":"Cirurgia Geral","stem":"Em sua enfermaria está um paciente de 73 anos, que tem perda ponderal de 15 kg em 4 meses, dor epigástrica persistente e vômitos pós-prandiais frequentes, é submetido à endoscopia digestiva alta, que revela lesão vegetante ulcerada no antro gástrico. A biópsia confirma adenocarcinoma gástrico pouco diferenciado. A tomografia de tórax, abdome e pelve demonstra linfonodomegalia retroperitoneal, ascite e nódulos hepáticos múltiplos. A laparoscopia diagnóstica confirma carcinomatose peritoneal, impossibilitando a ressecção cirúrgica. Na sessão clínica, a conduta a ser aplicada é discutida e concluiuse que, nesse caso, a melhor conduta será","options":{"A":"quimioterapia paliativa baseada em fluoropirimidina e platina, com objetivo de controle de sintomas e sobrevida.","B":"gastrectomia total com linfadenectomia D2, seguida de quimioterapia adjuvante.","C":"radioterapia curativa isolada com alta dose de precisão sobre o estômago e fígado.","D":"gastrojejunostomia profilática para prevenção de obstrução futura, sem necessidade de quimioterapia.","E":"imunoterapia com inibidores de checkpoint como monoterapia de primeira linha."},"answer":"A","topic":"Esôfago e Estômago"},{"number":12,"area":"Cirurgia Geral","stem":"Homem de 63 anos apresenta perda ponderal de 10 kg, saciedade precoce e dor epigástrica nos últimos 3 meses. A endoscopia digestiva alta com biópsia revelou adenocarcinoma gástrico pouco diferenciado na pequena curvatura do antro. A tomografia de abdome e pelve com contraste não evidenciou metástases. A ecoendoscopia mostrou lesão comprometendo a submucosa e parte da muscular própria, com linfonodos regionais positivos. A classificação TNM foi T2N1M0. A conduta apropriada é","options":{"A":"iniciar quimioterapia paliativa com fluorouracil e cisplatina.","B":"iniciar imunoterapia com anti-PD1 seguida de gastrectomia total.","C":"apenas vigilância clínica, pois se trata de um tumor limitado à submucosa.","D":"indicar radioterapia isolada antes da cirurgia para reduzir o volume tumoral.","E":"realizar gastrectomia subtotal com linfadenectomia D2 e considerar quimioterapia adjuvante."},"answer":"E","topic":"Esôfago e Estômago"},{"number":13,"area":"Cirurgia Geral","stem":"Homem de 68 anos, hipertenso, com antecedente de dispepsia crônica e uso contínuo de anti-inflamatórios não esteroidais (AINEs), é admitido na emergência com episódio de melena volumosa e queda do nível de consciência. Ao exame, encontrase pálido, sudorético, taquicárdico (FC 112 bpm) e hipotenso (PA 85/60 mmHg). Após estabilização com reposição volêmica e transfusão de 2 concentrados de hemácias, é submetido à endoscopia digestiva alta que revela úlcera duodenal com vaso visível sem sangramento ativo (classificação de Forrest IIa). Das condutas abaixo, a mais adequada nesse momento é","options":{"A":"alta hospitalar com uso de IBP oral e nova endoscopia em 30 dias.","B":"apenas observação clínica com jejum e hidratação intravenosa por 24-48h.","C":"cirurgia de emergência com sutura da úlcera e vagotomia troncular","D":"tratamento endoscópico com injeção de adrenalina e termo coagulação local.","E":"embolização angiográfica profilática, mesmo sem sangramento ativo."},"answer":"D","topic":"Esôfago e Estômago"},{"number":14,"area":"Cirurgia Geral","stem":"Paciente do sexo masculino, 64 anos, com histórico de dor epigástrica crônica e uso irregular de anti-inflamatórios não esteroidais (AINEs), é admitido no pronto-socorro com dor abdominal súbita, intensa, difusa, acompanhada de rigidez abdominal e taquicardia. Ao exame físico, há abdome em tábua, com sinal de Blumberg positivo. Radiografia de tórax em ortostatismo evidencia ar-livre subdiafragmático. O paciente está hemodinamicamente estável após reposição volêmica inicial. Diante desse quadro, a melhor conduta inicial a ser adotada para esse paciente será","options":{"A":"iniciar tratamento clínico com IBP endovenoso e antibióticos, observando por 24 h antes de decidir cirurgia.","B":"solicitar endoscopia digestiva alta imediata para confirmar a localização e gravidade da úlcera.","C":"realizar laparotomia exploradora com fechamento da perfuração e biópsia da borda da úlcera.","D":"realizar laparotomia exploradora com drenagem abdominal sem fechamento da perfuração.","E":"proceder a laparoscopia diagnóstica e, caso haja perfuração, manter apenas tratamento clínico com drenagem."},"answer":"C","topic":"Esôfago e Estômago"},{"number":15,"area":"Cirurgia Geral","stem":"Paciente, homem de 55 anos, com história de doença do refluxo gastroesofágico (DRGE) há mais de 10 anos, apresenta-se com pirose frequente, regurgitação e ocasional disfagia. Nega perda ponderal significativa ou sangramentos. Foi submetido a endoscopia digestiva alta, que revelou mucosa esofágica com coloração salmão, estendendo-se por 3 cm acima da junção esofagogástrica. Biópsias demonstraram metaplasia intestinal com células caliciformes. O exame histológico não evidenciou displasia. Ele está hemodinamicamente estável e com função hepática e renal preservadas. Com base nesse quadro, a conduta mais apropriada é","options":{"A":"iniciar esofagectomia subtotal, devido ao risco de adenocarcinoma.","B":"repetir a endoscopia com biópsias em 3 meses, para confirmar o diagnóstico antes de qualquer tratamento.","C":"realizar terapia endoscópica de ablação com radiofrequência imediatamente, mesmo na ausência de displasia.","D":"iniciar inibidor de bomba de prótons (IBP) e realizar vigilância endoscópica periódica com biópsias.","E":"encaminhar para fundoplicatura laparoscópica como primeira medida curativa."},"answer":"D","topic":"Esôfago e Estômago"},{"number":16,"area":"Cirurgia Geral","stem":"Um homem de 65 anos, tabagista e etilista crônico, apresenta disfagia progressiva para sólidos há três meses, perda de peso de 10 kg e episódios de odinofagia. A endoscopia digestiva alta revela lesão ulcerada e estenosante no terço médio do esôfago, com biópsia confirmando carcinoma espinocelular. A tomografia computadorizada de tórax e abdome mostra espessamento da parede esofágica sem evidência de metástases. Com base no quadro clínico e nos achados de imagem, o estadiamento clínico mais provável e a melhor conduta terapêutica inicial são","options":{"A":"estágio I; esofagectomia transhiatal sem neoadjuvância.","B":"estágio II; quimiorradioterapia neoadjuvante seguida de esofagectomia.","C":"estágio III; quimioterapia paliativa.","D":"estágio IV; radioterapia exclusiva.","E":"estágio II; esofagectomia toracoabdominal imediata."},"answer":"B","topic":"Esôfago e Estômago"},{"number":17,"area":"Cirurgia Geral","stem":"Um homem de 54 anos apresenta disfagia progressiva para sólidos e líquidos, regurgitação de alimentos não digeridos e perda de peso de 8 kg nos últimos seis meses. Nega tabagismo e etilismo. A endoscopia digestiva alta revela esôfago dilatado com acúmulo de resíduos alimentares e resistência na passagem para o estômago, sem lesões mucosas. A esofagografia baritada mostra dilatação esofágica com estreitamento distal em “bico de pássaro”. A manometria esofágica evidencia ausência de peristalse e hipertonia do esfíncter esofágico inferior. Com base no quadro clínico e nos achados de exames, o diagnóstico mais provável e a melhor conduta terapêutica para o caso são, respectivamente,","options":{"A":"acalasia; realizar miotomia de Heller laparoscópica com fundoplicatura parcial.","B":"estenose péptica do esôfago; iniciar inibidores da bomba de prótons e dilatações endoscópicas seriadas.","C":"espasmo esofágico difuso; iniciar bloqueadores de canal de cálcio e nitratos.","D":"doença do refluxo gastroesofágico; indicar fundoplicatura de Nissen.","E":"carcinoma de esôfago distal; agendar biópsia endoscópica e estadiamento com PET-CT."},"answer":"A","topic":"Esôfago e Estômago"},{"number":18,"area":"Cirurgia Geral","stem":"Homem de 67 anos, com histórico de fibrilação atrial crônica, em uso irregular de anticoagulante, apresenta dor abdominal súbita e intensa há 6 horas, desproporcional ao exame físico, que revela apenas discreta distensão e dor difusa à palpação. Está taquicárdico e com sinais de hipoperfusão. Leucograma com 18.000/mm³, lactato sérico elevado (5,2 mmol/L) e gasometria com acidose metabólica. A tomografia de abdome com contraste mostra pneumatose intestinal e ausência de realce da artéria mesentérica superior. Não há sinais de perfuração ou peritonite evidente. A conduta mais adequada nesse caso será","options":{"A":"iniciar anticoagulação plena e manter observação clínica com jejum.","B":"repetir tomografia em 12 horas para avaliar progressão da imagem.","C":"encaminhar para laparotomia exploradora imediata para avaliação da viabilidade intestinal.","D":"realizar colonoscopia urgente para confirmar o diagnóstico.","E":"administrar antibióticos e iniciar nutrição parenteral total."},"answer":"C","topic":"Coloproctologia e Intestino"},{"number":19,"area":"Cirurgia Geral","stem":"Mulher de 74 anos, com antecedente de colecistopatia não tratada, é admitida com quadro de distensão abdominal progressiva, náuseas e vômitos biliosos há 48 horas. Ao exame físico, encontra-se desidratada, com ruídos hidroaéreos aumentados e dor difusa à palpação do abdome. A radiografia de abdome mostra níveis hidroaéreos em alças delgadas e presença de ar nas vias biliares. A tomografia computadorizada revela alça ileal distendida com cálculo de 3 cm em sua luz, presença de pneumobilia e ausência de vesícula biliar. A melhor conduta terapêutica para esse caso será","options":{"A":"iniciar antibióticos e realizar CPRE com retirada do cálculo.","B":"indicar laparotomia com enterolitotomia para extração do cálculo.","C":"iniciar tratamento conservador com dieta zero e sonda nasogástrica, devido à idade da paciente.","D":"realizar colecistectomia laparoscópica de urgência com exploração do colédoco.","E":"colocar prótese biliar endoscópica para restabelecer o fluxo biliar."},"answer":"B","topic":"Coloproctologia e Intestino"},{"number":20,"area":"Cirurgia Geral","stem":"Mulher de 56 anos, com histórico de histerectomia por via laparotômica há 3 anos, apresenta quadro de dor abdominal em cólica, distensão e episódios de vômitos nos últimos dois dias. Refere eliminação de flatos, mas sem evacuação nas últimas 36 horas. Ao exame físico, o abdome está distendido, com ruídos hidroaéreos aumentados e dor difusa sem sinais de peritonite. Radiografia de abdome em pé revela níveis hidroaéreos em alças delgadas. Tomografia com contraste oral e
