 difusa sem sinais de peritonite. Radiografia de abdome em pé revela níveis hidroaéreos em alças delgadas. Tomografia com contraste oral e endovenoso mostra alças distendidas de delgado com ponto de transição único, sem sinais de isquemia ou perfuração. Paciente está hemodinamicamente estável, sem febre. A conduta mais adequada nesse momento é","options":{"A":"indicar laparotomia imediata, pois todo quadro obstrutivo requer cirurgia de urgência.","B":"iniciar tratamento conservador com hidratação venosa, cateter nasogástrico e observação clínica.","C":"realizar colonoscopia para descompressão e retirada do conteúdo fecal.","D":"administrar anticoagulação por suspeita de trombose venosa mesentérica associada.","E":"iniciar nutrição parenteral total imediata por risco de necrose intestinal."},"answer":"B","topic":"Coloproctologia e Intestino"},{"number":21,"area":"Cirurgia Geral","stem":"Paciente masculino, 25 anos de idade, é vítima de queda de grande altura. Apresenta TCE grave com anisocoria à direita. Pressão Arterial de 100 x 60 mmHg, frequência cardíaca de 110 bpm e hipocorado ++/4. Das alternativas de ressuscitação volêmica elencadas a seguir, a mais indicada é","options":{"A":"ringer lactato.","B":"soro glicosado 5%.","C":"solução coloide de Dextran.","D":"solução salina hipertônica a 3%.","E":"ringer sem lactato com dextrose 5%."},"answer":"D","topic":"Trauma e Emergências"},{"number":22,"area":"Cirurgia Geral","stem":"Paciente com diagnóstico de carcinoma papilífero em lobo direito da tireoide, apresentando linfonodo de 1 cm palpável no bordo anterior do músculo esternocleidomastoideo do mesmo lado, abaixo da altura do osso hioide e acima da altura da cartilagem cricoide. Segundo os compartimentos nodais do pescoço, esse linfonodo se encontra no nível","options":{"A":"I.","B":"II.","C":"III.","D":"IV.","E":"V."},"answer":"C","topic":"Endócrino e Tireoide"},{"number":23,"area":"Cirurgia Geral","stem":"Tumores formados a partir de células G produtoras de gastrina, quando localizados no pâncreas, ocorrem mais comumente","options":{"A":"no corpo e na cauda.","B":"no colo pancreático e no corpo.","C":"na cabeça e em processo uncinado.","D":"no corpo e em processo uncinado.","E":"na cauda, somente."},"answer":"C","topic":"Hepatobiliopancreática"},{"number":24,"area":"Cirurgia Geral","stem":"A correta síntese da parede abdominal é um fator importante na diminuição de ocorrência de hérnias incisionais de parede abdominal. O estudo STITCH demonstrou diminuição de hérnias incisionais, com o fechamento da parede abdominal da seguinte forma:","options":{"A":"pontos a 1 cm da borda, 0,5 cm entre os pontos e fio multifilamentar.","B":"pontos a 0,5 cm da borda, 0,5 cm entre os pontos e fio monofilamentar.","C":"pontos a 1 cm da borda, 1 cm entre os pontos e fio monofilamentar.","D":"pontos a 0,5 cm da borda, 1 cm entre os pontos e fio monofilamentar.","E":"pontos a 1 cm da borda, 1 cm entre os pontos e fio multifilamentar."},"answer":"B","topic":"Hérnias e Parede Abdominal"},{"number":25,"area":"Cirurgia Geral","stem":"Os divertículos de esôfago podem estar associados a diversas condições clínicas. O divertículo epifrênico está associado, entre outros, à(ao)","options":{"A":"tuberculose pulmonar.","B":"acalásia do esôfago.","C":"doença do refluxo gastroesofágico.","D":"hérnia de hiato tipo II.","E":"linfoma de Hodgkin."},"answer":"B","topic":"Esôfago e Estômago"},{"number":26,"area":"Cirurgia Geral","stem":"Paciente de 53 anos, tabagista, apresenta disfagia para sólidos. A endoscopia mostrou lesão estenosante de terço médio de esôfago, de 4 cm de extensão, ocupando 2/3 da luz do órgão. A biópsia confirmou carcinoma escamoso. O estadiamento clínico foi de um tumor T3, N1, M0. Nesse caso, a próxima medida terapêutica a ser adotada é","options":{"A":"radioterapia exclusiva.","B":"gastrostomia alimentar.","C":"esofagectomia em três campos.","D":"esofagectomia distal (Ivor Lewis).","E":"quimioradioterapia neoadjuvante."},"answer":"E","topic":"Esôfago e Estômago"},{"number":27,"area":"Cirurgia Geral","stem":"Sobre os tumores desmoides de parede abdominal, é correto afirmar que","options":{"A":"geralmente se manifestam como massas palpáveis e dolorosas na parede abdominal.","B":"têm associação com síndromes genéticas hamartamatosas como a síndrome de Peutz-Jeghers.","C":"a biópsia por agulha tipo “core biopsy” é contraindicada pelo risco de disseminação tumoral.","D":"se trata de um tumor benigno de comportamento maligno, com pouca propensão à recidiva local e a metástases.","E":"nos casos esporádicos, há uma predominância no sexo feminino de dois para um."},"answer":"E","topic":"Oncologia Cirúrgica"},{"number":28,"area":"Cirurgia Geral","stem":"Paciente chega ao pronto-socorro com quadro de obstrução intestinal alta. Apresenta dor na face anteromedial da coxa direita que alivia com a sua flexão. Ao exame físico, não são palpadas hérnias na região inguinal ou na parede anterior do abdome. A hipótese diagnóstica mais provável, entre as listadas a seguir, é a de hérnia","options":{"A":"obturatória.","B":"perineal.","C":"ciática.","D":"de Grynfeldt.","E":"de Petit."},"answer":"A","topic":"Hérnias e Parede Abdominal"},{"number":29,"area":"Cirurgia Geral","stem":"Paciente submetido à correção de hérnia inguinal direita pela técnica de Liechtenstein, apresentando parestesia em face lateral do escroto do mesmo lado. O nervo provavelmente lesado nessa situação é o","options":{"A":"ileoinguinal.","B":"ileohipogástrico.","C":"ramo genital do genitofemoral.","D":"ramo femoral do genitofemoral.","E":"cremastérico."},"answer":"C","topic":"Hérnias e Parede Abdominal"},{"number":30,"area":"Cirurgia Geral","stem":"Segundo a Resolução nº 2.429/2025 do Conselho Federal de Medicina, as cirurgias bariátricas em adolescentes podem ser realizadas","options":{"A":"acima de 14 anos, respeitando os mesmos critérios que os adultos.","B":"acima de 16 anos, respeitando os mesmos critérios que os adultos.","C":"acima de 16 anos, somente se o IMC for acima de 40 kg/m2 e houver comorbidades graves.","D":"acima de 14 anos, somente se o IMC for acima de 35 kg/m2 e houver comorbidades graves.","E":"acima de 16 anos somente se o IMC for acima de 35 kg/m2 e houver comorbidades graves."},"answer":"B","topic":"Cirurgia Bariátrica"},{"number":31,"area":"Cirurgia Geral","stem":"Paciente, 20 anos, com febre baixa e dor abdominal de início há 12 horas. Ao exame, nota-se perda de sensibilidade abdominal quando os músculos da parede abdominal são contraídos. Esse achado semiológico corresponde ao sinal de","options":{"A":"Blumberg.","B":"Rovsing.","C":"Murphy.","D":"Carnett.","E":"Fothergill."},"answer":"D","topic":"Coloproctologia e Intestino"},{"number":32,"area":"Cirurgia Geral","stem":"Em pacientes com hemorragia digestiva alta de causa varicosa, a contraindicação relativa ao uso do TIPS, entre as listadas a seguir, é","options":{"A":"o escore de MELD acima de 10.","B":"a classificação de Child-Pugh acima de 7 pontos.","C":"a síndrome hepatorrenal.","D":"a ascite refratária.","E":"o carcinoma hepatocelular."},"answer":"E","topic":"Esôfago e Estômago"},{"number":33,"area":"Cirurgia Geral","stem":"Avalie o fragmento a seguir. Secretado(a) por células presentes no fundo gástrico, é também conhecido(a) como “hormônio da fome”. O fragmento fala sobre","options":{"A":"grelina.","B":"colecistoquinina.","C":"GLP-1.","D":"peptídeo YY.","E":"leptina."},"answer":"A","topic":"Nutrição e Metabolismo"},{"number":34,"area":"Cirurgia Geral","stem":"Paciente, 40 anos, mostra massa indolor de 7 cm em testículo direito, discreto aumento de gonadotrofina coriônica humana (hCG), desidrogenase láctea (DHL) bastante aumentada e alfa feto proteína normal. Este tipo de tumor tem como sítio de metástase mais comum","options":{"A":"o pulmão.","B":"a coluna lombar.","C":"os linfonodos retroperitoneais.","D":"os linfonodos inguinais.","E":"o fígado."},"answer":"C","topic":"Oncologia Cirúrgica"},{"number":35,"area":"Cirurgia Geral","stem":"O subtipo de linfoma gástrico mais comum é o linfoma de","options":{"A":"tecido linfoide associado à mucosa.","B":"células foliculares.","C":"grandes células B difuso.","D":"células do manto.","E":"Burkitt."},"answer":"C","topic":"Oncologia Cirúrgica"},{"number":36,"area":"Cirurgia Geral","stem":"No pós-operatório de cirurgias em que não se utilizam próteses permanentes, as infecções de sítio cirúrgico são aquelas que ocorrem em até","options":{"A":"cinco dias.","B":"sete dias.","C":"dez dias.","D":"quinze dias.","E":"trinta dias."},"answer":"E","topic":"Inflamação, Infecção e Sepse"},{"number":37,"area":"Cirurgia Geral","stem":"Paciente, 58 anos, iniciou tratamento com amoxacilina + clavulanato após colecistectomia de urgência devido a empiema de vesícula biliar. Após 48 horas, começou quadro de dor abdominal tipo cólica, queda do estado geral, diarreia mucosanguinolenta e febre de 39,7 C. PA: 80 x 40 mmHg e FC: 128 bpm. Exame do abdome sem sinais de irritação peritoneal. Além de estabilização do quadro hemodinâmico, assinale a melhor medida terapêutica a ser adotada, entre as citadas.","options":{"A":"suspender amoxacilina + clavulanato e iniciar ceftriaxone.","B":"suspender amoxacilina + clavulanato e aguardar coprocultura.","C":"suspender amoxacilina + clavulanato e iniciar vancomicina.","D":"proctocolectomia total com ileostomia e iniciar ceftriaxone.","E":"associar vancomicina + metronidazol."},"answer":"C","topic":"Inflamação, Infecção e Sepse"},{"number":38,"area":"Cirurgia Geral","stem":"Paciente, 18 anos, sexo masculino, refere dor abdominal de início vaga em epigástrio, que migrou e se localizou em fossa ilíaca direita em 24 horas. Refere também náuseas e anorexia. A temperatura axilar é de 38 C. Apresenta dor e defesa à palpação da fossa ilíaca direita, com descompressão dolorosa. Leucograma normal, sem desvio. Ultrassonografia com apêndice de diâmetro de 8 mm, sem líquido periapendicular. Segundo o escore de Alvarado, esse paciente","options":{"A":"não tem apendicite aguda.","B":"tem probabilidade baixa de ter apendicite aguda.","C":"tem probabilidade mediana de ter apendicite.","D":"tem probabilidade alta de ter apendicite aguda.","E":"precisa realizar TC para avaliar probabilidade de apendicite."},"answer":"D","topic":"Coloproctologia e Intestino"},{"number":39,"area":"Cirurgia Geral","stem":"Pacientes com ileostomia podem apresentar distúrbios hidroeletrolíticos importantes, decorrentes da perda de eletrólitos pelo efluente ileal. A concentração de sódio no efluente ileal é em torno de","options":{"A":"25 mEg/L.","B":"50 mEq/L.","C":"100 mEq/L.","D":"200 mEq/L.","E":"300 mEq/L."},"answer":"D","topic":"Nutrição e Metabolismo"},{"number":40,"area":"Cirurgia Geral","stem":"O chamado canal anal cirúrgico diverge do canal anal anatômico. O canal anal cirúrgico possui comprimento de cerca de","options":{"A":"1 cm.","B":"2 cm.","C":"4 cm.","D":"6 cm.","E":"8 cm."},"answer":"C","topic":"Coloproctologia e Intestino"},{"number":41,"area":"Otorrinolaringologia","stem":"Em relação à otite média secretora na infância, assinale a afirmativa mais apropriada em relação à conduta diagnóstica inicial.","options":{"A":"A realização de tomografia computadorizada de mastoides é obrigatória em todos os casos.","B":"A timpanometria é pouco útil, pois não fornece dados confiáveis sobre a presença de líquido na orelha média.","C":"A avaliação audiológica deve ser postergada até o surgimento de queixas auditivas objetivas.","D":"A otoscopia pneumática deve ser utilizada para avaliação da mobilidade da membrana timpânica.","E":"A prescrição de antibióticos deve ser feita em todos os casos suspeitos, mesmo sem sinais de infecção aguda."},"answer":"D","topic":"Otologia e Audiologia"},{"number":42,"area":"Otorrinolaringologia","stem":"No tratamento das rinossinusites crônicas sem polipose nasal, das opções abaixo, assinale a que é considerada de primeira linha no manejo clínico.","options":{"A":"Lavagem nasal com solução salina e uso de corticoide tópico.","B":"Antibioticoterapia sistêmica por até 3 dias.","C":"Corticoterapia oral por tempo indeterminado.","D":"Uso diário de descongestionantes tópicos vasoconstritores.","E":"Cirurgia endoscópica nasossinusal imediata."},"answer":"A","topic":"Rinologia e Rinossinusites"},{"number":43,"area":"Otorrinolaringologia","stem":"Na avaliação otoneurológica, o teste de Romberg alterado sugere","options":{"A":"distúrbio exclusivamente coclear.","B":"lesão vestibular periférica ou comprometimento da propriocepção.","C":"alteração exclusiva da motricidade ocular.","D":"presença de nistagmo posicional típico da VPPB.","E":"hipersensibilidade auditiva bilateral."},"answer":"B","topic":"Vestibulologia"},{"number":44,"area":"Otorrinolaringologia","stem":"Sobre o uso do diapasão em testes clínicos de triagem auditiva, assinale a afirmativa correta.","options":{"A":"O teste de Weber lateraliza sempre para o lado normal em perdas condutivas.","B":"O teste de Rinne é positivo quando a condução óssea é melhor que a aérea.","C":"Em perdas neurossensoriais, o Rinne geralmente é negativo.","D":"O teste de Weber lateraliza para o lado afetado nas perdas condutivas.","E":"Diapasão de 128 Hz é o mais indicado para triagem auditiva."},"answer":"D","topic":"Otologia e Audiologia"},{"number":45,"area":"Otorrinolaringologia","stem":"Assinale a afirmativa correta sobre o desvio septal nasal.","options":{"A":"A cirurgia corretiva deve ser realizada preferencialmente antes dos 5 anos de idade.","B":"O desvio septal raramente causa obstrução nasal significativa.","C":"A septoplastia é indicada apenas em casos com perfuração septal.","D":"Pode estar associado à hipertrofia compensatória do corneto contralateral.","E":"O desvio septal não interfere na respiração durante o sono."},"answer":"D","topic":"Rinologia e Rinossinusites"},{"number":46,"area":"Otorrinolaringologia","stem":"Em relação às otites médias recorrentes na infância, a seguinte conduta está correta:","options":{"A":"a timpanotomia com colocação de tubo de ventilação é indicada após o primeiro episódio de otite.","B":"a profilaxia antibiótica contínua é sempre preferida em relação à intervenção cirúrgica.","C":"a presença de perda auditiva associada pode justificar indicação cirúrgica precoce.","D":"o uso de descongestionantes orais reduz comprovadamente a frequência de infecções.","E":"a adenoidectomia é contraindicada em crianças menores de 5 anos."},"answer":"C","topic":"Otologia e Audiologia"},{"number":47,"area":"Otorrinolaringologia","stem":"A função da audiometria vocal é","options":{"A":"avaliar prioritariamente o ganho com aparelhos auditivos.","B":"medir os limiares auditivos em diferentes frequências.","C":"avaliar principalmente lesões retrococleares.","D":"substituir completamente a audiometria tonal liminar.","E":"identificar limiar de recepção da fala e discriminação de palavras."},"answer":"E","topic":"Otologia e Audiologia"},{"number":48,"area":"Otorrinolaringologia","stem":"Em pacientes com perfuração timpânica traumática recente, a seguinte conduta inicial é mais adequada:","options":{"A":"realizar lavagem otológica com soro fisiológico para remover debris.","B":"iniciar antibiótico sistêmico por 10 dias e manter ouvido tampado.","C":"observar clinicamente por algumas semanas, evitando entrada de água.","D":"encaminhar imediatamente para timpanoplastia cirúrgica.","E":"efetuar irrigação auricular com álcool boricado a 3%."},"answer":"C","topic":"Otologia e Audiologia"},{"number":49,"area":"Otorrinolaringologia","stem":"No exame de nistagmo espontâneo, a seguinte característica sugere origem periférica:","options":{"A":"nistagmo vertical puro.","B":"ausência de supressão com fixação ocular.","C":"presença de nistagmo multidirecional.","D":"nistagmo horizontal, unidirecional, com supressão à fixação.","E":"nistagmo que se inverte com o olhar lateral."},"answer":"D","topic":"Vestibulologia"},{"number":50,"area":"Otorrinolaringologia","stem":"Em relação à fisiopatologia da rinite vasomotora, é correto afirmar que","options":{"A":"é uma rinite infecciosa com predomínio de neutrófilos.","B":"está relacionada à hiper-reatividade do sistema parassimpático nasal.","C":"apresenta eosinofilia nasal como característica diagnóstica obrigatória.","D":"tem como tratamento de escolha os antibióticos tópicos nasais.","E":"é determinada como sendo secundária a uso crônico de descongestionantes tópicos."},"answer":"B","topic":"Rinologia e Rinossinusites"},{"number":51,"area":"Otorrinolaringologia","stem":"Sobre o exame físico do nariz, assinale a afirmativa correta.","options":{"A":"A rinoscopia anterior permite avaliação direta do óstio do seio esfenoidal.","B":"A inspeção externa nasal é desnecessária em casos de obstrução nasal unilateral.","C":"A rinoscopia anterior avalia septo, cornetos inferiores e secreções na cavidade nasal.","D":"A presença de pólipos nasais impede completamente a realização da rinoscopia anterior.","E":"O exame rinoscópico é contraindicado em pacientes com rinite alérgica."},"answer":"C","topic":"Rinologia e Rinossinusites"},{"number":52,"area":"Otorrinolaringologia","stem":"Assinale a opção que apresenta uma contraindicação relativa à realização da prova calórica com água.","options":{"A":"Zumbido bilateral.","B":"Presença de otite externa aguda.","C":"Presbiacusia.","D":"Vertigem posicional paroxística benigna.","E":"Disacusia súbita unilateral."},"answer":"B","topic":"Vestibulologia"},{"number":53,"area":"Otorrinolaringologia","stem":"Em relação ao zumbido, é correto afirmar que","options":{"A":"o zumbido objetivo é sempre causado por distúrbios do sistema nervoso central.","B":"o zumbido pulsátil deve ser avaliado com atenção por possível origem vascular.","C":"o zumbido bilateral de início gradual raramente tem origem auditiva.","D":"a acufenometria é um exame que visa ao diagnóstico diferencial com perda condutiva.","E":"o zumbido é, por definição, um sinal de urgência médica."},"answer":"B","topic":"Otologia e Audiologia"},{"number":54,"area":"Otorrinolaringologia","stem":"Na propedêutica do labirintopata, a manobra de Dix-Hallpike é empregada principalmente para","options":{"A":"induzir zumbido em pacientes com perda auditiva unilateral.","B":"identificar hiporreflexia vestibular bilateral.","C":"confirmar vertigem central causada por esclerose múltipla.","D":"diagnosticar vertigem posicional paroxística benigna de canal posterior.","E":"medir limiares auditivos de condução óssea."},"answer":"D","topic":"Vestibulologia"},{"number":55,"area":"Otorrinolaringologia","stem":"Das situações elencadas a seguir, assinale a que representa uma indicação clássica para cirurgia de adenotonsilectomia em crianças.","options":{"A":"Apenas dois episódios de amigdalite por ano, com boa resposta a analgésicos.","B":"Ronco noturno sem apneia associada, com exames laboratoriais normais.","C":"Otalgia recorrente sem evidência de otite média ou infecção de vias aéreas superiores.","D":"Rinite alérgica perene não controlada com corticoterapia tópica nasal.","E":"Apneia obstrutiva do sono documentada por polissonografia com comprometimento ventilatório."},"answer":"E","topic":"Sono e Via Aérea Superior"},{"number":56,"area":"Otorrinolaringologia","stem":"No diagnóstico da rinite medicamentosa, dos achados a seguir, o mais característico é a","options":{"A":"obstrução nasal associada a prurido e espirros intensos.","B":"secreção nasal purulenta unilateral associada a febre.","C":"obstrução nasal persistente após uso prolongado de vasoconstritor tópico.","D":"presença de pólipos nasais visíveis à rinoscopia anterior.","E":"hipoacusia associada a espessamento da mucosa septal."},"answer":"C","topic":"Rinologia e Rinossinusites"},{"number":57,"area":"Otorrinolaringologia","stem":"O principal mecanismo fisiopatológico da vertigem em pacientes com doença de Ménière é a(o)","options":{"A":"destruição dos otólitos no utrículo.","B":"inflamação do nervo vestibular.","C":"presença de fístula perilinfática traumática.","D":"atrofia progressiva do canal semicircular posterior.","E":"aumento da pressão endolinfática no labirinto membranoso."},"answer":"E","topic":"Vestibulologia"},{"number":58,"area":"Otorrinolaringologia","stem":"Durante o exame físico otológico, a presença de nível hidroaéreo visível por otoscopia indica","options":{"A":"otosclerose.","B":"otite média com efusão.","C":"otite externa difusa.","D":"miringoesclerose sem secreção.","E":"perfuração timpânica seca."},"answer":"B","topic":"Otologia e Audiologia"},{"number":59,"area":"Otorrinolaringologia","stem":"Dos exames elencados a seguir, assinale o mais adequado para investigação inicial de rinossinusite crônica refratária ao tratamento clínico.","options":{"A":"Endoscopia digestiva alta.","B":"Nasofibrolaringoscopia.","C":"Ressonância magnética de crânio.","D":"Radiografia simples de cavidade nasal.","E":"Tomografia computadorizada de seios paranasais."},"answer":"E","topic":"Rinologia e Rinossinusites"},{"number":60,"area":"Otorrinolaringologia","stem":"A principal característica clínica da paracusia de recrutamento encontrada em perdas auditivas neurossensoriais é","options":{"A":"a melhora auditiva em ambientes silenciosos.","B":"uma audição normal com zumbido intermitente.","C":"um incômodo exagerado a sons de intensidade moderada.","D":"uma alteração no equilíbrio corporal em repouso.","E":"uma otalgia desencadeada por sons agudos."},"answer":"C","topic":"Otologia e Audiologia"},{"number":61,"area":"Otorrinolaringologia","stem":"Sobre a válvula nasal, formada por duas regiões anatomicamente próximas, que podem ser responsáveis isoladamente ou em conjunto pela sua insuficiência, assinale a afirmativa correta.","options":{"A":"A válvula nasal interna é um ângulo formado medialmente pela porção superior do septo nasal, superiormente e lateralmente pela porção caudal da cartilagem lateral superior e inferiormente pela cabeça do corneto inferior.","B":"É o local de menor resistência na via aérea superior.","C":"A válvula nasal externa é formada medialmente pelo septo caudal e columela, pelo triângulo frágil anteriormente, pelo rebordo alar lateralmente e pelo assoalho do vestíbulo nasal inferiormente.","D":"O restabelecimento da válvula nasal depende da abordagem cirúrgica de corneto inferior, septo nasal e parede nasal lateral.","E":"O uso de dilatadores nasais externos não ajuda no diagnóstico, mas representa terapêutica bastante eficaz."},"answer":"A","topic":"Rinologia e Rinossinusites"},{"number":62,"area":"Otorrinolaringologia","stem":"Em relação às deformidades de pavilhão auricular, como a orelha de abano, e às otoplastias, assinale a afirmativa correta.","options":{"A":"A orelha em abano é considerada uma malformação.","B":"A orelha em abano é transmitida geneticamente através de herança mendeliana autossômica dominante.","C":"A orelha de abano é normalmente assimétrica ou unilateral.","D":"O mau posicionamento do pavilhão pode ser decorrente do tamanho reduzido da concha, que projeta todo o pavilhão anteriormente.","E":"Normalmente, o pavilhão está posicionado em 50 com relação à cabeça e, quando apresenta-se com ângulos maiores, caracteriza-se a orelha em abano."},"answer":null,"topic":"Otologia e Audiologia"},{"number":63,"area":"Otorrinolaringologia","stem":"A respeito da halitose, assinale a afirmativa correta.","options":{"A":"A origem do mau hálito está localizada na cavidade oral em 50% dos casos.","B":"O odor desagradável está, na maioria das vezes, relacionado à presença de compostos provenientes da ação de enzimas proteolíticas de bactérias Gram positivas aeróbicas presentes na cavidade oral.","C":"As cáries são inerentemente malcheirosas, pois causam grandes espaços passíveis de acúmulo de alimentos.","D":"A salivação deve ser observada, já que o fluxo salivar aumentado favorece a halitose.","E":"A camada superficial da saburra está em constante contato com o ar formando uma camada anaeróbica. Já nas camadas profundas existem áreas com baixa concentração de oxigênio favorecendo a proliferação de bactérias aeróbicas."},"answer":"B","topic":"Cavidade Oral e Faringologia"},{"number":64,"area":"Otorrinolaringologia","stem":"Quanto aos dispositivos intraorais, assinale a afirmativa correta.","options":{"A":"Os elevadores de palato mole são muito eficazes e utilizados.","B":"Os retentores linguais retêm a língua mediante pressão negativa, levando à sua posteriorização e facilitando a passagem do ar.","C":"Os retentores linguais são melhor tolerados e mais usados em pacientes desdentados.","D":"O aparelho de avanço mandibular é o tipo mais utilizado atualmente, deslocando a mandíbula e a língua anteriormente, e devem ser utilizados continuamente, dia e noite.","E":"Os aparelhos intraorais de avanço mandibular formados por duas peças não permitem realizar avanço progressivo."},"answer":"C","topic":"Sono e Via Aérea Superior"},{"number":65,"area":"Otorrinolaringologia","stem":"Sobre os aparelhos intraorais de avanço mandibular, assinale a afirmativa correta.","options":{"A":"O efeito sobre a apneia dos aparelhos feitos sob medida e dos fornecidos prontos pré-moldados, é semelhante.","B":"Estão indicados para pacientes com apneia que não tolerem e não se adaptem ao aparelho de pressão aérea positiva (CPAP).","C":"Não podem ser associados ao uso de CPAP.","D":"A protusão individual não é fato preditivo de sua eficácia.","E":"Os pacientes com apneia supinodependente apresentam pior resposta."},"answer":"B","topic":"Sono e Via Aérea Superior"},{"number":66,"area":"Otorrinolaringologia","stem":"Sobre a aplicação do aparelho de pressão aérea positiva (CPAP), assinale a afirmativa correta.","options":{"A":"A pressão do CPAP deverá ser aumentada até os eventos respiratórios serem reduzidos em 50%, como apneias, hipopneias, despertares relacionados a esforços respiratórios e ronco.","B":"Para pressões acima de 10 cm H2O o uso de BiPAP (pressão positiva em dois níveis de pressão na via aérea superior) deve ser recomendado.","C":"O limite máximo de pressão recomendado é de 20 cm H2O para pacientes acima de 12 anos.","D":"Numa titulação “ótima” o índice de apneia-hipopneia deve estar abaixo de 15 eventos por hora de sono e a saturação mínima da oxi-hemoglobina acima de 85%.","E":"O tratamento com CPAP restaura totalmente a disfunção cognitiva e os domínios da memória e função executiva, tais como memória de trabalho, flexibilidade mental, planejamento, resolução de problemas, inibição e fluência verbal."},"answer":"C","topic":"Sono e Via Aérea Superior"},{"number":67,"area":"Otorrinolaringologia","stem":"Em relação à influência de condições clínicas e medicamentos na qualidade do sono, assinale a afirmativa correta.","options":{"A":"Não há relação entre refluxo faringolaríngeo e apneia do sono.","B":"Na mulher, os roncos e as apneias aparecem somente na forma precoce de menopausa e são decorrentes da perda do tônus muscular faríngeo oferecido pelo estrogênio.","C":"As metilxantinas aumentam a latência para o sono, diminuem o tempo total de sono, aumentam os despertares e a latência para o sono REM, e diminuem a porcentagem do sono REM.","D":"O tratamento de doenças da tireoide com hormônios tiroideanos melhora a qualidade do sono, mas não reduz a sonolência diurna excessiva.","E":"A reposição exógena de estrógenos está indicada para todas as mulheres em menopausa e apneia do sono."},"answer":"C","topic":"Sono e Via Aérea Superior"},{"number":68,"area":"Otorrinolaringologia","stem":"Em relação à síndrome do respirador oral, assinale a afirmativa correta.","options":{"A":"Trata-se de uma adaptação fisiológica associada a desvios do padrão de crescimento dentocraniofacial.","B":"Não está associada a maior frequência de infecções das vias aéreas superiores.","C":"Trata-se de alteração mais prevalente em adultos, associada a desvios do septo nasal.","D":"A respiração oral ativa sistemas distintos para o estímulo do crescimento e pode resultar em uma variação morfológica da face.","E":"São alterações características a inversão de lábio inferior, hiperdesenvolvido, alargamento narinário e hipertonia da musculatura perioral."},"answer":"D","topic":"Sono e Via Aérea Superior"},{"number":69,"area":"Otorrinolaringologia","stem":"Em relação às indicações de adenoidectomia e/ou amigdalectomia (tonsilectomia faríngea e/ou palatina), assinale a afirmativa correta.","options":{"A":"Doenças imunomediadas pelo Streptococcus pyogenes, como o reumatismo poliarticular agudo, a glomerulonefrite difusa aguda não se beneficiam da tonsilectomia.","B":"A formação do caseum ou tonsiolito nas criptas tonsilares causa halitose e representa indicação formal de tonsilectomia.","C":"Complicações locorregionais das infecções tonsilares tais como otites médias crônicas secretoras, rinossinusites e laringotraqueítes recorrentes, são raras.","D":"A administração de antimicrobianos no pós-operatório de tonsilectomias durante 7 a 10 dias traz benefícios adicionais.","E":"Nos casos de abscesso peritonsilar a indicação de tonsilectomia é controversa e deve ser restrita aos casos de infecções recorrentes."},"answer":"E","topic":"Sono e Via Aérea Superior"},{"number":70,"area":"Otorrinolaringologia","stem":"Em relação às técnicas cirúrgicas nas amigdalectomias, assinale a afirmativa correta.","options":{"A":"A técnica de dissecção extracapsular auxiliada pelo eletrocautério é raramente indicada.","B":"A utilização de microdebridador e bisturi bipolar de alta radiofrequência (Coblation®) oferecem substancial redução da dor pós-operatória e menor ocorrência de sangramento.","C":"A utilização de bisturi elétrico bipolar auxilia na dissecção e na hemostasia.","D":"As tonsilectomias parciais, quando realizadas em crianças maiores que 3 anos, não têm risco significativo de recidiva de hiperplasia tonsilar ou reintervenção cirúrgica.","E":"A administração de corticosteroides no pós-operatório imediato não ocasiona redução da dor e retorno alimentar mais precoce."},"answer":"C","topic":"Sono e Via Aérea Superior"},{"number":71,"area":"Otorrinolaringologia","stem":"Em relação à anquiloglossia, é correto afirmar que","options":{"A":"é mais comum em homens brancos.","B":"não apresenta relação com síndromes ou questões genéticas.","C":"existem evidências de que a frenectomia a laser seja a mais segura.","D":"não há indicação para terapia fonoaudiológica.","E":"pode causar limitações para a fala e mastigação, e efeitos como recessão gengival e má-oclusão."},"answer":"E","topic":"Cavidade Oral e Faringologia"},{"number":72,"area":"Otorrinolaringologia","stem":"Sobre a leucoplasia pilosa lingual, assinale a afirmação correta.","options":{"A":"É causada pelo vírus Epstein--Barr (EBV) e ocorre em pacientes imunossuprimidos.","B":"É considerada agressiva e de moderada morbidade.","C":"A sorologia positiva é patognomônica.","D":"Se manifesta como placa acinzentada escura corrugada na borda lateral da língua que não se destaca à raspagem.","E":"A biópsia está indicada, mas a identificação histológica é difícil."},"answer":"A","topic":"Cavidade Oral e Faringologia"},{"number":73,"area":"Otorrinolaringologia","stem":"Quanto às doenças sistêmicas que causam manifestações orais, assinale a afirmativa correta.","options":{"A":"O lúpus se manifesta na mucosa oral usualmente por lesões semelhantes a líquen plano e leucoplasias.","B":"São 12 as doenças sistêmicas que causam manifestações orais.","C":"A biópsia incisional é obrigatória para a definição diagnóstica.","D":"Por definição, em todos os casos, as manifestações orais são a primeira evidência da doença sistêmica.","E":"Na esclerodermia surgem gengivite, ressecamento oral, perda dentária e lesões endurecidas na mucosa."},"answer":"E","topic":"Cavidade Oral e Faringologia"},{"number":74,"area":"Otorrinolaringologia","stem":"Em relação às glândulas salivares e as sialoadenites, é correto afirmar que","options":{"A":"cerca de 50% da saliva é produzido pelas parótidas, submandibulares e sublinguais.","B":"o citomegalovírus normalmente promove infecções sistêmicas e possui tropismo por glândulas salivares.","C":"a caxumba está relacionada à infecção pelo paramixovírus, havendo maior incidência entre 8 e 12 anos de idade.","D":"exames de imagem auxiliam no diagnóstico, e a sialoendoscopia é a terapêutica mais empregada.","E":"a viscosidade da saliva produzida pela glândula parótida é a maior e a menor é a da submandibular."},"answer":"B","topic":"Glândulas Salivares"},{"number":75,"area":"Otorrinolaringologia","stem":"Sobre as sialolitíases, assinale a afirmativa correta.","options":{"A":"Ocorrem raramente associadas à sialoadenite crônica.","B":"Predominam em pacientes na faixa etária entre 30 e 50 anos.","C":"A sialorressonância magnética é um exame mais preciso para avaliar o parênquima glandular e o ducto de drenagem.","D":"Distribuem-se igualmente entre as glândulas maiores.","E":"Há direta correlação entre os níveis de cálcio sérico e a sua formação."},"answer":"C","topic":"Glândulas Salivares"},{"number":76,"area":"Otorrinolaringologia","stem":"Sobre hipossalivação e xerostomia, assinale a afirmativa correta.","options":{"A":"Xerostomia e hipossalivação são sinônimos.","B":"O tratamento da hipossalivação e da xerostomia se inicia no uso de saliva artificial e na ingesta de ácidos e cítricos.","C":"O uso sistêmico de cloridrato de pilocarpina em dose única diária resulta em aumento de salivação após uma semana de uso.","D":"O cloridrato de pilocarpina é bem tolerado por pacientes com úlcera gastrintestinal e mal de Parkinson.","E":"O cloreto de betanecol gera menor quantidade de efeitos colaterais, maior tempo de atividade sialogoga e melhor custo-benefício do que a pilocarpina."},"answer":"E","topic":"Glândulas Salivares"},{"number":77,"area":"Otorrinolaringologia","stem":"Quanto à sialorreia, assinale a afirmativa correta.","options":{"A":"É comum em condições neurológicas e pode ser causada pela produção excessiva de saliva ou diminuição da deglutição.","B":"A babugem é geralmente associada com aumento da produção salivar.","C":"Na sialorreia paroxística idiopática, os episódios podem durar algumas horas, sem outros sintomas.","D":"Trata-se de um fenômeno fisiológico em recém-nascidos, devendo cessar em torno dos 6 meses.","E":"O uso de medicamentos anticolinérgicos reduz o volume de saliva, mas pode causar flatulência, incontinência urinária e insônia."},"answer":"A","topic":"Glândulas Salivares"},{"number":78,"area":"Otorrinolaringologia","stem":"Sobre as mudanças vocais causadas pela variação dos hormônios, assinale a afirmativa correta.","options":{"A":"Mudanças vocais relacionadas a hormônios sexuais começam a ser percebidas a partir dos 11 anos.","B":"A muda vocal relativa à puberdade inicia-se a partir dos 12 anos, completando-se aos 15 em ambos os sexos.","C":"As variações vocais durante o ciclo menstrual são determinadas por preponderância de estrógeno ou progesterona, com efeitos laríngeos diversos.","D":"Substâncias androgênicas exógenas são componentes de contraceptivos orais, e seu uso representa um enorme risco para cantoras.","E":"A laringopatia da gravidez é mais perceptível em cantoras no terceiro trimestre da gestação, tornando a voz mais aguda e trêmula."},"answer":"C","topic":"Laringologia e Voz"},{"number":79,"area":"Otorrinolaringologia","stem":"Sobre os efeitos vocais das disfunções da tireoide, assinale a afirmativa correta.","options":{"A":"No hipotireoidismo as alterações vocais são decorrentes do aumento da massa das pregas vocais, o que acarreta proporcional aumento da frequência fundamental.","B":"No hipertireoidismo ocorre fadiga vocal e perda da extensão vocal, a voz é áspera ou grave.","C":"No hipotireoidismo grave com mixedema, há grande diminuição da força muscular e pode surgir paresia ou paralisia da prega vocal.","D":"O hipertireoidismo leve causa precocemente problemas vocais, com aumento da intensidade da voz e tremor na emissão.","E":"O hipertireoidismo moderado causa problemas vocais, com diminuição da intensidade da voz e tremor na emissão."},"answer":"C","topic":"Laringologia e Voz"},{"number":80,"area":"Otorrinolaringologia","stem":"Sobre a semiologia da laringe, assinale a afirmativa correta.","options":{"A":"Na laringoscopia solicita-se a emissão da vogal /i/ porque esta permite o rebaixamento da laringe, facilitando a visão da região anterior da glote.","B":"O estroboscópio capta a frequência de vibração das pregas vocais e emite luz entrecortada em ciclos sucessivos e regulares, sem defasagem, o que nos dá a falsa impressão de câmera lenta.","C":"Na escala RASATI avalia-se rouquidão, aspereza, soprosidade, astenia, tensão e instabilidade, graduando-se cada uma dessas características vocais em três graus.","D":"A avaliação acústica da voz é essencial na monitorização do tratamento do paciente, dispensando a avaliação perceptiva e auditiva da voz.","E":"Para a realização da laringoscopia em consultório é obrigatória a anestesia tópica na orofaringe. Realização"},"answer":"C","topic":"Laringologia e Voz"}],"sourceNote":"Prova oficial ENARE 2025/2026 enviada pelo usuário; questões transcritas do caderno oficial usado como base do aplicativo."},"simulado_ccp_01":{"id":"simulado_ccp_01","label":"Simulado 1 — ENARE CCP","subtitle":"Nível ENARE — base/intermediário · 80 questões","order":"1–40 Otorrinolaringologia · 41–80 Cirurgia Geral","localKey":"simulado_ccp_01_v1","sourceNote":"Itens autorais ou fortemente adaptados, calibrados pela matriz das provas ENARE Cabeça e Pescoço 2024/2025 e 2025/2026, pelo acervo ENARE 2023/2024 e por provas de Otorrinolaringologia R4 e Cirurgia Geral R+; não são transcrições literais de provas externas.","questions":[{"number":1,"area":"Otorrinolaringologia","stem":"Paciente de 58 anos refere crises de vertigem rotatória de segundos de duração ao deitar e ao virar a cabeça para a direita. A manobra de Dix-Hallpike à direita desencadeia nistagmo torsional e vertical superior, com latência e fatigabilidade. A melhor conduta inicial é:","options":{"A":"reabilitação vestibular isolada sem manobra de reposicionamento","B":"betahistina contínua por 6 meses","C":"manobra de reposicionamento de Epley para o canal posterior direito","D":"solicitar ressonância magnética antes de qualquer tratamento","E":"corticoterapia sistêmica em alta dose"},"answer":"C","topic":"Vestibulologia","explanation":"O padrão é típico de VPPB do canal semicircular posterior. O tratamento de primeira linha é uma manobra de reposicionamento canalicular, como a de Epley."},{"number":2,"area":"Otorrinolaringologia","stem":"Homem de 42 anos apresenta vertigem intensa contínua há 36 horas, náuseas e instabilidade, sem hipoacusia, zumbido ou sintomas neurológicos focais. Há nistagmo horizontal-torsional unidirecional, head impulse test alterado para a esquerda e teste de skew normal. O diagnóstico mais provável é:","options":{"A":"doença de Ménière","B":"VPPB do canal posterior","C":"acidente vascular cerebelar","D":"neurite vestibular esquerda","E":"labirintite bacteriana"},"answer":"D","topic":"Vestibulologia","explanation":"Vertigem aguda prolongada, HIT periférico alterado e ausência de sintomas cocleares favorecem neurite vestibular. Hipoacusia associada sugeriria labirintite ou outra etiologia cocleovestibular."},{"number":3,"area":"Otorrinolaringologia","stem":"Mulher de 39 anos apresenta episódios recorrentes de vertigem com duração de 1 a 3 horas, associados a plenitude auricular, zumbido e piora flutuante da audição em ouvido esquerdo. A hipótese diagnóstica principal é:","options":{"A":"tontura perceptual postural persistente","B":"neurite vestibular","C":"VPPB","D":"doença de Ménière","E":"fístula perilinfática"},"answer":"D","topic":"Vestibulologia","explanation":"A combinação de crises espontâneas de vertigem de dezenas de minutos a horas com sintomas cocleares flutuantes é característica da doença de Ménière."},{"number":4,"area":"Otorrinolaringologia","stem":"Paciente de 47 anos, após episódio vestibular agudo já resolvido, mantém por 5 meses sensação quase diária de balanço e instabilidade, pior em supermercados, telas em movimento e ambientes visualmente complexos. Exame neurológico e vestibular é normal. O diagnóstico mais provável é:","options":{"A":"doença de Ménière","B":"tontura perceptual postural persistente","C":"deiscência do canal semicircular superior","D":"neurinoma do acústico","E":"VPPB recorrente"},"answer":"B","topic":"Vestibulologia","explanation":"A PPPD cursa com tontura/instabilidade persistente por pelo menos 3 meses, exacerbada pela postura ortostática, movimento e estímulos visuais complexos."},{"number":5,"area":"Otorrinolaringologia","stem":"Adulto de 51 anos acorda com perda auditiva importante unilateral, percebida há menos de 24 horas, acompanhada de zumbido. Otoscopia é normal e a audiometria mostra perda neurossensorial de 45 dB em três frequências consecutivas. A conduta mais apropriada é:","options":{"A":"realizar miringotomia com tubo de ventilação","B":"indicar aparelho auditivo definitivo sem investigação","C":"iniciar corticoterapia precocemente e investigar causas de perda auditiva neurossensorial súbita","D":"prescrever apenas antibiótico oral","E":"observar por 30 dias antes de tratar"},"answer":"C","topic":"Otologia e Audiologia","explanation":"Perda neurossensorial súbita é uma urgência otológica. Corticoide sistêmico ou intratimpânico deve ser considerado precocemente, além de investigação retrococlear conforme o caso."},{"number":6,"area":"Otorrinolaringologia","stem":"Mulher de 34 anos tem hipoacusia condutiva progressiva bilateral, membranas timpânicas normais e história familiar semelhante. A audiometria demonstra gap aéreo-ósseo com entalhe de Carhart em 2 kHz. O diagnóstico mais provável é:","options":{"A":"colesteatoma adquirido","B":"doença de Ménière","C":"otosclerose","D":"otosclerose coclear isolada","E":"otite média com efusão"},"answer":"C","topic":"Otologia e Audiologia","explanation":"O quadro clássico de otosclerose fenestral é perda condutiva progressiva com otoscopia normal e entalhe de Carhart, relacionado à fixação do estribo."},{"number":7,"area":"Otorrinolaringologia","stem":"Paciente de 29 anos apresenta otorreia fétida crônica e hipoacusia. Otoscopia mostra bolsa de retração em pars flaccida com detritos queratínicos. A principal preocupação é:","options":{"A":"doença de Ménière","B":"colesteatoma adquirido com potencial de erosão óssea e complicações","C":"otossecreção por rinite alérgica","D":"perfuração traumática simples","E":"otosclerose com fixação do estribo"},"answer":"B","topic":"Otologia e Audiologia","explanation":"Bolsa de retração com queratina em ático é típica de colesteatoma. A doença é destrutiva e, em geral, requer tratamento cirúrgico."},{"number":8,"area":"Otorrinolaringologia","stem":"Criança de 5 anos apresenta otite média com efusão bilateral persistente por mais de 3 meses, com perda auditiva documentada e prejuízo de linguagem. A opção terapêutica mais adequada é:","options":{"A":"apenas lavagem nasal, independentemente do impacto auditivo","B":"mastoidectomia radical","C":"corticosteroide sistêmico mensal","D":"considerar timpanotomia com colocação de tubos de ventilação","E":"antibiótico profilático contínuo por 1 ano"},"answer":"D","topic":"Otologia e Audiologia","explanation":"Efusão bilateral persistente com perda auditiva e repercussão funcional é indicação clássica para considerar tubos de ventilação."},{"number":9,"area":"Otorrinolaringologia","stem":"Criança com otite média aguda evolui com febre persistente, dor retroauricular, apagamento do sulco retroauricular e deslocamento do pavilhão para frente. O diagnóstico mais provável é:","options":{"A":"mastoidite aguda","B":"colesteatoma congênito","C":"pericondrite isolada","D":"labirintite serosa","E":"otite externa maligna"},"answer":"A","topic":"Otologia e Audiologia","explanation":"Sinais inflamatórios retroauriculares com protrusão do pavilhão após OMA são típicos de mastoidite aguda e exigem tratamento hospitalar e avaliação de complicações."},{"number":10,"area":"Otorrinolaringologia","stem":"Adulto com perda auditiva neurossensorial bilateral severa a profunda apresenta reconhecimento de fala muito baixo mesmo com aparelhos auditivos bem adaptados. A estratégia de reabilitação a ser considerada é:","options":{"A":"tubo de ventilação bilateral","B":"estapedotomia","C":"apenas leitura labial, pois implante é contraindicado em adultos","D":"implante coclear","E":"mastoidectomia canal wall down"},"answer":"D","topic":"Otologia e Audiologia","explanation":"Implante coclear é indicado em perdas neurossensoriais severas/profundas com benefício insuficiente de aparelhos auditivos, conforme critérios audiológicos e clínicos."},{"number":11,"area":"Otorrinolaringologia","stem":"Criança com atresia congênita do conduto auditivo externo unilateral possui cóclea funcional e perda auditiva predominantemente condutiva. Uma opção de reabilitação auditiva é:","options":{"A":"dispositivo de condução óssea","B":"neurectomia vestibular","C":"aparelho exclusivamente por via aérea no conduto atrésico","D":"implante coclear obrigatoriamente","E":"estapedectomia"},"answer":"A","topic":"Otologia e Audiologia","explanation":"Dispositivos de condução óssea contornam o ouvido externo/médio e são úteis em atresias do conduto quando a função coclear está preservada."},{"number":12,"area":"Otorrinolaringologia","stem":"Paciente de 46 anos apresenta zumbido unilateral e perda auditiva neurossensorial assimétrica progressiva. A otoscopia é normal. O exame de imagem mais apropriado para excluir lesão retrococlear é:","options":{"A":"ressonância magnética de encéfalo e condutos auditivos internos com contraste","B":"tomografia de seios da face sem contraste","C":"ultrassonografia cervical","D":"radiografia simples de mastoide","E":"cintilografia óssea"},"answer":"A","topic":"Otologia e Audiologia","explanation":"Perda neurossensorial assimétrica ou zumbido unilateral levantam suspeita de schwannoma vestibular; RM dos condutos auditivos internos é o exame de escolha."},{"number":13,"area":"Otorrinolaringologia","stem":"Paciente com espirros, prurido nasal, rinorreia aquosa e obstrução nasal persistentes apresenta mucosa pálida e edemaciada. Para controle dos sintomas nasais persistentes, a classe medicamentosa de maior eficácia global é:","options":{"A":"antifúngico sistêmico","B":"corticosteroide sistêmico crônico","C":"descongestionante tópico por tempo indeterminado","D":"antibiótico macrolídeo contínuo","E":"corticosteroide intranasal"},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Corticoides intranasais são a base do tratamento da rinite alérgica persistente e controlam congestão, rinorreia, espirros e prurido."},{"number":14,"area":"Otorrinolaringologia","stem":"Para estabelecer o diagnóstico de rinossinusite crônica, além de sintomas compatíveis por mais de 12 semanas, é necessário:","options":{"A":"radiografia simples com nível hidroaéreo","B":"febre acima de 39 °C por pelo menos 5 dias","C":"demonstrar evidência objetiva de inflamação por endoscopia nasal ou tomografia","D":"eosinofilia periférica obrigatória","E":"cultura bacteriana positiva em todos os casos"},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Rinossinusite crônica exige sintomas persistentes e confirmação objetiva de inflamação sinonasal por endoscopia ou TC."},{"number":15,"area":"Otorrinolaringologia","stem":"Adulto com asma, polipose nasal bilateral e crises de broncoespasmo após uso de ácido acetilsalicílico apresenta a tríade conhecida como:","options":{"A":"granulomatose com poliangiite","B":"síndrome de Samter invertida sem asma","C":"doença respiratória exacerbada por aspirina","D":"síndrome de Churg-Strauss obrigatoriamente","E":"síndrome de Kartagener"},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Asma, pólipos nasais e hipersensibilidade a AAS/COX-1 caracterizam a doença respiratória exacerbada por aspirina, historicamente chamada tríade de Samter."},{"number":16,"area":"Otorrinolaringologia","stem":"Paciente imunocompetente tem obstrução nasal e dor facial crônicas. TC mostra seio maxilar unilateral opacificado com focos hiperdensos e calcificações, sem invasão óssea agressiva. A conduta mais adequada é:","options":{"A":"anfotericina B sistêmica por 6 semanas em todos os casos","B":"radioterapia do seio maxilar","C":"quimioterapia","D":"apenas antihistamínico","E":"remoção cirúrgica endoscópica do conteúdo fúngico e restauração da drenagem sinusal"},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Bola fúngica é forma não invasiva, geralmente unilateral em imunocompetentes. O tratamento é cirúrgico endoscópico, sem necessidade rotineira de antifúngico sistêmico."},{"number":17,"area":"Otorrinolaringologia","stem":"Paciente diabético em cetoacidose apresenta dor facial intensa, febre, necrose de concha nasal e rápida progressão orbital. A conduta deve incluir, com urgência:","options":{"A":"desbridamento cirúrgico agressivo, correção do fator predisponente e antifúngico sistêmico","B":"biópsia eletiva em 30 dias","C":"corticosteroide intranasal isolado","D":"observação por 72 horas","E":"apenas amoxicilina oral"},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"Rinossinusite fúngica invasiva aguda é emergência. O tratamento combina desbridamento precoce, antifúngico sistêmico e reversão da imunossupressão/metabólica."},{"number":18,"area":"Otorrinolaringologia","stem":"Adolescente masculino apresenta epistaxes volumosas recorrentes e obstrução nasal unilateral. TC mostra massa nasofaríngea com alargamento da fossa pterigopalatina. Qual procedimento deve ser evitado antes do planejamento terapêutico?","options":{"A":"angiografia quando indicada para planejamento","B":"avaliação por imagem","C":"avaliação endoscópica cuidadosa","D":"planejamento de embolização pré-operatória em casos selecionados","E":"biópsia incisional ambulatorial da massa"},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Nasoangiofibroma juvenil é tumor altamente vascular. A biópsia costuma ser evitada quando clínica e imagem são típicas pelo risco de hemorragia."},{"number":19,"area":"Otorrinolaringologia","stem":"Adulto jovem apresenta epistaxe anterior visível na área de Kiesselbach, sem instabilidade hemodinâmica. Após compressão adequada e vasoconstrictor tópico, persiste um ponto sangrante identificável. A próxima medida é:","options":{"A":"traqueostomia de urgência","B":"cauterização química ou elétrica dirigida ao ponto sangrante","C":"embolização de primeira escolha em qualquer caso","D":"ligadura imediata da artéria carótida externa","E":"tamponamento posterior obrigatório"},"answer":"B","topic":"Rinologia e Rinossinusites","explanation":"Epistaxe anterior focal persistente pode ser tratada com cauterização do ponto sangrante após medidas iniciais de compressão e vasoconstrição."},{"number":20,"area":"Otorrinolaringologia","stem":"Após trauma nasal, adolescente evolui com obstrução bilateral e abaulamento flutuante violáceo do septo. A conduta é:","options":{"A":"aguardar reabsorção espontânea","B":"drenagem urgente do hematoma septal e antibioticoprofilaxia conforme avaliação clínica","C":"punção lombar","D":"iniciar corticoide intranasal e reavaliar em 30 dias","E":"realizar apenas redução fechada dos ossos nasais"},"answer":"B","topic":"Rinologia e Rinossinusites","explanation":"Hematoma septal deve ser drenado precocemente para evitar necrose da cartilagem, abscesso e deformidade em sela."},{"number":21,"area":"Otorrinolaringologia","stem":"Paciente com odinofagia intensa unilateral, trismo, voz abafada e abaulamento do palato mole com desvio da úvula para o lado oposto apresenta:","options":{"A":"epiglotite","B":"sialolitíase submandibular","C":"cisto branquial infectado","D":"abscesso peritonsilar","E":"laringite viral simples"},"answer":"D","topic":"Cavidade Oral e Faringologia","explanation":"O conjunto trismo, voz abafada, abaulamento peritonsilar e desvio da úvula é clássico de abscesso peritonsilar, geralmente tratado com drenagem e antibióticos."},{"number":22,"area":"Otorrinolaringologia","stem":"Paciente com infecção odontogênica apresenta endurecimento bilateral do assoalho da boca, elevação da língua, disfagia e dispneia progressiva. A prioridade é:","options":{"A":"indicar amigdalectomia eletiva","B":"assegurar a via aérea precocemente e tratar a infecção cervical profunda","C":"aguardar flutuação antes de avaliar via aérea","D":"prescrever apenas anti-inflamatório e liberar","E":"realizar biópsia de língua antes de qualquer medida"},"answer":"B","topic":"Cavidade Oral e Faringologia","explanation":"Angina de Ludwig pode progredir rapidamente para obstrução de via aérea. Avaliação e proteção precoce da via aérea têm prioridade, associadas a antibiótico e controle do foco."},{"number":23,"area":"Otorrinolaringologia","stem":"Criança febril apresenta odinofagia importante, sialorreia, voz abafada e posição sentada inclinada para frente, com estridor inspiratório. Na suspeita de epiglotite, a abordagem correta é:","options":{"A":"enviar para casa com anti-histamínico","B":"forçar exame com abaixador de língua no consultório","C":"priorizar manejo controlado da via aérea e evitar manipulação desnecessária da orofaringe","D":"administrar apenas broncodilatador inalatório","E":"realizar lavagem nasal vigorosa"},"answer":"C","topic":"Cavidade Oral e Faringologia","explanation":"Na epiglotite, manipulação da orofaringe pode precipitar obstrução. O manejo deve ocorrer em ambiente capaz de controlar a via aérea."},{"number":24,"area":"Otorrinolaringologia","stem":"Professora de 32 anos apresenta disfonia crônica. Videolaringoscopia mostra duas pequenas lesões simétricas na junção do terço anterior com o médio das pregas vocais e fenda em ampulheta. O tratamento inicial preferencial é:","options":{"A":"laringectomia parcial","B":"injeção de toxina botulínica","C":"antibiótico por 21 dias","D":"radioterapia","E":"fonoterapia e higiene vocal"},"answer":"E","topic":"Laringologia e Voz","explanation":"Nódulos vocais são lesões fonotraumáticas bilaterais; o tratamento inicial é comportamental/fonoterápico, reservando cirurgia para situações selecionadas."},{"number":25,"area":"Otorrinolaringologia","stem":"Mulher tabagista apresenta voz grave e disfonia. Videolaringoscopia mostra edema polipoide difuso bilateral do espaço superficial da lâmina própria, com motilidade preservada. O diagnóstico é:","options":{"A":"carcinoma supraglótico obrigatoriamente","B":"paralisia bilateral de pregas vocais","C":"papilomatose respiratória recorrente","D":"edema de Reinke","E":"laringomalácia"},"answer":"D","topic":"Laringologia e Voz","explanation":"Edema de Reinke é fortemente associado ao tabagismo e causa aumento de massa das pregas vocais, com voz grave. Cessação do tabagismo é fundamental."},{"number":26,"area":"Otorrinolaringologia","stem":"Após tireoidectomia, paciente passa a apresentar voz soprosa, tosse fraca e episódios de engasgo com líquidos. Laringoscopia mostra uma prega vocal imóvel em posição paramediana. O nervo mais provavelmente lesado é:","options":{"A":"nervo frênico","B":"nervo laríngeo recorrente","C":"ramo mandibular do facial","D":"nervo auricular magno","E":"nervo hipoglosso"},"answer":"B","topic":"Laringologia e Voz","explanation":"O nervo laríngeo recorrente inerva a maior parte da musculatura intrínseca da laringe. Lesão unilateral causa imobilidade de prega vocal e disfonia soprosa."},{"number":27,"area":"Otorrinolaringologia","stem":"Paciente apresenta disfonia espasmódica adutora, com quebras de voz e esforço durante a fala, sem lesão estrutural das pregas vocais. Uma opção terapêutica de escolha é:","options":{"A":"estapedotomia","B":"corticosteroide intranasal","C":"antibiótico profilático","D":"septoplastia","E":"injeção de toxina botulínica nos músculos laríngeos envolvidos"},"answer":"E","topic":"Laringologia e Voz","explanation":"A disfonia espasmódica é uma distonia focal laríngea. Toxina botulínica é tratamento consagrado para reduzir a hiperatividade muscular."},{"number":28,"area":"Otorrinolaringologia","stem":"Paciente intubado por período prolongado desenvolve disfonia e sensação de corpo estranho. Laringoscopia mostra lesão granulomatosa sobre o processo vocal da aritenoide. A abordagem inicial costuma incluir:","options":{"A":"controle de fatores irritativos/refluxo, higiene vocal e fonoterapia, reservando cirurgia para casos selecionados","B":"traqueostomia definitiva","C":"laringectomia total","D":"antibiótico intravenoso por 6 semanas em todos","E":"radioterapia profilática"},"answer":"A","topic":"Laringologia e Voz","explanation":"Granuloma de processo vocal relaciona-se a trauma de intubação, abuso vocal e refluxo. O manejo inicial é conservador, com cirurgia em recidivas ou casos refratários selecionados."},{"number":29,"area":"Otorrinolaringologia","stem":"Criança de 6 anos com roncos habituais, pausas respiratórias observadas, respiração oral e hipertrofia adenotonsilar importante tem polissonografia compatível com apneia obstrutiva do sono. Sem comorbidades relevantes, o tratamento de primeira linha é:","options":{"A":"CPAP obrigatório como primeira opção em todas as crianças","B":"adenotonsilectomia","C":"traqueostomia eletiva","D":"uvulopalatofaringoplastia","E":"apenas perda ponderal, mesmo sem obesidade"},"answer":"B","topic":"Sono e Via Aérea Superior","explanation":"Hipertrofia adenotonsilar é a causa mais comum de AOS pediátrica; adenotonsilectomia é tratamento de primeira linha em crianças adequadamente selecionadas."},{"number":30,"area":"Otorrinolaringologia","stem":"Adulto com apneia obstrutiva do sono grave, sonolência diurna e ausência de contraindicação apresenta IAH de 42 eventos/h. A terapia de primeira linha mais eficaz para controle dos eventos respiratórios é:","options":{"A":"CPAP","B":"benzodiazepínico noturno","C":"septoplastia isolada como tratamento definitivo universal","D":"oxigênio domiciliar isolado","E":"tonsilectomia obrigatória em todos"},"answer":"A","topic":"Sono e Via Aérea Superior","explanation":"CPAP é o tratamento padrão mais eficaz para AOS moderada a grave, especialmente quando há sintomas e alto IAH."},{"number":31,"area":"Otorrinolaringologia","stem":"Recém-nascido apresenta micrognatia, glossoptose e obstrução de via aérea, associadas ou não a fissura palatina. Esse conjunto caracteriza:","options":{"A":"síndrome de Frey","B":"síndrome de Eagle","C":"sequência de Pierre Robin","D":"síndrome de Kartagener","E":"síndrome de Ménière"},"answer":"C","topic":"Craniofacial e Pediatria","explanation":"A sequência de Pierre Robin é definida por micrognatia, glossoptose e obstrução de via aérea; fissura palatina é frequente, mas não obrigatória."},{"number":32,"area":"Otorrinolaringologia","stem":"Criança operada de fissura palatina apresenta hipernasalidade, escape nasal de ar e dificuldade para produzir consoantes de pressão. O mecanismo mais provável é:","options":{"A":"insuficiência velofaríngea","B":"rinite medicamentosa","C":"paralisia do nervo hipoglosso isolada","D":"deiscência do canal semicircular superior","E":"otosclerose"},"answer":"A","topic":"Craniofacial e Pediatria","explanation":"Falha de fechamento adequado entre palato mole e parede faríngea posterior causa insuficiência velofaríngea, com hipernasalidade e escape nasal de ar."},{"number":33,"area":"Otorrinolaringologia","stem":"Criança de 3 anos apresenta atraso de fala e otites médias com efusão recorrentes. Na avaliação auditiva, uma consequência importante da perda condutiva persistente nessa faixa etária é:","options":{"A":"prejuízo do desenvolvimento de linguagem e da percepção de fala","B":"surdez neurossensorial irreversível em todos os casos","C":"anosmia permanente","D":"melhora espontânea garantida sem impacto funcional","E":"paralisia facial central"},"answer":"A","topic":"Craniofacial e Pediatria","explanation":"Perda auditiva condutiva persistente na primeira infância pode interferir no desenvolvimento de linguagem e aprendizado, justificando seguimento audiológico e tratamento quando indicado."},{"number":34,"area":"Otorrinolaringologia","stem":"Paciente com paralisia facial periférica aguda idiopática, sem vesículas, sem sinais neurológicos centrais e com início há 24 horas, apresenta incapacidade de fechar totalmente o olho. O tratamento inclui:","options":{"A":"cirurgia descompressiva de rotina","B":"nenhuma medida ocular é necessária","C":"corticosteroide precoce e proteção ocular rigorosa","D":"apenas antibiótico tópico ocular","E":"anticoagulação plena"},"answer":"C","topic":"Nervo Facial e Base do Crânio","explanation":"Paralisia de Bell deve ser tratada precocemente com corticoide, além de proteção corneana. Antiviral pode ser associado em casos selecionados, sobretudo paralisia grave."},{"number":35,"area":"Otorrinolaringologia","stem":"Em uma paralisia facial periférica, o paciente apresenta hiperacusia e perda do paladar nos dois terços anteriores da língua, além de redução da lacrimação. A lesão deve estar localizada:","options":{"A":"apenas no ramo marginal mandibular","B":"distalmente ao forame estilomastoideo","C":"no nervo hipoglosso","D":"apenas no ramo temporal após a parótida","E":"proximalmente à origem do nervo petroso maior no segmento intratemporal"},"answer":"E","topic":"Nervo Facial e Base do Crânio","explanation":"Quanto mais proximal a lesão intratemporal, maior o número de funções associadas comprometidas. Alteração de lacrimação implica lesão proximal ao nervo petroso maior."},{"number":36,"area":"Otorrinolaringologia","stem":"Adulto jovem apresenta massa cervical lateral indolor, localizada junto à borda anterior do esternocleidomastoideo, que surgiu após infecção de vias aéreas superiores. Imagem mostra lesão cística bem delimitada. O diagnóstico congênito mais provável é:","options":{"A":"cisto tireoglosso","B":"laringocelo interno","C":"mucocele de seio frontal","D":"ranula simples","E":"cisto de segunda fenda branquial"},"answer":"E","topic":"Pescoço e Tireoide","explanation":"Cisto de segunda fenda branquial é a anomalia branquial mais comum e tipicamente aparece como massa cística lateral próxima ao esternocleidomastoideo."},{"number":37,"area":"Otorrinolaringologia","stem":"Criança apresenta massa cervical mediana que se eleva com a deglutição e com a protrusão da língua. O tratamento cirúrgico recomendado é:","options":{"A":"esvaziamento cervical radical","B":"parotidectomia superficial","C":"procedimento de Sistrunk","D":"exérese simples sem ressecção do hioide","E":"tireoidectomia total obrigatória"},"answer":"C","topic":"Pescoço e Tireoide","explanation":"Cisto do ducto tireoglosso é tratado com Sistrunk, incluindo ressecção do cisto, trajeto e porção central do osso hioide, reduzindo recorrência."},{"number":38,"area":"Otorrinolaringologia","stem":"Paciente apresenta aumento cístico do assoalho da boca, azulado e flutuante, originado da glândula sublingual. A lesão é denominada:","options":{"A":"sialadenose parotídea","B":"laringocelo","C":"cisto branquial","D":"cisto tireoglosso","E":"ranula"},"answer":"E","topic":"Glândulas Salivares","explanation":"Ranula é uma mucocele do assoalho oral, geralmente relacionada à glândula sublingual. Pode permanecer oral ou mergulhar para o pescoço."},{"number":39,"area":"Otorrinolaringologia","stem":"Mulher de 43 anos apresenta nódulo de crescimento lento no lobo superficial da parótida, móvel e indolor, sem paralisia facial. Punção sugere adenoma pleomórfico. A conduta clássica é:","options":{"A":"realizar apenas aspiração do conteúdo","B":"sialoendoscopia terapêutica","C":"observar indefinidamente, pois não há risco de crescimento ou transformação","D":"radioterapia isolada como primeira escolha","E":"ressecção cirúrgica adequada com preservação do nervo facial, evitando enucleação simples"},"answer":"E","topic":"Glândulas Salivares","explanation":"Adenoma pleomórfico é o tumor benigno mais comum da parótida. Enucleação simples aumenta recorrência; a cirurgia deve respeitar margens/cápsula e preservar o facial quando não envolvido."},{"number":40,"area":"Otorrinolaringologia","stem":"Homem de 66 anos, tabagista, apresenta nódulos parotídeos bilaterais, bem delimitados, com citologia compatível com tumor de Warthin. Uma característica típica dessa neoplasia é:","options":{"A":"metástase cervical precoce na maioria dos casos","B":"origem exclusiva na glândula sublingual","C":"ocorrência quase exclusiva em crianças","D":"alta frequência de paralisia facial ao diagnóstico por comportamento agressivo","E":"associação com tabagismo e possibilidade de multifocalidade ou bilateralidade"},"answer":"E","topic":"Glândulas Salivares","explanation":"Tumor de Warthin é benigno, fortemente associado ao tabagismo e pode ser multifocal e bilateral, diferentemente da maioria dos tumores salivares."},{"number":41,"area":"Cirurgia Geral","stem":"No pós-operatório de uma grande cirurgia abdominal, a resposta metabólica ao trauma cirúrgico caracteriza-se tipicamente por:","options":{"A":"redução da gliconeogênese hepática e do consumo energético","B":"queda sustentada de cortisol e aumento da sensibilidade à insulina","C":"anabolismo proteico imediato e hipoglicemia persistente","D":"aumento de catecolaminas e cortisol, resistência insulínica e maior catabolismo proteico","E":"supressão completa de citocinas inflamatórias"},"answer":"D","topic":"Inflamação, Infecção e Sepse","explanation":"A resposta ao trauma ativa eixo neuroendócrino e inflamatório, gerando hiperglicemia por resistência à insulina e estado catabólico, sobretudo em agressões de maior magnitude."},{"number":42,"area":"Cirurgia Geral","stem":"Paciente submetido a cirurgia de grande porte permanecerá vários dias sem ingestão oral, mas apresenta trato gastrointestinal funcionante e estabilidade hemodinâmica. A estratégia nutricional preferencial é:","options":{"A":"jejum absoluto até retorno de ruídos hidroaéreos","B":"apenas solução glicosada intravenosa por 10 dias","C":"nutrição parenteral total obrigatória desde a primeira hora","D":"nutrição parenteral mesmo com intestino funcionante","E":"nutrição enteral precoce quando clinicamente possível"},"answer":"E","topic":"Nutrição e Metabolismo","explanation":"Quando o trato gastrointestinal funciona, a via enteral é preferida por preservar a barreira intestinal e associar-se a menos complicações infecciosas que a parenteral em muitos cenários."},{"number":43,"area":"Cirurgia Geral","stem":"Paciente gravemente desnutrido inicia suporte nutricional agressivo e, após 48 horas, desenvolve fraqueza, arritmia e insuficiência respiratória. Qual alteração laboratorial é mais característica da síndrome de realimentação?","options":{"A":"hiperfosfatemia","B":"hipofosfatemia","C":"hipercalcemia isolada","D":"hipernatremia obrigatória","E":"hipermagnesemia"},"answer":"B","topic":"Nutrição e Metabolismo","explanation":"Realimentação aumenta insulina e desloca fósforo, potássio e magnésio para o intracelular. Hipofosfatemia é a alteração emblemática e pode causar disfunção cardíaca e respiratória."},{"number":44,"area":"Cirurgia Geral","stem":"Um paciente com deficiência nutricional apresenta cicatrização inadequada. A vitamina C é particularmente importante porque participa:","options":{"A":"da hidroxilação de prolina e lisina na síntese de colágeno","B":"da inibição completa de fibroblastos","C":"da síntese de fatores de coagulação dependentes de vitamina K","D":"da produção de surfactante pulmonar","E":"da conversão de fibrina em fibrinogênio"},"answer":"A","topic":"Cicatrização e Feridas","explanation":"Vitamina C é cofator para hidroxilação de prolina e lisina, etapa essencial à estabilidade do colágeno. Sua deficiência compromete cicatrização."},{"number":45,"area":"Cirurgia Geral","stem":"Paciente será submetido a colectomia eletiva com anastomose primária. Em relação à profilaxia antimicrobiana cirúrgica, a conduta correta é:","options":{"A":"administrar esquema com cobertura para flora cutânea, gram-negativos e anaeróbios antes da incisão, com redose quando indicada","B":"não usar profilaxia porque a cirurgia é eletiva","C":"iniciar antibiótico somente após o fechamento da pele","D":"usar apenas antifúngico sistêmico","E":"manter antibiótico profilático por 14 dias em todos os casos"},"answer":"A","topic":"Inflamação, Infecção e Sepse","explanation":"Cirurgia colorretal é limpa-contaminada e exige profilaxia contra gram-negativos e anaeróbios, administrada em tempo adequado antes da incisão; prolongamento rotineiro não traz benefício."},{"number":46,"area":"Cirurgia Geral","stem":"Idoso de 81 anos será submetido a cirurgia oncológica eletiva. Qual avaliação pré-operatória acrescenta informação prognóstica relevante além da idade cronológica?","options":{"A":"apenas a presença de cabelos brancos","B":"excluir avaliação funcional porque não muda risco","C":"avaliação de fragilidade, capacidade funcional e cognição","D":"somente o sexo biológico","E":"apenas a idade em anos"},"answer":"C","topic":"Perioperatório e Ética","explanation":"Fragilidade, cognição e capacidade funcional predizem complicações, delirium, perda de independência e mortalidade melhor que a idade isolada."},{"number":47,"area":"Cirurgia Geral","stem":"Paciente diabético em uso de empagliflozina será submetido a cirurgia eletiva de médio porte. A principal razão para suspender o inibidor de SGLT2 previamente ao procedimento é reduzir o risco de:","options":{"A":"hipercalcemia maligna","B":"hemorragia por deficiência de vitamina K","C":"hipertireoidismo","D":"síndrome serotoninérgica","E":"cetoacidose diabética euglicêmica perioperatória"},"answer":"E","topic":"Perioperatório e Ética","explanation":"Inibidores de SGLT2 estão associados a cetoacidose euglicêmica em situações de jejum e estresse cirúrgico; por isso são suspensos alguns dias antes de procedimentos eletivos."},{"number":48,"area":"Cirurgia Geral","stem":"Tabagista de longa data pergunta se parar de fumar poucas semanas antes de uma cirurgia eletiva ainda traz benefício. A orientação correta é:","options":{"A":"cigarro não influencia cicatrização","B":"parar aumenta definitivamente as complicações pulmonares","C":"só há benefício após 10 anos de abstinência","D":"não vale a pena parar antes da cirurgia","E":"cessação pré-operatória por algumas semanas reduz complicações pulmonares e de ferida e deve ser estimulada"},"answer":"E","topic":"Perioperatório e Ética","explanation":"Cessação do tabagismo deve ser estimulada em qualquer momento; períodos de várias semanas antes da cirurgia reduzem complicações respiratórias e de cicatrização."},{"number":49,"area":"Cirurgia Geral","stem":"Durante correção laparoscópica de hérnia inguinal, identifica-se defeito que emerge lateralmente aos vasos epigástricos inferiores e percorre o anel inguinal profundo. Trata-se de hérnia:","options":{"A":"inguinal direta","B":"obturatória","C":"epigástrica","D":"femoral","E":"inguinal indireta"},"answer":"E","topic":"Hérnias e Parede Abdominal","explanation":"Hérnia inguinal indireta localiza-se lateral aos vasos epigástricos inferiores e entra pelo anel inguinal profundo."},{"number":50,"area":"Cirurgia Geral","stem":"Hérnia que protrui medialmente aos vasos epigástricos inferiores, através do triângulo de Hesselbach, é classificada como:","options":{"A":"obturatória","B":"inguinal direta","C":"Spigel","D":"inguinal indireta","E":"femoral"},"answer":"B","topic":"Hérnias e Parede Abdominal","explanation":"Hérnia inguinal direta atravessa a parede posterior do canal inguinal no triângulo de Hesselbach, medialmente aos vasos epigástricos inferiores."},{"number":51,"area":"Cirurgia Geral","stem":"Mulher idosa apresenta pequena massa dolorosa abaixo do ligamento inguinal, medial à veia femoral, com sinais de encarceramento. O diagnóstico mais provável é:","options":{"A":"hérnia inguinal indireta","B":"hérnia femoral","C":"lipoma subcutâneo","D":"hérnia de Spiegel","E":"hérnia umbilical"},"answer":"B","topic":"Hérnias e Parede Abdominal","explanation":"Hérnia femoral ocupa o canal femoral, abaixo do ligamento inguinal e medial à veia femoral. É mais comum em mulheres e tem alto risco de encarceramento/estrangulamento."},{"number":52,"area":"Cirurgia Geral","stem":"Na abordagem laparoscópica da hérnia inguinal, a fixação traumática de tela deve ser evitada no chamado “triângulo da dor” porque essa região contém principalmente:","options":{"A":"nervo vago abdominal","B":"nervos que podem ser lesados e causar dor crônica","C":"ducto colédoco","D":"ureter contralateral","E":"artéria mesentérica superior"},"answer":"B","topic":"Hérnias e Parede Abdominal","explanation":"O triângulo da dor contém ramos nervosos, incluindo nervos cutâneo femoral lateral e ramo femoral do genitofemoral. Fixação traumática nessa área pode causar neuralgia crônica."},{"number":53,"area":"Cirurgia Geral","stem":"Paciente com hérnia inguinal primária unilateral sintomática será operado por via aberta. Uma técnica sem tensão amplamente utilizada, baseada em tela plana, é:","options":{"A":"Lichtenstein","B":"Bassini sem tela como padrão obrigatório atual","C":"Hartmann","D":"Heller","E":"Whipple"},"answer":"A","topic":"Hérnias e Parede Abdominal","explanation":"A técnica de Lichtenstein é uma hernioplastia aberta sem tensão com tela e permanece abordagem clássica para hérnia inguinal primária."},{"number":54,"area":"Cirurgia Geral","stem":"Paciente de 45 anos apresenta disfagia progressiva para sólidos e líquidos, regurgitação e perda ponderal discreta. Esofagograma mostra afilamento distal em “bico de pássaro”. O exame padrão-ouro para confirmar e classificar o distúrbio é:","options":{"A":"ultrassonografia abdominal","B":"pHmetria isolada sem avaliar motilidade","C":"colonoscopia","D":"manometria esofágica de alta resolução","E":"cintilografia óssea"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Acalasia é confirmada pela manometria de alta resolução, que demonstra relaxamento inadequado da junção esofagogástrica e aperistalse, permitindo classificação por subtipos."},{"number":55,"area":"Cirurgia Geral","stem":"Idoso apresenta disfagia orofaríngea, regurgitação de alimentos não digeridos, halitose e tosse noturna. O esofagograma mostra divertículo posterior acima do esfíncter esofágico superior. O diagnóstico é:","options":{"A":"divertículo de Meckel","B":"acalasia","C":"síndrome de Mallory-Weiss","D":"divertículo de Zenker","E":"úlcera duodenal"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Divertículo de Zenker ocorre na região de Killian, acima do cricofaríngeo, causando regurgitação, halitose, disfagia e risco de aspiração."},{"number":56,"area":"Cirurgia Geral","stem":"Após episódios intensos de vômitos, homem apresenta dor torácica súbita, dispneia e enfisema subcutâneo. TC mostra pneumomediastino e derrame pleural. A hipótese principal é:","options":{"A":"laceração de Mallory-Weiss limitada à mucosa","B":"ruptura esofágica espontânea (síndrome de Boerhaave)","C":"espasmo esofágico difuso sem perfuração","D":"acalasia tipo II","E":"refluxo gastroesofágico simples"},"answer":"B","topic":"Esôfago e Estômago","explanation":"Boerhaave é ruptura transmural após aumento súbito da pressão intraesofágica, frequentemente pós-vômitos, e exige abordagem urgente com antibióticos, controle de contaminação e tratamento definitivo individualizado."},{"number":57,"area":"Cirurgia Geral","stem":"Adulto ingere grande quantidade de produto cáustico e chega estável ao hospital. Uma medida que deve ser evitada é:","options":{"A":"obter informações sobre agente e quantidade ingerida","B":"avaliar via aérea e sinais de perfuração","C":"considerar endoscopia precoce em paciente selecionado e estável","D":"induzir vômitos ou realizar neutralização química empírica","E":"manter vigilância clínica"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Induzir vômitos reexpõe o esôfago ao cáustico; neutralização pode gerar reação exotérmica. Avaliação de via aérea, perfuração e endoscopia em janela apropriada são centrais."},{"number":58,"area":"Cirurgia Geral","stem":"Paciente chega com hematêmese volumosa, PA 80/50 mmHg e taquicardia. Antes da endoscopia digestiva alta, a prioridade é:","options":{"A":"prescrever apenas antiácido","B":"esperar hemoglobina cair para iniciar qualquer medida","C":"administrar alimentação oral","D":"ressuscitação hemodinâmica, acesso venoso adequado e estabilização inicial","E":"realizar endoscopia imediatamente sem acesso venoso"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Em hemorragia digestiva alta instável, ABC e ressuscitação vêm antes do exame endoscópico. Endoscopia é realizada após estabilização inicial adequada."},{"number":59,"area":"Cirurgia Geral","stem":"Em paciente com úlcera péptica sangrante, a classificação de Forrest mostra sangramento arterial em jato. Esse achado corresponde a:","options":{"A":"Forrest Ib sem necessidade de hemostasia","B":"Forrest IV","C":"Forrest IIc sem estigma de sangramento recente","D":"Forrest III e baixo risco","E":"Forrest Ia e requer terapia endoscópica"},"answer":"E","topic":"Esôfago e Estômago","explanation":"Forrest Ia é sangramento em jato e representa alto risco de ressangramento, com indicação de hemostasia endoscópica combinada conforme o caso."},{"number":60,"area":"Cirurgia Geral","stem":"Paciente com adenocarcinoma gástrico ressecável no terço distal, sem invasão que exija gastrectomia total. O princípio oncológico adequado inclui:","options":{"A":"gastrectomia total obrigatória para qualquer tumor distal","B":"ressecção gástrica com margens apropriadas e linfadenectomia D2 em centro experiente","C":"enucleação local sem linfonodos","D":"apenas gastrojejunostomia mesmo ressecável","E":"linfadenectomia proibida em câncer gástrico"},"answer":"B","topic":"Esôfago e Estômago","explanation":"Para câncer gástrico ressecável, a extensão da gastrectomia depende da localização e margens; linfadenectomia D2 é padrão oncológico em centros com experiência."},{"number":61,"area":"Cirurgia Geral","stem":"Massa subepitelial gástrica é ressecada e o anatomopatológico mostra tumor mesenquimal com expressão de KIT (CD117) e DOG1. O diagnóstico é:","options":{"A":"tumor glômico cervical","B":"linfoma MALT","C":"GIST","D":"leiomioma esofágico obrigatoriamente","E":"adenocarcinoma gástrico"},"answer":"C","topic":"Esôfago e Estômago","explanation":"GIST deriva das células intersticiais de Cajal e frequentemente expressa KIT e DOG1. Ressecção deve evitar ruptura; linfadenectomia rotineira não é necessária porque disseminação nodal é incomum."},{"number":62,"area":"Cirurgia Geral","stem":"Mulher com gastrite atrófica autoimune apresenta múltiplos pequenos tumores neuroendócrinos gástricos, hipergastrinemia e lesões restritas à mucosa/submucosa. O tipo mais provável é:","options":{"A":"adenocarcinoma difuso hereditário","B":"linfoma de Burkitt","C":"tipo III esporádico agressivo","D":"tumor neuroendócrino gástrico tipo I","E":"GIST"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Tumores neuroendócrinos gástricos tipo I associam-se a gastrite atrófica autoimune e hipergastrinemia, costumam ser múltiplos, pequenos e de baixo risco metastático."},{"number":63,"area":"Cirurgia Geral","stem":"Paciente com obesidade grave e doença do refluxo gastroesofágico importante necessita de cirurgia bariátrica. Entre as opções usuais, qual procedimento tende a oferecer melhor controle do refluxo?","options":{"A":"gastrectomia vertical como opção preferencial para refluxo grave","B":"derivação biliopancreática em qualquer paciente","C":"bypass gástrico em Y de Roux","D":"banda gástrica ajustável obrigatória","E":"balão intragástrico definitivo"},"answer":"C","topic":"Cirurgia Bariátrica","explanation":"O bypass em Y de Roux tende a melhorar o ref
