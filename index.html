octologia e Intestino","explanation":"Síndrome de Ogilvie é pseudo-obstrução colônica aguda. Falha de medidas conservadoras e ausência de contraindicações permitem uso de neostigmina monitorizada; colonoscopia descompressiva é alternativa."},{"number":67,"area":"Cirurgia Geral","stem":"Paciente estável apresenta volvo de sigmoide sem peritonite, sem perfuração e sem sinais de isquemia. A conduta inicial preferencial é:","options":{"A":"destorção e descompressão endoscópica, seguida de planejamento de ressecção definitiva","B":"colectomia direita","C":"observação sem descompressão","D":"neostigmina obrigatória","E":"apendicectomia"},"answer":"A","topic":"Coloproctologia e Intestino","explanation":"Volvo de sigmoide não complicado é inicialmente descomprimido por endoscopia. Como a recorrência é alta, ressecção definitiva deve ser planejada após estabilização."},{"number":68,"area":"Cirurgia Geral","stem":"Paciente com dor abdominal e obstrução apresenta TC compatível com volvo de ceco. Em contraste com o volvo de sigmoide, o tratamento geralmente indicado é:","options":{"A":"cirurgia","B":"enema baritado terapêutico de rotina","C":"alta com laxativo","D":"descompressão colonoscópica como método de escolha","E":"apenas neostigmina"},"answer":"A","topic":"Coloproctologia e Intestino","explanation":"Volvo de ceco tem baixa taxa de sucesso com descompressão endoscópica e maior risco de recorrência/isquemia; tratamento é habitualmente cirúrgico."},{"number":69,"area":"Cirurgia Geral","stem":"Paciente com apendicite complicada apresenta abscesso periappendicular de 6 cm bem delimitado, está hemodinamicamente estável e sem peritonite difusa. Uma estratégia aceitável é:","options":{"A":"colonoscopia de urgência para drenar o apêndice","B":"apenas analgésico e alta","C":"quimioterapia","D":"tratamento com antibióticos e drenagem percutânea quando tecnicamente possível","E":"colectomia total obrigatória"},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Abscesso apendicular organizado em paciente estável pode ser manejado inicialmente com antibióticos e drenagem percutânea, reservando cirurgia para falha ou indicações específicas."},{"number":70,"area":"Cirurgia Geral","stem":"Após apendicectomia, anatomopatológico mostra tumor neuroendócrino bem diferenciado de 0,8 cm na ponta do apêndice, margens livres, sem fatores de alto risco. A conduta usual é:","options":{"A":"hemicolectomia direita obrigatória","B":"quimioterapia adjuvante obrigatória","C":"considerar a apendicectomia tratamento suficiente","D":"radioterapia abdominal","E":"colectomia total"},"answer":"C","topic":"Oncologia Cirúrgica","explanation":"Tumores neuroendócrinos apendiculares menores que 1 cm, completamente ressecados e sem fatores de risco, em geral são tratados adequadamente apenas com apendicectomia."},{"number":71,"area":"Cirurgia Geral","stem":"Paciente com diverticulite aguda apresenta abscesso pericólico de 5 cm acessível por imagem, sem peritonite generalizada. A abordagem apropriada é:","options":{"A":"colonoscopia durante a fase aguda para drenagem","B":"antibióticos associados a drenagem percutânea quando factível","C":"colectomia total obrigatória imediata","D":"alta sem antibiótico ou seguimento","E":"apenas corticoide"},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"Abscessos diverticulares maiores e acessíveis costumam ser tratados com antibióticos e drenagem percutânea, individualizando necessidade de cirurgia."},{"number":72,"area":"Cirurgia Geral","stem":"Paciente de 43 anos é diagnosticado com câncer colorretal e possui história familiar de tumores de endométrio e cólon em várias gerações. O mecanismo molecular típico da síndrome de Lynch envolve:","options":{"A":"defeito em genes de reparo de pareamento do DNA (mismatch repair)","B":"mutação germinativa exclusiva do gene APC em todos","C":"mutação de RET","D":"amplificação de HER2 como mecanismo hereditário principal","E":"deleção de SMN1"},"answer":"A","topic":"Coloproctologia e Intestino","explanation":"Síndrome de Lynch decorre de variantes germinativas em genes MMR, como MLH1, MSH2, MSH6 e PMS2, levando a instabilidade de microssatélites."},{"number":73,"area":"Cirurgia Geral","stem":"Adolescente apresenta centenas de pólipos adenomatosos colorretais e variante germinativa patogênica no gene APC. O diagnóstico é:","options":{"A":"Peutz-Jeghers","B":"síndrome de Cowden","C":"síndrome de Lynch","D":"polipose adenomatosa familiar","E":"polipose juvenil isolada"},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Polipose adenomatosa familiar é causada por mutação germinativa em APC e confere risco muito elevado de câncer colorretal, motivando vigilância e cirurgia profilática conforme o caso."},{"number":74,"area":"Cirurgia Geral","stem":"Idoso com fibrilação atrial apresenta dor abdominal súbita intensa, desproporcional ao exame físico inicialmente pouco exuberante, e lactato em elevação. O exame de escolha para investigação rápida da principal hipótese é:","options":{"A":"radiografia de tórax isolada","B":"colonoscopia eletiva em 30 dias","C":"angio-TC de abdome","D":"ressonância de joelho","E":"ultrassom de tireoide"},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"Dor desproporcional ao exame em paciente com fonte embólica sugere isquemia mesentérica aguda. Angio-TC é exame de primeira linha para diagnóstico e planejamento."},{"number":75,"area":"Cirurgia Geral","stem":"Paciente em choque séptico com altas doses de vasopressores desenvolve dor abdominal, acidose e sinais de isquemia intestinal. Angio-TC não mostra oclusão arterial ou venosa proximal. A hipótese é:","options":{"A":"doença de Hirschsprung","B":"volvo de sigmoide simples","C":"síndrome de dumping","D":"isquemia mesentérica não oclusiva","E":"apendicite crônica"},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Isquemia mesentérica não oclusiva ocorre por hipoperfusão e vasoconstrição esplâncnica, frequentemente em choque e uso de vasopressores, sem trombo arterial principal."},{"number":76,"area":"Cirurgia Geral","stem":"Paciente com febre, icterícia e dor no hipocôndrio direito apresenta hipotensão e alteração do nível de consciência. Após ressuscitação e antibióticos, a intervenção definitiva urgente deve priorizar:","options":{"A":"colonoscopia","B":"apenas observação","C":"colecistectomia eletiva em 6 meses sem descompressão","D":"esplenectomia","E":"drenagem biliar, geralmente por CPRE quando disponível e apropriada"},"answer":"E","topic":"Hepatobiliopancreática","explanation":"Colangite grave requer antibióticos e descompressão biliar urgente. CPRE é a via preferida na maioria dos casos quando factível."},{"number":77,"area":"Cirurgia Geral","stem":"Paciente com colelitíase apresenta enzimas canaliculares elevadas e colédoco discretamente dilatado, mas sem cálculo visualizado ao ultrassom e sem colangite. O risco de coledocolitíase é intermediário. Um exame adequado antes de indicar CPRE terapêutica é:","options":{"A":"colangiorressonância ou ecoendoscopia","B":"colonoscopia","C":"CPRE diagnóstica obrigatória em todos","D":"radiografia simples","E":"cintilografia pulmonar"},"answer":"A","topic":"Hepatobiliopancreática","explanation":"Em risco intermediário, métodos não invasivos ou minimamente invasivos como MRCP/EUS confirmam cálculos e evitam CPRE desnecessária, que possui complicações próprias."},{"number":78,"area":"Cirurgia Geral","stem":"Paciente com pancreatite aguda biliar, sem necrose infectada ou colangite, está estável. Entre as medidas iniciais recomendadas está:","options":{"A":"jejum absoluto até normalização completa da lipase","B":"reposição volêmica individualizada, analgesia e alimentação enteral precoce conforme tolerância","C":"nutrição parenteral obrigatória","D":"antibiótico profilático para todos por 14 dias","E":"cirurgia pancreática nas primeiras 6 horas"},"answer":"B","topic":"Hepatobiliopancreática","explanation":"Pancreatite aguda é tratada com suporte, fluidos de forma individualizada, analgesia e alimentação enteral precoce. Antibiótico profilático não é indicado na necrose estéril."},{"number":79,"area":"Cirurgia Geral","stem":"Paciente teve pancreatite há 8 semanas e apresenta coleção encapsulada de 5 cm compatível com pseudocisto, sem dor, infecção, obstrução ou sangramento. A conduta mais adequada é:","options":{"A":"drenagem obrigatória porque todo pseudocisto acima de 4 cm deve ser tratado","B":"quimioterapia","C":"observação clínica, pois tamanho isolado não determina drenagem","D":"pancreatectomia total","E":"antibiótico por tempo indeterminado"},"answer":"C","topic":"Hepatobiliopancreática","explanation":"Pseudocistos assintomáticos podem ser observados. Intervenção é indicada por sintomas, complicações, infecção, crescimento ou dúvida diagnóstica, não apenas por tamanho e tempo."},{"number":80,"area":"Cirurgia Geral","stem":"Paciente estável após trauma abdominal fechado apresenta lesão esplênica de baixo grau na tomografia, sem extravasamento ativo e sem outras indicações de laparotomia. A conduta preferencial é:","options":{"A":"laparotomia apenas pelo achado tomográfico","B":"alta imediata sem observação","C":"manejo não operatório com monitorização clínica e laboratorial","D":"esplenectomia obrigatória em toda lesão esplênica","E":"embolização obrigatória mesmo sem sangramento"},"answer":"C","topic":"Trauma e Emergências","explanation":"Em pacientes hemodinamicamente estáveis, o manejo não operatório é padrão para a maioria dos traumas esplênicos, com angioembolização reservada a achados e contextos selecionados."}]},"simulado_ccp_02":{"id":"simulado_ccp_02","label":"Simulado 2 — ENARE CCP","subtitle":"Nível ENARE — intermediário · 80 questões","order":"1–40 Otorrinolaringologia · 41–80 Cirurgia Geral","localKey":"simulado_ccp_02_v1","sourceNote":"Itens autorais ou fortemente adaptados, calibrados pela matriz das provas ENARE Cabeça e Pescoço 2024/2025 e 2025/2026, pelo acervo ENARE 2023/2024 e por provas de Otorrinolaringologia R4 e Cirurgia Geral R+; não são transcrições literais de provas externas.","questions":[{"number":1,"area":"Otorrinolaringologia","stem":"Mulher de 31 anos com história de migrânea apresenta episódios recorrentes de vertigem de 30 minutos a algumas horas, frequentemente acompanhados de fotofobia e fonofobia, porém sem perda auditiva flutuante. Entre as hipóteses abaixo, a mais provável é:","options":{"A":"doença de Ménière","B":"labirintite bacteriana","C":"migrânea vestibular","D":"VPPB posterior","E":"schwannoma vestibular"},"answer":"C","topic":"Vestibulologia","explanation":"Migrânea vestibular causa episódios de sintomas vestibulares em pacientes com história migranosa, com associação temporal a características de migrânea em parte das crises; sintomas cocleares flutuantes típicos favorecem Ménière."},{"number":2,"area":"Otorrinolaringologia","stem":"Paciente apresenta vertigem ao virar na cama. O teste de rotação supina (head roll test) desencadeia nistagmo horizontal geotrópico mais intenso à direita. O quadro é mais compatível com:","options":{"A":"neurite vestibular bilateral","B":"VPPB do canal posterior esquerdo","C":"VPPB do canal semicircular horizontal direito, variante canalitíase","D":"AVC de tronco encefálico obrigatoriamente","E":"doença de Ménière"},"answer":"C","topic":"Vestibulologia","explanation":"No canal horizontal, o head roll test é a manobra diagnóstica. Na variante geotrópica por canalitíase, o lado com nistagmo mais intenso costuma ser o afetado."},{"number":3,"area":"Otorrinolaringologia","stem":"Paciente com síndrome vestibular aguda apresenta nistagmo que muda de direção conforme o olhar, teste de skew positivo e head impulse test normal. Esses achados sugerem:","options":{"A":"otite média com efusão","B":"otosclerose","C":"causa central, devendo-se excluir AVC de circulação posterior","D":"VPPB do canal posterior","E":"neurite vestibular periférica típica"},"answer":"C","topic":"Vestibulologia","explanation":"No HINTS, HIT normal, nistagmo de direção variável e skew positivo são sinais centrais e devem levantar forte suspeita de AVC em paciente com síndrome vestibular aguda apropriada para aplicação do teste."},{"number":4,"area":"Otorrinolaringologia","stem":"Paciente relata vertigem precipitada por sons intensos e por aumento de pressão, associada a autofonia. TC de alta resolução mostra falha óssea sobre o canal semicircular superior. O diagnóstico é:","options":{"A":"doença de Ménière","B":"neurite vestibular","C":"otosclerose","D":"VPPB","E":"síndrome da deiscência do canal semicircular superior"},"answer":"E","topic":"Vestibulologia","explanation":"Deiscência do canal superior pode produzir fenômeno de terceira janela, com vertigem induzida por som/pressão, autofonia e alterações audiométricas peculiares."},{"number":5,"area":"Otorrinolaringologia","stem":"Idoso de 74 anos refere dificuldade progressiva de compreender fala, sobretudo em ambientes ruidosos. Audiometria mostra perda neurossensorial bilateral simétrica predominante em frequências altas. O diagnóstico mais provável é:","options":{"A":"colesteatoma","B":"otosclerose","C":"otite média secretora","D":"fístula perilinfática","E":"presbiacusia"},"answer":"E","topic":"Otologia e Audiologia","explanation":"Presbiacusia é uma perda neurossensorial relacionada à idade, geralmente bilateral, simétrica e inicialmente mais acentuada em altas frequências, com pior compreensão em ruído."},{"number":6,"area":"Otorrinolaringologia","stem":"Trabalhador exposto cronicamente a ruído ocupacional apresenta perda neurossensorial bilateral. Um achado audiométrico clássico nas fases iniciais é:","options":{"A":"entalhe em torno de 4 kHz","B":"curva totalmente plana condutiva","C":"gap aéreo-ósseo isolado em 500 Hz","D":"perda exclusivamente em 125 Hz","E":"melhora seletiva em 4 kHz"},"answer":"A","topic":"Otologia e Audiologia","explanation":"Perda auditiva induzida por ruído frequentemente apresenta entalhe audiométrico em 3–6 kHz, classicamente próximo de 4 kHz."},{"number":7,"area":"Otorrinolaringologia","stem":"Adulto sofre perfuração traumática pequena da membrana timpânica após cotonete. Não há vertigem, perda neurossensorial ou infecção. A conduta inicial costuma ser:","options":{"A":"manter o ouvido seco e observar cicatrização espontânea, com seguimento","B":"estapedotomia","C":"antibiótico sistêmico prolongado obrigatoriamente","D":"mastoidectomia imediata","E":"irrigar vigorosamente o ouvido diariamente"},"answer":"A","topic":"Otologia e Audiologia","explanation":"A maioria das perfurações timpânicas traumáticas pequenas cicatriza espontaneamente. Deve-se evitar entrada de água e acompanhar audição/cicatrização; cirurgia é reservada para persistência ou complicações."},{"number":8,"area":"Otorrinolaringologia","stem":"Paciente diabético idoso apresenta otalgia intensa, otorreia, tecido de granulação no conduto auditivo externo e dor desproporcional ao exame. A principal hipótese é:","options":{"A":"otosclerose","B":"barotrauma simples","C":"otite externa necrotizante","D":"VPPB","E":"otite média serosa"},"answer":"C","topic":"Otologia e Audiologia","explanation":"Otite externa necrotizante ocorre sobretudo em diabéticos/imunossuprimidos, geralmente por Pseudomonas, podendo causar osteomielite da base do crânio e neuropatias cranianas."},{"number":9,"area":"Otorrinolaringologia","stem":"Nadador de 24 anos apresenta otalgia ao tracionar o pavilhão, edema difuso do conduto e secreção, sem sinais sistêmicos ou extensão para partes moles. A terapia inicial é:","options":{"A":"antibiótico intravenoso obrigatório","B":"corticosteroide sistêmico isolado","C":"limpeza adequada do conduto e tratamento tópico com antimicrobiano, com ou sem corticosteroide","D":"apenas descongestionante nasal","E":"mastoidectomia"},"answer":"C","topic":"Otologia e Audiologia","explanation":"Otite externa difusa não complicada é tratada principalmente com terapia tópica e controle da dor. Antibiótico sistêmico fica reservado para extensão ou fatores específicos."},{"number":10,"area":"Otorrinolaringologia","stem":"Criança de 4 anos apresenta massa branca perolada atrás de membrana timpânica íntegra, sem história de perfuração ou cirurgia otológica. A hipótese é:","options":{"A":"timpanosclerose obrigatória","B":"colesteatoma congênito","C":"cerume impactado","D":"otite externa","E":"otosclerose"},"answer":"B","topic":"Otologia e Audiologia","explanation":"Colesteatoma congênito costuma aparecer como massa branca atrás de membrana timpânica íntegra em criança sem história de perfuração, tubo ou cirurgia prévia."},{"number":11,"area":"Otorrinolaringologia","stem":"Recém-nascido falha na triagem auditiva inicial. Em relação à investigação objetiva da audição em lactentes, um exame que avalia a resposta neural da via auditiva até o tronco encefálico é:","options":{"A":"teste de Weber isolado","B":"impedanciometria como medida direta do córtex auditivo","C":"audiometria tonal convencional obrigatória no recém-nascido","D":"potencial evocado auditivo de tronco encefálico (PEATE/BERA)","E":"teste calórico"},"answer":"D","topic":"Otologia e Audiologia","explanation":"O PEATE/BERA registra respostas elétricas da via auditiva e é útil na avaliação objetiva de limiares e integridade neural em lactentes e pacientes que não colaboram com audiometria comportamental."},{"number":12,"area":"Otorrinolaringologia","stem":"Paciente com otosclerose apresenta perda condutiva importante, boa discriminação vocal e anatomia favorável. Uma opção cirúrgica para melhorar a condução sonora é:","options":{"A":"estapedotomia","B":"mastoidectomia radical","C":"miringotomia isolada","D":"implante coclear obrigatório","E":"neurectomia vestibular"},"answer":"A","topic":"Otologia e Audiologia","explanation":"Estapedotomia cria uma fenestra na platina do estribo e utiliza prótese para contornar a fixação, sendo opção em otosclerose condutiva selecionada."},{"number":13,"area":"Otorrinolaringologia","stem":"Paciente usa oximetazolina nasal várias vezes ao dia há meses e relata congestão intensa sempre que tenta suspender. O diagnóstico é:","options":{"A":"rinossinusite fúngica invasiva","B":"rinite gustatória","C":"rinite atrófica primária","D":"granulomatose com poliangiite obrigatoriamente","E":"rinite medicamentosa"},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Uso prolongado de vasoconstritores tópicos pode causar congestão de rebote e rinite medicamentosa. O tratamento envolve retirada do descongestionante e controle da inflamação nasal."},{"number":14,"area":"Otorrinolaringologia","stem":"Paciente apresenta crostas, epistaxes recorrentes e assobio nasal após septoplastia prévia. Endoscopia confirma perfuração septal. Uma medida inicial em caso pequeno e pouco sintomático é:","options":{"A":"ligadura da carótida externa","B":"hidratação nasal e cuidados locais, reservando reparo para casos sintomáticos selecionados","C":"antifúngico sistêmico de rotina","D":"amputação do septo remanescente","E":"radioterapia"},"answer":"B","topic":"Rinologia e Rinossinusites","explanation":"Perfuração septal pode ser manejada conservadoramente com hidratação e pomadas em casos leves. Reparo cirúrgico ou botão septal é considerado conforme tamanho, sintomas e etiologia."},{"number":15,"area":"Otorrinolaringologia","stem":"Adulto com rinorreia purulenta e pressão facial há 12 dias, sem melhora, após quadro viral inicial. Esse padrão favorece:","options":{"A":"tumor de cavum","B":"rinossinusite aguda bacteriana","C":"bola fúngica","D":"rinossinusite crônica porque passou de 7 dias","E":"resfriado comum necessariamente ainda viral"},"answer":"B","topic":"Rinologia e Rinossinusites","explanation":"Sintomas persistentes por pelo menos 10 dias sem melhora, início grave ou dupla piora são padrões clínicos que favorecem rinossinusite aguda bacteriana."},{"number":16,"area":"Otorrinolaringologia","stem":"Criança com sinusite etmoidal evolui com edema palpebral, proptose, limitação de movimentos oculares e coleção subperiosteal na TC. Esse quadro exige:","options":{"A":"apenas anti-histamínico oral","B":"alta sem seguimento","C":"corticosteroide tópico isolado","D":"nenhuma avaliação oftalmológica","E":"antibiótico intravenoso e avaliação urgente para drenagem cirúrgica conforme idade, localização e evolução"},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Abscesso subperiosteal orbitário é complicação importante de sinusite, com risco visual e intracraniano. Exige antibiótico IV e decisão multidisciplinar sobre drenagem."},{"number":17,"area":"Otorrinolaringologia","stem":"Adolescente com sinusite frontal apresenta edema flutuante doloroso na testa. TC evidencia osteomielite do osso frontal com abscesso subperiosteal. O diagnóstico é:","options":{"A":"nasoangiofibroma","B":"rinite vasomotora","C":"Pott puffy tumor","D":"cisto dermoide obrigatório","E":"mucocele simples sem infecção"},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Pott puffy tumor é osteomielite frontal com abscesso subperiosteal, geralmente complicação de sinusite frontal, e necessita tratamento agressivo com antibiótico e drenagem."},{"number":18,"area":"Otorrinolaringologia","stem":"Paciente apresenta rinorreia unilateral aquosa contínua, que aumenta ao inclinar a cabeça, após trauma craniano. Qual marcador laboratorial na secreção nasal é altamente sugestivo de líquor?","options":{"A":"alfa-fetoproteína","B":"troponina","C":"beta-2 transferrina","D":"PSA","E":"D-dímero"},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Beta-2 transferrina é marcador altamente específico para LCR em secreções nasais/otológicas e auxilia no diagnóstico de fístula liquórica."},{"number":19,"area":"Otorrinolaringologia","stem":"Adulto apresenta obstrução nasal unilateral e epistaxe. Endoscopia mostra massa polipoide originada na parede lateral nasal; TC evidencia remodelamento ósseo e padrão cerebriforme. A hipótese principal é:","options":{"A":"pólipo antrocoanal simples","B":"mucocele labial","C":"rinite alérgica","D":"cisto tireoglosso","E":"papiloma invertido"},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Papiloma invertido é tumor sinonasal benigno localmente agressivo, com recorrência e associação a carcinoma escamoso. O padrão cerebriforme em imagem pode ser sugestivo."},{"number":20,"area":"Otorrinolaringologia","stem":"Criança ou adulto jovem apresenta obstrução nasal unilateral. Endoscopia mostra pólipo único que se origina no seio maxilar e se estende posteriormente em direção à coana. Trata-se de:","options":{"A":"pólipo antrocoanal","B":"nasoangiofibroma","C":"polipose eosinofílica bilateral obrigatória","D":"cisto branquial","E":"papiloma laríngeo"},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"O pólipo antrocoanal geralmente é unilateral, origina-se no seio maxilar e cresce através do óstio em direção à coana/nasofaringe."},{"number":21,"area":"Otorrinolaringologia","stem":"Criança apresenta respiração oral, roncos, voz hiponasal e otite média com efusão recorrente. A endoscopia mostra tecido linfoide ocupando grande parte da nasofaringe. O diagnóstico é:","options":{"A":"paralisia facial","B":"laringomalácia","C":"atresia de coana unilateral obrigatória","D":"hipertrofia adenoideana","E":"nasoangiofibroma"},"answer":"D","topic":"Craniofacial e Pediatria","explanation":"Hipertrofia de adenoide causa obstrução nasofaríngea, respiração oral e roncos e pode contribuir para disfunção tubária e otite média com efusão."},{"number":22,"area":"Otorrinolaringologia","stem":"Paciente com abscesso peritonsilar é drenado e recebe antibióticos. Em qual situação a tonsilectomia de intervalo pode ser particularmente considerada?","options":{"A":"história de amigdalites recorrentes ou episódios repetidos de abscesso peritonsilar","B":"rinite alérgica isolada","C":"otosclerose","D":"primeiro episódio leve sem história prévia em todos os pacientes","E":"otite externa recorrente"},"answer":"A","topic":"Cavidade Oral e Faringologia","explanation":"Tonsilectomia não é necessária após todo primeiro abscesso, mas pode ser indicada quando há recorrência ou critérios independentes de amigdalectomia por infecções de repetição."},{"number":23,"area":"Otorrinolaringologia","stem":"Criança pequena apresenta febre, rigidez cervical, disfagia e abaulamento da parede posterior da faringe. TC mostra coleção no espaço retrofaríngeo. A principal preocupação imediata é:","options":{"A":"comprometimento de via aérea e disseminação da infecção para espaços profundos/mediastino","B":"câncer de tireoide","C":"otosclerose","D":"rinite medicamentosa","E":"hipertensão intracraniana idiopática"},"answer":"A","topic":"Cavidade Oral e Faringologia","explanation":"Abscesso retrofaríngeo pode causar obstrução de via aérea e disseminação descendente. Antibiótico IV, avaliação de via aérea e drenagem quando indicada são essenciais."},{"number":24,"area":"Otorrinolaringologia","stem":"Criança ingere uma bateria tipo botão que fica impactada no esôfago cervical. A conduta é:","options":{"A":"observar eliminação espontânea por uma semana","B":"aguardar sintomas respiratórios","C":"remoção endoscópica emergente","D":"realizar apenas radiografia anual","E":"administrar laxante e liberar"},"answer":"C","topic":"Cavidade Oral e Faringologia","explanation":"Bateria de botão impactada no esôfago causa lesão cáustica rápida e deve ser removida emergencialmente."},{"number":25,"area":"Otorrinolaringologia","stem":"Criança apresenta rouquidão persistente e múltiplas lesões papilomatosas laríngeas recorrentes. Os tipos de HPV mais classicamente associados à papilomatose respiratória recorrente são:","options":{"A":"HPV 6 e 11","B":"CMV e HHV-8","C":"HPV 16 e 18 exclusivamente","D":"HSV 1 e 2","E":"EBV 1 e 2"},"answer":"A","topic":"Laringologia e Voz","explanation":"Papilomatose respiratória recorrente é causada principalmente pelos HPV de baixo risco 6 e 11. O tratamento é cirúrgico para manter via aérea e voz, com adjuvantes em casos selecionados."},{"number":26,"area":"Otorrinolaringologia","stem":"Homem tabagista apresenta disfonia progressiva há 2 meses. Lesão restrita à prega vocal verdadeira é diagnosticada precocemente. Uma razão para tumores glóticos iniciais apresentarem sintomas precoces é:","options":{"A":"a glote não participa da fonação","B":"a glote possui intensa drenagem linfática e sempre causa metástase inicial","C":"as pregas vocais são insensíveis a alterações estruturais","D":"pequenas lesões já alteram a vibração da prega vocal e causam rouquidão","E":"todo tumor glótico produz estridor antes de disfonia"},"answer":"D","topic":"Laringologia e Voz","explanation":"Lesões glóticas pequenas alteram a onda mucosa e a fonação, levando a rouquidão precoce; a drenagem linfática glótica é relativamente pobre, sobretudo em lesões iniciais."},{"number":27,"area":"Otorrinolaringologia","stem":"Cantor apresenta lesão unilateral pediculada em prega vocal após episódio de abuso vocal. Fonoterapia melhora técnica, mas persiste lesão e disfonia limitante. Uma opção é:","options":{"A":"laringectomia total","B":"traqueostomia definitiva","C":"microcirurgia de laringe com técnica fonocirúrgica cuidadosa","D":"antibiótico IV prolongado","E":"radioterapia"},"answer":"C","topic":"Laringologia e Voz","explanation":"Pólipos vocais são tipicamente unilaterais e podem persistir apesar de medidas conservadoras. Fonocirurgia pode ser indicada quando há impacto funcional persistente."},{"number":28,"area":"Otorrinolaringologia","stem":"Paciente apresenta disfonia com importante esforço supraglótico, sem lesão estrutural das pregas vocais e com piora relacionada ao uso profissional da voz. A abordagem inicial mais adequada é:","options":{"A":"estapedotomia","B":"fonoterapia voltada à redução da tensão muscular e otimização do uso vocal","C":"laringectomia parcial","D":"radioterapia","E":"antibiótico sistêmico"},"answer":"B","topic":"Laringologia e Voz","explanation":"Disfonia por tensão muscular é funcional e responde principalmente a terapia vocal, higiene vocal e correção de fatores associados."},{"number":29,"area":"Otorrinolaringologia","stem":"Paciente jovem apresenta episódios de dispneia e estridor inspiratório durante exercício, com saturação preservada e broncodilatador pouco eficaz. Laringoscopia durante o episódio demonstra adução paradoxal das pregas vocais na inspiração. O diagnóstico é:","options":{"A":"obstrução laríngea induzida por exercício/disfunção paradoxal de pregas vocais","B":"corpo estranho brônquico crônico","C":"epiglotite bacteriana","D":"paralisia bilateral fixa de pregas vocais","E":"asma obrigatoriamente"},"answer":"A","topic":"Laringologia e Voz","explanation":"Obstrução laríngea induzida por exercício pode mimetizar asma. Estridor inspiratório e adução paradoxal visualizada durante sintomas apoiam o diagnóstico."},{"number":30,"area":"Otorrinolaringologia","stem":"Em adultos, um índice de apneia-hipopneia de 34 eventos por hora é classificado, em geral, como:","options":{"A":"apenas ronco primário","B":"leve","C":"normal","D":"moderada","E":"apneia obstrutiva do sono grave"},"answer":"E","topic":"Sono e Via Aérea Superior","explanation":"Em adultos, IAH 5–14,9 é leve, 15–29,9 moderado e ≥30 grave, considerando também sintomas e contexto clínico."},{"number":31,"area":"Otorrinolaringologia","stem":"Paciente com AOS não tolera CPAP e será avaliado para cirurgia de via aérea superior. A endoscopia do sono induzido por drogas (DISE) tem como objetivo principal:","options":{"A":"medir limiar auditivo","B":"diagnosticar otosclerose","C":"substituir sempre a polissonografia diagnóstica","D":"avaliar apenas seios paranasais","E":"identificar padrões e níveis de colapso da via aérea durante sono simulado"},"answer":"E","topic":"Sono e Via Aérea Superior","explanation":"DISE permite visualizar dinamicamente locais e padrões de colapso, auxiliando seleção de procedimentos em pacientes candidatos a terapias anatômicas."},{"number":32,"area":"Otorrinolaringologia","stem":"Criança obesa mantém roncos e AOS após adenotonsilectomia. A conduta subsequente deve reconhecer que:","options":{"A":"AOS residual é mais frequente em crianças obesas e pode exigir reavaliação com terapias adicionais, incluindo CPAP","B":"polissonografia nunca deve ser repetida","C":"adenotonsilectomia sempre cura 100% dos casos","D":"CPAP é proibido em crianças","E":"obesidade não influencia AOS pediátrica"},"answer":"A","topic":"Sono e Via Aérea Superior","explanation":"Obesidade, síndromes craniofaciais e AOS grave aumentam risco de doença residual após adenotonsilectomia; terapia adicional e reavaliação são frequentemente necessárias."},{"number":33,"area":"Otorrinolaringologia","stem":"Recém-nascido apresenta cianose que piora em repouso e melhora ao chorar, com dificuldade de passagem de sonda por ambas as fossas nasais. A principal hipótese é:","options":{"A":"nasoangiofibroma","B":"VPPB","C":"laringomalácia isolada","D":"atresia bilateral de coanas","E":"rinite alérgica"},"answer":"D","topic":"Craniofacial e Pediatria","explanation":"Recém-nascidos são respiradores nasais preferenciais. Atresia bilateral de coanas pode causar cianose cíclica que melhora com choro e constitui emergência de via aérea."},{"number":34,"area":"Otorrinolaringologia","stem":"Criança apresenta hipoplasia malar e mandibular, fissuras palpebrais inclinadas para baixo e malformações auriculares, com inteligência geralmente preservada. O quadro é compatível com:","options":{"A":"síndrome de Ménière","B":"síndrome de Kartagener","C":"síndrome de Frey","D":"síndrome de Treacher Collins","E":"síndrome de Eagle"},"answer":"D","topic":"Craniofacial e Pediatria","explanation":"Treacher Collins é disostose mandibulofacial com hipoplasia zigomático-mandibular e alterações auriculares; pode causar problemas de via aérea e audição condutiva."},{"number":35,"area":"Otorrinolaringologia","stem":"Lactente com micrognatia e glossoptose apresenta episódios de obstrução de via aérea. Antes de procedimentos invasivos, uma medida inicial em casos leves pode incluir:","options":{"A":"sedação profunda domiciliar","B":"amigdalectomia em recém-nascido","C":"posicionamento e estratégias não invasivas para manter a via aérea, com escalonamento conforme gravidade","D":"nenhuma monitorização","E":"uso rotineiro de opioide"},"answer":"C","topic":"Craniofacial e Pediatria","explanation":"Na sequência de Pierre Robin, manejo é graduado conforme gravidade: posicionamento e suporte não invasivo podem bastar em casos leves; casos graves podem exigir via aérea nasofaríngea, CPAP ou cirurgia."},{"number":36,"area":"Otorrinolaringologia","stem":"Adulto apresenta pequeno orifício congênito na borda anterior do esternocleidomastoideo com drenagem intermitente desde a infância. Esse achado sugere:","options":{"A":"seio ou fístula branquial","B":"cisto tireoglosso","C":"laringomalácia","D":"otosclerose","E":"sialolitíase"},"answer":"A","topic":"Pescoço e Tireoide","explanation":"Anomalias branquiais podem se manifestar como cistos, seios ou fístulas laterais do pescoço, frequentemente ao longo da borda anterior do esternocleidomastoideo."},{"number":37,"area":"Otorrinolaringologia","stem":"Paciente apresenta dor e aumento da glândula submandibular durante as refeições. Radiografia mostra cálculo radiopaco no ducto de Wharton. O diagnóstico é:","options":{"A":"sialolitíase submandibular","B":"parotidite viral obrigatória","C":"ranula","D":"tumor de Warthin","E":"cisto branquial"},"answer":"A","topic":"Glândulas Salivares","explanation":"Sialolitíase é mais comum na glândula submandibular e causa dor/aumento relacionados à alimentação, devido à obstrução do fluxo salivar."},{"number":38,"area":"Otorrinolaringologia","stem":"Idoso desidratado no pós-operatório apresenta parótida dolorosa, aumentada, febre e saída de secreção purulenta pelo ducto de Stensen. A hipótese principal é:","options":{"A":"parotidite bacteriana supurativa aguda","B":"tumor de Warthin","C":"sialadenose indolor","D":"adenoma pleomórfico","E":"síndrome de Sjögren"},"answer":"A","topic":"Glândulas Salivares","explanation":"Parotidite supurativa ocorre em pacientes desidratados/debilitados; Staphylococcus aureus é agente comum. Manejo inclui hidratação, massagem, higiene oral e antibióticos apropriados."},{"number":39,"area":"Otorrinolaringologia","stem":"Após parotidectomia, paciente passa a apresentar sudorese e rubor na região pré-auricular ao mastigar. O quadro é denominado:","options":{"A":"síndrome de Horner","B":"síndrome de Frey","C":"síndrome de Costen","D":"síndrome de Eagle","E":"síndrome de Ramsay Hunt"},"answer":"B","topic":"Glândulas Salivares","explanation":"Síndrome de Frey resulta de reinervação aberrante de fibras parassimpáticas para glândulas sudoríparas após cirurgia/trauma parotídeo, causando sudorese gustatória."},{"number":40,"area":"Otorrinolaringologia","stem":"Homem de 58 anos apresenta massa cervical lateral cística nova. Não há sinais de infecção e ele é tabagista. Qual princípio diagnóstico é mais importante?","options":{"A":"drenar repetidamente sem diagnóstico","B":"em adulto, massa cervical persistente deve ser considerada neoplásica até prova em contrário, inclusive metástase cística de carcinoma de orofaringe","C":"presumir cisto branquial benigno e não investigar","D":"não realizar imagem ou punção","E":"considerar sempre lipoma"},"answer":"B","topic":"Cabeça e Pescoço / Salivar","explanation":"Massa cervical persistente no adulto requer investigação oncológica. Metástases císticas, especialmente de carcinoma orofaríngeo HPV-relacionado, podem mimetizar cisto branquial."},{"number":41,"area":"Cirurgia Geral","stem":"Paciente com peritonite secundária por perfuração intestinal apresenta sepse. Além de antibióticos e ressuscitação, um princípio essencial do tratamento é:","options":{"A":"controle precoce do foco infeccioso","B":"nutrição parenteral como tratamento da infecção","C":"usar apenas antitérmico","D":"evitar drenagem ou cirurgia","E":"adiar toda intervenção até normalização da PCR"},"answer":"A","topic":"Inflamação, Infecção e Sepse","explanation":"Sepse cirúrgica por foco abdominal exige controle da fonte por drenagem, ressecção, reparo ou outra intervenção adequada, associado à ressuscitação e antimicrobianos."},{"number":42,"area":"Cirurgia Geral","stem":"Protocolos de recuperação acelerada após cirurgia (ERAS) incluem, quando apropriado:","options":{"A":"analgesia multimodal, mobilização e alimentação precoces e redução de dispositivos desnecessários","B":"repouso absoluto até a alta","C":"opioide em altas doses como única analgesia","D":"sonda nasogástrica obrigatória por 7 dias","E":"jejum pós-operatório prolongado de rotina"},"answer":"A","topic":"Perioperatório e Ética","explanation":"ERAS combina intervenções baseadas em evidência para reduzir resposta ao estresse, complicações e tempo de internação, incluindo mobilização/alimentação precoces e analgesia multimodal."},{"number":43,"area":"Cirurgia Geral","stem":"Em avaliação nutricional pré-operatória, qual afirmação sobre albumina sérica é correta?","options":{"A":"albumina não sofre influência de inflamação","B":"albumina baixa associa-se a pior prognóstico, mas é influenciada por inflamação e não deve ser interpretada isoladamente como medida de ingestão nutricional","C":"albumina é marcador específico de ingestão proteica das últimas 24 horas","D":"albumina baixa sempre prova desnutrição pura","E":"albumina nunca tem valor prognóstico"},"answer":"B","topic":"Nutrição e Metabolismo","explanation":"Albumina é proteína negativa de fase aguda e se associa a risco cirúrgico, porém inflamação, hidratação e doença sistêmica influenciam seus níveis; avaliação nutricional deve ser global."},{"number":44,"area":"Cirurgia Geral","stem":"Deficiência de qual micronutriente pode comprometer epitelização, síntese proteica e resposta imune, prejudicando cicatrização?","options":{"A":"bromo","B":"zinco","C":"lítio","D":"iodo em excesso","E":"flúor"},"answer":"B","topic":"Cicatrização e Feridas","explanation":"Zinco participa de numerosas enzimas e processos de síntese proteica, imunidade e cicatrização. Deficiência deve ser corrigida quando presente."},{"number":45,"area":"Cirurgia Geral","stem":"Uma laparotomia realizada por perfuração de cólon com fezes livres na cavidade é classificada, quanto ao potencial de contaminação, como cirurgia:","options":{"A":"limpa-contaminada","B":"infectada/suja","C":"estéril","D":"limpa","E":"contaminada apenas, sem infecção estabelecida"},"answer":"B","topic":"Inflamação, Infecção e Sepse","explanation":"Perfuração de víscera com contaminação fecal e infecção estabelecida caracteriza ferida classe IV, suja/infectada."},{"number":46,"area":"Cirurgia Geral","stem":"Em relação ao momento da antibioticoprofilaxia, a regra prática para a maioria dos agentes intravenosos é:","options":{"A":"administrar apenas após surgir febre","B":"administrar apenas por via oral após alta","C":"iniciar somente 24 horas após a cirurgia","D":"sempre prolongar por 7 dias","E":"administrá-los antes da incisão para garantir concentração tecidual adequada no momento da contaminação"},"answer":"E","topic":"Inflamação, Infecção e Sepse","explanation":"Profilaxia deve atingir níveis adequados no tecido antes da incisão. Fármacos com infusão prolongada, como vancomicina, exigem início mais antecipado."},{"number":47,"area":"Cirurgia Geral","stem":"Paciente oncológico de alto risco para tromboembolismo será submetido a cirurgia abdominal, sem contraindicação a anticoagulação. Uma estratégia preventiva apropriada é:","options":{"A":"nenhuma profilaxia porque haverá sangramento inevitável","B":"anticoagulação terapêutica plena em todos","C":"profilaxia farmacológica com heparina de baixo peso molecular associada a medidas mecânicas conforme risco","D":"AAS como única medida universal","E":"apenas hidratação oral"},"answer":"C","topic":"Perioperatório e Ética","explanation":"Risco de TEV deve ser estratificado. Pacientes de alto risco geralmente se beneficiam de profilaxia farmacológica, frequentemente associada a compressão mecânica, salvo contraindicações."},{"number":48,"area":"Cirurgia Geral","stem":"Paciente usa betabloqueador cronicamente por doença coronariana e será submetido a cirurgia eletiva. Em geral, a conduta é:","options":{"A":"iniciar altas doses em todos os pacientes no dia da cirurgia","B":"manter o betabloqueador crônico no perioperatório, evitando suspensão abrupta","C":"dobrar a dose na manhã da cirurgia sem avaliar sinais vitais","D":"trocar por corticoide","E":"suspender obrigatoriamente 7 dias antes"},"answer":"B","topic":"Perioperatório e Ética","explanation":"Betabloqueadores crônicos devem ser mantidos na maioria dos pacientes; suspensão abrupta pode provocar rebote. Início de altas doses imediatamente antes da cirurgia pode ser prejudicial."},{"number":49,"area":"Cirurgia Geral","stem":"Qual fator está fortemente associado ao desenvolvimento de hérnia incisional após laparotomia?","options":{"A":"miopia","B":"rinite alérgica","C":"uso de óculos","D":"infecção do sítio cirúrgico","E":"grupo sanguíneo O isolado"},"answer":"D","topic":"Hérnias e Parede Abdominal","explanation":"Infecção de ferida compromete cicatrização fascial e é importante fator de risco para hérnia incisional, além de obesidade, tabagismo e fatores técnicos."},{"number":50,"area":"Cirurgia Geral","stem":"Paciente apresenta hérnia encarcerada em que apenas parte da circunferência da parede intestinal está presa, podendo haver estrangulamento sem obstrução intestinal completa. Essa hérnia é chamada:","options":{"A":"hérnia de Spiegel","B":"hérnia obturatória","C":"hérnia de Littre","D":"hérnia de Richter","E":"hérnia direta"},"answer":"D","topic":"Hérnias e Parede Abdominal","explanation":"Na hérnia de Richter, apenas uma porção antimesentérica da parede intestinal é encarcerada; pode necrosar sem causar obstrução completa, o que dificulta o diagnóstico."},{"number":51,"area":"Cirurgia Geral","stem":"Mulher idosa, magra, com obstrução intestinal e dor irradiada para face medial da coxa, pior à extensão/rotação do quadril, pode apresentar:","options":{"A":"hérnia umbilical simples","B":"hérnia lombar","C":"hérnia de Amyand","D":"hérnia epigástrica","E":"hérnia obturatória"},"answer":"E","topic":"Hérnias e Parede Abdominal","explanation":"Hérnia obturatória é rara, típica de mulheres idosas e magras. Compressão do nervo obturador pode produzir sinal de Howship-Romberg."},{"number":52,"area":"Cirurgia Geral","stem":"Em uma hérnia inguinal deslizante, parte da parede do saco herniário é formada por:","options":{"A":"fígado obrigatoriamente","B":"pâncreas em todos os casos","C":"músculo reto abdominal","D":"uma víscera, como cólon ou bexiga","E":"apenas pele"},"answer":"D","topic":"Hérnias e Parede Abdominal","explanation":"Na hérnia deslizante, uma víscera retroperitoneal ou parcialmente peritonealizada participa da parede do saco; reconhecer isso evita lesão visceral durante dissecção."},{"number":53,"area":"Cirurgia Geral","stem":"Na correção laparoscópica de hérnia inguinal, a técnica TEP diferencia-se da TAPP porque:","options":{"A":"acessa o espaço pré-peritoneal sem entrar intencionalmente na cavidade peritoneal","B":"não utiliza tela","C":"é sempre feita por laparotomia","D":"só pode ser usada em hérnia femoral","E":"não permite visualizar o espaço miopectíneo"},"answer":"A","topic":"Hérnias e Parede Abdominal","explanation":"TEP é totalmente extraperitoneal; TAPP entra na cavidade peritoneal, abre o peritônio e depois o fecha sobre a tela."},{"number":54,"area":"Cirurgia Geral","stem":"Paciente com hérnia inguinal dolorosa apresenta sinais sistêmicos, hiperemia local e TC com alça sem realce e pneumatoses. A conduta é:","options":{"A":"prescrever laxante","B":"observar por 48 horas","C":"agendar cirurgia eletiva em um ano","D":"tentar redução manual repetida apesar de sinais de isquemia","E":"exploração cirúrgica urgente por suspeita de estrangulamento"},"answer":"E","topic":"Hérnias e Parede Abdominal","explanation":"Sinais de isquemia/estrangulamento tornam a hérnia uma emergência cirúrgica; redução manual forçada pode ser perigosa e atrasar o tratamento definitivo."},{"number":55,"area":"Cirurgia Geral","stem":"Paciente com pirose crônica, regurgitação e esofagite documentada tem sintomas persistentes apesar de tratamento clínico otimizado e deseja alternativa definitiva. Antes de fundoplicatura, é importante:","options":{"A":"suspender todos os exames porque sintomas bastam em qualquer cenário","B":"operar sem qualquer investigação","C":"confirmar refluxo quando necessário e avaliar motilidade esofágica para planejamento","D":"indicar gastrectomia total","E":"realizar colectomia profilática"},"answer":"C","topic":"Esôfago e Estômago","explanation":"Cirurgia antirrefluxo exige diagnóstico objetivo e seleção adequada; endoscopia, pHmetria e manometria são usados conforme o caso para confirmar refluxo e excluir distúrbios motores."},{"number":56,"area":"Cirurgia Geral","stem":"Paciente com grande hérnia hiatal paraesofágica apresenta dor pós-prandial, saciedade precoce e anemia por lesões de Cameron. A conduta, em geral, é:","options":{"A":"observação obrigatória mesmo com sintomas","B":"apendicectomia","C":"colectomia","D":"avaliação para reparo cirúrgico por ser sintomática","E":"esplenectomia"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Hérnias paraesofágicas sintomáticas são candidatas a reparo cirúrgico, sobretudo quando causam obstrução, sangramento/anemia ou risco de complicações."},{"number":57,"area":"Cirurgia Geral","stem":"Qual associação epidemiopatológica está correta para câncer de esôfago?","options":{"A":"carcinoma escamoso associa-se exclusivamente a Barrett","B":"adenocarcinoma ocorre apenas no esôfago cervical","C":"carcinoma escamoso não se relaciona a tabagismo ou álcool","D":"todos os tumores são GIST","E":"adenocarcinoma associa-se a esôfago de Barrett e predomina no esôfago distal"},"answer":"E","topic":"Esôfago e Estômago","explanation":"Adenocarcinoma é associado a DRGE/Barrett e costuma localizar-se distalmente; carcinoma escamoso associa-se a tabagismo, álcool e outros fatores e é mais comum no médio/superior."},{"number":58,"area":"Cirurgia Geral","stem":"Paciente com esôfago de Barrett apresenta displasia de alto grau confirmada por patologista experiente, sem câncer invasivo. Uma estratégia atual apropriada em muitos casos é:","options":{"A":"apenas observar por 10 anos","B":"terapia endoscópica de erradicação, incluindo ressecção de lesões visíveis e ablação do Barrett remanescente","C":"colectomia","D":"radioterapia cervical","E":"antibiótico crônico"},"answer":"B","topic":"Esôfago e Estômago","explanation":"Displasia de alto grau em Barrett geralmente requer terapia endoscópica de erradicação em centros experientes, após confirmação histológica e avaliação cuidadosa."},{"number":59,"area":"Cirurgia Geral","stem":"Úlcera gástrica é identificada à endoscopia em paciente de 62 anos. Uma diferença importante em relação à úlcera duodenal é que a úlcera gástrica:","options":{"A":"nunca precisa de biópsia","B":"deve ser avaliada com biópsia adequada para excluir malignidade quando não houver contraindicação","C":"é sempre maligna","D":"não se associa a H. pylori ou AINEs","E":"não pode sangrar"},"answer":"B","topic":"Esôfago e Estômago","explanation":"Úlceras gástricas podem representar câncer ulcerado; biópsias são importantes, além de tratamento de H. pylori/AINEs e confirmação de cicatrização em situações apropriadas."},{"number":60,"area":"Cirurgia Geral","stem":"Paciente com perfuração de pequena úlcera duodenal chega com peritonite e é submetido a cirurgia. Um reparo clássico para pequenas perfurações é:","options":{"A":"esofagectomia","B":"pancreatectomia total","C":"hemicolectomia direita","D":"rafia com patch omental (Graham), associada ao tratamento da causa","E":"fundoplicatura isolada"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Pequenas perfurações duodenais podem ser fechadas com sutura e reforço omental; é essencial tratar H. pylori e evitar AINEs quando pertinentes."},{"number":61,"area":"Cirurgia Geral","stem":"Paciente com vômitos alimentares tardios e sucussão gástrica apresenta estenose pilórica por doença ulcerosa crônica. A investigação inicial inclui principalmente:","options":{"A":"broncoscopia","B":"colonoscopia","C":"angiografia cerebral","D":"ultrassom de tireoide","E":"endoscopia digestiva alta após correção hidroeletrolítica e descompressão quando necessária"},"answer":"E","topic":"Esôfago e Estômago","explanation":"Obstrução da saída gástrica exige correção de alcalose/hipocloremia e avaliação endoscópica para definir etiologia e excluir neoplasia."},{"number":62,"area":"Cirurgia Geral","stem":"Paciente submetido a gastrectomia apresenta, logo após refeições ricas em carboidratos, cólicas, diarreia, taquicardia, rubor e tontura. O quadro é:","options":{"A":"acalasia","B":"síndrome de Ogilvie","C":"isquemia mesentérica crônica","D":"síndrome de dumping precoce","E":"síndrome de dumping tardio exclusivamente hipoglicêmico"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Dumping precoce ocorre 10–30 minutos após refeição pela rápida passagem de conteúdo hiperosmolar ao intestino, causando sintomas gastrointestinais e vasomotores."},{"number":63,"area":"Cirurgia Geral","stem":"Após gastrectomia Billroth II, paciente apresenta dor pós-prandial, vômitos biliosos e dilatação da alça aferente. A hipótese é:","options":{"A":"divertículo de Zenker","B":"hérnia de Richter","C":"síndrome de Mallory-Weiss","D":"síndrome da alça aferente","E":"volvo de ceco"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Síndrome da alça aferente decorre de obstrução da alça que conduz secreções biliares/pancreáticas ao estômago ou à anastomose, podendo ser aguda ou crônica."},{"number":64,"area":"Cirurgia Geral","stem":"Paciente com doença de Crohn apresenta estenose fibrosa curta de intestino delgado, sem fístula ou abscesso, e grande extensão de intestino previamente ressecida. Uma opção que preserva comprimento intestinal é:","options":{"A":"esplenectomia","B":"gastrectomia","C":"colectomia total obrigatória","D":"estrituroplastia","E":"hepatectomia"},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Estrituroplastia pode tratar estenoses selecionadas de Crohn preservando intestino e reduzindo risco de síndrome do intestino curto. Cirurgia não cura a doença de Crohn."},{"number":65,"area":"Cirurgia Geral","stem":"Criança com sangramento intestinal indolor e cintilografia positiva apresenta divertículo de Meckel. Um princípio clássico é que ele resulta da persistência do:","options":{"A":"úraco exclusivamente","B":"ducto colédoco","C":"ducto de Wharton","D":"ducto tireoglosso","E":"ducto onfalomesentérico"},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Divertículo de Meckel é remanescente do ducto vitelino/onfalomesentérico e pode conter mucosa ectópica gástrica, causando sangramento."},{"number":66,"area":"Cirurgia Geral","stem":"Adulto apresenta invaginação intestinal identificada por TC. Diferentemente da maioria dos casos pediátricos, em adultos é importante considerar:","options":{"A":"tratamento obrigatório com neostigmina","B":"que a condição só ocorre no cólon","C":"ausência completa de risco de tumor","D":"lesão estrutural como ponto de invaginação, frequentemente exigindo abordagem cirúrgica","E":"etiologia sempre idiopática e tratamento apenas por enema"},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Invaginação no adulto é rara e frequentemente tem um ponto de tração estrutural, inclusive neoplasias; por isso a abordagem difere da pediátrica e costuma ser cirúrgica."},{"number":67,"area":"Cirurgia Geral","stem":"Pólipo colorretal pediculado é ressecado endoscopicamente e contém adenocarcinoma superficial. Qual fator favorece considerar ressecção endoscópica curativa?","options":{"A":"tumor pouco diferenciado","B":"invasão linfovascular","C":"margem livre adequada, boa diferenciação e ausência de invasão linfovascular","D":"margem comprometida","E":"invasão profunda com alto risco nodal"},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"Em câncer T1 de pólipo, características histológicas de baixo risco e ressecção completa podem permitir tratamento endoscópico; fatores de alto risco indicam considerar ressecção oncológica segmentar."},{"number":68,"area":"Cirurgia Geral","stem":"Paciente com câncer obstrutivo de cólon esquerdo, sem perfuração, em centro experiente, pode ser avaliado para prótese autoexpansível com objetivo de:","options":{"A":"tratar definitivamente todo câncer sem cirurgia","B":"induzir perfuração para facilitar ressecção","C":"descompressão como ponte para cirurgia em casos selecionados","D":"evitar qualquer biópsia","E":"substituir estadiamento"},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"Stent colônico pode ser usado como ponte para cirurgia ou paliativamente em pacientes selecionados, considerando risco de perfuração e expertise local."},{"number":69,"area":"Cirurgia Geral","stem":"Em adenocarcinoma de reto, o exame de imagem fundamental para estadiamento local e avaliação da fáscia mesorretal é:","options":{"A":"TC de crânio isolada","B":"ressonância magnética de pelve","C":"radiografia de mão","D":"cintilografia renal","E":"ultrassom de tireoide"},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"RM pélvica de alta qualidade avalia profundidade tumoral, linfonodos e margem circunferencial/fáscia mesorretal, guiando terapia neoadjuvante e cirurgia."},{"number":70,"area":"Cirurgia Geral","stem":"No 5º dia após colectomia, paciente desenvolve taquicardia persistente, dor abdominal crescente, íleo, febre e elevação de marcadores inflamatórios. Deve-se suspeitar de:","options":{"A":"deiscência/anastomotic leak até prova em contrário","B":"rinite alérgica","C":"otosclerose","D":"evolução normal obrigatória","E":"apenas ansiedade"},"answer":"A","topic":"Coloproctologia e Intestino","explanation":"Taquicardia persistente e deterioração clínica no pós-operatório colorretal podem ser os primeiros sinais de fístula anastomótica e justificam investigação imediata, frequentemente com TC."},{"number":71,"area":"Cirurgia Geral","stem":"Paciente com colite por Clostridioides difficile evolui com choque, megacólon tóxico, lactato elevado e falha de tratamento clínico. A opção cirúrgica clássica é:","options":{"A":"hemorroidectomia","B":"colectomia subtotal com ileostomia terminal, conforme avaliação clínica","C":"herniorrafia","D":"gastrectomia vertical","E":"apendicectomia"},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"Colite fulminante com choque/megacólon pode exigir cirurgia emergencial. Colectomia subtotal com ileostomia é operação padrão clássica, embora estratégias alternativas existam em centros selecionados."},{"number":72,"area":"Cirurgia Geral","stem":"Idoso com aterosclerose apresenta dor abdominal e hematoquezia após episódio de hipotensão. Colonoscopia mostra inflamação segmentar em região de watershed, sem necrose. A hipótese é:","options":{"A":"apendicite","B":"colite isquêmica","C":"retocolite ulcerativa obrigatória","D":"síndrome de dumping","E":"doença de Hirschsprung"},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"Colite isquêmica afeta frequentemente regiões de perfusão limítrofe, como flexura esplênica e retossigmoide. Casos sem gangrena/peritonite são tratados principalmente com suporte."},{"number":73,"area":"Cirurgia Geral","stem":"Paciente com pancreatite aguda biliar leve melhora clinicamente durante a internação. Para reduzir recorrência, a colecistectomia deve, em geral, ser realizada:","options":{"A":"após 2 anos","B":"somente se houver pseudocisto","C":"nunca, pois pancreatite contraindica colecistectomia","D":"na mesma internação, após melhora clínica, se não houver contraindicação","E":"antes de qualquer estabilização nas primeiras 30 minutos"},"answer":"D","topic":"Hepatobiliopancreática","explanation":"Na pancreatite biliar leve, colecistectomia na mesma internação reduz eventos biliares recorrentes. Em pancreatite grave com coleções, o momento é individualizado."},{"number":74,"area":"Cirurgia Geral","stem":"Ultrassom mostra pólipo vesicular de 12 mm em paciente clinicamente apto. Uma conduta usual é:","options":{"A":"CPRE obrigatória","B":"esplenectomia","C":"nenhum seguimento necessário","D":"gastrectomia","E":"colecistectomia devido ao maior risco de neoplasia em pólipos ≥10 mm"},"answer":"E","topic":"Hepatobiliopancreática","explanation":"Pólipos de vesícula ≥10 mm têm risco maior de malignidade e geralmente são indicação de colecistectomia se o paciente for operável."},{"number":75,"area":"Cirurgia Geral","stem":"Paciente com cálculo impactado no infundíbulo vesicular apresenta icterícia por compressão extrínseca do ducto hepático comum. O diagnóstico é:","options":{"A":"síndrome de Zollinger-Ellison","B":"síndrome de Mallory-Weiss","C":"síndrome de Mirizzi","D":"síndrome de Ogilvie","E":"síndrome de Budd-Chiari"},"answer":"C","topic":"Hepatobiliopancreática","explanation":"Mirizzi decorre de cálculo impactado no colo/Hartmann comprimindo ducto hepático comum, podendo causar inflamação e fístulas biliares em formas avançadas."},{"number":76,"area":"Cirurgia Geral","stem":"Após colecistectomia laparoscópica, paciente apresenta saída persistente de bile por dreno, sem instabilidade. A investigação deve considerar:","options":{"A":"apenas retirar o dreno e dar alta","B":"presumir colite","C":"fazer colectomia imediata","D":"lesão biliar ou vazamento do coto cístico, usando imagem e CPRE/MRCP conforme suspeita anatômica","E":"diagnosticar pancreatite sem exames"},"answer":"D","topic":"Hepatobiliopancreática","explanation":"Vazamento biliar pós-colecistectomia exige definir anatomia e gravidade. CPRE é útil para vazamentos menores/coto cístico, enquanto lesões maiores demandam avaliação hepatobiliar especializada."},{"number":77,"area":"Cirurgia Geral","stem":"Paciente com pancreatite necrosante desenvolve necrose infectada após várias semanas, mantendo-se estável. A estratégia moderna preferencial é:","options":{"A":"pancreatectomia total universal","B":"abordagem step-up, com drenagem e necrosectomia minimamente invasiva quando necessária, idealmente após organização da coleção","C":"antibiótico profilático sem evidência de infecção","D":"nenhuma intervenção mesmo em sepse persistente","E":"laparotomia aberta imediata no primeiro dia para todos"},"answer":"B","topic":"Hepatobiliopancreática","explanation":"Na necrose infectada, adiar intervenção quando possível permite encapsulamento; abordagem step-up inicia com drenagem e escala para necrosectomia se necessário, reduzindo morbidade."},{"number":78,"area":"Cirurgia Geral","stem":"Paciente com pancreatite crônica alcoólica apresenta dor refratária e ducto pancreático principal muito dilatado com múltiplos cálculos. Uma operação de drenagem clássica é:","options":{"A":"fundoplicatura de Nissen","B":"procedimento de Sistrunk","C":"Lichtenstein","D":"colectomia de Hartmann","E":"pancreatojejunostomia longitudinal de Partington-Rochelle"},"answer":"E","topic":"Hepatobiliopancreática","explanation":"Em pancreatite crônica com ducto principal dilatado, a pancreatojejunostomia longitudinal pode descomprimir o ducto e melhorar dor em pacientes selecionados."},{"number":79,"area":"Cirurgia Geral","stem":"Paciente hemodinamicamente estável após trauma abdominal fechado apresenta lesão esplênica de alto grau com blush arterial na TC, sem peritonite. Em centro com recursos, uma opção para preservar o baço é:","options":{"A":"nenhuma monitorização","B":"lavagem peritoneal isolada","C":"embolização angiográfica associada ao manejo não operatório","D":"alta imediata","E":"esplenectomia obrigatória em toda lesão de alto grau"},"answer":"C","topic":"Trauma e Emergências","explanation":"Estabilidade hemodinâmica é central para manejo não operatório do trauma esplênico. Blush vascular e lesões de alto grau podem se beneficiar de angioembolização em centros apropriados."},{"number":80,"area":"Cirurgia Geral","stem":"Paciente estável com trauma hepático fechado e TC mostrando lesão hepática sem extravasamento ativo ou outras indicações cirúrgicas deve ser tratado, em geral, com:","options":{"A":"hepatectomia total","B":"laparotomia obrigatória para toda laceração hepática","C":"alta sem observação","D":"CPRE imediata em todos","E":"manejo não operatório com monitorização adequada"},"answer":"E","topic":"Trauma e Emergências","explanation":"A maioria das lesões hepáticas em pacientes estáveis é tratada não operatoriamente. Instabilidade, peritonite ou complicações específicas indicam intervenção."}]},"simulado_ccp_03":{"id":"simulado_ccp_03","label":"Simulado 3 — ENARE CCP","subtitle":"Nível ENARE — intermediário/avançado · 80 questões","order":"1–40 Otorrinolaringologia · 41–80 Cirurgia Geral","localKey":"simulado_ccp_03_v1","sourceNote":"Itens autorais ou fortemente adaptados, calibrados pela matriz das provas ENARE Cabeça e Pescoço 2024/2025 e 2025/2026, pelo acervo ENARE 2023/2024 e por provas de Otorrinolaringologia R4 e Cirurgia Geral R+; não são transcrições literais de provas externas.","questions":[{"number":1,"area":"Otorrinolaringologia","stem":"Paciente com vertigem recorrente apresenta perda auditiva neurossensorial flutuante predominantemente em baixas frequências no ouvido afetado. Esse padrão audiométrico, associado a zumbido e plenitude, reforça o diagnóstico de:","options":{"A":"doença de Ménière","B":"migrânea sem sintomas vestibulares","C":"PPPD","D":"neurite vestibular","E":"VPPB"},"answer":"A","topic":"Vestibulologia","explanation":"Nas fases iniciais da doença de Ménière, a perda neurossensorial costuma ser flutuante e mais acentuada em baixas frequências, associada a sintomas aural e vertigem episódica."},{"number":2,"area":"Otorrinolaringologia","stem":"Idoso apresenta instabilidade crônica, pior no escuro e ao caminhar em terreno irregular, além de oscilopsia ao movimentar a cabeça. Head impulse test é bilateralmente alterado. A hipótese é:","options":{"A":"VPPB unilateral","B":"doença de Ménière monossintomática","C":"hipofunção vestibular bilateral","D":"otosclerose","E":"rinite vasomotora"},"answer":"C","topic":"Vestibulologia","explanation":"Hipofunção vestibular bilateral reduz o reflexo vestíbulo-ocular, causando oscilopsia e desequilíbrio que piora quando pistas visuais/proprioceptivas são reduzidas."},{"number":3,"area":"Otorrinolaringologia","stem":"Paciente com colesteatoma crônico refere vertigem ao pressionar o trago. TC mostra erosão do canal semicircular lateral. O achado sugere:","options":{"A":"neurite vestibular","B":"otosclerose","C":"VPPB primária","D":"fístula labiríntica","E":"PPPD"},"answer":"D","topic":"Vestibulologia","explanation":"Colesteatoma pode erodir a cápsula ótica, especialmente o canal lateral, produzindo fístula labiríntica e vertigem induzida por pressão."},{"number":4,"area":"Otorrinolaringologia","stem":"Paciente com vertigem posicional apresenta nistagmo vertical inferior persistente, sem latência ou fatigabilidade e acompanhado de outros sinais neurológicos. A conduta mais adequada é:","options":{"A":"diagnosticar Ménière","B":"realizar Epley repetidamente como única medida","C":"indicar estapedotomia","D":"prescrever antibiótico","E":"investigar causa central em vez de assumir VPPB"},"answer":"E","topic":"Vestibulologia","explanation":"Nistagmo posicional atípico, especialmente vertical puro persistente, sem fatigabilidade ou com sinais neurológicos, exige investigação de etiologia central."},{"number":5,"area":"Otorrinolaringologia","stem":"Paciente apresenta otite média crônica e dor retro-orbitária intensa, otorreia persistente e paralisia do VI nervo craniano. Essa tríade é compatível com:","options":{"A":"síndrome de Gradenigo por petrosite apical","B":"síndrome de Horner","C":"síndrome de Frey","D":"síndrome de Ramsay Hunt","E":"síndrome de Eagle"},"answer":"A","topic":"Otologia e Audiologia","explanation":"Petrosite apical pode causar tríade de Gradenigo: otorreia/otite, dor na distribuição trigeminal e paralisia do abducente."},{"number":6,"area":"Otorrinolaringologia","stem":"Criança com mastoidite aguda evolui com cefaleia, papiledema e dor cervical. Angio-TC mostra trombose do seio sigmoide. Trata-se de:","options":{"A":"otosclerose","B":"trombose de seio venoso como complicação intracraniana da otomastoidite","C":"fístula branquial","D":"presbiacusia","E":"VPPB"},"answer":"B","topic":"Otologia e Audiologia","explanation":"Otomastoidite pode complicar com trombose do seio lateral/sigmoide, meningite e abscessos intracranianos. Requer antibiótico IV e tratamento otológico/vascular individualizado."},{"number":7,"area":"Otorrinolaringologia","stem":"Em um paciente com perda auditiva, o teste de Rinne é negativo à direita e Weber lateraliza para a direita. Esse conjunto sugere:","options":{"A":"perda neurossensorial direita","B":"surdez central pura","C":"perda neurossensorial esquerda obrigatoriamente","D":"audição normal bilateral","E":"perda auditiva condutiva à direita"},"answer":"E","topic":"Otologia e Audiologia","explanation":"Na perda condutiva, Rinne pode ser negativo no lado afetado e Weber lateraliza para esse lado; na neurossensorial, Weber tende a lateralizar para o ouvido melhor."},{"number":8,"area":"Otorrinolaringologia","stem":"Em recém-nascidos, emissões otoacústicas avaliam principalmente:","options":{"A":"função vestibular central","B":"função do nervo facial","C":"integridade do córtex visual","D":"motilidade do estribo","E":"função das células ciliadas externas da cóclea"},"answer":"E","topic":"Otologia e Audiologia","explanation":"Emissões otoacústicas são sons gerados pela cóclea, especialmente pelas células ciliadas externas, e são usadas na triagem auditiva neonatal."},{"number":9,"area":"Otorrinolaringologia","stem":"Mergulhador apresenta otalgia e hipoacusia condutiva após dificuldade para equalizar pressão durante a descida. Otoscopia mostra membrana timpânica hiperemiada e retraída, sem perfuração. A fisiopatologia é:","options":{"A":"doença de Ménière","B":"barotrauma de ouvido médio por falha de equalização da tuba auditiva","C":"otosclerose aguda","D":"colesteatoma congênito","E":"neurite vestibular"},"answer":"B","topic":"Otologia e Audiologia","explanation":"Barotrauma ocorre quando a pressão do ouvido médio não acompanha a pressão ambiental, geralmente por disfunção tubária durante mergulho ou voo."},{"number":10,"area":"Otorrinolaringologia","stem":"Paciente apresenta otorreia crônica através de perfuração timpânica central, sem bolsa de retração ou detritos de queratina. Em relação à otite média crônica, esse padrão é mais compatível com:","options":{"A":"otosclerose","B":"presbiacusia","C":"schwannoma vestibular","D":"doença mucosa sem colesteatoma","E":"VPPB"},"answer":"D","topic":"Otologia e Audiologia","explanation":"Perfuração central com otorreia crônica, na ausência de colesteatoma, sugere forma mucosa de otite média crônica. Colesteatoma associa-se a queratina e doença óssea mais destrutiva."},{"number":11,"area":"Otorrinolaringologia","stem":"Paciente com interrupção traumática da cadeia ossicular após trauma craniano apresenta membrana timpânica íntegra e perda condutiva persistente. Um achado esperado é:","options":{"A":"audiometria normal obrigatória","B":"perda neurossensorial pura sem gap","C":"ausência de qualquer alteração timpanométrica possível","D":"perda apenas de discriminação central","E":"grande gap aéreo-ósseo com limiares ósseos relativamente preservados"},"answer":"E","topic":"Otologia e Audiologia","explanation":"Descontinuidade ossicular produz perda condutiva significativa. Timpanometria pode mostrar complacência aumentada em alguns casos."},{"number":12,"area":"Otorrinolaringologia","stem":"Paciente com perda auditiva neurossensorial unilateral apresenta pior discriminação vocal do que seria esperado pelos limiares tonais. Esse achado reforça necessidade de excluir:","options":{"A":"lesão retrococlear","B":"cerume","C":"otite externa simples","D":"rinite alérgica","E":"perfuração timpânica"},"answer":"A","topic":"Otologia e Audiologia","explanation":"Discriminação desproporcionalmente ruim, assimetria auditiva e zumbido unilateral são sinais que podem sugerir patologia retrococlear e indicar RM."},{"number":13,"area":"Otorrinolaringologia","stem":"Paciente com rinossinusite crônica com pólipos realizou corticoide intranasal, lavagens e tratamento adequado de comorbidades, mas permanece muito sintomático com doença objetiva extensa. Uma próxima etapa possível é:","options":{"A":"laringectomia","B":"cirurgia endoscópica dos seios paranasais em paciente adequadamente selecionado","C":"antibiótico intravenoso vitalício","D":"radioterapia","E":"nenhum tratamento adicional é possível"},"answer":"B","topic":"Rinologia e Rinossinusites","explanation":"Cirurgia endoscópica é indicada quando doença crônica permanece sintomática apesar de tratamento clínico apropriado e há correlação clínica/endoscópica/tomográfica."},{"number":14,"area":"Otorrinolaringologia","stem":"Paciente asmático e atópico apresenta pólipos, mucina espessa eosinofílica e opacificação heterogênea hiperdensa de múltiplos seios, com expansão óssea sem invasão tecidual. A hipótese é:","options":{"A":"rinossinusite fúngica alérgica","B":"mucormicose invasiva aguda","C":"rinite medicamentosa","D":"nasoangiofibroma","E":"bola fúngica isolada"},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"Rinossinusite fúngica alérgica ocorre em pacientes imunocompetentes atópicos e se associa a pólipos, mucina eosinofílica e conteúdo hiperdenso heterogêneo, podendo expandir os seios."},{"number":15,"area":"Otorrinolaringologia","stem":"Paciente com edema palpebral após sinusite mantém acuidade visual normal, sem dor à movimentação ocular, sem proptose e com motilidade ocular preservada. O quadro é mais compatível com:","options":{"A":"abscesso subperiosteal","B":"celulite pré-septal","C":"trombose de seio cavernoso","D":"celulite orbitária","E":"neurite óptica"},"answer":"B","topic":"Rinologia e Rinossinusites","explanation":"Celulite pré-septal restringe-se anteriormente ao septo orbital. Dor ao movimento, oftalmoplegia, proptose ou comprometimento visual sugerem acometimento pós-septal/orbitário."},{"number":16,"area":"Otorrinolaringologia","stem":"Paciente com sinusite esfenoidal evolui com febre, cefaleia, proptose bilateral, quemose e paresia de múltiplos nervos oculomotores. Deve-se suspeitar de:","options":{"A":"cisto tireoglosso","B":"VPPB","C":"rinite alérgica","D":"trombose do seio cavernoso","E":"otosclerose"},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"Trombose de seio cavernoso pode complicar infecções faciais/sinusais e causa sinais orbitários bilaterais e déficits de III, IV, V1/V2 e VI nervos cranianos."},{"number":17,"area":"Otorrinolaringologia","stem":"Paciente apresenta fístula liquórica nasal pós-trauma confirmada por beta-2 transferrina. Persistência do vazamento e defeito de base anterior bem localizado tornam apropriado considerar:","options":{"A":"tonsilectomia","B":"apenas antibiótico profilático para sempre","C":"reparo endoscópico endonasal do defeito em casos selecionados","D":"estapedotomia","E":"septoplastia isolada sem abordar o defeito"},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Fístulas persistentes de base anterior são frequentemente reparadas por via endoscópica endonasal, com alta taxa de sucesso quando o defeito é bem localizado."},{"number":18,"area":"Otorrinolaringologia","stem":"Em epistaxe posterior grave que persiste apesar de medidas iniciais e tamponamento, uma opção cirúrgica eficaz é:","options":{"A":"colectomia","B":"ligadura de artéria radial","C":"tireoidectomia","D":"ligadura endoscópica da artéria esfenopalatina","E":"mastoidectomia"},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"A artéria esfenopalatina é principal fonte de muitas epistaxes posteriores. Ligadura endoscópica é opção eficaz quando manejo conservador falha."},{"number":19,"area":"Otorrinolaringologia","stem":"Paciente com desvio septal importante apresenta obstrução nasal unilateral persistente apesar do tratamento de rinite concomitante. A principal indicação para septoplastia é:","options":{"A":"rinite alérgica isolada sem desvio","B":"obstrução nasal sintomática atribuível ao desvio, após avaliação clínica adequada","C":"VPPB","D":"qualquer desvio radiológico assintomático","E":"zumbido bilateral"},"answer":"B","topic":"Rinologia e Rinossinusites","explanation":"Septoplastia é cirurgia funcional indicada quando deformidade septal contribui de forma relevante para obstrução ou outras indicações específicas; desvio assintomático não exige cirurgia."},{"number":20,"area":"Otorrinolaringologia","stem":"Lactente apresenta estridor inspiratório desde as primeiras semanas, pior em decúbito dorsal e durante alimentação, com melhora em posição prona. A laringoscopia mostra supraglote redundante e colapso inspiratório. O diagnóstico é:","options":{"A":"laringomalácia","B":"papilomatose","C":"epiglotite","D":"paralisia bilateral de pregas vocais obrigatória","E":"croup"},"answer":"A","topic":"Craniofacial e Pediatria","explanation":"Laringomalácia é a causa mais comum de estridor congênito e se deve ao colapso supraglótico dinâmico. A maioria é leve e autolimitada; casos graves podem requerer supraglotoplastia."},{"number":21,"area":"Otorrinolaringologia","stem":"Criança com laringomalácia apresenta apneias, dificuldade alimentar, falha de crescimento e retrações intensas. A intervenção cirúrgica mais frequentemente considerada é:","options":{"A":"supraglotoplastia","B":"septoplastia","C":"miringoplastia","D":"estapedotomia","E":"parotidectomia"},"answer":"A","topic":"Sono e Via Aérea Superior","explanation":"Laringomalácia grave com comprometimento respiratório ou alimentar pode ser tratada com supraglotoplastia, após avaliação de comorbidades e da via aérea."},{"number":22,"area":"Otorrinolaringologia","stem":"Paciente pós-tireoidectomia apresenta estridor intenso e laringoscopia com ambas as pregas vocais imóveis próximas à linha média. A prioridade é:","options":{"A":"realizar Epley","B":"usar aparelho auditivo","C":"prescrever apenas antiácido","D":"garantir a via aérea, considerando intubação ou traqueostomia conforme gravidade","E":"observar em casa"},"answer":"D","topic":"Sono e Via Aérea Superior","explanation":"Paralisia bilateral de pregas vocais pode comprometer gravemente a via aérea. Proteção da via aérea precede intervenções definitivas para ampliar a glote."},{"number":23,"area":"Otorrinolaringologia","stem":"Após cirurgia de tireoide, cantor mantém mobilidade normal das pregas vocais, mas perde capacidade de atingir notas agudas e apresenta fadiga vocal. Deve-se suspeitar de lesão do:","options":{"A":"ramo externo do nervo laríngeo superior","B":"nervo laríngeo recorrente bilateral","C":"nervo hipoglosso","D":"nervo frênico","E":"nervo facial"},"answer":"A","topic":"Laringologia e Voz","explanation":"O ramo externo do nervo laríngeo superior inerva o cricotireóideo, responsável por tensionar as pregas vocais e elevar a frequência fundamental. Lesão afeta principalmente voz aguda/profissional."},{"number":24,"area":"Otorrinolaringologia","stem":"Paciente com intubação prolongada apresenta dispneia progressiva após extubação. Laringoscopia mostra estreitamento cicatricial abaixo das pregas vocais. O diagnóstico é:","options":{"A":"edema de Reinke","B":"VPPB","C":"estenose subglótica adquirida","D":"otosclerose","E":"rinite alérgica"},"answer":"C","topic":"Laringologia e Voz","explanation":"Trauma de intubação pode causar cicatrização subglótica e estenose. A gravidade é avaliada endoscopicamente e o tratamento varia de endoscópico a reconstrução aberta."},{"number":25,"area":"Otorrinolaringologia","stem":"Paciente imunossuprimido apresenta placas brancas removíveis à raspagem, deixando base eritematosa. O diagnóstico é:","options":{"A":"leucoplasia pilosa obrigatoriamente","B":"candidíase pseudomembranosa oral","C":"carcinoma espinocelular","D":"líquen plano reticular","E":"leucoplasia homogênea"},"answer":"B","topic":"Cavidade Oral e Faringologia","explanation":"Candidíase pseudomembranosa forma placas brancas removíveis, ao contrário de muitas leucoplasias e lesões queratóticas aderentes."},{"number":26,"area":"Otorrinolaringologia","stem":"Paciente apresenta placa branca aderente na mucosa oral, não removível à raspagem, sem causa irritativa óbvia. A conduta adequada é:","options":{"A":"avaliar fatores de risco e indicar biópsia conforme características para excluir displasia ou câncer","B":"aspirar com agulha fina como único exame","C":"tratar apenas com antibiótico","D":"não investigar nunca","E":"considerar candidíase obrigatória"},"answer":"A","topic":"Cavidade Oral e Faringologia","explanation":"Leucoplasia é diagnóstico clínico de exclusão e pode conter displasia. Lesões persistentes ou suspeitas requerem biópsia e manejo de fatores de risco."},{"number":27,"area":"Otorrinolaringologia","stem":"Adulto jovem não tabagista apresenta carcinoma de tonsila associado a HPV e linfonodo cervical cístico. Um marcador imuno-histoquímico usado como substituto da associação ao HPV em carcinoma orofaríngeo é:","options":{"A":"calcitonina","B":"CD20 exclusivamente","C":"CD117","D":"p16","E":"desmina"},"answer":"D","topic":"Cabeça e Pescoço / Salivar","explanation":"Expressão difusa e forte de p16 é utilizada como marcador substituto de carcinoma orofaríngeo HPV-mediado no contexto apropriado e tem implicações prognósticas/estadiamento."},{"number":28,"area":"Otorrinolaringologia","stem":"Tumor maligno de glândula salivar apresenta tendência marcante à invasão perineural, dor e recorrência tardia. O diagnóstico mais típico é:","options":{"A":"oncocitoma","B":"adenoma pleomórfico","C":"carcinoma adenoide cístico","D":"tumor de Warthin","E":"sialadenose"},"answer":"C","topic":"Glândulas Salivares","explanation":"Carcinoma adenoide cístico é conhecido pela invasão perineural e possibilidade de recorrência/metástases tardias, mesmo após controle local."},{"number":29,"area":"Otorrinolaringologia","stem":"Entre as neoplasias malignas de glândulas salivares, uma das mais frequentes e com amplo espectro de grau histológico é:","options":{"A":"tumor de Warthin","B":"adenoma pleomórfico","C":"adenoma canalicular","D":"carcinoma mucoepidermoide","E":"sialolitíase"},"answer":"D","topic":"Glândulas Salivares","explanation":"Carcinoma mucoepidermoide é um dos cânceres salivares mais comuns e varia de baixo a alto grau, influenciando prognóstico e tratamento."},{"number":30,"area":"Otorrinolaringologia","stem":"Paciente com síndrome de Sjögren apresenta xerostomia e xeroftalmia. Uma complicação neoplásica para a qual há risco aumentado é:","options":{"A":"melanoma uveal exclusivamente","B":"linfoma não Hodgkin, especialmente de linhagem B/MALT","C":"carcinoma hepatocelular","D":"osteossarcoma mandibular obrigatório","E":"glioblastoma"},"answer":"B","topic":"Glândulas Salivares","explanation":"Sjögren associa-se a risco aumentado de linfoma de células B, frequentemente do tipo MALT, devendo-se investigar aumento glandular persistente, linfonodomegalia e sinais sistêmicos."},{"number":31,"area":"Otorrinolaringologia","stem":"Paciente com cálculo distal do ducto submandibular, pequeno e palpável, mantém sintomas apesar de hidratação e massagem. Uma técnica minimamente invasiva que pode ser utilizada é:","options":{"A":"mas
