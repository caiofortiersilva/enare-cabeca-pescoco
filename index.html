e orientar a investigação?","options":{"A":"A perda ponderal confirma necessariamente acalasia tipo III.","B":"O achado indica apenas espasmo esofágico distal.","C":"Acalasia nunca se associa a câncer e dispensa biópsia.","D":"A dificuldade de transposição prova doença de Chagas sem necessidade de imagem.","E":"Pseudoacalasia por neoplasia da junção esofagogástrica deve ser excluída."},"answer":"E","topic":"Esôfago e Estômago","explanation":"Idade mais avançada, perda ponderal importante, evolução rápida e resistência à passagem do aparelho pela junção levantam suspeita de pseudoacalasia, frequentemente neoplásica.","difficulty":"very_hard","fragility":true},{"number":43,"area":"Cirurgia Geral","stem":"Paciente com úlcera gástrica perfurada de 0,8 cm em antro é operado nas primeiras horas, está hemodinamicamente estável e não há massa evidente. Além do fechamento da perfuração, qual medida é importante por se tratar de úlcera gástrica?","options":{"A":"Fazer colectomia direita profilática.","B":"Não investigar malignidade porque perfuração exclui câncer.","C":"Obter amostra/biópsia adequada da lesão ou garantir avaliação endoscópica posterior para excluir malignidade.","D":"Realizar vagotomia troncular obrigatória em todos os casos na era atual.","E":"Realizar gastrectomia total obrigatória em toda perfuração gástrica."},"answer":"C","topic":"Esôfago e Estômago","explanation":"Úlcera gástrica pode representar neoplasia. Em perfuração, deve-se obter diagnóstico histológico quando seguro ou programar avaliação endoscópica adequada após recuperação.","difficulty":"very_hard","fragility":true},{"number":44,"area":"Cirurgia Geral","stem":"Paciente com hemorragia digestiva alta por úlcera duodenal tem vaso visível não sangrante na endoscopia. Qual interpretação é mais adequada?","options":{"A":"É estigma de baixo risco e permite alta imediata sem tratamento.","B":"Terapia endoscópica é contraindicada porque pode provocar sangramento.","C":"É equivalente a base limpa da úlcera.","D":"É estigma de alto risco de ressangramento e merece terapia endoscópica, além de supressão ácida adequada.","E":"A única conduta possível é cirurgia de urgência."},"answer":"D","topic":"Esôfago e Estômago","explanation":"Vaso visível não sangrante é Forrest IIa, associado a risco relevante de ressangramento; terapia endoscópica é indicada.","difficulty":"very_hard","fragility":false},{"number":45,"area":"Cirurgia Geral","stem":"Após fundoplicatura para doença do refluxo, paciente apresenta disfagia persistente importante. Endoscopia não mostra estenose luminal evidente. Qual exame ajuda particularmente a avaliar distúrbio motor ou uma barreira funcional na junção esofagogástrica?","options":{"A":"Colonoscopia.","B":"CPRE.","C":"Ultrassonografia de tireoide.","D":"Manometria esofágica de alta resolução.","E":"Cintilografia óssea."},"answer":"D","topic":"Esôfago e Estômago","explanation":"Na disfagia pós-fundoplicatura, endoscopia e estudo contrastado avaliam anatomia; manometria é útil para motilidade e obstrução funcional da junção.","difficulty":"very_hard","fragility":false},{"number":46,"area":"Cirurgia Geral","stem":"Paciente com câncer gástrico proximal difuso apresenta linitis plastica na endoscopia e TC sem metástases. Por que uma laparoscopia de estadiamento pode ser particularmente útil antes de operação com intenção curativa?","options":{"A":"Porque substitui completamente a endoscopia e a biópsia.","B":"Porque define sozinho o estágio T microscópico da parede gástrica.","C":"Porque todo câncer difuso é obrigatoriamente M1.","D":"Porque pode detectar doença peritoneal oculta e permitir citologia, achados que mudam a intenção terapêutica.","E":"Porque permite excluir doença linfonodal sem linfadenectomia."},"answer":"D","topic":"Esôfago e Estômago","explanation":"Tumores gástricos localmente avançados/difusos têm risco de disseminação peritoneal não evidente na TC. Laparoscopia pode evitar laparotomia não terapêutica.","difficulty":"very_hard","fragility":true},{"number":47,"area":"Cirurgia Geral","stem":"Paciente de 61 anos com câncer de reto baixo apresenta RM com tumor cT3, fáscia mesorretal ameaçada e linfonodos suspeitos, sem metástases. Qual conceito é central para o planejamento?","options":{"A":"Apenas a distância da borda anal importa; a fáscia mesorretal não altera conduta.","B":"A margem circunferencial e a qualidade da excisão total do mesorreto são determinantes; terapia neoadjuvante/total pode ser indicada antes da cirurgia.","C":"Ressecção local transanal é adequada para qualquer cT3.","D":"A cirurgia deve remover somente o tumor, preservando o mesorreto.","E":"Linfonodos suspeitos excluem possibilidade de tratamento curativo."},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"RM de reto avalia relação com a fáscia mesorretal e outros fatores de risco. A excisão total do mesorreto e estratégias neoadjuvantes são pilares em doença localmente avançada.","difficulty":"very_hard","fragility":true},{"number":48,"area":"Cirurgia Geral","stem":"Em paciente com câncer de cólon e imunohistoquímica mostrando perda isolada de MSH6, qual interpretação é mais adequada?","options":{"A":"Exclui síndrome de Lynch.","B":"Perda isolada de MSH6 é padrão típico de hipermetilação de MLH1 e dispensa investigação hereditária.","C":"Confirma polipose adenomatosa familiar por APC.","D":"É achado sem relevância oncológica.","E":"O achado sugere deficiência do sistema de reparo de mismatch e deve motivar avaliação para síndrome de Lynch, especialmente conforme contexto clínico e germinativo."},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Perda de MSH6 pode refletir alteração de MSH6 e é um padrão que merece investigação de Lynch; ao contrário de perda MLH1/PMS2, não é o padrão clássico de hipermetilação esporádica de MLH1.","difficulty":"very_hard","fragility":true},{"number":49,"area":"Cirurgia Geral","stem":"Paciente com retocolite ulcerativa extensa há muitos anos apresenta displasia de alto grau multifocal confirmada em revisão patológica. Qual princípio terapêutico é mais apropriado?","options":{"A":"Usar antibiótico por 6 semanas para reverter a displasia.","B":"Apenas repetir colonoscopia em 10 anos.","C":"Colectomia/proctocolectomia deve ser fortemente considerada devido ao alto risco de neoplasia sincrônica ou progressão.","D":"Displasia multifocal de alto grau não aumenta risco de câncer.","E":"Ressecar endoscopicamente uma única área e ignorar os demais focos."},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"Displasia de alto grau multifocal em colite extensa de longa duração é cenário de alto risco oncológico, geralmente indicação para tratamento cirúrgico.","difficulty":"very_hard","fragility":false},{"number":50,"area":"Cirurgia Geral","stem":"Homem de 72 anos com fibrilação atrial apresenta dor abdominal súbita intensa, exame inicialmente pouco exuberante e lactato discretamente elevado. Angio-TC mostra êmbolo na artéria mesentérica superior, sem sinais de necrose transmural. Qual princípio é correto?","options":{"A":"Antibiótico oral e retorno em 48 horas são suficientes.","B":"Revascularização urgente e avaliação da viabilidade intestinal são prioritárias; atraso aumenta risco de necrose.","C":"Colectomia total deve preceder qualquer tentativa de revascularização.","D":"Lactato normal ou pouco elevado excluiria a doença.","E":"A ausência de peritonite exclui isquemia mesentérica."},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"Isquemia mesentérica aguda pode ter dor desproporcional e lactato inicial pouco alterado. Na oclusão arterial sem necrose estabelecida, restauração rápida do fluxo é crucial.","difficulty":"very_hard","fragility":true},{"number":51,"area":"Cirurgia Geral","stem":"Paciente com doença de Crohn ileocecal conhecida apresenta dor, febre e TC mostrando abscesso de 6 cm adjacente a íleo terminal, sem peritonite difusa. Qual estratégia inicial costuma ser mais apropriada?","options":{"A":"Observar sem antibióticos porque abscesso é manifestação inflamatória estéril.","B":"Iniciar corticoide em alta dose imediatamente sem controlar o abscesso.","C":"Tratar somente com mesalazina.","D":"Realizar colectomia total obrigatória.","E":"Antibióticos e drenagem percutânea quando factível, com cirurgia planejada conforme resposta e anatomia."},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Abscesso em Crohn exige controle de sepse. Drenagem percutânea e antibióticos podem permitir estabilização e cirurgia mais segura quando necessária.","difficulty":"very_hard","fragility":false},{"number":52,"area":"Cirurgia Geral","stem":"Paciente com apendicite perfurada é submetido a apendicectomia e controle de foco satisfatório. Evolui estável, afebril, com melhora clínica. Qual princípio moderno sobre duração de antibióticos é mais adequado?","options":{"A":"A cultura peritoneal obriga tratamento indefinido se crescer bactéria.","B":"O antibiótico deve ser mantido até o dreno parar de produzir qualquer líquido.","C":"Após controle de foco adequado, cursos curtos são geralmente suficientes; prolongar antibiótico até normalização de todos os exames não é obrigatório.","D":"Não se deve usar antibiótico em apendicite perfurada.","E":"Todo caso perfurado exige 21 dias de antibiótico."},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"Em infecção intra-abdominal complicada com controle de foco adequado, evidências apoiam cursos curtos, individualizados à evolução clínica.","difficulty":"very_hard","fragility":false},{"number":53,"area":"Cirurgia Geral","stem":"Paciente com tumor neuroendócrino de apêndice de 2,3 cm, localizado na base, com margem comprometida após apendicectomia. Qual conduta deve ser discutida?","options":{"A":"Colectomia total com proctectomia obrigatória.","B":"Nova apendicectomia simples, apesar de o apêndice já ter sido removido.","C":"Nenhum seguimento porque todo tumor neuroendócrino apendicular é benigno.","D":"Radioterapia pélvica exclusiva.","E":"Hemicolectomia direita oncológica, considerando tamanho, localização, margens e demais fatores de risco."},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Tumores >2 cm e/ou com fatores de risco como base e margem comprometida costumam justificar ampliação oncológica com hemicolectomia direita.","difficulty":"very_hard","fragility":true},{"number":54,"area":"Cirurgia Geral","stem":"Paciente com obstrução de cólon esquerdo por neoplasia, sem perfuração, está estável e em centro com equipe experiente. Em cenário selecionado, qual afirmação sobre stent colônico autoexpansível é correta?","options":{"A":"Substitui tratamento oncológico definitivo em todos os casos.","B":"É obrigatório em toda obstrução maligna.","C":"Deve ser usado mesmo na presença de perfuração livre.","D":"Pode ser usado como ponte para cirurgia em pacientes selecionados, permitindo descompressão e operação eletiva, mas a indicação depende de contexto e expertise.","E":"É contraindicado em qualquer câncer colorretal."},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Stent pode ser ponte para cirurgia ou paliação em situações selecionadas. Perfuração e ausência de expertise são limitações importantes.","difficulty":"very_hard","fragility":false},{"number":55,"area":"Cirurgia Geral","stem":"Paciente com pancreatite aguda biliar apresenta colangite concomitante. Qual afirmação é correta sobre CPRE?","options":{"A":"Colecistectomia substitui descompressão biliar na colangite aguda.","B":"CPRE deve ser evitada mesmo em colangite porque piora pancreatite.","C":"CPRE precoce é indicada para descompressão biliar no contexto de colangite/obstrução persistente, não apenas pela pancreatite em si.","D":"CPRE é obrigatória em toda pancreatite biliar leve sem colestase.","E":"A presença de lipase elevada contraindica endoscopia terapêutica."},"answer":"C","topic":"Hepatobiliopancreática","explanation":"Pancreatite biliar isolada não exige CPRE rotineira; colangite ou obstrução biliar persistente são indicações importantes.","difficulty":"very_hard","fragility":true},{"number":56,"area":"Cirurgia Geral","stem":"Durante colecistectomia laparoscópica, o cirurgião identifica estrutura tubular que acredita ser o ducto cístico, mas não consegue obter visão crítica de segurança devido a inflamação intensa no triângulo hepatocístico. Qual princípio reduz melhor o risco de lesão biliar?","options":{"A":"Evitar clampear ou seccionar estrutura não identificada e adotar estratégia de bailout, como colecistectomia subtotal, conforme anatomia e experiência.","B":"Realizar coledocotomia exploradora em todos os casos.","C":"Clampear a estrutura mais calibrosa porque provavelmente é o cístico.","D":"Converter para aberta e então seccionar imediatamente sem redefinir anatomia.","E":"Persistir na dissecção às cegas até encontrar a via biliar principal."},"answer":"A","topic":"Hepatobiliopancreática","explanation":"Quando a anatomia não pode ser definida com segurança, a prioridade é evitar lesão. Estratégias de bailout são preferíveis à dissecção perigosa.","difficulty":"very_hard","fragility":true},{"number":57,"area":"Cirurgia Geral","stem":"Paciente com pancreatite necrosante infectada, estável, com coleção organizada após cerca de 4 semanas. Qual estratégia contemporânea é preferida quando possível?","options":{"A":"Abordagem step-up: drenagem minimamente invasiva inicialmente, escalonando para necrosectomia se necessário.","B":"Laparotomia com necrosectomia aberta nas primeiras 24 horas em todos os casos.","C":"Punção única sem drenagem e alta imediata.","D":"Pancreatectomia total obrigatória.","E":"Antibiótico indefinido sem controle de foco."},"answer":"A","topic":"Hepatobiliopancreática","explanation":"Em necrose infectada organizada, atraso quando clinicamente possível e estratégia step-up reduzem morbidade em comparação à cirurgia aberta precoce.","difficulty":"very_hard","fragility":true},{"number":58,"area":"Cirurgia Geral","stem":"Paciente com cirrose Child-Pugh A apresenta carcinoma hepatocelular único de 2,5 cm, sem hipertensão portal clinicamente significativa e com função hepática preservada. Qual opção potencialmente curativa pode ser considerada?","options":{"A":"Transplante é a única opção possível para qualquer HCC em cirrose.","B":"Somente cuidados paliativos porque cirrose contraindica qualquer terapia curativa.","C":"Drenagem biliar percutânea como tratamento do tumor.","D":"Quimioterapia sistêmica obrigatória antes de qualquer tratamento local.","E":"Ressecção hepática, conforme avaliação de reserva funcional e anatomia."},"answer":"E","topic":"Hepatobiliopancreática","explanation":"Em HCC pequeno, função hepática preservada e ausência de hipertensão portal significativa, ressecção pode ser opção curativa; transplante e ablação são alternativas conforme caso.","difficulty":"very_hard","fragility":false},{"number":59,"area":"Cirurgia Geral","stem":"Paciente com icterícia indolor, vesícula palpável e massa em cabeça do pâncreas. Qual achado laboratorial isolado NÃO deve ser usado para diagnosticar adenocarcinoma pancreático sem confirmação por imagem/tecido?","options":{"A":"Elevação de CA 19-9, pois pode aumentar em colestase e outras condições.","B":"GGT elevada.","C":"Bilirrubina direta elevada em obstrução.","D":"Todas as alterações bioquímicas devem ser integradas ao contexto clínico e radiológico.","E":"Fosfatase alcalina elevada em colestase."},"answer":"A","topic":"Hepatobiliopancreática","explanation":"CA 19-9 é marcador útil para acompanhamento e contexto, mas não é diagnóstico isolado e pode elevar-se em obstrução biliar benigna.","difficulty":"very_hard","fragility":true},{"number":60,"area":"Cirurgia Geral","stem":"Paciente com pancreatite crônica apresenta ducto pancreático principal muito dilatado, múltiplos cálculos intraductais e dor incapacitante, sem massa inflamatória predominante na cabeça. Qual operação clássica de drenagem pode ser considerada?","options":{"A":"Procedimento de Whipple obrigatório.","B":"Gastrectomia vertical.","C":"Esplenectomia isolada.","D":"Pancreatojejunostomia longitudinal lateral (Partington-Rochelle).","E":"Colecistectomia subtotal."},"answer":"D","topic":"Hepatobiliopancreática","explanation":"Ducto pancreático principal dilatado com dor e sem massa cefálica dominante é cenário clássico para drenagem longitudinal tipo Partington-Rochelle.","difficulty":"very_hard","fragility":true},{"number":61,"area":"Cirurgia Geral","stem":"Em abordagem laparoscópica de hérnia inguinal, qual estrutura delimita medialmente o triângulo da dor e por que essa região exige cautela com fixação traumática?","options":{"A":"O trato iliopúbico não tem relação com essa anatomia.","B":"O ducto deferente forma o limite lateral e a região contém artéria femoral.","C":"Os vasos gonadais formam limite medial do triângulo da dor, que contém nervos importantes suscetíveis a lesão por grampos.","D":"Os vasos epigástricos delimitam inferiormente e a região contém nervo vago.","E":"O ligamento de Cooper delimita medialmente e a região contém ureter."},"answer":"C","topic":"Hérnias e Parede Abdominal","explanation":"No reparo posterior, o triângulo da dor fica lateral aos vasos gonadais e abaixo do trato iliopúbico, contendo nervos como cutâneo femoral lateral e ramo femoral do genitofemoral; fixação traumática deve ser evitada.","difficulty":"very_hard","fragility":true},{"number":62,"area":"Cirurgia Geral","stem":"Na visão laparoscópica posterior da região inguinal, uma hérnia que emerge lateralmente aos vasos epigástricos inferiores é classificada como:","options":{"A":"Hérnia de Spiegel.","B":"Hérnia inguinal direta.","C":"Hérnia obturatória.","D":"Hérnia femoral.","E":"Hérnia inguinal indireta."},"answer":"E","topic":"Hérnias e Parede Abdominal","explanation":"Hérnia indireta atravessa o anel inguinal profundo e situa-se lateral aos vasos epigástricos inferiores; a direta é medial.","difficulty":"very_hard","fragility":true},{"number":63,"area":"Cirurgia Geral","stem":"Paciente com hérnia incisional mediana grande apresenta perda de domínio. Qual é a principal preocupação fisiológica ao reduzir abruptamente grande volume visceral para a cavidade abdominal?","options":{"A":"Síndrome de dumping.","B":"Hipertensão intracraniana isolada sem alteração abdominal.","C":"Hipotireoidismo agudo.","D":"Aumento importante da pressão intra-abdominal, com risco respiratório e síndrome compartimental abdominal.","E":"Crise addisoniana inevitável."},"answer":"D","topic":"Hérnias e Parede Abdominal","explanation":"Em perda de domínio, reintegração visceral pode elevar muito a pressão intra-abdominal e comprometer ventilação, retorno venoso, perfusão renal e intestinal.","difficulty":"very_hard","fragility":false},{"number":64,"area":"Cirurgia Geral","stem":"Paciente com hérnia femoral encarcerada apresenta dor intensa e sinais de obstrução. Qual característica anatômica ajuda a explicar maior risco de estrangulamento?","options":{"A":"O canal femoral é amplo e elástico, reduzindo risco de isquemia.","B":"Hérnias femorais não contêm alça intestinal.","C":"A hérnia femoral passa acima do ligamento inguinal e lateral à artéria femoral.","D":"O anel femoral é formado apenas por músculo distensível.","E":"O colo femoral é relativamente estreito e rígido, favorecendo constrição do conteúdo herniado."},"answer":"E","topic":"Hérnias e Parede Abdominal","explanation":"O canal/anél femoral possui limites rígidos e colo estreito, o que aumenta risco de encarceramento e estrangulamento.","difficulty":"very_hard","fragility":false},{"number":65,"area":"Cirurgia Geral","stem":"Paciente com hiperaldosteronismo primário confirmado tem nódulo adrenal unilateral de 1,2 cm na TC, mas possui 58 anos e a adrenal contralateral é normal. Antes de adrenalectomia, qual exame é frequentemente necessário para demonstrar lateralização funcional?","options":{"A":"Cintilografia óssea.","B":"Dosagem de tireoglobulina.","C":"Teste de supressão com dexametasona como único exame de lateralização.","D":"PAAF do nódulo adrenal.","E":"Amostragem venosa adrenal, salvo cenários selecionados em que possa ser dispensada."},"answer":"E","topic":"Endócrino e Tireoide","explanation":"Nódulos incidentais são comuns. A amostragem venosa adrenal diferencia produção unilateral de bilateral e evita adrenalectomia baseada apenas em imagem em muitos adultos.","difficulty":"very_hard","fragility":true},{"number":66,"area":"Cirurgia Geral","stem":"Paciente com massa adrenal de 7 cm, heterogênea, com áreas de necrose, crescimento rápido e produção de andrógenos. Qual diagnóstico deve ser particularmente considerado?","options":{"A":"Feocromocitoma é excluído apenas porque há produção androgênica.","B":"Adenoma cortical não funcionante típico.","C":"Cisto simples adrenal.","D":"Carcinoma adrenocortical.","E":"Mielolipoma pequeno típico."},"answer":"D","topic":"Endócrino e Tireoide","explanation":"Tamanho, heterogeneidade, necrose, crescimento e síndrome virilizante aumentam suspeita de carcinoma adrenocortical.","difficulty":"very_hard","fragility":true},{"number":67,"area":"Cirurgia Geral","stem":"Paciente com nódulo tireoidiano Bethesda IV apresenta teste molecular não disponível. Qual limitação citológica explica por que a PAAF não consegue confirmar carcinoma folicular?","options":{"A":"A presença de coloide exclui neoplasia.","B":"A PAAF nunca identifica células foliculares.","C":"A distinção entre adenoma e carcinoma folicular depende de demonstrar invasão capsular e/ou vascular na peça cirúrgica.","D":"Carcinoma folicular é definido por metástase linfonodal obrigatória.","E":"Carcinoma folicular é diagnosticado apenas por calcitonina."},"answer":"C","topic":"Endócrino e Tireoide","explanation":"Citologia pode classificar neoplasia folicular, mas o diagnóstico de carcinoma exige invasão capsular/vascular, que depende de avaliação histológica da cápsula.","difficulty":"very_hard","fragility":true},{"number":68,"area":"Cirurgia Geral","stem":"Após tireoidectomia, paciente apresenta incapacidade de elevar a frequência fundamental da voz, fadiga vocal e dificuldade para notas agudas, com mobilidade preservada das pregas vocais. Qual lesão nervosa é mais provável?","options":{"A":"Nervo hipoglosso.","B":"Ramo externo do nervo laríngeo superior, com disfunção do músculo cricotireóideo.","C":"Nervo laríngeo recorrente bilateral.","D":"Nervo facial.","E":"Nervo frênico."},"answer":"B","topic":"Endócrino e Tireoide","explanation":"O ramo externo do laríngeo superior inerva o cricotireóideo, importante para tensionar a prega vocal e elevar pitch; sua lesão pode preservar mobilidade grosseira.","difficulty":"very_hard","fragility":true},{"number":69,"area":"Cirurgia Geral","stem":"Paciente com sarcoma retroperitoneal suspeito, grande e ressecável, sem metástases. Qual é a forma preferível de obter diagnóstico histológico quando ele é necessário antes do tratamento?","options":{"A":"Fragmentação laparoscópica do tumor.","B":"PAAF sempre suficiente para subtipagem e grau.","C":"Biópsia percutânea por agulha grossa, planejada em trajeto que não comprometa futura ressecção.","D":"Ressecção parcial intralesional apenas para diagnóstico.","E":"Biópsia incisional transperitoneal não planejada."},"answer":"C","topic":"Oncologia Cirúrgica","explanation":"Core biopsy percutânea planejada fornece tecido para diagnóstico e evita contaminação/violação desnecessária. O trajeto deve ser pensado com a equipe oncológica.","difficulty":"very_hard","fragility":true},{"number":70,"area":"Cirurgia Geral","stem":"Homem com tumor testicular sólido suspeito apresenta marcadores séricos colhidos. Qual abordagem diagnóstica/cirúrgica inicial é padrão?","options":{"A":"Orquiectomia radical por via inguinal, evitando biópsia transescrotal de rotina.","B":"Radioterapia testicular antes do diagnóstico histológico.","C":"Biópsia transescrotal com incisão sobre o tumor.","D":"Orquiectomia simples por via escrotal em todos os casos.","E":"Punção aspirativa do testículo como primeiro passo."},"answer":"A","topic":"Oncologia Cirúrgica","explanation":"A via inguinal permite controle do cordão e evita violação escrotal, que pode alterar drenagem e manejo oncológico.","difficulty":"very_hard","fragility":true},{"number":71,"area":"Cirurgia Geral","stem":"Paciente com tumor desmoide intra-abdominal associado à polipose adenomatosa familiar é assintomático e estável em exames seriados. Qual conduta pode ser apropriada?","options":{"A":"Desmoide metastatiza precocemente, portanto observação é proibida.","B":"Vigilância ativa em caso selecionado, reservando tratamento para progressão, sintomas ou ameaça a estruturas.","C":"Radioterapia abdominal é sempre primeira escolha em FAP.","D":"Quimioterapia citotóxica de alta dose é obrigatória mesmo estável.","E":"Cirurgia radical imediata é obrigatória em todos os desmoides."},"answer":"B","topic":"Oncologia Cirúrgica","explanation":"Desmoides têm comportamento variável e não metastatizam. Estratégias modernas frequentemente incluem observação inicial em casos estáveis e assintomáticos.","difficulty":"very_hard","fragility":true},{"number":72,"area":"Cirurgia Geral","stem":"Paciente com trauma pélvico grave permanece hipotenso apesar de transfusão balanceada. FAST é negativo e há instabilidade mecânica pélvica. Qual medida imediata pode contribuir para controle hemorrágico enquanto se organiza tratamento definitivo?","options":{"A":"Estabilização/compressão pélvica adequada e ativação de estratégia de controle de hemorragia, com angioembolização e/ou tamponamento pré-peritoneal conforme padrão e recursos.","B":"Administrar grande volume de cristaloide e adiar hemostasia.","C":"Retirar qualquer binder porque aumenta sangramento venoso.","D":"Aguardar hemoglobina cair antes de agir.","E":"Realizar laparotomia mediana apenas para explorar retroperitônio pélvico rotineiramente."},"answer":"A","topic":"Trauma e Emergências","explanation":"Hemorragia pélvica exige estabilização mecânica e controle de sangramento. O método definitivo depende de fonte, estabilidade e recursos; abrir hematoma pélvico retroperitoneal indiscriminadamente pode piorar sangramento.","difficulty":"very_hard","fragility":true},{"number":73,"area":"Cirurgia Geral","stem":"Paciente com ferimento penetrante cervical na zona II está estável, sem sangramento ativo, enfisema, hematêmese, déficit neurológico ou outro “hard sign”. Qual abordagem contemporânea é adequada?","options":{"A":"Alta imediata sem qualquer investigação.","B":"Ligadura carotídea profilática.","C":"Exploração cervical obrigatória em todo ferimento que atravesse platisma.","D":"Traqueostomia obrigatória em todos os casos.","E":"Avaliação seletiva com angio-TC e investigação dirigida de via aerodigestiva conforme achados, em vez de exploração obrigatória apenas pela zona anatômica."},"answer":"E","topic":"Trauma e Emergências","explanation":"Em paciente estável sem hard signs, algoritmos modernos usam avaliação seletiva com imagem de alta qualidade e exames dirigidos, reduzindo cervicotomias não terapêuticas.","difficulty":"very_hard","fragility":true},{"number":74,"area":"Cirurgia Geral","stem":"Politraumatizado com hemorragia maciça apresenta hipotermia, acidose e coagulopatia durante laparotomia. Qual filosofia operatória é mais apropriada?","options":{"A":"Evitar transfusão porque piora coagulopatia.","B":"Fechar abdome e dar alta.","C":"Realizar apenas drenagem superficial da pele.","D":"Completar toda reconstrução gastrointestinal e vascular, independentemente da fisiologia.","E":"Cirurgia de controle de danos: abreviar operação para controlar hemorragia/contaminação, ressuscitar em UTI e retornar para reconstrução definitiva."},"answer":"E","topic":"Trauma e Emergências","explanation":"A tríade letal indica exaustão fisiológica. Controle de danos prioriza hemostasia e controle de contaminação, interrompendo a espiral de hipotermia, acidose e coagulopatia.","difficulty":"very_hard","fragility":false},{"number":75,"area":"Cirurgia Geral","stem":"Paciente com fasciíte necrotizante por estreptococo do grupo A apresenta choque e extensa necrose. Além de desbridamento e beta-lactâmico apropriado, por que clindamicina costuma ser associada?","options":{"A":"Porque inibe síntese proteica e pode reduzir produção de toxinas, mantendo efeito mesmo em alta carga bacteriana.","B":"Porque neutraliza endotoxina por ligação direta no sangue.","C":"Porque é necessária apenas para cobertura de fungos.","D":"Porque substitui completamente o desbridamento.","E":"Porque é o único antibiótico com atividade contra gram-negativos."},"answer":"A","topic":"Inflamação, Infecção e Sepse","explanation":"Clindamicina é útil em infecções invasivas por estreptococos/clostrídios pela inibição de síntese proteica e efeito antitoxina; o controle cirúrgico continua essencial.","difficulty":"very_hard","fragility":true},{"number":76,"area":"Cirurgia Geral","stem":"Paciente com capacidade decisória pede ao médico que não informe à família o diagnóstico oncológico. A família exige detalhes completos. Qual conduta é eticamente adequada?","options":{"A":"Informar tudo à família porque parentes têm prioridade sobre o paciente.","B":"Publicar o caso em grupo profissional identificável.","C":"Declarar incapacidade porque o paciente deseja privacidade.","D":"Respeitar a confidencialidade do paciente e compartilhar informações apenas com sua autorização, salvo exceções legais/risco relevante previstos.","E":"Negar ao próprio paciente acesso às informações."},"answer":"D","topic":"Perioperatório e Ética","explanation":"Confidencialidade pertence ao paciente capaz. Familiares não têm direito automático a informações sem consentimento, salvo exceções legais específicas.","difficulty":"very_hard","fragility":false},{"number":77,"area":"Cirurgia Geral","stem":"Paciente com síndrome de realimentação de alto risco vai iniciar suporte nutricional. Qual estratégia é mais apropriada?","options":{"A":"Iniciar aporte de forma cautelosa, corrigir/monitorar fósforo, potássio e magnésio e administrar tiamina conforme risco.","B":"Oferecer apenas solução glicosada hipertônica intravenosa.","C":"Suspender qualquer eletrólito até surgir arritmia.","D":"Iniciar imediatamente 100% das necessidades calóricas sem monitorização.","E":"Evitar tiamina porque aumenta consumo de fósforo."},"answer":"A","topic":"Nutrição e Metabolismo","explanation":"Prevenção de realimentação exige reconhecer risco, iniciar nutrição progressivamente e monitorar/repor eletrólitos, além de tiamina.","difficulty":"very_hard","fragility":true},{"number":78,"area":"Cirurgia Geral","stem":"Paciente 2 anos após bypass gástrico em Y de Roux apresenta dor abdominal intermitente, pior após refeições, com episódios de náuseas. A TC é inconclusiva, mas a suspeita clínica de hérnia interna permanece alta. Qual princípio é mais seguro?","options":{"A":"Baixo limiar para exploração cirúrgica em quadro compatível, pois imagem negativa não exclui hérnia interna e isquemia pode ocorrer.","B":"Tratar apenas com inibidor de bomba de prótons por seis meses.","C":"Descartar hérnia interna definitivamente se a TC não mostrar obstrução completa.","D":"Realizar colonoscopia como exame definitivo.","E":"Evitar cirurgia porque hérnia interna não causa isquemia."},"answer":"A","topic":"Cirurgia Bariátrica","explanation":"Hérnia interna pós-bypass pode ser intermitente e a TC não é perfeita. Dor sugestiva com alta suspeita exige avaliação cirúrgica precoce.","difficulty":"very_hard","fragility":true},{"number":79,"area":"Cirurgia Geral","stem":"Paciente diabético apresenta úlcera plantar com tecido necrótico, pulsos pediosos não palpáveis e índice tornozelo-braquial muito baixo. Antes de atribuir falha de cicatrização apenas à infecção, qual fator precisa ser abordado?","options":{"A":"Antibiótico tópico restaura perfusão.","B":"Somente deficiência de vitamina C.","C":"Perfusão arterial inadequada, com avaliação vascular e possibilidade de revascularização.","D":"A ausência de pulso é irrelevante em feridas.","E":"Toda úlcera plantar deve ser fechada primariamente."},"answer":"C","topic":"Cicatrização e Feridas","explanation":"Isquemia é causa fundamental de não cicatrização. Controle de infecção e desbridamento podem falhar sem perfusão adequada; avaliação vascular é essencial.","difficulty":"very_hard","fragility":false},{"number":80,"area":"Cirurgia Geral","stem":"Paciente idoso com delirium hiperativo no pós-operatório arranca acessos e tenta sair do leito. Antes de usar contenção física ou sedação, qual abordagem inicial é mais apropriada?","options":{"A":"Dar alta para casa imediatamente.","B":"Prescrever benzodiazepínico para todos os casos independentemente da causa.","C":"Manter o paciente isolado no escuro para reduzir estímulo.","D":"Procurar e tratar causas reversíveis, reorientar, corrigir dor/hipóxia/distúrbios metabólicos e adotar medidas ambientais, reservando contenção para risco imediato quando necessária.","E":"Considerar delirium consequência inevitável da idade e não investigar."},"answer":"D","topic":"Perioperatório e Ética","explanation":"Delirium é multifatorial. Avaliação de causas precipitantes e medidas não farmacológicas são fundamentais; sedação/contenção deve ser criteriosa e voltada à segurança.","difficulty":"very_hard","fragility":false}]},"simulado_ccp_08":{"id":"simulado_ccp_08","label":"Simulado 8 — ENARE CCP","subtitle":"Nível ENARE+ — prova-alvo final · 80 questões","localKey":"enare_ccp_simulado_08_v1","order":"1–40 Otorrinolaringologia · 41–80 Cirurgia Geral","sourceNote":"Simulado autoral/fortemente adaptado para preparação ENARE R+ CCP. Comentários aparecem somente após a correção. Questões 6–8 foram calibradas para maior dificuldade e poder diagnóstico.","questions":[{"number":1,"area":"Otorrinolaringologia","stem":"Paciente de 47 anos apresenta episódios de vertigem com duração de 1 a 3 horas, plenitude auricular, zumbido e flutuação da audição no ouvido esquerdo. Audiometria em crise mostra perda neurossensorial predominante em baixas frequências. Qual hipótese é mais provável?","options":{"A":"Neurite vestibular.","B":"Tontura perceptual postural persistente.","C":"Deiscência de canal semicircular superior.","D":"VPPB de canal posterior.","E":"Doença de Ménière."},"answer":"E","topic":"Vestibulologia","explanation":"Crises espontâneas de vertigem de dezenas de minutos a horas associadas a sintomas cocleares flutuantes e perda neurossensorial de baixas frequências são típicas de Ménière.","difficulty":"target","fragility":false},{"number":2,"area":"Otorrinolaringologia","stem":"Paciente com vertigem posicional apresenta, no roll test, nistagmo horizontal apogeotrópico bilateral, mais intenso quando a cabeça é girada para a direita. Na variante apogeotrópica, qual lado costuma ser o acometido?","options":{"A":"O lado em que o nistagmo é mais intenso, portanto o direito.","B":"Sempre o lado do nistagmo para baixo.","C":"O lado em que o nistagmo é menos intenso, portanto o esquerdo neste caso.","D":"Não é possível lateralizar em nenhuma variante horizontal.","E":"O canal posterior contralateral."},"answer":"C","topic":"Vestibulologia","explanation":"Na VPPB horizontal apogeotrópica, o nistagmo costuma ser mais intenso quando a cabeça é virada para o lado saudável; portanto o lado afetado tende a ser o de menor intensidade.","difficulty":"target","fragility":true},{"number":3,"area":"Otorrinolaringologia","stem":"Paciente de 38 anos desenvolve tontura persistente não rotatória há 5 meses após episódio de neurite vestibular. Os sintomas pioram ao ficar em pé, caminhar em supermercado e observar telas com muito movimento. Exames vestibulares atuais não explicam a intensidade dos sintomas. O diagnóstico mais provável é:","options":{"A":"VPPB não tratada obrigatoriamente.","B":"Ménière bilateral.","C":"Fístula perilinfática.","D":"Tontura perceptual postural persistente (TPPP/PPPD).","E":"Schwannoma vestibular."},"answer":"D","topic":"Vestibulologia","explanation":"PPPD caracteriza tontura/instabilidade persistente por pelo menos 3 meses, exacerbada por postura ereta, movimento e estímulos visuais complexos, muitas vezes após evento vestibular precipitante.","difficulty":"target","fragility":true},{"number":4,"area":"Otorrinolaringologia","stem":"Em paciente com síndrome vestibular aguda, qual combinação do HINTS é mais compatível com origem periférica?","options":{"A":"Head impulse normal, nistagmo que muda de direção e skew positivo.","B":"Ausência total de nistagmo com déficit neurológico focal.","C":"Head impulse normal e skew positivo, independentemente do nistagmo.","D":"Nistagmo vertical puro e head impulse normal.","E":"Head impulse anormal, nistagmo unidirecional e ausência de skew."},"answer":"E","topic":"Vestibulologia","explanation":"HIT anormal, nistagmo unidirecional e ausência de skew compõem um padrão periférico; sinais centrais incluem HIT normal, nistagmo direction-changing ou skew.","difficulty":"target","fragility":false},{"number":5,"area":"Otorrinolaringologia","stem":"Paciente com otalgia intensa após banho de piscina apresenta edema importante do conduto, dor à mobilização do trago e otorreia, sem sinais sistêmicos. Qual conduta inicial é mais apropriada?","options":{"A":"Mastoidectomia imediata.","B":"Antibiótico venoso de amplo espectro para todos os casos.","C":"Corticoterapia sistêmica isolada.","D":"Timpanoplastia de urgência.","E":"Limpeza cuidadosa do conduto quando possível e tratamento tópico, mantendo orelha seca; considerar mecha se edema impedir penetração das gotas."},"answer":"E","topic":"Otologia e Audiologia","explanation":"Otite externa difusa não complicada é tratada principalmente com terapia tópica e cuidados locais. Antibiótico sistêmico fica para extensão, fatores de risco ou complicações.","difficulty":"target","fragility":false},{"number":6,"area":"Otorrinolaringologia","stem":"Idoso diabético com otalgia intensa desproporcional, otorreia persistente e tecido de granulação no assoalho do conduto auditivo externo apresenta suspeita de otite externa necrotizante. Qual agente é classicamente implicado?","options":{"A":"Candida albicans em todos os casos.","B":"Pseudomonas aeruginosa.","C":"Mycobacterium tuberculosis.","D":"Treponema pallidum.","E":"Streptococcus pyogenes exclusivamente."},"answer":"B","topic":"Otologia e Audiologia","explanation":"Otite externa necrotizante ocorre sobretudo em diabéticos/imunossuprimidos e é classicamente associada a Pseudomonas, podendo evoluir com osteomielite de base do crânio.","difficulty":"target","fragility":false},{"number":7,"area":"Otorrinolaringologia","stem":"Paciente com hipoacusia condutiva e otoscopia normal apresenta curva timpanométrica tipo Ad. Qual alteração mecânica é mais compatível?","options":{"A":"Hipermobilidade da membrana/sistema tímpano-ossicular, como em descontinuidade ossicular.","B":"Efusão de orelha média.","C":"Rigidez aumentada por otosclerose típica.","D":"Perfuração timpânica necessariamente.","E":"Função normal obrigatória."},"answer":"A","topic":"Otologia e Audiologia","explanation":"Curva Ad indica complacência aumentada. Descontinuidade ossicular ou membrana monomérica são possibilidades; tipo B é mais típico de efusão e As de rigidez.","difficulty":"target","fragility":false},{"number":8,"area":"Otorrinolaringologia","stem":"Paciente apresenta paralisia facial periférica, vesículas no pavilhão auricular e conduto, além de otalgia intensa. Qual diagnóstico é mais provável?","options":{"A":"Síndrome de Gradenigo.","B":"Síndrome de Ramsay Hunt por reativação do vírus varicela-zóster.","C":"Ménière.","D":"Otosclerose.","E":"Paralisia de Bell sem infecção viral."},"answer":"B","topic":"Otologia e Audiologia","explanation":"Paralisia facial associada a otalgia e vesículas auriculares caracteriza herpes-zóster ótico/Ramsay Hunt.","difficulty":"target","fragility":false},{"number":9,"area":"Otorrinolaringologia","stem":"Criança de 6 anos apresenta febre, otalgia e abaulamento retroauricular com deslocamento do pavilhão para frente e para baixo após otite média aguda. Qual complicação é mais provável?","options":{"A":"Mastoidite aguda com abscesso subperiosteal possível.","B":"Otite externa simples.","C":"Paralisia de Bell.","D":"Otosclerose juvenil.","E":"Schwannoma vestibular."},"answer":"A","topic":"Otologia e Audiologia","explanation":"Inflamação mastoidea complicada pode causar edema/abscesso retroauricular e protrusão do pavilhão. O quadro requer avaliação hospitalar e tratamento intensivo.","difficulty":"target","fragility":false},{"number":10,"area":"Otorrinolaringologia","stem":"Paciente com otosclerose pergunta qual achado audiométrico clássico pode aparecer por alteração mecânica da cadeia ossicular, sem representar verdadeira perda coclear nessa frequência. A resposta é:","options":{"A":"Entalhe de 4 kHz por trauma acústico.","B":"Gap aéreo-ósseo apenas em 8 kHz.","C":"Entalhe de Carhart em torno de 2 kHz na via óssea.","D":"Recrutamento de Metz obrigatório.","E":"Perda neurossensorial súbita em 250 Hz."},"answer":"C","topic":"Otologia e Audiologia","explanation":"O entalhe de Carhart é uma piora aparente da via óssea tipicamente em 2 kHz associada à fixação do estribo.","difficulty":"target","fragility":true},{"number":11,"area":"Otorrinolaringologia","stem":"Paciente com perda auditiva neurossensorial súbita unilateral, instalada em horas, sem causa evidente ao exame. Qual abordagem inicial é mais apropriada?","options":{"A":"Confirmar audiometricamente e iniciar tratamento com corticosteroide em tempo oportuno, além de investigação de causas retrococleares conforme o caso.","B":"Prescrever apenas descongestionante nasal.","C":"Realizar mastoidectomia.","D":"Aguardar espontaneamente por três meses antes de audiometria.","E":"Considerar perda condutiva até prova em contrário porque a instalação foi súbita."},"answer":"A","topic":"Otologia e Audiologia","explanation":"Perda neurossensorial súbita é urgência otológica. Tratamento precoce com corticoide é prática habitual; avaliação audiológica e investigação etiológica/retrococlear são importantes.","difficulty":"target","fragility":false},{"number":12,"area":"Otorrinolaringologia","stem":"Paciente com rinossinusite aguda evolui com edema palpebral, dor à movimentação ocular, proptose e redução da acuidade visual. Qual complicação deve ser presumida até prova em contrário?","options":{"A":"Pólipo antrocoanal.","B":"Celulite pré-septal simples sem risco visual.","C":"Rinite alérgica.","D":"Desvio septal.","E":"Complicação orbitária pós-septal, exigindo avaliação urgente com imagem e tratamento hospitalar."},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Dor ao movimento ocular, proptose e alteração visual sugerem doença pós-septal/orbitária, potencialmente ameaçadora à visão e à vida.","difficulty":"target","fragility":false},{"number":13,"area":"Otorrinolaringologia","stem":"Paciente diabético em cetoacidose apresenta dor facial, obstrução nasal, necrose de corneto e alteração visual de rápida evolução. Qual conduta é mais apropriada?","options":{"A":"Biópsia apenas após 30 dias de antifúngico.","B":"Observação porque necrose nasal é típica de rinite medicamentosa.","C":"Desbridamento cirúrgico urgente associado a antifúngico sistêmico e correção do fator predisponente.","D":"Apenas corticoide intranasal.","E":"Antibiótico oral e retorno em uma semana."},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Mucormicose rinocerebral invasiva é emergência; tratamento combina reversão da imunossupressão/metabolismo, antifúngico sistêmico e desbridamento agressivo.","difficulty":"target","fragility":true},{"number":14,"area":"Otorrinolaringologia","stem":"Homem de 17 anos apresenta obstrução nasal unilateral e epistaxes recorrentes. TC mostra massa nasofaríngea com alargamento do forame esfenopalatino e arqueamento anterior da parede posterior do seio maxilar. O diagnóstico é:","options":{"A":"Papiloma invertido.","B":"Carcinoma nasofaríngeo.","C":"Pólipo antrocoanal.","D":"Angiofibroma nasofaríngeo juvenil.","E":"Adenoide hipertrófica."},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"O angiofibroma juvenil ocorre em adolescentes do sexo masculino e causa epistaxe/obstrução. O sinal de Holman-Miller corresponde ao arqueamento da parede posterior do seio maxilar.","difficulty":"target","fragility":true},{"number":15,"area":"Otorrinolaringologia","stem":"Paciente com obstrução nasal persistente após septoplastia apresenta melhora importante ao realizar manobra de Cottle e colapso inspiratório da parede lateral nasal. Qual estrutura funcional deve ser valorizada?","options":{"A":"Tuba auditiva.","B":"Seio esfenoidal.","C":"Adenoide em todo adulto.","D":"Ducto nasolacrimal exclusivamente.","E":"Válvula nasal, especialmente insuficiência da válvula interna/parede lateral."},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"A válvula nasal é a região de maior resistência nasal. Colapso lateral e melhora com suporte manual sugerem insuficiência valvar.","difficulty":"target","fragility":true},{"number":16,"area":"Otorrinolaringologia","stem":"Paciente com rinossinusite crônica sem pólipos pergunta sobre indicação de TC. Qual afirmação é correta?","options":{"A":"TC deve ser evitada mesmo diante de complicações orbitárias.","B":"Radiografia simples substitui TC para planejamento endoscópico.","C":"TC normal exclui qualquer rinite alérgica.","D":"A TC é útil para confirmar doença objetiva e planejamento cirúrgico, geralmente após tratamento clínico apropriado, não sendo necessária em toda rinite viral aguda.","E":"TC deve ser feita em toda infecção viral de 48 horas."},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"Rinossinusite crônica requer sintomas persistentes e evidência objetiva por endoscopia/TC. Imagem é especialmente relevante para cirurgia e complicações.","difficulty":"target","fragility":true},{"number":17,"area":"Otorrinolaringologia","stem":"Paciente com pólipo nasal unilateral em adulto apresenta massa irregular, epistaxe e remodelamento ósseo focal. Qual princípio é mais adequado?","options":{"A":"Lesão unilateral atípica deve ser investigada para neoplasia, como papiloma invertido ou malignidade, em vez de presumida polipose inflamatória simples.","B":"Todo pólipo unilateral é antrocoanal benigno.","C":"Biópsia e imagem são desnecessárias.","D":"Polipose inflamatória é sempre unilateral.","E":"Epistaxe reduz suspeita de tumor."},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"Polipose inflamatória é geralmente bilateral. Massa unilateral, sangramento ou alterações ósseas exigem investigação específica.","difficulty":"target","fragility":false},{"number":18,"area":"Otorrinolaringologia","stem":"Paciente com uso crônico de descongestionante tópico alfa-adrenérgico apresenta piora progressiva da obstrução quando tenta suspender. O diagnóstico mais provável é:","options":{"A":"Rinossinusite fúngica invasiva.","B":"Rinite medicamentosa.","C":"Síndrome de Kartagener.","D":"Fístula liquórica.","E":"Granulomatose com poliangiite obrigatória."},"answer":"B","topic":"Rinologia e Rinossinusites","explanation":"Agonistas tópicos usados por períodos prolongados podem causar congestão rebote e rinite medicamentosa.","difficulty":"target","fragility":false},{"number":19,"area":"Otorrinolaringologia","stem":"Professor apresenta disfonia crônica. Videolaringoscopia mostra lesões bilaterais simétricas na junção do terço anterior com médio das pregas vocais e fenda em ampulheta. Qual tratamento inicial é mais apropriado?","options":{"A":"Traqueostomia.","B":"Antibiótico por 30 dias.","C":"Fonoterapia e higiene vocal, reservando cirurgia para casos selecionados/refratários.","D":"Radioterapia.","E":"Cordectomia bilateral."},"answer":"C","topic":"Laringologia e Voz","explanation":"Nódulos vocais são tipicamente bilaterais e associados a fonotrauma; terapia vocal é primeira linha.","difficulty":"target","fragility":true},{"number":20,"area":"Otorrinolaringologia","stem":"Paciente intubado por 12 dias evolui com dispneia progressiva semanas após alta. Endoscopia mostra estreitamento subglótico circunferencial. Qual fator etiológico é mais provável?","options":{"A":"Paralisia facial.","B":"Otosclerose.","C":"Estenose laringotraqueal pós-intubação por lesão isquêmica/cicatricial.","D":"Nódulos vocais.","E":"Edema de Reinke."},"answer":"C","topic":"Laringologia e Voz","explanation":"Intubação prolongada, pressão do cuff e trauma podem produzir lesão mucosa e cicatriz subglótica/traqueal, levando a estenose tardia.","difficulty":"target","fragility":true},{"number":21,"area":"Otorrinolaringologia","stem":"Paciente após tireoidectomia apresenta voz fraca, soprosa e aspiração de líquidos. Laringoscopia mostra imobilidade unilateral de prega vocal. Qual nervo é mais provavelmente afetado?","options":{"A":"Nervo acessório.","B":"Nervo laríngeo recorrente ipsilateral.","C":"Nervo facial.","D":"Nervo glossofaríngeo.","E":"Ramo externo do laríngeo superior isolado."},"answer":"B","topic":"Laringologia e Voz","explanation":"Lesão recorrencial causa paralisia da prega vocal e pode gerar disfonia e aspiração. Lesão do ramo externo do superior tende a afetar pitch e projeção.","difficulty":"target","fragility":false},{"number":22,"area":"Otorrinolaringologia","stem":"Paciente fumante apresenta disfonia progressiva há 3 meses. Videolaringoscopia mostra lesão irregular em prega vocal com redução de mobilidade. Qual conduta é mais adequada?","options":{"A":"Prescrever antibiótico e alta.","B":"Tratar empiricamente com antiácido por um ano antes de biopsiar.","C":"Obter diagnóstico histológico e estadiar a lesão, considerando neoplasia laríngea.","D":"Apenas fonoterapia sem investigação.","E":"Considerar nódulo vocal benigno porque é unilateral."},"answer":"C","topic":"Laringologia e Voz","explanation":"Disfonia persistente com lesão irregular e alteração de mobilidade em tabagista é sinal de alarme para câncer e exige biópsia/estadiamento.","difficulty":"target","fragility":false},{"number":23,"area":"Otorrinolaringologia","stem":"Paciente com edema de Reinke importante e tabagismo ativo pergunta qual medida tem papel fundamental, além de eventual cirurgia em casos selecionados.","options":{"A":"Antibiótico contínuo.","B":"Quimioterapia.","C":"Tireoidectomia.","D":"Cessação do tabagismo e controle de fatores irritativos/fonotraumáticos.","E":"Implante coclear."},"answer":"D","topic":"Laringologia e Voz","explanation":"Edema de Reinke é fortemente associado ao tabagismo e abuso vocal. Controle etiológico é essencial para reduzir recorrência e melhorar resultado.","difficulty":"target","fragility":false},{"number":24,"area":"Otorrinolaringologia","stem":"Adulto com ronco, IAH de 3/h e ausência de sonolência ou apneias presenciadas apresenta importante obstrução nasal e hipertrofia tonsilar. Qual afirmação é correta?","options":{"A":"IAH 3/h define AOS grave se houver hipertrofia tonsilar.","B":"CPAP é obrigatório porque há ronco.","C":"O quadro define AOS moderada.","D":"Toda cirurgia de via aérea é contraindicada se IAH for menor que 5.","E":"O IAH está abaixo do limiar usual para AOS em adulto; tratamento deve ser direcionado à obstrução/sintomas, e CPAP não é indicado apenas pelo ronco com IAH normal."},"answer":"E","topic":"Sono e Via Aérea Superior","explanation":"Em adultos, IAH <5/h é usualmente considerado normal para AOS. Outras queixas e obstruções anatômicas podem ter indicação própria de tratamento.","difficulty":"target","fragility":true},{"number":25,"area":"Otorrinolaringologia","stem":"Criança de 6 anos com ronco habitual, pausas respiratórias, respiração oral e hipertrofia adenotonsilar importante apresenta AOS confirmada. Qual tratamento é frequentemente primeira linha quando não há contraindicações?","options":{"A":"Septoplastia isolada.","B":"Adenotonsilectomia.","C":"Uvulopalatofaringoplastia de rotina.","D":"CPAP obrigatório antes de considerar cirurgia em toda criança.","E":"Traqueostomia."},"answer":"B","topic":"Sono e Via Aérea Superior","explanation":"Hipertrofia adenotonsilar é causa frequente de AOS pediátrica; adenotonsilectomia é terapia de primeira linha em crianças selecionadas.","difficulty":"target","fragility":false},{"number":26,"area":"Otorrinolaringologia","stem":"Adulto com IAH 34/h é classificado, quanto à gravidade da AOS, como:","options":{"A":"Moderada.","B":"Leve.","C":"Normal.","D":"Não classificável sem oximetria.","E":"Grave."},"answer":"E","topic":"Sono e Via Aérea Superior","explanation":"Em adultos, AOS grave corresponde geralmente a IAH ≥30 eventos/h.","difficulty":"target","fragility":false},{"number":27,"area":"Otorrinolaringologia","stem":"Paciente com AOS usa CPAP todas as noites, mas relata persistência de sonolência. Qual passo deve preceder a conclusão de que o tratamento falhou?","options":{"A":"Prescrever estimulante antes de verificar eficácia.","B":"Suspender CPAP imediatamente.","C":"Indicar cirurgia multinível sem reavaliar dados do aparelho.","D":"Revisar adesão objetiva, vazamentos, pressão, eventos residuais e outras causas de sonolência.","E":"Considerar que qualquer sonolência prova apneia central."},"answer":"D","topic":"Sono e Via Aérea Superior","explanation":"Persistência de sintomas exige confirmar eficácia/adesão do CPAP e investigar outras causas, como privação de sono, medicamentos e doenças associadas.","difficulty":"target","fragility":false},{"number":28,"area":"Otorrinolaringologia","stem":"Paciente com infecção odontogênica apresenta febre alta, endurecimento bilateral do assoalho da boca, elevação da língua, disfagia e voz abafada. Qual diagnóstico e prioridade inicial são mais adequados?","options":{"A":"Abscesso peritonsilar unilateral, sem risco de via aérea.","B":"Candidíase pseudomembra
