 endovenoso mostra alças distendidas de delgado com ponto de transição único, sem sinais de isquemia ou perfuração. Paciente está hemodinamicamente estável, sem febre. A conduta mais adequada nesse momento é","options":{"A":"indicar laparotomia imediata, pois todo quadro obstrutivo requer cirurgia de urgência.","B":"iniciar tratamento conservador com hidratação venosa, cateter nasogástrico e observação clínica.","C":"realizar colonoscopia para descompressão e retirada do conteúdo fecal.","D":"administrar anticoagulação por suspeita de trombose venosa mesentérica associada.","E":"iniciar nutrição parenteral total imediata por risco de necrose intestinal."},"answer":"B","topic":"Coloproctologia e Intestino"},{"number":21,"area":"Cirurgia Geral","stem":"Paciente masculino, 25 anos de idade, é vítima de queda de grande altura. Apresenta TCE grave com anisocoria à direita. Pressão Arterial de 100 x 60 mmHg, frequência cardíaca de 110 bpm e hipocorado ++/4. Das alternativas de ressuscitação volêmica elencadas a seguir, a mais indicada é","options":{"A":"ringer lactato.","B":"soro glicosado 5%.","C":"solução coloide de Dextran.","D":"solução salina hipertônica a 3%.","E":"ringer sem lactato com dextrose 5%."},"answer":"D","topic":"Trauma e Emergências"},{"number":22,"area":"Cirurgia Geral","stem":"Paciente com diagnóstico de carcinoma papilífero em lobo direito da tireoide, apresentando linfonodo de 1 cm palpável no bordo anterior do músculo esternocleidomastoideo do mesmo lado, abaixo da altura do osso hioide e acima da altura da cartilagem cricoide. Segundo os compartimentos nodais do pescoço, esse linfonodo se encontra no nível","options":{"A":"I.","B":"II.","C":"III.","D":"IV.","E":"V."},"answer":"C","topic":"Endócrino e Tireoide"},{"number":23,"area":"Cirurgia Geral","stem":"Tumores formados a partir de células G produtoras de gastrina, quando localizados no pâncreas, ocorrem mais comumente","options":{"A":"no corpo e na cauda.","B":"no colo pancreático e no corpo.","C":"na cabeça e em processo uncinado.","D":"no corpo e em processo uncinado.","E":"na cauda, somente."},"answer":"C","topic":"Hepatobiliopancreática"},{"number":24,"area":"Cirurgia Geral","stem":"A correta síntese da parede abdominal é um fator importante na diminuição de ocorrência de hérnias incisionais de parede abdominal. O estudo STITCH demonstrou diminuição de hérnias incisionais, com o fechamento da parede abdominal da seguinte forma:","options":{"A":"pontos a 1 cm da borda, 0,5 cm entre os pontos e fio multifilamentar.","B":"pontos a 0,5 cm da borda, 0,5 cm entre os pontos e fio monofilamentar.","C":"pontos a 1 cm da borda, 1 cm entre os pontos e fio monofilamentar.","D":"pontos a 0,5 cm da borda, 1 cm entre os pontos e fio monofilamentar.","E":"pontos a 1 cm da borda, 1 cm entre os pontos e fio multifilamentar."},"answer":"B","topic":"Hérnias e Parede Abdominal"},{"number":25,"area":"Cirurgia Geral","stem":"Os divertículos de esôfago podem estar associados a diversas condições clínicas. O divertículo epifrênico está associado, entre outros, à(ao)","options":{"A":"tuberculose pulmonar.","B":"acalásia do esôfago.","C":"doença do refluxo gastroesofágico.","D":"hérnia de hiato tipo II.","E":"linfoma de Hodgkin."},"answer":"B","topic":"Esôfago e Estômago"},{"number":26,"area":"Cirurgia Geral","stem":"Paciente de 53 anos, tabagista, apresenta disfagia para sólidos. A endoscopia mostrou lesão estenosante de terço médio de esôfago, de 4 cm de extensão, ocupando 2/3 da luz do órgão. A biópsia confirmou carcinoma escamoso. O estadiamento clínico foi de um tumor T3, N1, M0. Nesse caso, a próxima medida terapêutica a ser adotada é","options":{"A":"radioterapia exclusiva.","B":"gastrostomia alimentar.","C":"esofagectomia em três campos.","D":"esofagectomia distal (Ivor Lewis).","E":"quimioradioterapia neoadjuvante."},"answer":"E","topic":"Esôfago e Estômago"},{"number":27,"area":"Cirurgia Geral","stem":"Sobre os tumores desmoides de parede abdominal, é correto afirmar que","options":{"A":"geralmente se manifestam como massas palpáveis e dolorosas na parede abdominal.","B":"têm associação com síndromes genéticas hamartamatosas como a síndrome de Peutz-Jeghers.","C":"a biópsia por agulha tipo “core biopsy” é contraindicada pelo risco de disseminação tumoral.","D":"se trata de um tumor benigno de comportamento maligno, com pouca propensão à recidiva local e a metástases.","E":"nos casos esporádicos, há uma predominância no sexo feminino de dois para um."},"answer":"E","topic":"Oncologia Cirúrgica"},{"number":28,"area":"Cirurgia Geral","stem":"Paciente chega ao pronto-socorro com quadro de obstrução intestinal alta. Apresenta dor na face anteromedial da coxa direita que alivia com a sua flexão. Ao exame físico, não são palpadas hérnias na região inguinal ou na parede anterior do abdome. A hipótese diagnóstica mais provável, entre as listadas a seguir, é a de hérnia","options":{"A":"obturatória.","B":"perineal.","C":"ciática.","D":"de Grynfeldt.","E":"de Petit."},"answer":"A","topic":"Hérnias e Parede Abdominal"},{"number":29,"area":"Cirurgia Geral","stem":"Paciente submetido à correção de hérnia inguinal direita pela técnica de Liechtenstein, apresentando parestesia em face lateral do escroto do mesmo lado. O nervo provavelmente lesado nessa situação é o","options":{"A":"ileoinguinal.","B":"ileohipogástrico.","C":"ramo genital do genitofemoral.","D":"ramo femoral do genitofemoral.","E":"cremastérico."},"answer":"C","topic":"Hérnias e Parede Abdominal"},{"number":30,"area":"Cirurgia Geral","stem":"Segundo a Resolução nº 2.429/2025 do Conselho Federal de Medicina, as cirurgias bariátricas em adolescentes podem ser realizadas","options":{"A":"acima de 14 anos, respeitando os mesmos critérios que os adultos.","B":"acima de 16 anos, respeitando os mesmos critérios que os adultos.","C":"acima de 16 anos, somente se o IMC for acima de 40 kg/m2 e houver comorbidades graves.","D":"acima de 14 anos, somente se o IMC for acima de 35 kg/m2 e houver comorbidades graves.","E":"acima de 16 anos somente se o IMC for acima de 35 kg/m2 e houver comorbidades graves."},"answer":"B","topic":"Cirurgia Bariátrica"},{"number":31,"area":"Cirurgia Geral","stem":"Paciente, 20 anos, com febre baixa e dor abdominal de início há 12 horas. Ao exame, nota-se perda de sensibilidade abdominal quando os músculos da parede abdominal são contraídos. Esse achado semiológico corresponde ao sinal de","options":{"A":"Blumberg.","B":"Rovsing.","C":"Murphy.","D":"Carnett.","E":"Fothergill."},"answer":"D","topic":"Coloproctologia e Intestino"},{"number":32,"area":"Cirurgia Geral","stem":"Em pacientes com hemorragia digestiva alta de causa varicosa, a contraindicação relativa ao uso do TIPS, entre as listadas a seguir, é","options":{"A":"o escore de MELD acima de 10.","B":"a classificação de Child-Pugh acima de 7 pontos.","C":"a síndrome hepatorrenal.","D":"a ascite refratária.","E":"o carcinoma hepatocelular."},"answer":"E","topic":"Esôfago e Estômago"},{"number":33,"area":"Cirurgia Geral","stem":"Avalie o fragmento a seguir. Secretado(a) por células presentes no fundo gástrico, é também conhecido(a) como “hormônio da fome”. O fragmento fala sobre","options":{"A":"grelina.","B":"colecistoquinina.","C":"GLP-1.","D":"peptídeo YY.","E":"leptina."},"answer":"A","topic":"Nutrição e Metabolismo"},{"number":34,"area":"Cirurgia Geral","stem":"Paciente, 40 anos, mostra massa indolor de 7 cm em testículo direito, discreto aumento de gonadotrofina coriônica humana (hCG), desidrogenase láctea (DHL) bastante aumentada e alfa feto proteína normal. Este tipo de tumor tem como sítio de metástase mais comum","options":{"A":"o pulmão.","B":"a coluna lombar.","C":"os linfonodos retroperitoneais.","D":"os linfonodos inguinais.","E":"o fígado."},"answer":"C","topic":"Oncologia Cirúrgica"},{"number":35,"area":"Cirurgia Geral","stem":"O subtipo de linfoma gástrico mais comum é o linfoma de","options":{"A":"tecido linfoide associado à mucosa.","B":"células foliculares.","C":"grandes células B difuso.","D":"células do manto.","E":"Burkitt."},"answer":"C","topic":"Oncologia Cirúrgica"},{"number":36,"area":"Cirurgia Geral","stem":"No pós-operatório de cirurgias em que não se utilizam próteses permanentes, as infecções de sítio cirúrgico são aquelas que ocorrem em até","options":{"A":"cinco dias.","B":"sete dias.","C":"dez dias.","D":"quinze dias.","E":"trinta dias."},"answer":"E","topic":"Inflamação, Infecção e Sepse"},{"number":37,"area":"Cirurgia Geral","stem":"Paciente, 58 anos, iniciou tratamento com amoxacilina + clavulanato após colecistectomia de urgência devido a empiema de vesícula biliar. Após 48 horas, começou quadro de dor abdominal tipo cólica, queda do estado geral, diarreia mucosanguinolenta e febre de 39,7 C. PA: 80 x 40 mmHg e FC: 128 bpm. Exame do abdome sem sinais de irritação peritoneal. Além de estabilização do quadro hemodinâmico, assinale a melhor medida terapêutica a ser adotada, entre as citadas.","options":{"A":"suspender amoxacilina + clavulanato e iniciar ceftriaxone.","B":"suspender amoxacilina + clavulanato e aguardar coprocultura.","C":"suspender amoxacilina + clavulanato e iniciar vancomicina.","D":"proctocolectomia total com ileostomia e iniciar ceftriaxone.","E":"associar vancomicina + metronidazol."},"answer":"C","topic":"Inflamação, Infecção e Sepse"},{"number":38,"area":"Cirurgia Geral","stem":"Paciente, 18 anos, sexo masculino, refere dor abdominal de início vaga em epigástrio, que migrou e se localizou em fossa ilíaca direita em 24 horas. Refere também náuseas e anorexia. A temperatura axilar é de 38 C. Apresenta dor e defesa à palpação da fossa ilíaca direita, com descompressão dolorosa. Leucograma normal, sem desvio. Ultrassonografia com apêndice de diâmetro de 8 mm, sem líquido periapendicular. Segundo o escore de Alvarado, esse paciente","options":{"A":"não tem apendicite aguda.","B":"tem probabilidade baixa de ter apendicite aguda.","C":"tem probabilidade mediana de ter apendicite.","D":"tem probabilidade alta de ter apendicite aguda.","E":"precisa realizar TC para avaliar probabilidade de apendicite."},"answer":"D","topic":"Coloproctologia e Intestino"},{"number":39,"area":"Cirurgia Geral","stem":"Pacientes com ileostomia podem apresentar distúrbios hidroeletrolíticos importantes, decorrentes da perda de eletrólitos pelo efluente ileal. A concentração de sódio no efluente ileal é em torno de","options":{"A":"25 mEg/L.","B":"50 mEq/L.","C":"100 mEq/L.","D":"200 mEq/L.","E":"300 mEq/L."},"answer":"D","topic":"Nutrição e Metabolismo"},{"number":40,"area":"Cirurgia Geral","stem":"O chamado canal anal cirúrgico diverge do canal anal anatômico. O canal anal cirúrgico possui comprimento de cerca de","options":{"A":"1 cm.","B":"2 cm.","C":"4 cm.","D":"6 cm.","E":"8 cm."},"answer":"C","topic":"Coloproctologia e Intestino"},{"number":41,"area":"Otorrinolaringologia","stem":"Em relação à otite média secretora na infância, assinale a afirmativa mais apropriada em relação à conduta diagnóstica inicial.","options":{"A":"A realização de tomografia computadorizada de mastoides é obrigatória em todos os casos.","B":"A timpanometria é pouco útil, pois não fornece dados confiáveis sobre a presença de líquido na orelha média.","C":"A avaliação audiológica deve ser postergada até o surgimento de queixas auditivas objetivas.","D":"A otoscopia pneumática deve ser utilizada para avaliação da mobilidade da membrana timpânica.","E":"A prescrição de antibióticos deve ser feita em todos os casos suspeitos, mesmo sem sinais de infecção aguda."},"answer":"D","topic":"Otologia e Audiologia"},{"number":42,"area":"Otorrinolaringologia","stem":"No tratamento das rinossinusites crônicas sem polipose nasal, das opções abaixo, assinale a que é considerada de primeira linha no manejo clínico.","options":{"A":"Lavagem nasal com solução salina e uso de corticoide tópico.","B":"Antibioticoterapia sistêmica por até 3 dias.","C":"Corticoterapia oral por tempo indeterminado.","D":"Uso diário de descongestionantes tópicos vasoconstritores.","E":"Cirurgia endoscópica nasossinusal imediata."},"answer":"A","topic":"Rinologia e Rinossinusites"},{"number":43,"area":"Otorrinolaringologia","stem":"Na avaliação otoneurológica, o teste de Romberg alterado sugere","options":{"A":"distúrbio exclusivamente coclear.","B":"lesão vestibular periférica ou comprometimento da propriocepção.","C":"alteração exclusiva da motricidade ocular.","D":"presença de nistagmo posicional típico da VPPB.","E":"hipersensibilidade auditiva bilateral."},"answer":"B","topic":"Vestibulologia"},{"number":44,"area":"Otorrinolaringologia","stem":"Sobre o uso do diapasão em testes clínicos de triagem auditiva, assinale a afirmativa correta.","options":{"A":"O teste de Weber lateraliza sempre para o lado normal em perdas condutivas.","B":"O teste de Rinne é positivo quando a condução óssea é melhor que a aérea.","C":"Em perdas neurossensoriais, o Rinne geralmente é negativo.","D":"O teste de Weber lateraliza para o lado afetado nas perdas condutivas.","E":"Diapasão de 128 Hz é o mais indicado para triagem auditiva."},"answer":"D","topic":"Otologia e Audiologia"},{"number":45,"area":"Otorrinolaringologia","stem":"Assinale a afirmativa correta sobre o desvio septal nasal.","options":{"A":"A cirurgia corretiva deve ser realizada preferencialmente antes dos 5 anos de idade.","B":"O desvio septal raramente causa obstrução nasal significativa.","C":"A septoplastia é indicada apenas em casos com perfuração septal.","D":"Pode estar associado à hipertrofia compensatória do corneto contralateral.","E":"O desvio septal não interfere na respiração durante o sono."},"answer":"D","topic":"Rinologia e Rinossinusites"},{"number":46,"area":"Otorrinolaringologia","stem":"Em relação às otites médias recorrentes na infância, a seguinte conduta está correta:","options":{"A":"a timpanotomia com colocação de tubo de ventilação é indicada após o primeiro episódio de otite.","B":"a profilaxia antibiótica contínua é sempre preferida em relação à intervenção cirúrgica.","C":"a presença de perda auditiva associada pode justificar indicação cirúrgica precoce.","D":"o uso de descongestionantes orais reduz comprovadamente a frequência de infecções.","E":"a adenoidectomia é contraindicada em crianças menores de 5 anos."},"answer":"C","topic":"Otologia e Audiologia"},{"number":47,"area":"Otorrinolaringologia","stem":"A função da audiometria vocal é","options":{"A":"avaliar prioritariamente o ganho com aparelhos auditivos.","B":"medir os limiares auditivos em diferentes frequências.","C":"avaliar principalmente lesões retrococleares.","D":"substituir completamente a audiometria tonal liminar.","E":"identificar limiar de recepção da fala e discriminação de palavras."},"answer":"E","topic":"Otologia e Audiologia"},{"number":48,"area":"Otorrinolaringologia","stem":"Em pacientes com perfuração timpânica traumática recente, a seguinte conduta inicial é mais adequada:","options":{"A":"realizar lavagem otológica com soro fisiológico para remover debris.","B":"iniciar antibiótico sistêmico por 10 dias e manter ouvido tampado.","C":"observar clinicamente por algumas semanas, evitando entrada de água.","D":"encaminhar imediatamente para timpanoplastia cirúrgica.","E":"efetuar irrigação auricular com álcool boricado a 3%."},"answer":"C","topic":"Otologia e Audiologia"},{"number":49,"area":"Otorrinolaringologia","stem":"No exame de nistagmo espontâneo, a seguinte característica sugere origem periférica:","options":{"A":"nistagmo vertical puro.","B":"ausência de supressão com fixação ocular.","C":"presença de nistagmo multidirecional.","D":"nistagmo horizontal, unidirecional, com supressão à fixação.","E":"nistagmo que se inverte com o olhar lateral."},"answer":"D","topic":"Vestibulologia"},{"number":50,"area":"Otorrinolaringologia","stem":"Em relação à fisiopatologia da rinite vasomotora, é correto afirmar que","options":{"A":"é uma rinite infecciosa com predomínio de neutrófilos.","B":"está relacionada à hiper-reatividade do sistema parassimpático nasal.","C":"apresenta eosinofilia nasal como característica diagnóstica obrigatória.","D":"tem como tratamento de escolha os antibióticos tópicos nasais.","E":"é determinada como sendo secundária a uso crônico de descongestionantes tópicos."},"answer":"B","topic":"Rinologia e Rinossinusites"},{"number":51,"area":"Otorrinolaringologia","stem":"Sobre o exame físico do nariz, assinale a afirmativa correta.","options":{"A":"A rinoscopia anterior permite avaliação direta do óstio do seio esfenoidal.","B":"A inspeção externa nasal é desnecessária em casos de obstrução nasal unilateral.","C":"A rinoscopia anterior avalia septo, cornetos inferiores e secreções na cavidade nasal.","D":"A presença de pólipos nasais impede completamente a realização da rinoscopia anterior.","E":"O exame rinoscópico é contraindicado em pacientes com rinite alérgica."},"answer":"C","topic":"Rinologia e Rinossinusites"},{"number":52,"area":"Otorrinolaringologia","stem":"Assinale a opção que apresenta uma contraindicação relativa à realização da prova calórica com água.","options":{"A":"Zumbido bilateral.","B":"Presença de otite externa aguda.","C":"Presbiacusia.","D":"Vertigem posicional paroxística benigna.","E":"Disacusia súbita unilateral."},"answer":"B","topic":"Vestibulologia"},{"number":53,"area":"Otorrinolaringologia","stem":"Em relação ao zumbido, é correto afirmar que","options":{"A":"o zumbido objetivo é sempre causado por distúrbios do sistema nervoso central.","B":"o zumbido pulsátil deve ser avaliado com atenção por possível origem vascular.","C":"o zumbido bilateral de início gradual raramente tem origem auditiva.","D":"a acufenometria é um exame que visa ao diagnóstico diferencial com perda condutiva.","E":"o zumbido é, por definição, um sinal de urgência médica."},"answer":"B","topic":"Otologia e Audiologia"},{"number":54,"area":"Otorrinolaringologia","stem":"Na propedêutica do labirintopata, a manobra de Dix-Hallpike é empregada principalmente para","options":{"A":"induzir zumbido em pacientes com perda auditiva unilateral.","B":"identificar hiporreflexia vestibular bilateral.","C":"confirmar vertigem central causada por esclerose múltipla.","D":"diagnosticar vertigem posicional paroxística benigna de canal posterior.","E":"medir limiares auditivos de condução óssea."},"answer":"D","topic":"Vestibulologia"},{"number":55,"area":"Otorrinolaringologia","stem":"Das situações elencadas a seguir, assinale a que representa uma indicação clássica para cirurgia de adenotonsilectomia em crianças.","options":{"A":"Apenas dois episódios de amigdalite por ano, com boa resposta a analgésicos.","B":"Ronco noturno sem apneia associada, com exames laboratoriais normais.","C":"Otalgia recorrente sem evidência de otite média ou infecção de vias aéreas superiores.","D":"Rinite alérgica perene não controlada com corticoterapia tópica nasal.","E":"Apneia obstrutiva do sono documentada por polissonografia com comprometimento ventilatório."},"answer":"E","topic":"Sono e Via Aérea Superior"},{"number":56,"area":"Otorrinolaringologia","stem":"No diagnóstico da rinite medicamentosa, dos achados a seguir, o mais característico é a","options":{"A":"obstrução nasal associada a prurido e espirros intensos.","B":"secreção nasal purulenta unilateral associada a febre.","C":"obstrução nasal persistente após uso prolongado de vasoconstritor tópico.","D":"presença de pólipos nasais visíveis à rinoscopia anterior.","E":"hipoacusia associada a espessamento da mucosa septal."},"answer":"C","topic":"Rinologia e Rinossinusites"},{"number":57,"area":"Otorrinolaringologia","stem":"O principal mecanismo fisiopatológico da vertigem em pacientes com doença de Ménière é a(o)","options":{"A":"destruição dos otólitos no utrículo.","B":"inflamação do nervo vestibular.","C":"presença de fístula perilinfática traumática.","D":"atrofia progressiva do canal semicircular posterior.","E":"aumento da pressão endolinfática no labirinto membranoso."},"answer":"E","topic":"Vestibulologia"},{"number":58,"area":"Otorrinolaringologia","stem":"Durante o exame físico otológico, a presença de nível hidroaéreo visível por otoscopia indica","options":{"A":"otosclerose.","B":"otite média com efusão.","C":"otite externa difusa.","D":"miringoesclerose sem secreção.","E":"perfuração timpânica seca."},"answer":"B","topic":"Otologia e Audiologia"},{"number":59,"area":"Otorrinolaringologia","stem":"Dos exames elencados a seguir, assinale o mais adequado para investigação inicial de rinossinusite crônica refratária ao tratamento clínico.","options":{"A":"Endoscopia digestiva alta.","B":"Nasofibrolaringoscopia.","C":"Ressonância magnética de crânio.","D":"Radiografia simples de cavidade nasal.","E":"Tomografia computadorizada de seios paranasais."},"answer":"E","topic":"Rinologia e Rinossinusites"},{"number":60,"area":"Otorrinolaringologia","stem":"A principal característica clínica da paracusia de recrutamento encontrada em perdas auditivas neurossensoriais é","options":{"A":"a melhora auditiva em ambientes silenciosos.","B":"uma audição normal com zumbido intermitente.","C":"um incômodo exagerado a sons de intensidade moderada.","D":"uma alteração no equilíbrio corporal em repouso.","E":"uma otalgia desencadeada por sons agudos."},"answer":"C","topic":"Otologia e Audiologia"},{"number":61,"area":"Otorrinolaringologia","stem":"Sobre a válvula nasal, formada por duas regiões anatomicamente próximas, que podem ser responsáveis isoladamente ou em conjunto pela sua insuficiência, assinale a afirmativa correta.","options":{"A":"A válvula nasal interna é um ângulo formado medialmente pela porção superior do septo nasal, superiormente e lateralmente pela porção caudal da cartilagem lateral superior e inferiormente pela cabeça do corneto inferior.","B":"É o local de menor resistência na via aérea superior.","C":"A válvula nasal externa é formada medialmente pelo septo caudal e columela, pelo triângulo frágil anteriormente, pelo rebordo alar lateralmente e pelo assoalho do vestíbulo nasal inferiormente.","D":"O restabelecimento da válvula nasal depende da abordagem cirúrgica de corneto inferior, septo nasal e parede nasal lateral.","E":"O uso de dilatadores nasais externos não ajuda no diagnóstico, mas representa terapêutica bastante eficaz."},"answer":"A","topic":"Rinologia e Rinossinusites"},{"number":62,"area":"Otorrinolaringologia","stem":"Em relação às deformidades de pavilhão auricular, como a orelha de abano, e às otoplastias, assinale a afirmativa correta.","options":{"A":"A orelha em abano é considerada uma malformação.","B":"A orelha em abano é transmitida geneticamente através de herança mendeliana autossômica dominante.","C":"A orelha de abano é normalmente assimétrica ou unilateral.","D":"O mau posicionamento do pavilhão pode ser decorrente do tamanho reduzido da concha, que projeta todo o pavilhão anteriormente.","E":"Normalmente, o pavilhão está posicionado em 50 com relação à cabeça e, quando apresenta-se com ângulos maiores, caracteriza-se a orelha em abano."},"answer":null,"topic":"Otologia e Audiologia"},{"number":63,"area":"Otorrinolaringologia","stem":"A respeito da halitose, assinale a afirmativa correta.","options":{"A":"A origem do mau hálito está localizada na cavidade oral em 50% dos casos.","B":"O odor desagradável está, na maioria das vezes, relacionado à presença de compostos provenientes da ação de enzimas proteolíticas de bactérias Gram positivas aeróbicas presentes na cavidade oral.","C":"As cáries são inerentemente malcheirosas, pois causam grandes espaços passíveis de acúmulo de alimentos.","D":"A salivação deve ser observada, já que o fluxo salivar aumentado favorece a halitose.","E":"A camada superficial da saburra está em constante contato com o ar formando uma camada anaeróbica. Já nas camadas profundas existem áreas com baixa concentração de oxigênio favorecendo a proliferação de bactérias aeróbicas."},"answer":"B","topic":"Cavidade Oral e Faringologia"},{"number":64,"area":"Otorrinolaringologia","stem":"Quanto aos dispositivos intraorais, assinale a afirmativa correta.","options":{"A":"Os elevadores de palato mole são muito eficazes e utilizados.","B":"Os retentores linguais retêm a língua mediante pressão negativa, levando à sua posteriorização e facilitando a passagem do ar.","C":"Os retentores linguais são melhor tolerados e mais usados em pacientes desdentados.","D":"O aparelho de avanço mandibular é o tipo mais utilizado atualmente, deslocando a mandíbula e a língua anteriormente, e devem ser utilizados continuamente, dia e noite.","E":"Os aparelhos intraorais de avanço mandibular formados por duas peças não permitem realizar avanço progressivo."},"answer":"C","topic":"Sono e Via Aérea Superior"},{"number":65,"area":"Otorrinolaringologia","stem":"Sobre os aparelhos intraorais de avanço mandibular, assinale a afirmativa correta.","options":{"A":"O efeito sobre a apneia dos aparelhos feitos sob medida e dos fornecidos prontos pré-moldados, é semelhante.","B":"Estão indicados para pacientes com apneia que não tolerem e não se adaptem ao aparelho de pressão aérea positiva (CPAP).","C":"Não podem ser associados ao uso de CPAP.","D":"A protusão individual não é fato preditivo de sua eficácia.","E":"Os pacientes com apneia supinodependente apresentam pior resposta."},"answer":"B","topic":"Sono e Via Aérea Superior"},{"number":66,"area":"Otorrinolaringologia","stem":"Sobre a aplicação do aparelho de pressão aérea positiva (CPAP), assinale a afirmativa correta.","options":{"A":"A pressão do CPAP deverá ser aumentada até os eventos respiratórios serem reduzidos em 50%, como apneias, hipopneias, despertares relacionados a esforços respiratórios e ronco.","B":"Para pressões acima de 10 cm H2O o uso de BiPAP (pressão positiva em dois níveis de pressão na via aérea superior) deve ser recomendado.","C":"O limite máximo de pressão recomendado é de 20 cm H2O para pacientes acima de 12 anos.","D":"Numa titulação “ótima” o índice de apneia-hipopneia deve estar abaixo de 15 eventos por hora de sono e a saturação mínima da oxi-hemoglobina acima de 85%.","E":"O tratamento com CPAP restaura totalmente a disfunção cognitiva e os domínios da memória e função executiva, tais como memória de trabalho, flexibilidade mental, planejamento, resolução de problemas, inibição e fluência verbal."},"answer":"C","topic":"Sono e Via Aérea Superior"},{"number":67,"area":"Otorrinolaringologia","stem":"Em relação à influência de condições clínicas e medicamentos na qualidade do sono, assinale a afirmativa correta.","options":{"A":"Não há relação entre refluxo faringolaríngeo e apneia do sono.","B":"Na mulher, os roncos e as apneias aparecem somente na forma precoce de menopausa e são decorrentes da perda do tônus muscular faríngeo oferecido pelo estrogênio.","C":"As metilxantinas aumentam a latência para o sono, diminuem o tempo total de sono, aumentam os despertares e a latência para o sono REM, e diminuem a porcentagem do sono REM.","D":"O tratamento de doenças da tireoide com hormônios tiroideanos melhora a qualidade do sono, mas não reduz a sonolência diurna excessiva.","E":"A reposição exógena de estrógenos está indicada para todas as mulheres em menopausa e apneia do sono."},"answer":"C","topic":"Sono e Via Aérea Superior"},{"number":68,"area":"Otorrinolaringologia","stem":"Em relação à síndrome do respirador oral, assinale a afirmativa correta.","options":{"A":"Trata-se de uma adaptação fisiológica associada a desvios do padrão de crescimento dentocraniofacial.","B":"Não está associada a maior frequência de infecções das vias aéreas superiores.","C":"Trata-se de alteração mais prevalente em adultos, associada a desvios do septo nasal.","D":"A respiração oral ativa sistemas distintos para o estímulo do crescimento e pode resultar em uma variação morfológica da face.","E":"São alterações características a inversão de lábio inferior, hiperdesenvolvido, alargamento narinário e hipertonia da musculatura perioral."},"answer":"D","topic":"Sono e Via Aérea Superior"},{"number":69,"area":"Otorrinolaringologia","stem":"Em relação às indicações de adenoidectomia e/ou amigdalectomia (tonsilectomia faríngea e/ou palatina), assinale a afirmativa correta.","options":{"A":"Doenças imunomediadas pelo Streptococcus pyogenes, como o reumatismo poliarticular agudo, a glomerulonefrite difusa aguda não se beneficiam da tonsilectomia.","B":"A formação do caseum ou tonsiolito nas criptas tonsilares causa halitose e representa indicação formal de tonsilectomia.","C":"Complicações locorregionais das infecções tonsilares tais como otites médias crônicas secretoras, rinossinusites e laringotraqueítes recorrentes, são raras.","D":"A administração de antimicrobianos no pós-operatório de tonsilectomias durante 7 a 10 dias traz benefícios adicionais.","E":"Nos casos de abscesso peritonsilar a indicação de tonsilectomia é controversa e deve ser restrita aos casos de infecções recorrentes."},"answer":"E","topic":"Sono e Via Aérea Superior"},{"number":70,"area":"Otorrinolaringologia","stem":"Em relação às técnicas cirúrgicas nas amigdalectomias, assinale a afirmativa correta.","options":{"A":"A técnica de dissecção extracapsular auxiliada pelo eletrocautério é raramente indicada.","B":"A utilização de microdebridador e bisturi bipolar de alta radiofrequência (Coblation®) oferecem substancial redução da dor pós-operatória e menor ocorrência de sangramento.","C":"A utilização de bisturi elétrico bipolar auxilia na dissecção e na hemostasia.","D":"As tonsilectomias parciais, quando realizadas em crianças maiores que 3 anos, não têm risco significativo de recidiva de hiperplasia tonsilar ou reintervenção cirúrgica.","E":"A administração de corticosteroides no pós-operatório imediato não ocasiona redução da dor e retorno alimentar mais precoce."},"answer":"C","topic":"Sono e Via Aérea Superior"},{"number":71,"area":"Otorrinolaringologia","stem":"Em relação à anquiloglossia, é correto afirmar que","options":{"A":"é mais comum em homens brancos.","B":"não apresenta relação com síndromes ou questões genéticas.","C":"existem evidências de que a frenectomia a laser seja a mais segura.","D":"não há indicação para terapia fonoaudiológica.","E":"pode causar limitações para a fala e mastigação, e efeitos como recessão gengival e má-oclusão."},"answer":"E","topic":"Cavidade Oral e Faringologia"},{"number":72,"area":"Otorrinolaringologia","stem":"Sobre a leucoplasia pilosa lingual, assinale a afirmação correta.","options":{"A":"É causada pelo vírus Epstein--Barr (EBV) e ocorre em pacientes imunossuprimidos.","B":"É considerada agressiva e de moderada morbidade.","C":"A sorologia positiva é patognomônica.","D":"Se manifesta como placa acinzentada escura corrugada na borda lateral da língua que não se destaca à raspagem.","E":"A biópsia está indicada, mas a identificação histológica é difícil."},"answer":"A","topic":"Cavidade Oral e Faringologia"},{"number":73,"area":"Otorrinolaringologia","stem":"Quanto às doenças sistêmicas que causam manifestações orais, assinale a afirmativa correta.","options":{"A":"O lúpus se manifesta na mucosa oral usualmente por lesões semelhantes a líquen plano e leucoplasias.","B":"São 12 as doenças sistêmicas que causam manifestações orais.","C":"A biópsia incisional é obrigatória para a definição diagnóstica.","D":"Por definição, em todos os casos, as manifestações orais são a primeira evidência da doença sistêmica.","E":"Na esclerodermia surgem gengivite, ressecamento oral, perda dentária e lesões endurecidas na mucosa."},"answer":"E","topic":"Cavidade Oral e Faringologia"},{"number":74,"area":"Otorrinolaringologia","stem":"Em relação às glândulas salivares e as sialoadenites, é correto afirmar que","options":{"A":"cerca de 50% da saliva é produzido pelas parótidas, submandibulares e sublinguais.","B":"o citomegalovírus normalmente promove infecções sistêmicas e possui tropismo por glândulas salivares.","C":"a caxumba está relacionada à infecção pelo paramixovírus, havendo maior incidência entre 8 e 12 anos de idade.","D":"exames de imagem auxiliam no diagnóstico, e a sialoendoscopia é a terapêutica mais empregada.","E":"a viscosidade da saliva produzida pela glândula parótida é a maior e a menor é a da submandibular."},"answer":"B","topic":"Glândulas Salivares"},{"number":75,"area":"Otorrinolaringologia","stem":"Sobre as sialolitíases, assinale a afirmativa correta.","options":{"A":"Ocorrem raramente associadas à sialoadenite crônica.","B":"Predominam em pacientes na faixa etária entre 30 e 50 anos.","C":"A sialorressonância magnética é um exame mais preciso para avaliar o parênquima glandular e o ducto de drenagem.","D":"Distribuem-se igualmente entre as glândulas maiores.","E":"Há direta correlação entre os níveis de cálcio sérico e a sua formação."},"answer":"C","topic":"Glândulas Salivares"},{"number":76,"area":"Otorrinolaringologia","stem":"Sobre hipossalivação e xerostomia, assinale a afirmativa correta.","options":{"A":"Xerostomia e hipossalivação são sinônimos.","B":"O tratamento da hipossalivação e da xerostomia se inicia no uso de saliva artificial e na ingesta de ácidos e cítricos.","C":"O uso sistêmico de cloridrato de pilocarpina em dose única diária resulta em aumento de salivação após uma semana de uso.","D":"O cloridrato de pilocarpina é bem tolerado por pacientes com úlcera gastrintestinal e mal de Parkinson.","E":"O cloreto de betanecol gera menor quantidade de efeitos colaterais, maior tempo de atividade sialogoga e melhor custo-benefício do que a pilocarpina."},"answer":"E","topic":"Glândulas Salivares"},{"number":77,"area":"Otorrinolaringologia","stem":"Quanto à sialorreia, assinale a afirmativa correta.","options":{"A":"É comum em condições neurológicas e pode ser causada pela produção excessiva de saliva ou diminuição da deglutição.","B":"A babugem é geralmente associada com aumento da produção salivar.","C":"Na sialorreia paroxística idiopática, os episódios podem durar algumas horas, sem outros sintomas.","D":"Trata-se de um fenômeno fisiológico em recém-nascidos, devendo cessar em torno dos 6 meses.","E":"O uso de medicamentos anticolinérgicos reduz o volume de saliva, mas pode causar flatulência, incontinência urinária e insônia."},"answer":"A","topic":"Glândulas Salivares"},{"number":78,"area":"Otorrinolaringologia","stem":"Sobre as mudanças vocais causadas pela variação dos hormônios, assinale a afirmativa correta.","options":{"A":"Mudanças vocais relacionadas a hormônios sexuais começam a ser percebidas a partir dos 11 anos.","B":"A muda vocal relativa à puberdade inicia-se a partir dos 12 anos, completando-se aos 15 em ambos os sexos.","C":"As variações vocais durante o ciclo menstrual são determinadas por preponderância de estrógeno ou progesterona, com efeitos laríngeos diversos.","D":"Substâncias androgênicas exógenas são componentes de contraceptivos orais, e seu uso representa um enorme risco para cantoras.","E":"A laringopatia da gravidez é mais perceptível em cantoras no terceiro trimestre da gestação, tornando a voz mais aguda e trêmula."},"answer":"C","topic":"Laringologia e Voz"},{"number":79,"area":"Otorrinolaringologia","stem":"Sobre os efeitos vocais das disfunções da tireoide, assinale a afirmativa correta.","options":{"A":"No hipotireoidismo as alterações vocais são decorrentes do aumento da massa das pregas vocais, o que acarreta proporcional aumento da frequência fundamental.","B":"No hipertireoidismo ocorre fadiga vocal e perda da extensão vocal, a voz é áspera ou grave.","C":"No hipotireoidismo grave com mixedema, há grande diminuição da força muscular e pode surgir paresia ou paralisia da prega vocal.","D":"O hipertireoidismo leve causa precocemente problemas vocais, com aumento da intensidade da voz e tremor na emissão.","E":"O hipertireoidismo moderado causa problemas vocais, com diminuição da intensidade da voz e tremor na emissão."},"answer":"C","topic":"Laringologia e Voz"},{"number":80,"area":"Otorrinolaringologia","stem":"Sobre a semiologia da laringe, assinale a afirmativa correta.","options":{"A":"Na laringoscopia solicita-se a emissão da vogal /i/ porque esta permite o rebaixamento da laringe, facilitando a visão da região anterior da glote.","B":"O estroboscópio capta a frequência de vibração das pregas vocais e emite luz entrecortada em ciclos sucessivos e regulares, sem defasagem, o que nos dá a falsa impressão de câmera lenta.","C":"Na escala RASATI avalia-se rouquidão, aspereza, soprosidade, astenia, tensão e instabilidade, graduando-se cada uma dessas características vocais em três graus.","D":"A avaliação acústica da voz é essencial na monitorização do tratamento do paciente, dispensando a avaliação perceptiva e auditiva da voz.","E":"Para a realização da laringoscopia em consultório é obrigatória a anestesia tópica na orofaringe. Realização"},"answer":"C","topic":"Laringologia e Voz"}]}};

function saveState(id,opts={}){if(!opts.preserveTime)states[id].updatedAt=new Date().toISOString();saveLocal(id);if(!opts.skipCloud)queueCloud(id)}
function queueCloud(id){if(!sb||!currentUser)return;clearTimeout(syncTimers[id]);setCloud('Alterações pendentes','warn');syncTimers[id]=setTimeout(()=>pushProgress(id),550)}
async function pushProgress(id){if(!sb||!currentUser)return;try{setCloud('Salvando…','warn');const s=states[id];const{error}=await sb.from('quiz_progress').upsert({user_id:currentUser.id,quiz_id:id,progress:s,updated_at:s.updatedAt||new Date().toISOString()},{onConflict:'user_id,quiz_id'});if(error)throw error;setCloud('Sincronizado','ok')}catch(e){console.error(e);setCloud('Falha ao sincronizar','bad')}}
function chooseNewest(local,cloud,rowTime,exam){const l=normalizeState(local,exam),c=normalizeState(cloud,exam);return stateTime(l)>=(Date.parse(rowTime||'')||stateTime(c))?l:c}
async function syncAll(){if(!sb||!currentUser)return;setCloud('Sincronizando…','warn');try{const{data,error}=await sb.from('quiz_progress').select('quiz_id,progress,updated_at').eq('user_id',currentUser.id).in('quiz_id',EXAM_IDS);if(error)throw error;const by={};(data||[]).forEach(r=>by[r.quiz_id]=r);for(const id of EXAM_IDS){const row=by[id];if(row)states[id]=chooseNewest(states[id],row.progress,row.updated_at,EXAMS[id]);saveLocal(id);if(!row&&hasProgress(states[id]))await pushProgress(id)}for(const id of EXAM_IDS)await ensureAttempt(id);await loadAttempts();setCloud('Sincronizado','ok');render()}catch(e){console.error(e);setCloud('Falha ao sincronizar','bad')}}
function setCloud(text,kind=''){const el=$('#cloudPill');if(!el)return;el.textContent=currentUser?'☁ '+text:'☁ Somente local';el.className='cloudpill '+kind}
function authBoxHtml(){if(currentUser)return `<div class="card authbox"><div class="row space"><div><b>Sincronização ativa</b><div class="muted" style="font-size:12px">${esc(currentUser.email||'')}</div></div><div class="row"><button class="secondary" onclick="syncAll()">Sincronizar agora</button><button class="secondary" onclick="logout()">Sair</button></div></div><div id="authMsg" class="authmsg"></div></div>`;return `<div class="card authbox"><b>Sincronização entre dispositivos</b><div class="muted" style="font-size:12px;margin:5px 0 10px">Entre com o mesmo e-mail em todos os aparelhos.</div><div class="row"><input id="emailInput" type="email" placeholder="seu e-mail"><button class="primary" onclick="login()">Enviar link de acesso</button></div><div id="authMsg" class="authmsg"></div></div>`}
function authMsg(text,kind=''){const e=$('#authMsg');if(e){e.textContent=text;e.className='authmsg '+kind}}
async function login(){if(!sb)return authMsg('Biblioteca de sincronização indisponível.','bad');const email=$('#emailInput')?.value.trim();if(!email)return authMsg('Digite seu e-mail.','warn');authMsg('Enviando link…','warn');const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:REDIRECT_URL}});if(error)return authMsg(error.message,'bad');authMsg('Link enviado. Abra o e-mail neste dispositivo.','ok')}
async function logout(){if(sb)await sb.auth.signOut();currentUser=null;stopRealtime();setCloud('Somente local');render()}
async function initAuth(){if(!sb)return;const{data}=await sb.auth.getSession();currentUser=data?.session?.user||null;if(currentUser){startRealtime();await syncAll()}sb.auth.onAuthStateChange(async(ev,session)=>{currentUser=session?.user||null;if(currentUser){startRealtime();setTimeout(syncAll,0)}else{stopRealtime();setCloud('Somente local');render()}})}
function startRealtime(){if(!sb||!currentUser||realtimeChannel)return;realtimeChannel=sb.channel('quiz-progress-'+currentUser.id).on('postgres_changes',{event:'*',schema:'public',table:'quiz_progress',filter:'user_id=eq.'+currentUser.id},payload=>{const r=payload.new;if(!r||!EXAMS[r.quiz_id])return;if((Date.parse(r.updated_at||'')||0)>stateTime(states[r.quiz_id])){states[r.quiz_id]=normalizeState(r.progress,EXAMS[r.quiz_id]);saveLocal(r.quiz_id);render()}}).subscribe()}
function stopRealtime(){if(sb&&realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=null}
function score(id){const e=EXAMS[id],s=states[id],valid=e.questions.filter(q=>q.answer);let correct=0;const areas={},topics={};for(const q of e.questions){if(!areas[q.area])areas[q.area]={correct:0,total:0,answered:0};if(!topics[q.topic])topics[q.topic]={correct:0,total:0,answered:0};if(q.answer){areas[q.area].total++;topics[q.topic].total++}const a=s.answers[q.number];if(a&&q.answer){areas[q.area].answered++;topics[q.topic].answered++;if(a===q.answer){correct++;areas[q.area].correct++;topics[q.topic].correct++}}}return{correct,total:valid.length,pct:valid.length?Math.round(correct/valid.length*100):0,areas,topics,wrong:e.questions.filter(q=>q.answer&&s.answers[q.number]&&s.answers[q.number]!==q.answer).map(q=>q.number)}}
function answeredCount(id){return Object.keys(states[id].answers).length}
function reviewedCount(id){return Object.values(states[id].review).filter(Boolean).length}
function examCard(id){const e=EXAMS[id],s=states[id],sc=score(id),ans=answeredCount(id);return `<div class="card examcard"><div class="row space"><div><h3>${e.label}</h3><div class="muted" style="font-size:12px">${e.order}</div></div>${s.finished?`<div class="bigpct">${sc.pct}%</div>`:''}</div><div class="progress"><div class="bar" style="width:${ans/80*100}%"></div></div><div class="metrics"><div class="metric"><b>${ans}/80</b><span>respondidas</span></div><div class="metric"><b>${reviewedCount(id)}</b><span>para revisar</span></div><div class="metric"><b>${s.finished?sc.correct+'/'+sc.total:'—'}</b><span>acertos</span></div></div><div class="row"><button class="primary" onclick="openExam('${id}')">${ans?'Continuar':'Iniciar prova'}</button>${s.finished?`<button class="secondary" onclick="openExam('${id}',{status:'wrong'})">Ver erradas</button>`:''}</div></div>`}
function renderHome(){view='home';currentExamId=null;$('#app').innerHTML=`${authBoxHtml()}<div class="section-title"><div><h2>Provas</h2><div class="muted">Seu progresso é independente em cada edição e sincronizado pela mesma conta.</div></div></div><div class="homegrid">${EXAM_IDS.map(examCard).join('')}</div><div class="section-title" style="margin-top:24px"><div><h2>Atalhos de estudo</h2><div class="muted">Revise por padrão de erro, tema ou histórico.</div></div></div><div class="homegrid"><div class="card pad"><h3 style="margin-top:0">Questões erradas</h3><p class="muted">Abra uma prova finalizada e filtre somente as respostas incorretas.</p><div class="row">${EXAM_IDS.filter(id=>states[id].finished).map(id=>`<button class="secondary" onclick="openExam('${id}',{status:'wrong'})">${EXAMS[id].label}</button>`).join('')||'<span class="muted">Finalize uma prova para liberar.</span>'}</div></div><div class="card pad"><h3 style="margin-top:0">Revisão por tema</h3><p class="muted">Agrupa as 160 questões em temas amplos para revisão dirigida.</p><button class="primary" onclick="go('topics')">Abrir temas</button></div></div>`;setNav();setCloud(currentUser?'Sincronizado':'Somente local',currentUser?'ok':'')}
function go(v){if(v==='home')return renderHome();if(v==='performance')return renderPerformance();if(v==='topics')return renderTopics()}
function setNav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function openExam(id,opts={}){currentExamId=id;view='exam';const s=states[id];if(opts.status)s.statusFilter=opts.status;if(opts.topic)s.topicFilter=opts.topic;const vis=visibleQuestions(id);if(vis.length&&!vis.some(q=>q.number===s.current))s.current=vis[0].number;saveState(id,{skipCloud:true,preserveTime:true});renderExam();setNav()}
function visibleQuestions(id){const e=EXAMS[id],s=states[id],sc=score(id);return e.questions.filter(q=>{if(s.topicFilter!=='all'&&q.topic!==s.topicFilter)return false;if(s.statusFilter==='unanswered'&&s.answers[q.number])return false;if(s.statusFilter==='review'&&!s.review[q.number])return false;if(s.statusFilter==='wrong'&&(!s.finished||!(q.answer&&s.answers[q.number]&&s.answers[q.number]!==q.answer)))return false;return true})}
function renderExam(){const id=currentExamId,e=EXAMS[id],s=states[id],vis=visibleQuestions(id);if(!vis.length){s.current=1}else if(!vis.some(q=>q.number===s.current))s.current=vis[0].number;const q=e.questions.find(x=>x.number===s.current)||e.questions[0];const sc=score(id),topics=[...new Set(e.questions.map(x=>x.topic))].sort();$('#app').innerHTML=`<div class="exam-layout"><section><div class="card question ${s.finished?'finished':''}">${q.answer?'':`<div class="banner">Questão anulada no gabarito oficial — não entra na nota.</div>`}<div class="qmeta"><div><div class="qnum">Questão ${q.number} · ${e.label}</div><div class="area">${esc(q.area)}</div><div class="topic">${esc(q.topic)}</div></div><button class="reviewbtn" onclick="toggleReview()">${s.review[q.number]?'★ Marcada':'☆ Marcar para revisar'}</button></div><div class="stem">${esc(q.stem)}</div><div id="opts"></div><div class="actions"><button class="secondary" onclick="move(-1)">← Anterior</button><button class="primary" onclick="move(1)">Próxima →</button></div></div>${s.finished?resultHtml(id):''}</section><aside class="card side"><div class="row space"><b>Filtros</b><span class="badge">${vis.length} questões</span></div><div class="filters" style="margin-top:10px"><select onchange="setTopic(this.value)"><option value="all">Todos os temas</option>${topics.map(t=>`<option ${s.topicFilter===t?'selected':''} value="${esc(t)}">${esc(t)}</option>`).join('')}</select><div class="filterchips">${[['all','Todas'],['unanswered','Não respondidas'],['review','Revisar'],['wrong','Erradas']].map(([v,l])=>`<button class="secondary ${s.statusFilter===v?'active':''}" ${v==='wrong'&&!s.finished?'disabled title="Disponível após finalizar"':''} onclick="setStatus('${v}')">${l}</button>`).join('')}</div></div><div class="grid">${vis.map(x=>`<button class="qbtn ${s.answers[x.number]?'answered':''} ${s.review[x.number]?'reviewed':''} ${x.number===s.current?'current':''} ${!x.answer?'anulada':''}" onclick="jump(${x.number})">${x.number}</button>`).join('')}</div><div class="footerBtns">${!s.finished?'<button class="primary" onclick="finishExam()">Finalizar e corrigir</button>':`<button class="secondary" onclick="retryWrong()">Refazer somente as erradas</button><button class="secondary" onclick="newAttempt()">Nova tentativa completa</button>`}<button class="secondary" onclick="syncAll()">Sincronizar agora</button></div><div class="tiny">Respondidas: ${answeredCount(id)}/80 · Revisar: ${reviewedCount(id)}. Questões anuladas não entram no cálculo.</div></aside></div>`;
const box=$('#opts');for(const [letter,text] of Object.entries(q.options)){const d=document.createElement('div');d.className='opt'+(s.answers[q.number]===letter?' selected':'');if(s.finished&&q.answer===letter)d.classList.add('correct');if(s.finished&&s.answers[q.number]===letter&&q.answer&&letter!==q.answer)d.classList.add('wrong');d.innerHTML=`<div class="letter">${letter}</div><div>${esc(text)}</div>`;if(!s.finished)d.onclick=()=>answer(letter);box.appendChild(d)}setCloud(currentUser?'Sincronizado':'Somente local',currentUser?'ok':'')}
function resultHtml(id){const sc=score(id);return `<div class="card result"><div class="muted">Resultado desta tentativa</div><div class="score">${sc.correct}/${sc.total} · ${sc.pct}%</div><div class="split">${Object.entries(sc.areas).map(([a,x])=>`<div class="mini"><b>${esc(a)}</b><div>${x.correct}/${x.total} · ${x.total?Math.round(x.correct/x.total*100):0}%</div></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="secondary" onclick="go('performance')">Ver histórico</button><button class="secondary" onclick="go('topics')">Desempenho por tema</button></div></div>`}
function answer(letter){const id=currentExamId,s=states[id];s.answers[s.current]=letter;saveState(id);renderExam()}
function toggleReview(){const s=states[currentExamId];s.review[s.current]=!s.review[s.current];saveState(currentExamId);renderExam()}
function jump(n){states[currentExamId].current=n;saveState(currentExamId);renderExam();window.scrollTo({top:0,behavior:'smooth'})}
function move(dir){const vis=visibleQuestions(currentExamId),s=states[currentExamId],i=Math.max(0,vis.findIndex(q=>q.number===s.current));if(!vis.length)return;const ni=Math.min(vis.length-1,Math.max(0,i+dir));s.current=vis[ni].number;saveState(currentExamId);renderExam();window.scrollTo({top:0,behavior:'smooth'})}
function setStatus(v){states[currentExamId].statusFilter=v;const vis=visibleQuestions(currentExamId);if(vis.length)states[currentExamId].current=vis[0].number;saveState(currentExamId);renderExam()}
function setTopic(v){states[currentExamId].topicFilter=v;const vis=visibleQuestions(currentExamId);if(vis.length)states[currentExamId].current=vis[0].number;saveState(currentExamId);renderExam()}
async function finishExam(){const id=currentExamId,e=EXAMS[id],s=states[id],unanswered=e.questions.filter(q=>q.answer&&!s.answers[q.number]).length;if(unanswered&&!confirm(`Ainda há ${unanswered} questão(ões) válidas sem resposta. Finalizar mesmo assim?`))return;s.finished=true;s.finishedAt=new Date().toISOString();if(!s.attemptId)s.attemptId=crypto.randomUUID();saveState(id);await recordAttempt(id);renderExam()}
async function recordAttempt(id){const s=states[id],sc=score(id),attempt={id:s.attemptId,user_id:currentUser?.id||null,quiz_id:id,attempt_type:s.attemptType||'full',score:sc.correct,total:sc.total,percentage:sc.pct,section_scores:sc.areas,topic_scores:sc.topics,finished_at:s.finishedAt||new Date().toISOString()};const i=attempts.findIndex(a=>a.id===attempt.id);if(i>=0)attempts[i]=attempt;else attempts.unshift(attempt);saveAttemptsLocal();if(sb&&currentUser){const payload={...attempt,user_id:currentUser.id};const{error}=await sb.from('quiz_attempts').upsert(payload,{onConflict:'id'});if(error)console.warn('Histórico cloud:',error.message)}}
async function ensureAttempt(id){const s=states[id];if(s.finished&&!s.attemptId){s.attemptId=crypto.randomUUID();s.finishedAt=s.finishedAt||new Date().toISOString();saveState(id);await recordAttempt(id)}}
function retryWrong(){const id=currentExamId,s=states[id],wrong=score(id).wrong;if(!wrong.length)return alert('Não há questões erradas para refazer.');for(const n of wrong)delete s.answers[n];s.finished=false;s.attemptId=null;s.attemptType='retry_wrong';s.finishedAt=null;s.statusFilter='unanswered';s.topicFilter='all';s.current=wrong[0];saveState(id);renderExam()}
function newAttempt(){if(!confirm('Iniciar uma nova tentativa completa? O resultado anterior permanecerá no histórico.'))return;const id=currentExamId;states[id]=defaultState();saveState(id);renderExam()}
async function loadAttempts(){if(!sb||!currentUser)return;try{const{data,error}=await sb.from('quiz_attempts').select('*').eq('user_id',currentUser.id).order('finished_at',{ascending:false}).limit(100);if(error)throw error;const cloudIds=new Set((data||[]).map(a=>a.id));const pending=attempts.filter(a=>a?.id&&!cloudIds.has(a.id));for(const a of pending){const payload={...a,user_id:currentUser.id};const{error:upErr}=await sb.from('quiz_attempts').upsert(payload,{onConflict:'id'});if(upErr)console.warn('Histórico cloud:',upErr.message)}const map=new Map(attempts.map(a=>[a.id,a]));for(const a of data||[])map.set(a.id,a);for(const a of pending)map.set(a.id,{...a,user_id:currentUser.id});attempts=[...map.values()].sort((a,b)=>Date.parse(b.finished_at)-Date.parse(a.finished_at));saveAttemptsLocal()}catch(e){console.warn('Tabela de histórico ainda não configurada:',e.message)}}
function renderPerformance(){view='performance';currentExamId=null;const rows=[...attempts].sort((a,b)=>Date.parse(b.finished_at)-Date.parse(a.finished_at));$('#app').innerHTML=`${authBoxHtml()}<div class="section-title"><div><h2>Histórico de desempenho</h2><div class="muted">Cada finalização fica registrada; revisões de erradas aparecem separadamente.</div></div></div><div class="card pad tablewrap">${rows.length?`<table class="table"><thead><tr><th>Data</th><th>Prova</th><th>Tipo</th><th>Nota</th><th>Otorrino</th><th>Cirurgia</th></tr></thead><tbody>${rows.map(a=>{const sec=a.section_scores||{},ent=sec['Otorrinolaringologia'],surg=sec['Cirurgia Geral']||sec['Cirurgia Geral e Área Cirúrgica Básica'];return `<tr><td>${new Date(a.finished_at).toLocaleString('pt-BR')}</td><td>${EXAMS[a.quiz_id]?.label||a.quiz_id}</td><td><span class="badge">${a.attempt_type==='retry_wrong'?'Revisão de erradas':'Completa'}</span></td><td><b>${a.score}/${a.total} · ${Math.round(a.percentage)}%</b></td><td>${ent?ent.correct+'/'+ent.total:'—'}</td><td>${surg?surg.correct+'/'+surg.total:'—'}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Finalize uma prova para começar seu histórico.</div>'}</div>`;setNav();setCloud(currentUser?'Sincronizado':'Somente local',currentUser?'ok':'')}
function aggregateTopics(){const out={};for(const id of EXAM_IDS){const e=EXAMS[id],s=states[id];for(const q of e.questions){if(!out[q.topic])out[q.topic]={total:0,answered:0,gradedAnswered:0,correct:0,exams:{}};const x=out[q.topic];if(q.answer)x.total++;if(s.answers[q.number]&&q.answer){x.answered++;if(s.finished){x.gradedAnswered++;if(s.answers[q.number]===q.answer)x.correct++}}if(!x.exams[id])x.exams[id]=0;x.exams[id]++}}return out}
function renderTopics(){view='topics';currentExamId=null;const agg=aggregateTopics();const entries=Object.entries(agg).sort((a,b)=>a[0].localeCompare(b[0],'pt-BR'));$('#app').innerHTML=`${authBoxHtml()}<div class="section-title"><div><h2>Revisão por tema</h2><div class="muted">Os temas são categorias amplas inferidas a partir do assunto de cada questão das duas provas.</div></div></div><div class="topicgrid">${entries.map(([t,x])=>`<div class="card topiccard"><div class="row space"><h3>${esc(t)}</h3><span class="badge">${x.total} questões</span></div><div class="topicstats">${x.gradedAnswered?`${x.correct} acertos em ${x.gradedAnswered} questões já corrigidas · ${Math.round(x.correct/x.gradedAnswered*100)}%`:x.answered?`${x.answered} respondidas · finalize a prova para ver acertos`:'Ainda não respondido'}</div><div class="row">${EXAM_IDS.filter(id=>x.exams[id]).map(id=>`<button class="secondary" onclick="openExam('${id}',{topic:${JSON.stringify(t)},status:'all'})">${EXAMS[id].label}</button>`).join('')}</div></div>`).join('')}</div>`;setNav();setCloud(currentUser?'Sincronizado':'Somente local',currentUser?'ok':'')}
function render(){if(view==='exam'&&currentExamId)return renderExam();if(view==='performance')return renderPerformance();if(view==='topics')return renderTopics();return renderHome()}
window.addEventListener('DOMContentLoaded',async()=>{renderHome();for(const id of EXAM_IDS)await ensureAttempt(id);await initAuth();render()});
</script></body></html>
