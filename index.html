","explanation":"Autonomia de adulto capaz inclui direito de recusar tratamento, mesmo com risco relevante. É essencial confirmar capacidade, informação e voluntariedade e documentar alternativas."},{"number":77,"area":"Cirurgia Geral","stem":"Em paciente com diabetes submetido a cirurgia, controle glicêmico perioperatório deve evitar tanto hiperglicemia importante quanto:","options":{"A":"analgesia adequada","B":"profilaxia trombótica","C":"normotermia","D":"mobilização precoce","E":"hipoglicemia decorrente de metas excessivamente estritas"},"answer":"E","topic":"Perioperatório e Ética","explanation":"Metas excessivamente intensivas aumentam hipoglicemia. Protocolos hospitalares geralmente adotam faixas moderadas, individualizadas ao paciente e cenário."},{"number":78,"area":"Cirurgia Geral","stem":"Paciente com colangite apresenta hipotensão e confusão, além de icterícia, febre e dor em hipocôndrio direito. O conjunto de cinco achados é conhecido como:","options":{"A":"sinal de Cullen","B":"tétrade de Fallot","C":"síndrome de Boerhaave","D":"tríade de Virchow","E":"pêntade de Reynolds"},"answer":"E","topic":"Hepatobiliopancreática","explanation":"Tríade de Charcot é febre, dor e icterícia; adição de hipotensão e alteração do estado mental constitui pêntade de Reynolds e sugere colangite grave."},{"number":79,"area":"Cirurgia Geral","stem":"Paciente com suspeita intermediária de coledocolitíase, sem colangite, deve preferencialmente confirmar cálculo antes de CPRE terapêutica por meio de:","options":{"A":"CPRE diagnóstica obrigatória em todos","B":"colangiorressonância ou ultrassonografia endoscópica","C":"colonoscopia","D":"Dix-Hallpike","E":"radiografia simples"},"answer":"B","topic":"Hepatobiliopancreática","explanation":"CPRE tem risco de pancreatite e outras complicações e é preferida como procedimento terapêutico. MRCP/EUS são excelentes métodos diagnósticos em risco intermediário."},{"number":80,"area":"Cirurgia Geral","stem":"Paciente com GIST gástrico grande, de alto risco, ressecado com margens livres. Em contexto apropriado, terapia adjuvante com imatinibe depende especialmente de:","options":{"A":"grupo sanguíneo","B":"teste de Schirmer","C":"expressão de p16 exclusivamente","D":"nível de TSH","E":"presença de mutação sensível em KIT/PDGFRA e estratificação de risco de recorrência"},"answer":"E","topic":"Oncologia Cirúrgica","explanation":"Imatinibe é efetivo em GIST com mutações sensíveis. Risco é estimado por tamanho, índice mitótico, sítio e ruptura; mutações resistentes, como PDGFRA D842V, mudam a estratégia."}]},"simulado_ccp_05":{"id":"simulado_ccp_05","label":"Simulado 5 — ENARE CCP","subtitle":"Nível ENARE — prova-alvo/avançado · 80 questões","order":"1–40 Otorrinolaringologia · 41–80 Cirurgia Geral","localKey":"simulado_ccp_05_v1","sourceNote":"Itens autorais ou fortemente adaptados, calibrados pela matriz das provas ENARE Cabeça e Pescoço 2024/2025 e 2025/2026, pelo acervo ENARE 2023/2024 e por provas de Otorrinolaringologia R4 e Cirurgia Geral R+; não são transcrições literais de provas externas.","questions":[{"number":1,"area":"Otorrinolaringologia","stem":"Mulher de 46 anos apresenta crises recorrentes de vertigem com duração de horas, fotofobia, fonofobia e história de enxaqueca; audiometria é normal. O diagnóstico mais provável é:","options":{"A":"otite média secretora","B":"doença de Ménière obrigatoriamente","C":"VPPB de canal posterior","D":"otosclerose","E":"enxaqueca vestibular"},"answer":"E","topic":"Vestibulologia","explanation":"Enxaqueca vestibular combina episódios vestibulares recorrentes com história/características migranosas. A ausência de perda auditiva flutuante favorece esse diagnóstico em relação à Ménière."},{"number":2,"area":"Otorrinolaringologia","stem":"Paciente com síndrome vestibular aguda apresenta nistagmo vertical, skew deviation e impulso cefálico normal. A interpretação mais segura é:","options":{"A":"Ménière confirmada","B":"neurite vestibular periférica típica","C":"labirintite bacteriana obrigatória","D":"VPPB sem necessidade de imagem","E":"achados centrais, devendo-se investigar AVC de circulação posterior"},"answer":"E","topic":"Vestibulologia","explanation":"No HINTS realizado por examinador treinado, head impulse normal, nistagmo central ou skew são sinais preocupantes para causa central, particularmente AVC posterior."},{"number":3,"area":"Otorrinolaringologia","stem":"Paciente apresenta autofonia intensa, percepção exagerada de sons corporais e vertigem induzida por sons fortes ou pressão. TC de alta resolução pode demonstrar:","options":{"A":"colesteatoma congênito","B":"rinite medicamentosa","C":"tumor de Warthin","D":"otosclerose exclusivamente","E":"deiscência do canal semicircular superior"},"answer":"E","topic":"Otologia e Audiologia","explanation":"Deiscência do canal superior cria uma “terceira janela”, podendo causar fenômeno de Tullio, vertigem por pressão, autofonia e aparente componente condutivo."},{"number":4,"area":"Otorrinolaringologia","stem":"Criança com otite média com efusão bilateral há mais de 3 meses apresenta perda auditiva documentada e impacto de linguagem. Uma opção apropriada é:","options":{"A":"mastoidectomia radical","B":"timpanostomia com tubo de ventilação, após avaliação do contexto clínico","C":"antibiótico sistêmico contínuo por meses","D":"nenhum acompanhamento auditivo","E":"estapedectomia"},"answer":"B","topic":"Otologia e Audiologia","explanation":"Efusão persistente com perda auditiva e impacto funcional é indicação clássica para considerar tubos. A decisão inclui idade, duração, audição e fatores de risco para desenvolvimento."},{"number":5,"area":"Otorrinolaringologia","stem":"Em criança com perda auditiva neurossensorial profunda bilateral que não obtém benefício suficiente com aparelhos auditivos, a intervenção que pode restaurar acesso ao som é:","options":{"A":"tubo de ventilação como terapia definitiva","B":"ceruminolítico","C":"implante coclear, após avaliação multidisciplinar de candidatura","D":"mastoidectomia simples","E":"estapedotomia obrigatória"},"answer":"C","topic":"Otologia e Audiologia","explanation":"Implante coclear estimula diretamente o nervo auditivo e é indicado em perdas neurossensoriais severas/profundas com benefício limitado de amplificação, conforme critérios audiológicos e clínicos."},{"number":6,"area":"Otorrinolaringologia","stem":"Paciente com otite média crônica colesteatomatosa desenvolve vertigem provocada por pressão no trago e perda auditiva. Deve-se suspeitar de:","options":{"A":"VPPB idiopática não relacionada","B":"paralisia de Bell isolada","C":"síndrome de Frey","D":"rinite alérgica","E":"fístula labiríntica, frequentemente envolvendo o canal semicircular lateral"},"answer":"E","topic":"Otologia e Audiologia","explanation":"Colesteatoma pode erodir a cápsula ótica, sobretudo o canal semicircular lateral, causando sinal de fístula, vertigem e risco de perda neurossensorial."},{"number":7,"area":"Otorrinolaringologia","stem":"Paciente diabético idoso apresenta otalgia noturna intensa, otorreia persistente e tecido de granulação no conduto, com pouca resposta a gotas usuais. Deve-se pensar em:","options":{"A":"otite externa necrotizante, frequentemente associada a Pseudomonas aeruginosa","B":"rinite alérgica","C":"otite média serosa","D":"VPPB","E":"otosclerose"},"answer":"A","topic":"Otologia e Audiologia","explanation":"Otite externa necrotizante é osteomielite de base do crânio associada sobretudo a diabetes/imunossupressão. Exige antibiótico antipseudomonas prolongado e controle metabólico."},{"number":8,"area":"Otorrinolaringologia","stem":"Em perda auditiva induzida por ruído, um achado audiométrico clássico inicial é:","options":{"A":"melhora progressiva do limiar com exposição contínua","B":"entalhe em torno de 4 kHz","C":"discriminação sempre normal até perda total","D":"curva B timpanométrica obrigatória","E":"perda condutiva isolada em 250 Hz"},"answer":"B","topic":"Otologia e Audiologia","explanation":"PAIR tipicamente produz entalhe em 3–6 kHz, frequentemente mais evidente em 4 kHz, com evolução conforme intensidade e duração da exposição."},{"number":9,"area":"Otorrinolaringologia","stem":"Paciente com paralisia facial periférica apresenta lacrimejamento reduzido, hiperacusia e perda do paladar anterior. A lesão está localizada:","options":{"A":"proximalmente à origem do nervo petroso maior e do nervo do estapédio","B":"no nervo hipoglosso","C":"apenas no ramo marginal mandibular","D":"no nervo acessório","E":"após a saída do forame estilomastoideo"},"answer":"A","topic":"Nervo Facial e Base do Crânio","explanation":"Quanto mais proximal a lesão intratemporal, mais funções do facial são afetadas. Alteração lacrimal implica lesão proximal ao petroso maior; hiperacusia, proximal ao nervo do estapédio; disgeusia, proximal à corda do tímpano."},{"number":10,"area":"Otorrinolaringologia","stem":"Paralisia facial periférica aguda acompanhada de incapacidade de fechar o olho exige, além do tratamento etiológico:","options":{"A":"manter o olho exposto para avaliação","B":"oclusão do ducto lacrimal","C":"proteção corneana com lubrificação e medidas para fechamento palpebral","D":"colírio anestésico crônico","E":"nenhum cuidado ocular"},"answer":"C","topic":"Nervo Facial e Base do Crânio","explanation":"Exposição corneana pode causar ceratite e ulceração. Lubrificação, proteção noturna e avaliação oftalmológica quando necessário são medidas essenciais."},{"number":11,"area":"Otorrinolaringologia","stem":"Paciente usa oximetazolina várias vezes ao dia há meses e apresenta obstrução nasal progressiva quando tenta suspender. O diagnóstico é:","options":{"A":"rinite atrófica obrigatória","B":"papiloma invertido","C":"rinite medicamentosa","D":"granuloma vocal","E":"fístula liquórica"},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Descongestionantes tópicos alfa-adrenérgicos usados por períodos prolongados podem causar congestão rebote. Tratamento inclui retirada do agente e uso de terapias nasais adequadas, como corticoide tópico."},{"number":12,"area":"Otorrinolaringologia","stem":"Adulto apresenta rinossinusite aguda com sintomas persistentes por mais de 10 dias sem melhora e secreção purulenta. O quadro favorece:","options":{"A":"rinossinusite bacteriana aguda","B":"otosclerose","C":"resfriado viral simples obrigatoriamente","D":"papilomatose laríngea","E":"VPPB"},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"Persistência ≥10 dias sem melhora, piora dupla ou início grave são padrões usados para diferenciar provável rinossinusite bacteriana de infecção viral autolimitada."},{"number":13,"area":"Otorrinolaringologia","stem":"Paciente com rinorreia aquosa unilateral após cirurgia endoscópica nasal apresenta líquido positivo para beta-2 transferrina. Isso confirma:","options":{"A":"rinite alérgica","B":"rinite medicamentosa","C":"sinusite fúngica bola fúngica","D":"epistaxe posterior","E":"fístula de líquido cefalorraquidiano"},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Beta-2 transferrina é altamente específica para LCR (e humor vítreo) e auxilia na confirmação de rinoliquorreia."},{"number":14,"area":"Otorrinolaringologia","stem":"Adolescente do sexo masculino apresenta epistaxe recorrente e obstrução nasal progressiva. TC mostra massa hipervascular na nasofaringe com remodelamento ósseo. A hipótese é:","options":{"A":"carcinoma de parótida","B":"pólipo antrocoanal","C":"mucocele frontal","D":"papiloma invertido","E":"nasoangiofibroma juvenil"},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Nasoangiofibroma ocorre quase exclusivamente em adolescentes do sexo masculino e é altamente vascular. Biópsia rotineira deve ser evitada pelo risco de sangramento."},{"number":15,"area":"Otorrinolaringologia","stem":"Paciente imunossuprimido com cetoacidose diabética apresenta dor facial, necrose de palato e escara nasal negra. A conduta deve incluir:","options":{"A":"corticosteroide isolado","B":"aguardar cultura por semanas","C":"antibiótico oral isolado","D":"antifúngico sistêmico imediato e desbridamento cirúrgico agressivo, além de corrigir o fator predisponente","E":"apenas lavagem nasal"},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"Rinossinusite fúngica invasiva aguda, frequentemente por Mucorales ou Aspergillus, é emergência com alta mortalidade. Tratamento combina antifúngico, cirurgia e reversão da imunossupressão/metabolismo quando possível."},{"number":16,"area":"Otorrinolaringologia","stem":"Paciente com pólipo nasal unilateral originado do seio maxilar e estendendo-se para coana/nasofaringe apresenta:","options":{"A":"cisto tireoglosso","B":"nasoangiofibroma","C":"polipose etmoidal bilateral obrigatória","D":"pólipo antrocoanal","E":"tumor de Warthin"},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"Pólipo antrocoanal costuma ser unilateral, surge no seio maxilar e se estende através do óstio para a coana, sendo mais comum em jovens."},{"number":17,"area":"Otorrinolaringologia","stem":"Profissional da voz apresenta duas pequenas lesões simétricas na junção do terço anterior com o médio das pregas vocais. A primeira abordagem é:","options":{"A":"radioterapia","B":"laringectomia parcial","C":"fonoterapia e correção de fatores de abuso vocal","D":"antibiótico intravenoso","E":"traqueostomia"},"answer":"C","topic":"Laringologia e Voz","explanation":"Nódulos vocais são tipicamente bilaterais e relacionados a fonotrauma. Fonoterapia é tratamento inicial; cirurgia é incomum e reservada a situações selecionadas."},{"number":18,"area":"Otorrinolaringologia","stem":"Paciente com história de intubação prolongada apresenta dispneia progressiva e estridor bifásico. Laringoscopia demonstra estenose subglótica. O exame que melhor define extensão e planejamento é:","options":{"A":"Dix-Hallpike","B":"teste cutâneo alérgico isolado","C":"endoscopia da via aérea, complementada por imagem quando necessário","D":"timpanometria","E":"audiometria"},"answer":"C","topic":"Laringologia e Voz","explanation":"Estenose subglótica é graduada e planejada por avaliação endoscópica direta; TC pode complementar anatomia. Tratamento varia de endoscópico a reconstrução aberta conforme extensão e grau."},{"number":19,"area":"Otorrinolaringologia","stem":"Paciente após tireoidectomia total apresenta estridor imediato e ambas as pregas vocais em posição paramediana. A complicação mais provável é:","options":{"A":"paralisia bilateral dos nervos laríngeos recorrentes","B":"papiloma invertido","C":"lesão isolada do nervo laríngeo superior externo","D":"VPPB","E":"edema de Reinke"},"answer":"A","topic":"Laringologia e Voz","explanation":"Lesão bilateral dos recorrentes pode deixar pregas próximas da linha média, preservando voz relativamente melhor que a ventilação e causando obstrução grave."},{"number":20,"area":"Otorrinolaringologia","stem":"Paciente cantor após cirurgia cervical refere dificuldade para atingir notas agudas, embora a mobilidade das pregas vocais esteja preservada. Deve-se suspeitar de lesão do:","options":{"A":"nervo auriculotemporal","B":"nervo hipoglosso","C":"ramo externo do nervo laríngeo superior","D":"nervo frênico","E":"nervo facial"},"answer":"C","topic":"Laringologia e Voz","explanation":"O ramo externo do laríngeo superior inerva o cricotireóideo, responsável por tensionar as pregas e elevar frequência. Lesão pode comprometer projeção e notas agudas."},{"number":21,"area":"Otorrinolaringologia","stem":"Adulto com AHI de 38 eventos/h, sonolência importante e sem contraindicação apresenta OSA grave. A terapia padrão de maior eficácia para controle dos eventos é:","options":{"A":"septoplastia obrigatória como monoterapia","B":"nenhum tratamento se não houver hipertensão","C":"CPAP","D":"anti-histamínico isolado","E":"antibiótico noturno"},"answer":"C","topic":"Sono e Via Aérea Superior","explanation":"CPAP é terapia de primeira linha e alta eficácia para OSA moderada-grave, embora adesão e alternativas anatômicas/odontológicas devam ser consideradas individualmente."},{"number":22,"area":"Otorrinolaringologia","stem":"Criança com OSA por hipertrofia adenotonsilar apresenta saturação mínima muito baixa e AHI elevado. Após adenotonsilectomia, uma preocupação especial é:","options":{"A":"nenhum risco relacionado à gravidade","B":"evitar qualquer analgesia","C":"alta imediata obrigatória em todo caso","D":"proibir oxigênio em qualquer situação","E":"monitorização pós-operatória por maior risco de complicações respiratórias"},"answer":"E","topic":"Sono e Via Aérea Superior","explanation":"OSA grave, idade pequena e comorbidades elevam risco respiratório após adenotonsilectomia e podem indicar observação hospitalar/monitorização."},{"number":23,"area":"Otorrinolaringologia","stem":"Paciente apresenta odinofagia após episódio de vômitos e endoscopia normal, mas exame oral mostra placas brancas removíveis com base eritematosa em contexto de uso recente de antibióticos. O diagnóstico é:","options":{"A":"eritroplasia","B":"leucoplasia homogênea","C":"candidíase oral pseudomembranosa","D":"carcinoma escamoso obrigatório","E":"líquen plano reticular"},"answer":"C","topic":"Cavidade Oral e Faringologia","explanation":"Candidíase pseudomembranosa apresenta placas brancas removíveis. Predisponentes incluem antibióticos, corticoide inalatório, diabetes e imunossupressão."},{"number":24,"area":"Otorrinolaringologia","stem":"Úlcera de borda lateral da língua persiste por 4 semanas, é endurecida e indolor em tabagista. A próxima etapa é:","options":{"A":"fazer apenas audiometria","B":"biópsia para excluir carcinoma espinocelular","C":"observar por mais seis meses sem exame","D":"tratar como afta indefinidamente","E":"prescrever descongestionante nasal"},"answer":"B","topic":"Cavidade Oral e Faringologia","explanation":"Lesão oral persistente, endurecida, ulcerada ou eritroleucoplásica, especialmente em paciente de risco, deve ser biopsiada precocemente."},{"number":25,"area":"Otorrinolaringologia","stem":"Paciente com abscesso retrofaríngeo apresenta febre, rigidez cervical e odinofagia. TC mostra coleção significativa com sinais de comprometimento de via aérea. O manejo inclui:","options":{"A":"alta sem observação","B":"manobra de Epley","C":"nenhuma antibioticoterapia","D":"proteção da via aérea, antibiótico intravenoso e drenagem quando indicada","E":"apenas antiácido"},"answer":"D","topic":"Cavidade Oral e Faringologia","explanation":"Infecções do espaço retrofaríngeo podem disseminar-se ao mediastino e ameaçar a via aérea. Coleções grandes, piora clínica ou falha de antibiótico demandam drenagem."},{"number":26,"area":"Otorrinolaringologia","stem":"Paciente apresenta tumor de Warthin de parótida. Uma associação epidemiológica clássica é:","options":{"A":"invasão perineural em quase todos","B":"metástase pulmonar precoce como regra","C":"ocorrência exclusiva em crianças","D":"forte relação com tabagismo e possibilidade de bilateralidade/multifocalidade","E":"relação obrigatória com HPV 16"},"answer":"D","topic":"Glândulas Salivares","explanation":"Tumor de Warthin é benigno, mais comum em homens mais velhos, fortemente relacionado ao tabagismo e pode ser bilateral ou multifocal."},{"number":27,"area":"Otorrinolaringologia","stem":"Adenoma pleomórfico de parótida deve ser removido com margem adequada em vez de simples enucleação porque:","options":{"A":"é sempre carcinoma de alto grau","B":"apresenta pseudópodes/extensões microscópicas e maior risco de recorrência após enucleação","C":"não possui cápsula em nenhum caso","D":"não se relaciona ao nervo facial","E":"metastatiza obrigatoriamente em semanas"},"answer":"B","topic":"Glândulas Salivares","explanation":"Adenoma pleomórfico é benigno, mas pode ter cápsula incompleta e pseudópodes. Enucleação aumenta recorrência; ressecção adequada reduz esse risco e também o de transformação maligna tardia."},{"number":28,"area":"Otorrinolaringologia","stem":"Paciente com dor e edema submandibular principalmente durante refeições apresenta quadro típico de:","options":{"A":"otite média secretora","B":"sialolitíase obstrutiva","C":"laringomalácia","D":"VPPB","E":"Ménière"},"answer":"B","topic":"Glândulas Salivares","explanation":"Dor e aumento glandular relacionados à alimentação são clássicos de obstrução salivar por cálculo, sobretudo na glândula submandibular."},{"number":29,"area":"Otorrinolaringologia","stem":"Massa cervical mediana em criança move-se com protrusão da língua. O tratamento definitivo é:","options":{"A":"laringectomia","B":"procedimento de Sistrunk, removendo cisto, trajeto e porção central do osso hioide","C":"parotidectomia","D":"simples aspiração como cura","E":"mastoidectomia"},"answer":"B","topic":"Pescoço e Tireoide","explanation":"Cisto do ducto tireoglosso mantém relação com o hioide. Sistrunk reduz recorrência ao remover o segmento central do hioide e o trajeto superior."},{"number":30,"area":"Otorrinolaringologia","stem":"Adulto jovem apresenta massa indolor junto à bifurcação carotídea, hipervascular, que desloca artéria carótida interna e externa. O diagnóstico mais provável é:","options":{"A":"cisto tireoglosso","B":"ranula","C":"pólipo antrocoanal","D":"tumor do corpo carotídeo (paraganglioma)","E":"otosclerose"},"answer":"D","topic":"Pescoço e Tireoide","explanation":"Paraganglioma do corpo carotídeo é hipervascular e causa splaying das carótidas interna e externa (sinal da lira). Avaliação vascular e planejamento especializado são essenciais."},{"number":31,"area":"Otorrinolaringologia","stem":"Paciente com paraganglioma timpânico apresenta sintoma inicial clássico de:","options":{"A":"disfagia por acalásia","B":"diarreia aquosa","C":"tinnitus pulsátil","D":"anosmia isolada","E":"dor lombar"},"answer":"C","topic":"Pescoço e Tireoide","explanation":"Glomus timpânico/jugular são tumores hipervasculares do osso temporal e frequentemente se manifestam com tinnitus pulsátil e massa avermelhada retro-timpânica."},{"number":32,"area":"Otorrinolaringologia","stem":"Criança com fissura labiopalatina apresenta otite média com efusão recorrente. O mecanismo predominante é:","options":{"A":"disfunção da tuba auditiva pela alteração da musculatura do palato","B":"lesão do nervo facial","C":"produção excessiva de cerume","D":"deiscência do canal superior","E":"fixação do estribo"},"answer":"A","topic":"Craniofacial e Pediatria","explanation":"Anatomia e função do tensor do véu palatino são alteradas na fissura palatina, comprometendo ventilação da orelha média e aumentando efusão/perda condutiva."},{"number":33,"area":"Otorrinolaringologia","stem":"Criança com insuficiência velofaríngea após correção de fissura palatina apresenta principalmente:","options":{"A":"vertigem posicional","B":"hipernasalidade e escape nasal de ar durante a fala","C":"tinnitus pulsátil","D":"anosmia isolada","E":"dor otológica por Ramsay Hunt"},"answer":"B","topic":"Craniofacial e Pediatria","explanation":"Falha no fechamento velofaríngeo permite comunicação excessiva com cavidade nasal durante fala, causando hipernasalidade, emissão nasal e alterações articulatórias."},{"number":34,"area":"Otorrinolaringologia","stem":"Paciente com corpo estranho de via aérea apresenta tosse súbita, estridor e redução unilateral do murmúrio. Em criança estável com forte suspeita, o procedimento diagnóstico-terapêutico padrão é:","options":{"A":"broncoscopia rígida","B":"biópsia de parótida","C":"Dix-Hallpike","D":"timpanotomia exploradora","E":"colonoscopia"},"answer":"A","topic":"Trauma e Emergências","explanation":"Broncoscopia rígida permite ventilação e remoção de corpo estranho em pediatria. Instabilidade extrema pode exigir manobras imediatas de desobstrução conforme faixa etária."},{"number":35,"area":"Otorrinolaringologia","stem":"Paciente com trauma laríngeo fechado apresenta estridor, enfisema cervical e hematoma expansivo. A prioridade é:","options":{"A":"realizar apenas audiometria","B":"estabelecer via aérea segura, preferencialmente evitando manobras que agravem uma lesão instável","C":"dar alta sem endoscopia","D":"forçar intubação às cegas repetidamente","E":"prescrever anti-histamínico"},"answer":"B","topic":"Trauma e Emergências","explanation":"Trauma laríngeo com sinais de instabilidade exige controle cuidadoso da via aérea por equipe experiente; traqueostomia pode ser necessária. Depois, endoscopia/imagem definem lesões estruturais."},{"number":36,"area":"Otorrinolaringologia","stem":"Paciente com pólipos nasais, asma e broncoespasmo após uso de aspirina apresenta:","options":{"A":"síndrome de Frey","B":"síndrome de Ramsay Hunt","C":"doença respiratória exacerbada por aspirina (AERD)","D":"doença de Ménière","E":"otosclerose"},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"AERD caracteriza-se pela tríade de asma, rinossinusite crônica com pólipos e reações a inibidores de COX-1. Tratamento envolve manejo da via aérea, pólipos e, em selecionados, dessensibilização/biológicos."},{"number":37,"area":"Otorrinolaringologia","stem":"Em teste de Weber, o som lateraliza para a orelha esquerda. Rinne é negativo à esquerda e positivo à direita. O padrão é compatível com:","options":{"A":"perda neurossensorial esquerda","B":"audição normal bilateral obrigatória","C":"perda auditiva condutiva à esquerda","D":"VPPB esquerda","E":"perda neurossensorial direita obrigatória"},"answer":"C","topic":"Otologia e Audiologia","explanation":"Na perda condutiva, Weber lateraliza para o lado afetado e Rinne torna-se negativo (via óssea percebida melhor que aérea) no ouvido com componente condutivo significativo."},{"number":38,"area":"Otorrinolaringologia","stem":"Paciente com disfonia funcional, exame estrutural normal e hiperfunção supraglótica durante fonação apresenta disfonia por tensão muscular. O tratamento inicial é:","options":{"A":"laringectomia","B":"radioterapia","C":"traqueostomia","D":"fonoterapia com reeducação do comportamento vocal","E":"antibiótico IV"},"answer":"D","topic":"Laringologia e Voz","explanation":"Disfonia por tensão muscular é uma alteração funcional de uso da musculatura laríngea; terapia vocal é central, após excluir lesões estruturais e causas neurológicas."},{"number":39,"area":"Otorrinolaringologia","stem":"Paciente com OSA leve a moderada, retrognatia e intolerância ao CPAP pergunta sobre dispositivo intraoral. Uma opção é:","options":{"A":"aparelho de avanço mandibular confeccionado e acompanhado adequadamente","B":"tubo de ventilação","C":"antibiótico noturno","D":"placa sem avanço para todos","E":"nenhum tratamento possível"},"answer":"A","topic":"Sono e Via Aérea Superior","explanation":"Dispositivos de avanço mandibular podem ser efetivos especialmente em OSA leve/moderada e em intolerância ao CPAP, com seleção e acompanhamento odontológico do sono."},{"number":40,"area":"Otorrinolaringologia","stem":"Homem tabagista de 62 anos apresenta rouquidão progressiva há 6 semanas, sem quadro infeccioso. A conduta correta é:","options":{"A":"prescrever antibiótico por meses antes de examinar a laringe","B":"realizar manobra de Epley","C":"considerar rouquidão prolongada normal no tabagista","D":"solicitar apenas audiometria","E":"realizar avaliação laríngea endoscópica para excluir neoplasia, sem postergar apenas com tratamento empírico"},"answer":"E","topic":"Laringologia e Voz","explanation":"Rouquidão persistente, especialmente em tabagista ou com sinais de alarme, requer visualização da laringe. Câncer glótico frequentemente se apresenta cedo com disfonia."},{"number":41,"area":"Cirurgia Geral","stem":"Paciente com choque séptico permanece hipotenso após reposição volêmica adequada. O vasopressor de primeira escolha na maioria dos casos é:","options":{"A":"noradrenalina","B":"furosemida como vasopressor","C":"nitroprussiato","D":"propranolol","E":"dopamina obrigatoriamente em todos"},"answer":"A","topic":"Inflamação, Infecção e Sepse","explanation":"Noradrenalina é o vasopressor de primeira linha no choque séptico. Vasopressina ou adrenalina podem ser adicionadas em contextos selecionados."},{"number":42,"area":"Cirurgia Geral","stem":"Em protocolo ERAS para cirurgia colorretal eletiva, uma prática coerente é:","options":{"A":"sonda nasogástrica rotineira até alta","B":"jejum prolongado por vários dias em todos","C":"opioide em altas doses como única analgesia","D":"alimentação e mobilização precoces, analgesia multimodal e redução de tubos/drenos desnecessários","E":"repouso absoluto"},"answer":"D","topic":"Perioperatório e Ética","explanation":"ERAS combina medidas baseadas em evidências para reduzir estresse cirúrgico e acelerar recuperação: educação, otimização, analgesia multimodal, mobilização e nutrição precoces, entre outras."},{"number":43,"area":"Cirurgia Geral","stem":"Paciente crítico tem trato gastrointestinal funcionante, mas não consegue atingir necessidades por via oral. A via de suporte nutricional preferencial, quando viável, é:","options":{"A":"jejum até recuperar apetite","B":"nutrição parenteral total obrigatória desde a primeira hora","C":"apenas solução glicosada","D":"nutrição enteral","E":"nenhum aporte proteico"},"answer":"D","topic":"Nutrição e Metabolismo","explanation":"Se o intestino funciona e a via enteral é segura, ela é geralmente preferida por preservar barreira intestinal e reduzir complicações relacionadas a cateter e superalimentação."},{"number":44,"area":"Cirurgia Geral","stem":"Paciente desnutrido apresenta hipofosfatemia importante após início rápido de dieta hipercalórica. A complicação é:","options":{"A":"síndrome de Boerhaave","B":"síndrome de realimentação","C":"hérnia interna","D":"síndrome de dumping tardio obrigatoriamente","E":"acalásia"},"answer":"B","topic":"Nutrição e Metabolismo","explanation":"Refeeding causa deslocamento intracelular de fósforo, potássio e magnésio mediado por insulina. Prevenção inclui identificar risco, tiamina e progressão cautelosa do aporte."},{"number":45,"area":"Cirurgia Geral","stem":"Na fase proliferativa da cicatrização, um evento característico é:","options":{"A":"maturação final do colágeno sem fibroblastos","B":"mineralização óssea da pele","C":"formação de tecido de granulação, angiogênese e deposição de matriz por fibroblastos","D":"necrose intencional da ferida","E":"ausência completa de células inflamatórias desde o primeiro minuto"},"answer":"C","topic":"Cicatrização e Feridas","explanation":"Fase proliferativa inclui fibroplasia, angiogênese, epitelização e contração. Remodelamento posterior reorganiza colágeno e aumenta resistência tênsil."},{"number":46,"area":"Cirurgia Geral","stem":"Paciente tabagista será submetido a cirurgia eletiva. Cessar tabagismo com antecedência de algumas semanas pode:","options":{"A":"eliminar todo risco cirúrgico","B":"substituir profilaxia trombótica","C":"não produzir qualquer benefício","D":"aumentar obrigatoriamente complicações e por isso deve ser evitado","E":"reduzir complicações pulmonares e de ferida, sem justificar manter o tabagismo até a cirurgia"},"answer":"E","topic":"Perioperatório e Ética","explanation":"Cessação pré-operatória, especialmente por quatro semanas ou mais quando possível, reduz complicações. Mesmo interrupção mais tardia não é motivo para recomendar continuidade do tabagismo."},{"number":47,"area":"Cirurgia Geral","stem":"Na anatomia laparoscópica da região inguinal, o triângulo de Hesselbach contém o defeito de uma hérnia:","options":{"A":"femoral exclusivamente","B":"inguinal direta","C":"inguinal indireta","D":"de Spigel","E":"obturatória"},"answer":"B","topic":"Hérnias e Parede Abdominal","explanation":"Hérnia direta protrui medialmente aos vasos epigástricos inferiores através do triângulo de Hesselbach; indireta passa lateralmente pelo anel inguinal profundo."},{"number":48,"area":"Cirurgia Geral","stem":"Uma hérnia femoral tem particular importância clínica porque:","options":{"A":"não contém vísceras","B":"sempre pode ser observada indefinidamente","C":"nunca estrangula","D":"é mais comum em homens jovens que todas as inguinais","E":"apresenta risco relativamente alto de encarceramento e estrangulamento e costuma indicar reparo após diagnóstico"},"answer":"E","topic":"Hérnias e Parede Abdominal","explanation":"O colo femoral é estreito e rígido, predispondo a encarceramento/estrangulamento. Hérnias femorais são mais frequentes em mulheres, embora hérnia inguinal ainda seja mais comum no total."},{"number":49,"area":"Cirurgia Geral","stem":"Durante reparo laparoscópico de hérnia inguinal, fixação traumática abaixo do trato iliopúbico lateralmente aos vasos gonadais deve ser evitada por risco de lesão de nervos no:","options":{"A":"triângulo posterior do pescoço","B":"triângulo de Hesselbach","C":"triângulo de Killian","D":"triângulo de Calot","E":"triângulo da dor"},"answer":"E","topic":"Hérnias e Parede Abdominal","explanation":"Triângulo da dor contém nervos como cutâneo femoral lateral e ramo femoral do genitofemoral. O triângulo do desastre contém vasos ilíacos externos."},{"number":50,"area":"Cirurgia Geral","stem":"Paciente com hérnia encarcerada apresenta dor contínua, sinais sistêmicos, lactato crescente e alterações isquêmicas na TC. A conduta é:","options":{"A":"exploração cirúrgica urgente por suspeita de estrangulamento","B":"redução forçada repetida apesar de suspeita de necrose","C":"alta com analgésico","D":"apenas ultrassom anual","E":"observar por 48 horas sem reavaliar"},"answer":"A","topic":"Hérnias e Parede Abdominal","explanation":"Estrangulamento compromete perfusão e pode evoluir a necrose/perfuração. Sinais sistêmicos e de isquemia indicam cirurgia urgente."},{"number":51,"area":"Cirurgia Geral","stem":"Paciente apresenta disfagia para sólidos e líquidos desde o início, regurgitação e manometria com falha de relaxamento da junção esofagogástrica. O diagnóstico é:","options":{"A":"acalásia","B":"colecistite","C":"carcinoma de cólon","D":"pseudocisto pancreático","E":"estenose péptica típica"},"answer":"A","topic":"Esôfago e Estômago","explanation":"Disfagia simultânea para sólidos e líquidos sugere distúrbio motor. Manometria de alta resolução confirma acalásia pela ausência de peristalse apropriada e relaxamento inadequado do EEI."},{"number":52,"area":"Cirurgia Geral","stem":"Paciente com divertículo de Zenker apresenta regurgitação de alimento não digerido, halitose e tosse. O divertículo surge na:","options":{"A":"ducto cístico","B":"triângulo de Hesselbach","C":"junção ileocecal","D":"área de fraqueza de Killian, entre fibras do constritor inferior/cricofaríngeo","E":"ampola de Vater"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Zenker é pseudodivertículo por pulsão acima do cricofaríngeo, na deiscência de Killian. Tratamento sintomático envolve divisão do septo e miotomia cricofaríngea por técnica endoscópica ou aberta."},{"number":53,"area":"Cirurgia Geral","stem":"Após episódios repetidos de vômitos, paciente apresenta hematêmese, sem enfisema ou dor torácica intensa. EDA mostra laceração mucosa na junção gastroesofágica. Trata-se de:","options":{"A":"GIST","B":"acalásia","C":"linite plástica","D":"síndrome de Mallory-Weiss","E":"síndrome de Boerhaave"},"answer":"D","topic":"Esôfago e Estômago","explanation":"Mallory-Weiss é laceração mucosa associada a esforço de vômito e causa sangramento. Boerhaave é ruptura transmural e costuma causar dor torácica intensa e sepse/mediastinite."},{"number":54,"area":"Cirurgia Geral","stem":"Paciente com úlcera duodenal perfurada apresenta pneumoperitônio e peritonite. Em úlcera pequena e sem suspeita de malignidade, uma técnica frequente é:","options":{"A":"fechamento simples com patch de omento, associado a tratamento antiulceroso e investigação de H. pylori","B":"colectomia direita","C":"Sistrunk","D":"gastrectomia total obrigatória","E":"pancreatectomia distal"},"answer":"A","topic":"Esôfago e Estômago","explanation":"Perfurações duodenais pequenas são frequentemente tratadas por rafia/patch omental. Erradicação de H. pylori e suspensão de AINEs reduzem recorrência."},{"number":55,"area":"Cirurgia Geral","stem":"Paciente com hemorragia digestiva alta apresenta hipotensão e Hb baixa. A primeira prioridade é:","options":{"A":"nenhuma tipagem sanguínea","B":"colonoscopia imediata antes de ressuscitar","C":"estabilização hemodinâmica com acesso venoso, ressuscitação e estratificação antes/ao mesmo tempo que se organiza endoscopia","D":"alta domiciliar","E":"antibiótico tópico"},"answer":"C","topic":"Esôfago e Estômago","explanation":"ABC e ressuscitação vêm antes da terapêutica endoscópica. Estratégia transfusional é individualizada; em muitos pacientes estáveis usa-se limiar restritivo, com exceções conforme cardiopatia/choque."},{"number":56,"area":"Cirurgia Geral","stem":"Em classificação de Forrest, úlcera com vaso visível não sangrante é classificada como:","options":{"A":"Forrest Ia sem sangramento","B":"Forrest IIa e apresenta alto risco de ressangramento, indicando terapia endoscópica","C":"Forrest Ib com base limpa","D":"Forrest IIc obrigatoriamente","E":"Forrest III sem risco"},"answer":"B","topic":"Esôfago e Estômago","explanation":"Forrest IIa corresponde a vaso visível; Ia é jato, Ib é oozing, IIb coágulo aderido, IIc mancha plana e III base limpa. Ia/Ib/IIa exigem hemostasia endoscópica."},{"number":57,"area":"Cirurgia Geral","stem":"Paciente com adenocarcinoma gástrico ressecável, não precoce, será submetido a gastrectomia oncológica. A linfadenectomia padrão em centros experientes é:","options":{"A":"linfadenectomia cervical","B":"D2, quando apropriada e realizada com segurança","C":"D4 obrigatória","D":"apenas linfonodo sentinela em todo caso","E":"nenhuma retirada linfonodal"},"answer":"B","topic":"Oncologia Cirúrgica","explanation":"Gastrectomia com linfadenectomia D2 é padrão oncológico para doença ressecável em muitos cenários, associada a estratégia perioperatória sistêmica conforme estágio."},{"number":58,"area":"Cirurgia Geral","stem":"GIST é um tumor mesenquimal gastrointestinal frequentemente positivo para:","options":{"A":"KIT (CD117) e DOG1","B":"PSA","C":"calcitonina","D":"tiroglobulina","E":"p16 exclusivamente"},"answer":"A","topic":"Oncologia Cirúrgica","explanation":"GIST deriva de células relacionadas a Cajal e frequentemente apresenta mutações KIT ou PDGFRA, com expressão de KIT/CD117 e DOG1. O perfil molecular orienta terapia alvo."},{"number":59,"area":"Cirurgia Geral","stem":"Paciente com obesidade grave e refluxo gastroesofágico importante necessita cirurgia metabólica. Entre sleeve e bypass em Y de Roux, frequentemente se favorece:","options":{"A":"sleeve porque sempre cura refluxo","B":"gastrectomia total oncológica","C":"colectomia","D":"nenhuma técnica pode ser usada em obesidade","E":"bypass gástrico em Y de Roux por melhor controle de refluxo em muitos pacientes"},"answer":"E","topic":"Cirurgia Bariátrica","explanation":"Sleeve pode causar ou piorar refluxo; RYGB costuma melhorar GERD e é frequentemente preferido quando refluxo importante coexiste, considerando perfil individual."},{"number":60,"area":"Cirurgia Geral","stem":"Paciente com obstrução intestinal por aderências, estável, sem peritonite, sem isquemia e sem alça fechada pode inicialmente receber:","options":{"A":"manejo não operatório com hidratação, correção eletrolítica, descompressão quando necessária e observação seriada","B":"alimentação sólida forçada","C":"laparotomia imediata obrigatória em todos","D":"colonoscopia terapêutica em toda obstrução delgada","E":"alta sem orientação"},"answer":"A","topic":"Coloproctologia e Intestino","explanation":"Obstrução adesiva simples pode resolver sem cirurgia. Sinais de estrangulamento, alça fechada, peritonite, deterioração ou falha do manejo conservador indicam operação."},{"number":61,"area":"Cirurgia Geral","stem":"Idoso institucionalizado com distensão abdominal apresenta volvo de sigmoide sem sinais de perfuração ou isquemia. A abordagem inicial é:","options":{"A":"destorção endoscópica e descompressão, seguida de planejamento de ressecção eletiva devido ao risco de recorrência","B":"apenas laxante e alta","C":"CPRE","D":"colectomia total imediata em todo caso estável","E":"nenhum tratamento"},"answer":"A","topic":"Coloproctologia e Intestino","explanation":"Volvo sigmoide não complicado é inicialmente descomprimido endoscopicamente. Recorrência é alta, por isso colectomia eletiva é recomendada em paciente operável após descompressão bem-sucedida."},{"number":62,"area":"Cirurgia Geral","stem":"Paciente com volvo de ceco sintomático, sem contraindicação cirúrgica, geralmente deve ser tratado com:","options":{"A":"ressecção cirúrgica do segmento afetado, pois descompressão endoscópica tem baixa eficácia e alta recorrência","B":"observação indefinida","C":"colonoscopia como tratamento definitivo padrão","D":"fundoplicatura","E":"apenas antibiótico"},"answer":"A","topic":"Coloproctologia e Intestino","explanation":"Volvo cecal é tratado preferencialmente com cirurgia, frequentemente hemicolectomia direita, sobretudo em paciente operável."},{"number":63,"area":"Cirurgia Geral","stem":"Paciente com apendicite complicada apresenta abscesso periappendicular organizado de 5 cm, estável e sem peritonite difusa. Uma estratégia aceitável é:","options":{"A":"laparotomia obrigatória imediata em todos","B":"colonoscopia como drenagem","C":"alta sem seguimento","D":"nenhum antibiótico","E":"antibiótico e drenagem percutânea quando acessível, com decisão individualizada sobre apendicectomia intervalar"},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Abscesso apendicular bem formado pode ser manejado não operatoriamente com antibiótico ± drenagem. Apendicectomia intervalar não é obrigatória para todos e depende de idade, recorrência e investigação de neoplasia."},{"number":64,"area":"Cirurgia Geral","stem":"Paciente de 68 anos apresenta apendicite e massa apendicular. Após resolução, é especialmente importante considerar:","options":{"A":"timpanometria","B":"apenas audiometria","C":"investigação de neoplasia colorretal/apendicular, incluindo avaliação colônica conforme contexto","D":"nenhum seguimento por causa da idade","E":"teste de Schirmer"},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"Em adultos mais velhos, apendicite complicada ou massa pode ser apresentação de neoplasia apendicular/cecal; avaliação colônica e/ou imagem adicional é indicada conforme cenário."},{"number":65,"area":"Cirurgia Geral","stem":"Paciente com diverticulite apresenta abscesso pélvico de 6 cm, estável. A conduta usual inclui:","options":{"A":"apenas laxante","B":"alta sem antibiótico","C":"colectomia total imediata obrigatória em todos","D":"antibióticos e drenagem percutânea se tecnicamente acessível","E":"nenhuma imagem"},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Abscessos diverticulares maiores têm menor chance de resolução apenas com antibiótico. Drenagem percutânea é empregada quando factível, reservando cirurgia para falha, peritonite ou outras indicações."},{"number":66,"area":"Cirurgia Geral","stem":"Paciente com câncer colorretal e história familiar sugestiva apresenta deficiência de proteínas de reparo de mismatch. A síndrome hereditária associada é:","options":{"A":"síndrome de MEN2","B":"síndrome de Ramsay Hunt","C":"síndrome de Frey","D":"síndrome de Lynch","E":"síndrome de Peutz-Jeghers obrigatoriamente"},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Lynch resulta de variantes germinativas em genes MMR como MLH1, MSH2, MSH6 e PMS2/EPCAM e aumenta risco de câncer colorretal e outros tumores."},{"number":67,"area":"Cirurgia Geral","stem":"Paciente com isquemia mesentérica aguda embólica apresenta dor abdominal súbita intensa desproporcional ao exame. O exame de escolha em paciente estável é:","options":{"A":"radiografia de crânio","B":"angio-TC de abdome","C":"timpanometria","D":"ultrassom de tireoide","E":"colonoscopia como primeiro exame em todos"},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"Angio-TC é método diagnóstico rápido para avaliar oclusão arterial/venosa, perfusão intestinal e diagnósticos diferenciais. Tratamento requer ressuscitação e revascularização/avaliação intestinal urgente quando há oclusão arterial."},{"number":68,"area":"Cirurgia Geral","stem":"Paciente com colecistite aguda calculosa e baixo risco cirúrgico procura atendimento precocemente. A conduta preferida é:","options":{"A":"aguardar obrigatoriamente 3 meses","B":"colecistectomia laparoscópica precoce na mesma internação","C":"colecistostomia em todo jovem","D":"CPRE para todos","E":"apenas antibiótico como cura definitiva"},"answer":"B","topic":"Hepatobiliopancreática","explanation":"Colecistectomia precoce reduz recorrência e tempo total de internação. Colecistostomia é alternativa para pacientes selecionados de alto risco ou com impossibilidade de cirurgia imediata."},{"number":69,"area":"Cirurgia Geral","stem":"Paciente com icterícia, febre e dor em hipocôndrio direito apresenta colangite e cálculo em colédoco. Além de antibióticos e ressuscitação, deve-se realizar:","options":{"A":"colecistectomia isolada sem descompressão em choque","B":"observar até desaparecer febre","C":"apenas analgesia","D":"pancreatectomia","E":"drenagem biliar precoce, preferencialmente por CPRE quando disponível e apropriada"},"answer":"E","topic":"Hepatobiliopancreática","explanation":"Colangite é infecção sob pressão e requer descompressão da via biliar. CPRE é a via preferida na maioria dos casos; alternativas são percutânea ou cirúrgica quando endoscopia não é possível."},{"number":70,"area":"Cirurgia Geral","stem":"Paciente com pancreatite aguda apresenta dor típica e lipase >3 vezes o limite superior. A TC contrastada nas primeiras horas:","options":{"A":"é contraindicada para sempre","B":"não é obrigatória para confirmar diagnóstico típico e deve ser reservada a dúvida diagnóstica ou avaliação de complicações/gravidade em momento apropriado","C":"substitui avaliação clínica","D":"sempre mostra necrose nas primeiras 2 horas","E":"é obrigatória em todos antes de analgesia"},"answer":"B","topic":"Hepatobiliopancreática","explanation":"Diagnóstico requer dois de três critérios: dor típica, enzimas >3x e imagem. TC precoce de rotina não melhora manejo e pode subestimar necrose; é útil quando diagnóstico é incerto ou evolução é desfavorável."},{"number":71,"area":"Cirurgia Geral","stem":"Paciente com necrose pancreática infectada, estável, quatro semanas após pancreatite, apresenta coleção encapsulada. A estratégia contemporânea favorece:","options":{"A":"pancreatectomia total obrigatória","B":"abordagem step-up, começando por drenagem e postergando necrosectomia quando possível","C":"laparotomia e necrosectomia aberta imediata em todos","D":"nenhum antibiótico","E":"apenas dieta oral"},"answer":"B","topic":"Hepatobiliopancreática","explanation":"Na necrose infectada organizada, drenagem percutânea/endoscópica e necrosectomia minimamente invasiva conforme necessidade reduzem morbidade comparadas à cirurgia aberta precoce."},{"number":72,"area":"Cirurgia Geral","stem":"Pseudocisto pancreático assintomático de 5 cm, maduro, sem infecção, obstrução ou crescimento preocupante deve ser:","options":{"A":"drenado obrigatoriamente por ser maior que 4 cm","B":"tratado com CPRE em todos","C":"considerado câncer até prova em contrário","D":"observado clinicamente e por imagem, sem drenagem apenas pelo tamanho","E":"ressecado com Whipple"},"answer":"D","topic":"Hepatobiliopancreática","explanation":"Indicações de drenagem são sintomas, infecção, sangramento, obstrução, ruptura ou crescimento/diagnóstico incerto; o antigo critério isolado de 6 cm/6 semanas não é indicação absoluta."},{"number":73,"area":"Cirurgia Geral","stem":"Paciente com carcinoma hepatocelular pequeno, fígado não cirrótico, função hepática preservada e sem hipertensão portal significativa pode ser candidato a:","options":{"A":"ressecção hepática","B":"gastrectomia","C":"colectomia","D":"transplante obrigatório em todo HCC","E":"nenhuma terapia curativa"},"answer":"A","topic":"Hepatobiliopancreática","explanation":"Ressecção é excelente opção em HCC localizado com reserva hepática adequada, especialmente em fígado não cirrótico. Transplante beneficia pacientes selecionados com cirrose e tumores dentro de critérios."},{"number":74,"area":"Cirurgia Geral","stem":"Paciente com feocromocitoma será submetido a adrenalectomia. O preparo farmacológico clássico exige:","options":{"A":"betabloqueio isolado antes de alfa em todos","B":"apenas diurético","C":"bloqueio alfa-adrenérgico adequado antes de eventual introdução de betabloqueador","D":"corticosteroide como única preparação","E":"nenhum controle pressórico"},"answer":"C","topic":"Endócrino e Tireoide","explanation":"Bloqueio beta antes do alfa pode causar crise hipertensiva por estímulo alfa sem oposição. Expansão volêmica e controle de pressão fazem parte do preparo."},{"number":75,"area":"Cirurgia Geral","stem":"Após tireoidectomia total, paciente desenvolve parestesias, câimbras e sinal de Chvostek. A alteração laboratorial esperada é:","options":{"A":"hipercalcemia grave obrigatória","B":"hiperpotassemia por lesão do recorrente","C":"hiperglicemia como causa direta","D":"hipocalcemia, frequentemente por hipoparatireoidismo transitório ou permanente","E":"hipernatremia isolada"},"answer":"D","topic":"Endócrino e Tireoide","explanation":"Hipoparatireoidismo pós-tireoidectomia reduz PTH e cálcio. Casos sintomáticos requerem reposição de cálcio, e calcitriol é usado conforme gravidade e evolução."},{"number":76,"area":"Cirurgia Geral","stem":"Paciente após tireoidectomia apresenta voz soprosa e uma prega vocal imóvel em posição paramediana. O nervo mais provavelmente lesionado é:","options":{"A":"nervo auriculotemporal","B":"nervo frênico","C":"ramo marginal mandibular do facial","D":"nervo laríngeo recorrente ipsilateral","E":"nervo óptico"},"answer":"D","topic":"Endócrino e Tireoide","explanation":"O recorrente inerva todos os músculos intrínsecos da laringe exceto cricotireóideo. Lesão unilateral causa disfonia e pode causar aspiração; avaliação laríngea confirma mobilidade."},{"number":77,"area":"Cirurgia Geral","stem":"Bócio mergulhante volumoso causa compressão traqueal e sintomas. Na maioria dos casos, a abordagem inicial para ressecção é:","options":{"A":"nenhuma cirurgia mesmo sintomático","B":"toracotomia obrigatória bilateral","C":"acesso abdominal","D":"cervical, reservando esternotomia para extensão/anatomia selecionadas","E":"esternotomia obrigatória em todo bócio substernal"},"answer":"D","topic":"Endócrino e Tireoide","explanation":"A maioria dos bócios substernal pode ser removida por cervicotomia. Esternotomia é rara e depende de extensão abaixo do arco aórtico, componente mediastinal posterior, tumor ectópico/recorrente e outras características."},{"number":78,"area":"Cirurgia Geral","stem":"Paciente com trauma esplênico grau alto está hemodinamicamente estável, mas TC mostra blush arterial. Uma estratégia preservadora do baço é:","options":{"A":"alta imediata","B":"anticoagulação plena para parar sangramento","C":"esplenectomia obrigatória apesar de estabilidade","D":"nenhuma observação","E":"angiografia com embolização em paciente selecionado, associada a monitorização"},"answer":"E","topic":"Trauma e Emergências","explanation":"Angioembolização aumenta sucesso do manejo não operatório em pacientes estáveis com blush, pseudoaneurisma ou lesões de maior grau, conforme recursos e protocolo."},{"number":79,"area":"Cirurgia Geral","stem":"Paciente com trauma hepático fechado, estável, sem peritonite e sem sangramento ativo importante pode ser tratado com:","options":{"A":"CPRE obrigatória para todos","B":"laparotomia por toda lesão vista na TC","C":"manejo não operatório e monitorização","D":"hepatectomia obrigatória em qualquer grau","E":"alta sem avaliação"},"answer":"C","topic":"Trauma e Emergências","explanation":"Manejo não operatório é padrão para a maioria dos traumas hepáticos em pacientes estáveis; angioembolização e intervenções biliares são usadas conforme complicações."},{"number":80,"area":"Cirurgia Geral","stem":"Paciente capaz compreende diagnóstico e opções, mas decide não operar uma neoplasia potencialmente curável. A conduta ética é:","options":{"A":"obrigar familiar a autorizar","B":"operar sem consentimento porque a cirurgia é benéfica","C":"declarar incapacidade apenas porque discorda do médico","D":"omitir prognóstico","E":"respeitar a decisão informada após garantir capacidade, compreensão e ausência de coerção, documentando a discussão"},"answer":"E","topic":"Perioperatório e Ética","explanation":"Capacidade decisória não depende de concordar com a recomendação médica. Adulto capaz pode recusar tratamento após informação adequada; exceções envolvem incapacidade, emergência sem representante e situações legais específicas."}]},"simulado_ccp_06":{"id":"simulado_ccp_06","label":"Simulado 6 — ENARE CCP","subtitle":"Nível ENARE+ — difícil/calibrador · 80 questões","localKey":"enare_ccp_simulado_06_v1","order":"1–40 Otorrinolaringologia · 41–80 Cirurgia Geral","sourceNote":"Simulado autoral/fortemente adaptado para preparação ENARE R+ CCP. Comentários aparecem somente após a correção. Questões 6–8 foram calibradas para maior dificuldade e poder diagnóstico.","questions":[{"number":1,"area":"Otorrinolaringologia","stem":"Paciente de 56 anos refere crises de vertigem rotatória de 20 a 40 segundos ao virar-se para a direita na cama. Dix-Hallpike à direita desencadeia nistagmo torsional com componente vertical para cima, com latência de alguns segundos, fatigável. Qual é a conduta inicial mais apropriada?","options":{"A":"Solicitar ressonância de encéfalo e meatos acústicos antes do tratamento.","B":"Betahistina contínua por 3 meses antes de qualquer manobra.","C":"Manobra de Lempert (barbecue roll) para o canal lateral direito.","D":"Manobra de Gufoni para canal lateral geotrópico.","E":"Manobra de reposicionamento de Epley para o canal semicircular posterior direito."},"answer":"E","topic":"Vestibulologia","explanation":"O padrão torsional upbeat, provocado pelo Dix-Hallpike, com latência e fatigabilidade é típico de VPPB do canal posterior. A manobra de Epley é tratamento de primeira linha.","difficulty":"hard","fragility":true},{"number":2,"area":"Otorrinolaringologia","stem":"Uma mulher de 42 anos apresenta vertigem contínua há 36 horas, náuseas intensas e dificuldade para caminhar. O head impulse test é anormal para a esquerda, há nistagmo horizontal unidirecional que aumenta ao olhar para a direita e skew test negativo. Não há sintomas auditivos. Qual diagnóstico é mais provável?","options":{"A":"VPPB de canal horizontal esquerdo.","B":"Neurite vestibular esquerda.","C":"AVC de circulação posterior.","D":"Labirintite bacteriana.","E":"Doença de Ménière esquerda."},"answer":"B","topic":"Vestibulologia","explanation":"No contexto de síndrome vestibular aguda, HINTS com HIT anormal, nistagmo unidirecional e ausência de skew favorece causa periférica. A ausência de sintomas cocleares favorece neurite vestibular, e o lado do HIT alterado é o lado hipofuncionante.","difficulty":"hard","fragility":false},{"number":3,"area":"Otorrinolaringologia","stem":"Paciente com VPPB apresenta nistagmo horizontal geotrópico bilateral durante o roll test, mais intenso quando a cabeça é virada para a esquerda. Qual combinação identifica corretamente o canal e o lado acometidos?","options":{"A":"Canal semicircular posterior esquerdo.","B":"Canal semicircular lateral esquerdo, variante geotrópica.","C":"Canal semicircular anterior direito.","D":"Canal semicircular lateral esquerdo, variante apogeotrópica.","E":"Canal semicircular lateral direito, variante geotrópica."},"answer":"B","topic":"Vestibulologia","explanation":"Na VPPB horizontal geotrópica, o lado afetado costuma produzir o nistagmo mais intenso. O roll test é a manobra diagnóstica fundamental para o canal lateral.","difficulty":"hard","fragility":true},{"number":4,"area":"Otorrinolaringologia","stem":"Paciente de 68 anos com vertigem súbita contínua e ataxia importante apresenta head impulse test normal, nistagmo que muda de direção conforme o olhar e desvio vertical ocular no cover test. A melhor interpretação é:","options":{"A":"Conjunto de achados fortemente sugestivo de lesão vestibular central, devendo-se investigar AVC de circulação posterior.","B":"VPPB multicanal, indicada manobra de Epley bilateral.","C":"Labirintite viral com HINTS periférico.","D":"Quadro compatível com Ménière sem necessidade de imagem.","E":"Achados típicos de neurite vestibular, podendo receber alta após sintomáticos."},"answer":"A","topic":"Vestibulologia","explanation":"No HINTS, HIT normal, nistagmo direction-changing e skew positivo são sinais centrais e, em síndrome vestibular aguda, devem elevar muito a suspeita de AVC posterior.","difficulty":"hard","fragility":false},{"number":5,"area":"Otorrinolaringologia","stem":"Adulto com otite média crônica colesteatomatosa apresenta paralisia facial periférica aguda e vertigem. A TC mostra erosão do canal semicircular lateral. Qual é a melhor conduta?","options":{"A":"Corticoterapia isolada por provável paralisia de Bell.","B":"Timpanoplastia eletiva somente após 6 meses sem otorreia.","C":"Tratamento cirúrgico urgente da doença colesteatomatosa, associado ao manejo da infecção e avaliação do nervo facial/labirinto.","D":"Aparelho auditivo como tratamento definitivo.","E":"Antibiótico oral e reavaliação em 30 dias."},"answer":"C","topic":"Otologia e Audiologia","explanation":"Colesteatoma complicado com paralisia facial e fístula labiríntica exige controle cirúrgico da doença; tratamento conservador isolado é inadequado.","difficulty":"hard","fragility":false},{"number":6,"area":"Otorrinolaringologia","stem":"Paciente de 36 anos refere hipoacusia progressiva à direita e zumbido unilateral. Audiometria mostra perda neurossensorial assimétrica e discriminação vocal desproporcionalmente baixa à direita. Qual exame é mais indicado para excluir lesão retrococlear?","options":{"A":"Eletrococleografia como exame definitivo.","B":"Ressonância magnética de meatos acústicos internos com contraste.","C":"TC de ossos temporais sem contraste.","D":"Radiografia de mastoides.","E":"Impedanciometria isolada."},"answer":"B","topic":"Otologia e Audiologia","explanation":"Perda neurossensorial assimétrica, sobretudo com discriminação vocal baixa, exige investigação retrococlear; RM de meatos acústicos é o exame de escolha.","difficulty":"hard","fragility":false},{"number":7,"area":"Otorrinolaringologia","stem":"Mulher de 31 anos apresenta hipoacusia condutiva progressiva, membrana timpânica normal, reflexo estapediano ausente e curva timpanométrica tipo A. Há história familiar semelhante. O diagnóstico mais provável é:","options":{"A":"Otite média com efusão.","B":"Schwannoma vestibular.","C":"Doença de Ménière.","D":"Descontinuidade ossicular traumática.","E":"Otosclerose."},"answer":"E","topic":"Otologia e Audiologia","explanation":"Otosclerose costuma cursar com perda condutiva progressiva, otoscopia normal, timpanometria A/As e reflexos estapedianos ausentes.","difficulty":"hard","fragility":false},{"number":8,"area":"Otorrinolaringologia","stem":"Criança de 4 anos com otite média com efusão bilateral persistente há 4 meses apresenta perda auditiva documentada e atraso de linguagem. Qual conduta é mais apropriada?","options":{"A":"Manter apenas observação por mais 12 meses, independentemente da audição.","B":"Realizar mastoidectomia cortical bilateral.","C":"Prescrever antibiótico profilático contínuo.","D":"Indicar tubos de ventilação, considerando adenoidectomia conforme idade/indicações associadas.","E":"Prescrever corticoide sistêmico por 30 dias como tratamento definitivo."},"answer":"D","topic":"Otologia e Audiologia","explanation":"Efusão bilateral persistente com perda auditiva e impacto no desenvolvimento é indicação clássica de intervenção com tubos de ventilação; a adenoide é avaliada conforme o contexto clínico.","difficulty":"hard","fragility":false},{"number":9,"area":"Otorrinolaringologia","stem":"Homem de 48 anos apresenta zumbido pulsátil unilateral e massa retro-timpânica avermelhada que pulsa à otoscopia. Qual hipótese e conduta diagnóstica são mais adequadas?","options":{"A":"Otosclerose; indicar estapedotomia sem imagem.","B":"Ceruminoma; realizar curetagem imediata.","C":"Paraganglioma timpânico/jugular; solicitar imagem vascular e de osso temporal antes de qualquer biópsia.","D":"Colesteatoma; biopsiar a massa no consultório.","E":"Otite média aguda; realizar miringotomia diagnóstica."},"answer":"C","topic":"Otologia e Audiologia","explanation":"Massa pulsátil retro-timpânica sugere paraganglioma. Biópsia pode causar sangramento importante; a caracterização é feita por imagem antes da abordagem.","difficulty":"hard","fragility":true},{"number":10,"area":"Otorrinolaringologia","stem":"Paciente submetido a mergulho apresenta otalgia intensa e hipoacusia após ascensão rápida. Otoscopia mostra hemotímpano, sem perfuração. Audiometria revela perda predominantemente condutiva. Qual mecanismo é mais provável?","options":{"A":"Otosclerose desencadeada pelo mergulho.","B":"Labirintite autoimune.","C":"Barotrauma de orelha média por falha de equalização da pressão através da tuba auditiva.","D":"Ruptura espontânea do nervo coclear.","E":"Doença descompressiva coclear obrigatória."},"answer":"C","topic":"Otologia e Audiologia","explanation":"Hemotímpano após mudança de pressão, com perda condutiva, aponta para barotrauma de orelha média por falha na equalização tubária.","difficulty":"hard","fragility":false},{"number":11,"area":"Otorrinolaringologia","stem":"Adulto asmático apresenta polipose nasal bilateral recidivante e refere broncoespasmo após uso de AAS. Qual associação fisiopatológica é mais característica?","options":{"A":"Granulomatose com poliangiite como causa usual.","B":"Reação IgE-mediada específica ao AAS em todos os casos.","C":"Doença respiratória exacerbada por AAS, relacionada à desregulação do metabolismo do ácido araquidônico e aumento de leucotrienos.","D":"Infecção fúngica invasiva por Mucor em paciente imunocompetente.","E":"Deficiência seletiva de IgA como mecanismo obrigatório."},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"A tríade asma, polipose/rinossinusite crônica e hipersensibilidade a AAS caracteriza AERD, associada a desbalanço eicosanoide e excesso de leucotrienos.","difficulty":"hard","fragility":false},{"number":12,"area":"Otorrinolaringologia","stem":"Paciente imunocompetente com asma apresenta rinossinusite crônica, pólipos, eosinofilia, mucina espessa e hiperdensa com expansão de seios na TC, sem invasão tecidual. Qual diagnóstico é mais provável?","options":{"A":"Mucormicose rinocerebral invasiva.","B":"Rinossinusite bacteriana aguda complicada.","C":"Bola fúngica isolada sem resposta inflamatória alérgica.","D":"Carcinoma sinonasal.","E":"Rinossinusite fúngica alérgica."},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Rinossinusite fúngica alérgica ocorre tipicamente em imunocompetentes atópicos, com pólipos, mucina eosinofílica e material hiperdenso/expansivo, sem invasão.","difficulty":"hard","fragility":true},{"number":13,"area":"Otorrinolaringologia","stem":"Adolescente com obstrução nasal unilateral apresenta pólipo que se origina no seio maxilar, passa pelo óstio acessório e se estende posteriormente até a coana. O diagnóstico é:","options":{"A":"Pólipo etmoidal bilateral.","B":"Encefalocele nasal.","C":"Papiloma invertido obrigatoriamente maligno.","D":"Pólipo antrocoanal.","E":"Angiofibroma nasofaríngeo juvenil."},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"O pólipo antrocoanal é geralmente unilateral, nasce no seio maxilar e se projeta em direção à coana/nasofaringe.","difficulty":"hard","fragility":true},{"number":14,"area":"Otorrinolaringologia","stem":"Homem de 19 anos apresenta epistaxes recorrentes volumosas e obstrução nasal progressiva. Endoscopia mostra massa vascular na nasofaringe. Qual atitude deve ser evitada antes da caracterização radiológica?","options":{"A":"Biópsia incisional da lesão no consultório.","B":"Angiografia em casos selecionados para planejamento/embolização.","C":"Planejamento cirúrgico conforme estadiamento.","D":"TC/RM para avaliar extensão.","E":"Avaliação da extensão à fossa pterigopalatina."},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"O angiofibroma nasofaríngeo juvenil é altamente vascular; biópsia prévia costuma ser evitada por risco hemorrágico quando o quadro clínico-radiológico é típico.","difficulty":"hard","fragility":false},{"number":15,"area":"Otorrinolaringologia","stem":"Paciente com rinossinusite bacteriana aguda evolui com edema palpebral, dor à movimentação ocular, proptose e redução da acuidade visual. Qual é a prioridade?","options":{"A":"Manter apenas lavagem nasal e retorno em 72 horas.","B":"Realizar punção lombar antes de qualquer imagem.","C":"Internação, antibiótico intravenoso, avaliação oftalmológica/otorrinolaringológica urgente e imagem para complicação orbitária, com drenagem quando indicada.","D":"Iniciar anti-histamínico e liberar para casa.","E":"Prescrever somente corticoide nasal porque se trata de celulite pré-septal simples."},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Proptose, oftalmoplegia/dor ocular e alteração visual sugerem doença pós-septal/abscesso orbitário, uma complicação potencialmente grave que exige manejo hospitalar urgente.","difficulty":"hard","fragility":false},{"number":16,"area":"Otorrinolaringologia","stem":"Paciente refere obstrução nasal que melhora ao tracionar lateralmente a bochecha. Endoscopia não mostra pólipos e o septo tem apenas discreto desvio. A manobra de Cottle modificada localizada melhora claramente o fluxo. O achado sugere principalmente:","options":{"A":"Comprometimento da válvula nasal.","B":"Fístula liquórica.","C":"Atresia coanal bilateral.","D":"Hipertrofia adenoideana.","E":"Rinossinusite fúngica alérgica."},"answer":"A","topic":"Rinologia e Rinossinusites","explanation":"Melhora localizada com manobra de Cottle modificada é compatível com insuficiência/estreitamento da válvula nasal, especialmente quando outras causas obstrutivas são discretas.","difficulty":"hard","fragility":true},{"number":17,"area":"Otorrinolaringologia","stem":"Professora de 34 anos apresenta disfonia progressiva ao longo do dia. Videolaringoscopia mostra lesões bilaterais, simétricas, na junção do terço anterior com os dois terços posteriores das pregas vocais. Qual é a conduta inicial preferencial?","options":{"A":"Radioterapia de baixa dose.","B":"Tireoplastia tipo I.","C":"Microcirurgia laríngea imediata em todos os casos.","D":"Antibiótico por 21 dias.","E":"Fonoterapia e medidas de higiene vocal, reservando cirurgia para casos selecionados/refratários."},"answer":"E","topic":"Laringologia e Voz","explanation":"O quadro é típico de nódulos vocais, cujo tratamento inicial é comportamental/fonoterápico; cirurgia não é primeira linha na maioria dos casos.","difficulty":"hard","fragility":true},{"number":18,"area":"Otorrinolaringologia","stem":"Após intubação prolongada, paciente desenvolve dispneia inspiratória semanas depois. Laringoscopia mostra mobilidade das pregas vocais preservada e estreitamento cicatricial subglótico. Qual diagnóstico é mais provável?","options":{"A":"Laringomalácia.","B":"Paralisia bilateral de pregas vocais.","C":"Disfonia espasmódica.","D":"Nódulos vocais.","E":"Estenose subglótica pós-intubação."},"answer":"E","topic":"Laringologia e Voz","explanation":"Dispneia tardia após intubação, com mobilidade vocal preservada e cicatriz subglótica, é típica de estenose laringotraqueal pós-intubação.","difficulty":"hard","fragility":true},{"number":19,"area":"Otorrinolaringologia","stem":"Paciente tabagista de 62 anos apresenta disfonia persistente. Há lesão irregular em prega vocal verdadeira e redução de mobilidade. Qual é a próxima etapa mais apropriada?","options":{"A":"Fonoterapia isolada.","B":"Empiricamente inibidor de bomba de prótons por 6 meses antes de investigar.","C":"Observação anual por se tratar de disfonia comum em tabagistas.","D":"Endoscopia laríngea com avaliação oncológica e biópsia da lesão para diagnóstico histológico.","E":"Punção aspirativa da prega vocal."},"answer":"D","topic":"Laringologia e Voz","explanation":"Disfonia persistente em tabagista com lesão irregular e alteração de mobilidade é sinal de alerta para malignidade e exige diagnóstico endoscópico/histológico.","difficulty":"hard","fragility":false},{"number":20,"area":"Otorrinolaringologia","stem":"Mulher de 29 anos apresenta voz soprosa após tireoidectomia. A laringoscopia mostra prega vocal esquerda imóvel em posição paramediana. Qual nervo foi mais provavelmente lesionado?","options":{"A":"Ramo interno do nervo laríngeo superior.","B":"Nervo hipoglosso.","C":"Ramo externo do nervo laríngeo superior isoladamente.","D":"Nervo glossofaríngeo.","E":"Nervo laríngeo recorrente esquerdo."},"answer":"E","topic":"Laringologia e Voz","explanation":"Lesão do recorrente causa paralisia da prega vocal. Lesão isolada do ramo externo do laríngeo superior compromete sobretudo tensão e alcance de tons agudos, sem imobilidade completa.","difficulty":"hard","fragility":false},{"number":21,"area":"Otorrinolaringologia","stem":"Homem de 45 anos, IMC 31 kg/m², apresenta IAH de 54 eventos/h, sonolência diurna e dessaturações. Como a apneia obstrutiva do sono é classificada pelo IAH?","options":{"A":"Leve.","B":"Indeterminada sem endoscopia do sono.","C":"Moderada.","D":"Grave.","E":"Normal."},"answer":"D","topic":"Sono e Via Aérea Superior","explanation":"Em adultos, IAH ≥30 eventos/h caracteriza AOS grave. Esse é um ponto clássico de classificação em prova.","difficulty":"hard","fragility":true},{"number":22,"area":"Otorrinolaringologia","stem":"Paciente com AOS moderada a grave, sem anomalia anatômica única claramente corrigível, pergunta qual é o tratamento de primeira linha com maior eficácia em normalizar eventos respiratórios. A resposta é:","options":{"A":"Pressão positiva contínua nas vias aéreas (CPAP), quando tolerada e indicada.","B":"Amigdalectomia em todos os adultos.","C":"Traqueostomia eletiva como primeira opção.","D":"Oxigênio noturno isolado.","E":"Septoplastia isolada, independentemente da obstrução nasal."},"answer":"A","topic":"Sono e Via Aérea Superior","explanation":"CPAP é tratamento de referência para AOS moderada/grave em muitos adultos. Cirurgias são selecionadas conforme anatomia, gravidade, preferência e falha/intolerância a terapia positiva.","difficulty":"hard","fragility":true},{"number":23,"area":"Otorrinolaringologia","stem":"Criança de 6 anos com ronco habitual, pausas respiratórias e hipertrofia adenotonsilar importante apresenta polissonografia compatível com AOS. Na ausência de contraindicações, qual intervenção é mais típica como primeira opção cirúrgica?","options":{"A":"Adenotonsilectomia.","B":"Uvulopalatofaringoplastia.","C":"Septoplastia isolada.","D":"CPAP obrigatório antes de qualquer abordagem anatômica.","E":"Traqueostomia."},"answer":"A","topic":"Sono e Via Aérea Superior","explanation":"Na AOS pediátrica associada a hipertrofia adenotonsilar, a adenotonsilectomia é a abordagem cirúrgica clássica de primeira linha.","difficulty":"hard","fragility":false},{"number":24,"area":"Otorrinolaringologia","stem":"Adulto com ronco, obstrução nasal e amígdalas grau IV tem IAH de 3 eventos/h na polissonografia e nega sonolência excessiva. Qual afirmação é correta?","options":{"A":"O IAH está na faixa normal para AOS em adulto; CPAP não é indicado apenas por esse resultado, e a abordagem deve focar sint palatina completa será acompanhado por equipe multidisciplinar. Qual sequência conceitual é mais compatível com a prática usual?","options":{"A":"Aguardar dentição permanente para qualquer correção.","B":"Queiloplastia nos primeiros meses de vida e palatoplastia posteriormente, ainda na primeira infância, conforme protocolo e condições clínicas.","C":"Palatoplastia ao nascimento e queiloplastia apenas após 5 anos.","D":"Fazer palatoplastia apenas após o término do crescimento facial.","E":"Realizar apenas queiloplastia, pois a fenda palatina fecha espontaneamente."},"answer":"B","topic":"Craniofacial e Pediatria","explanation":"A correção do lábio costuma preceder a do palato. Protocolos variam, mas a palatoplastia é feita na primeira infância para favorecer função e fala; não se espera o crescimento completo.","difficulty":"hard","fragility":true},{"number":33,"area":"Otorrinolaringologia","stem":"Criança com micrognatia, glossoptose e fissura palatina apresenta episódios de obstrução respiratória. Essa tríade caracteriza:","options":{"A":"Síndrome de Down.","B":"Síndrome de Crouzon.","C":"Síndrome de Treacher Collins obrigatoriamente.","D":"Sequência de Pierre Robin.","E":"Síndrome de Waardenburg."},"answer":"D","topic":"Craniofacial e Pediatria","explanation":"Micrognatia leva a glossoptose e pode associar-se a fissura palatina; esse encadeamento é clássico da sequência de Pierre Robin.","difficulty":"hard","fragility":false},{"number":34,"area":"Otorrinolaringologia","stem":"Criança com atresia bilateral de conduto auditivo externo e malformação ossicular apresenta cóclea funcional. Qual estratégia auditiva é particularmente útil quando a via aérea não pode ser aproveitada?","options":{"A":"Estapedotomia bilateral como primeira opção.","B":"Implante coclear obrigatório, independentemente da função coclear.","C":"Dispositivo de condução óssea.","D":"Apenas leitura labial até a adolescência.","E":"Aparelho convencional por via aérea no conduto atrésico."},"answer":"C","topic":"Craniofacial e Pediatria","explanation":"Quando a cóclea funciona e há bloqueio da via aérea por atresia, dispositivos de condução óssea contornam o componente condutivo.","difficulty":"hard","fragility":true},{"number":35,"area":"Otorrinolaringologia","stem":"Adulto jovem apresenta massa cervical mediana que se eleva com a deglutição e com a protrusão da língua. O diagnóstico mais provável e a operação padrão são:","options":{"A":"Laringocele; tireoidectomia total.","B":"Cisto dermoide; procedimento de Sistrunk com tireoidectomia.","C":"Cisto branquial; cervicotomia com amigdalectomia obrigatória.","D":"Cisto do ducto tireoglosso; procedimento de Sistrunk com ressecção do segmento central do hioide.","E":"Linfangioma; esvaziamento cervical radical."},"answer":"D","topic":"Pescoço e Tireoide","explanation":"A mobilidade com protrusão da língua é característica de cisto tireoglosso. Sistrunk reduz recorrência ao remover o cisto, trajeto e porção central do hioide.","difficulty":"hard","fragility":false},{"number":36,"area":"Otorrinolaringologia","stem":"Adulto apresenta massa lateral cervical ao longo da borda anterior do esternocleidomastoideo. Imagem sugere cisto de segunda fenda branquial. Em relação ao trajeto clássico, é correto afirmar que ele se relaciona com a bifurcação carotídea e pode dirigir-se à fossa tonsilar.","options":{"A":"Essa descrição define anomalia de primeira fenda exclusivamente.","B":"O trajeto clássico passa sempre pelo forame jugular.","C":"Essa descrição é compatível com anomalia da segunda fenda branquial.","D":"O trajeto típico termina no ápice do seio piriforme e define quarta fenda.","E":"Toda massa cística lateral em adulto deve ser presumida benigna, dispensando investigação oncológica."},"answer":"C","topic":"Pescoço e Tireoide","explanation":"Anomalias de segunda fenda são as mais comuns e podem seguir da região lateral do pescoço entre estruturas carotídeas em direção à fossa tonsilar. Em adultos, porém, massa císti
