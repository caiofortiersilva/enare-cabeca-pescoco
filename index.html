async function syncAll(){if(!sb||!currentUser)return;setCloud('Sincronizando…','warn');try{const{data,error}=await sb.from('quiz_progress').select('quiz_id,progress,updated_at').eq('user_id',currentUser.id).in('quiz_id',EXAM_IDS);if(error)throw error;const by={};(data||[]).forEach(r=>by[r.quiz_id]=r);for(const id of EXAM_IDS){const row=by[id];if(row)states[id]=chooseNewest(states[id],row.progress,row.updated_at,EXAMS[id]);saveLocal(id);if(!row&&hasProgress(states[id]))await pushProgress(id)}for(const id of EXAM_IDS)await ensureAttempt(id);await loadAttempts();setCloud('Sincronizado','ok');render()}catch(e){console.error(e);setCloud('Falha ao sincronizar','bad')}}
function setCloud(text,kind=''){const el=$('#cloudPill');if(!el)return;el.textContent=currentUser?'☁ '+text:'☁ Somente local';el.className='cloudpill '+kind}
function authBoxHtml(){if(currentUser)return `<div class="card authbox"><div class="row space"><div><b>Sincronização ativa</b><div class="muted" style="font-size:12px">${esc(currentUser.email||'')}</div></div><div class="row"><button class="secondary" onclick="syncAll()">Sincronizar agora</button><button class="secondary" onclick="logout()">Sair</button></div></div><div id="authMsg" class="authmsg"></div></div>`;const otpStep=pendingOtpEmail?`<div class="authstep"><div class="muted" style="font-size:12px;margin-bottom:8px">Código enviado para <b>${esc(pendingOtpEmail)}</b></div><div class="row"><input id="otpInput" class="otpinput" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="000000" oninput="this.value=this.value.replace(/\D/g,'').slice(0,8)" onkeydown="if(event.key==='Enter')verifyOtpCode()"><button class="primary" onclick="verifyOtpCode()">Confirmar código</button><button class="secondary" onclick="sendOtp()">Reenviar</button></div><div class="authhint">Digite o código numérico recebido no e-mail. Você não precisa abrir nenhum link.</div></div>`:'';return `<div class="card authbox"><b>Sincronização entre dispositivos</b><div class="muted" style="font-size:12px;margin:5px 0 10px">Entre com o mesmo e-mail em todos os aparelhos. O acesso agora é feito por código, sem Magic Link.</div><div class="row"><input id="emailInput" type="email" autocomplete="email" value="${esc(pendingOtpEmail)}" placeholder="seu e-mail" onkeydown="if(event.key==='Enter')sendOtp()"><button class="primary" onclick="sendOtp()">${pendingOtpEmail?'Enviar novo código':'Enviar código'}</button></div>${otpStep}<div id="authMsg" class="authmsg"></div></div>`}
function authMsg(text,kind=''){const e=$('#authMsg');if(e){e.textContent=text;e.className='authmsg '+kind}}
async function sendOtp(){if(!sb)return authMsg('Biblioteca de sincronização indisponível.','bad');const email=$('#emailInput')?.value.trim().toLowerCase();if(!email)return authMsg('Digite seu e-mail.','warn');authMsg('Enviando código…','warn');const{error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)return authMsg(error.message,'bad');pendingOtpEmail=email;localStorage.setItem('enare_ccp_pending_otp_email',email);render();authMsg('Código enviado. Digite-o abaixo; não abra links do e-mail.','ok');setTimeout(()=>$('#otpInput')?.focus(),0)}
async function verifyOtpCode(){if(!sb)return authMsg('Biblioteca de sincronização indisponível.','bad');const email=(pendingOtpEmail||$('#emailInput')?.value||'').trim().toLowerCase(),token=($('#otpInput')?.value||'').replace(/\D/g,'');if(!email)return authMsg('Informe o e-mail usado para receber o código.','warn');if(token.length<6||token.length>8)return authMsg('Digite o código numérico recebido no e-mail.','warn');authMsg('Confirmando código…','warn');const{data,error}=await sb.auth.verifyOtp({email,token,type:'email'});if(error)return authMsg(error.message,'bad');pendingOtpEmail='';localStorage.removeItem('enare_ccp_pending_otp_email');currentUser=data?.session?.user||data?.user||null;if(currentUser){startRealtime();setCloud('Sincronizando…','warn');await syncAll();render()}else authMsg('Código confirmado, mas a sessão não foi criada. Tente novamente.','bad')}
async function logout(){if(sb)await sb.auth.signOut();currentUser=null;pendingOtpEmail='';localStorage.removeItem('enare_ccp_pending_otp_email');stopRealtime();setCloud('Somente local');render()}
function clearLegacyAuthErrorHash(){if(location.hash&&/(?:^#|&)error=/.test(location.hash)){history.replaceState(null,'',location.pathname+location.search)}}
async function initAuth(){if(!sb)return;clearLegacyAuthErrorHash();const{data}=await sb.auth.getSession();currentUser=data?.session?.user||null;if(currentUser){pendingOtpEmail='';localStorage.removeItem('enare_ccp_pending_otp_email');startRealtime();await syncAll()}sb.auth.onAuthStateChange(async(ev,session)=>{currentUser=session?.user||null;if(currentUser){pendingOtpEmail='';localStorage.removeItem('enare_ccp_pending_otp_email');startRealtime();setTimeout(syncAll,0)}else{stopRealtime();setCloud('Somente local');render()}})}
function startRealtime(){if(!sb||!currentUser||realtimeChannel)return;realtimeChannel=sb.channel('quiz-progress-'+currentUser.id).on('postgres_changes',{event:'*',schema:'public',table:'quiz_progress',filter:'user_id=eq.'+currentUser.id},payload=>{const r=payload.new;if(!r||!EXAMS[r.quiz_id])return;if((Date.parse(r.updated_at||'')||0)>stateTime(states[r.quiz_id])){states[r.quiz_id]=normalizeState(r.progress,EXAMS[r.quiz_id]);saveLocal(r.quiz_id);render()}}).subscribe()}
function stopRealtime(){if(sb&&realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=null}
function score(id){const e=EXAMS[id],s=states[id],valid=e.questions.filter(q=>q.answer);let correct=0;const areas={},topics={};for(const q of e.questions){if(!areas[q.area])areas[q.area]={correct:0,total:0,answered:0};if(!topics[q.topic])topics[q.topic]={correct:0,total:0,answered:0};if(q.answer){areas[q.area].total++;topics[q.topic].total++}const a=s.answers[q.number];if(a&&q.answer){areas[q.area].answered++;topics[q.topic].answered++;if(a===q.answer){correct++;areas[q.area].correct++;topics[q.topic].correct++}}}return{correct,total:valid.length,pct:valid.length?Math.round(correct/valid.length*100):0,areas,topics,wrong:e.questions.filter(q=>q.answer&&s.answers[q.number]&&s.answers[q.number]!==q.answer).map(q=>q.number)}}
function answeredCount(id){return Object.keys(states[id].answers).length}
function reviewedCount(id){return Object.values(states[id].review).filter(Boolean).length}

const ERROR_REASON_LABELS={nao_sabia:'Não sabia',detalhe:'Sabia, mas esqueci um detalhe',interpretacao:'Interpretei mal',duas:'Fiquei entre duas'};
function errorReasonHtml(id,q){const s=states[id],a=s.answers[q.number];if(!s.finished||!q.answer||!a||a===q.answer)return '';const sel=s.errorReasons?.[q.number]||'';return `<div class="error-reason-box"><div class="error-reason-title">Por que eu errei?</div><div class="error-reason-sub">Classifique enquanto a questão ainda está fresca. Isso fica salvo e sincronizado para orientar sua revisão.</div><div class="error-reason-chips">${Object.entries(ERROR_REASON_LABELS).map(([k,l])=>`<button class="errorchip ${sel===k?'active':''}" onclick="setErrorReason(${q.number},'${k}')">${l}</button>`).join('')}</div></div>`}
function setErrorReason(n,reason){if(!ERROR_REASON_LABELS[reason])return;const id=currentExamId,s=states[id],q=EXAMS[id].questions.find(x=>x.number===n),a=s.answers[n];if(!s.finished||!q?.answer||!a||a===q.answer)return;s.errorReasons[n]=reason;if(s.attemptId){const rec={attemptId:s.attemptId,question:n,reason,topic:q.topic,area:q.area,recordedAt:new Date().toISOString()};const i=s.errorHistory.findIndex(x=>x.attemptId===s.attemptId&&Number(x.question)===Number(n));if(i>=0)s.errorHistory[i]=rec;else s.errorHistory.push(rec);if(s.errorHistory.length>500)s.errorHistory=s.errorHistory.slice(-500)}saveState(id);renderExam()}
function errorProfileForAttempt(attemptId){const rows=[];for(const id of EXAM_IDS){for(const r of (states[id].errorHistory||[])){if(r?.attemptId===attemptId&&ERROR_REASON_LABELS[r.reason])rows.push(r)}}const counts={nao_sabia:0,detalhe:0,interpretacao:0,duas:0};for(const r of rows)counts[r.reason]++;return{classified:rows.length,counts,rows}}
function errorProfileCompact(attemptId,wrong){const p=errorProfileForAttempt(attemptId);if(!wrong)return '<span class="muted">Sem erros</span>';if(!p.classified)return `<span class="muted">0/${wrong} classificados</span>`;const parts=Object.entries(p.counts).filter(([,n])=>n).map(([k,n])=>`${ERROR_REASON_LABELS[k]}: ${n}`);return `<div class="error-profile-cell"><b>${p.classified}/${wrong} classificados</b><br>${parts.join(' · ')}</div>`}
function errorProfileBox(id){const s=states[id],sc=score(id),wrong=sc.wrong.length;if(!wrong)return '';const p=errorProfileForAttempt(s.attemptId);return `<div class="error-summary"><b>Perfil dos erros</b> · ${p.classified}/${wrong} classificados<div class="error-summary-grid">${Object.entries(ERROR_REASON_LABELS).map(([k,l])=>`<span class="error-summary-chip">${l}: <b>${p.counts[k]||0}</b></span>`).join('')}</div>${p.classified<wrong?'<div class="tiny">Antes de iniciar outra tentativa, passe pelas questões erradas e classifique a causa do erro.</div>':''}</div>`}

function examCard(id){const e=EXAMS[id],s=states[id],sc=score(id),ans=answeredCount(id),n=e.questions.length,isSim=SIM_IDS.includes(id);return `<div class="card examcard">${isSim?'<span class="simtag">SIMULADO DE PREPARAÇÃO</span>':''}<div class="row space"><div><h3>${e.label}</h3><div class="muted" style="font-size:12px">${esc(e.subtitle||'')}<br>${e.order}</div></div>${s.finished?`<div class="bigpct">${sc.pct}%</div>`:''}</div><div class="progress"><div class="bar" style="width:${ans/n*100}%"></div></div><div class="metrics"><div class="metric"><b>${ans}/${n}</b><span>respondidas</span></div><div class="metric"><b>${reviewedCount(id)}</b><span>para revisar</span></div><div class="metric"><b>${s.finished?sc.correct+'/'+sc.total:'—'}</b><span>acertos</span></div></div><div class="row"><button class="primary" onclick="openExam('${id}')">${ans?'Continuar':'Iniciar prova'}</button>${s.finished?`<button class="secondary" onclick="openExam('${id}',{status:'wrong'})">Ver erradas</button>`:''}</div></div>`}
function simEvolutionHtml(){return `<div class="evolution">${SIM_IDS.map(id=>{const e=EXAMS[id];const full=attempts.filter(a=>a.quiz_id===id&&a.attempt_type==='full').sort((a,b)=>Date.parse(a.finished_at)-Date.parse(b.finished_at));const latest=full.length?full[full.length-1]:null;const best=full.length?Math.max(...full.map(a=>Number(a.percentage)||0)):null;const bars=full.slice(-8).map(a=>`<i title="${a.score}/${a.total} · ${Math.round(a.percentage)}%" style="height:${Math.max(4,Math.round(a.percentage)*.32)}px"></i>`).join('');return `<div class="card evocard"><h4>${e.label.replace(' — ENARE CCP','')}</h4>${latest?`<div class="evoscore">${latest.score}/${latest.total}</div><div class="evometa">Último: ${Math.round(latest.percentage)}% · Melhor: ${Math.round(best)}%<br>${full.length} tentativa${full.length===1?'':'s'} completa${full.length===1?'':'s'}</div><div class="trend">${bars}</div>`:`<div class="evoscore">—</div><div class="evometa">Ainda sem tentativa finalizada.</div>`}</div>`}).join('')}</div>`}
function officialFragilitiesHtml(){const agg=aggregateTopics('all','official');const items=Object.entries(agg).filter(([,x])=>x.gradedAnswered>0).sort((a,b)=>topicPct(a[1])-topicPct(b[1])||b[1].gradedAnswered-a[1].gradedAnswered).slice(0,8);if(!items.length)return '';return `<div class="card fragility-card" style="margin-top:18px"><div class="row space"><div><h3 style="margin:0">Fragilidades nas provas oficiais</h3><div class="muted" style="font-size:12px;margin-top:3px">Calculado apenas com ENARE 2024/25 e 2025/26 — sem a inflação dos simulados.</div></div><button class="secondary" onclick="openTopicsFiltered('official','all')">Abrir análise oficial</button></div><div class="fragility-list">${items.map(([t,x])=>`<div class="fragility-item"><span>${esc(t)} <span class="muted">· ${x.correct}/${x.gradedAnswered}</span></span><b>${topicPct(x)}%</b></div>`).join('')}</div></div>`}
function renderHome(){view='home';currentExamId=null;$('#app').innerHTML=`${authBoxHtml()}<div class="section-title"><div><h2>Provas oficiais</h2><div class="muted">As duas edições usadas como matriz do banco. Seu progresso original foi preservado.</div></div></div><div class="homegrid">${OFFICIAL_IDS.map(examCard).join('')}</div>${officialFragilitiesHtml()}<div class="section-title" style="margin-top:28px"><div><h2>Simulados de preparação</h2><div class="muted">8 provas autorais/adaptadas no formato-alvo: 40 Otorrino + 40 Cirurgia Geral. Os simulados 6–8 têm calibração deliberadamente mais difícil.</div></div></div><div class="homegrid">${SIM_IDS.map(examCard).join('')}</div><div class="section-title" style="margin-top:28px"><div><h2>Evolução nos simulados</h2><div class="muted">Mostra a última nota, a melhor porcentagem e suas tentativas completas em cada simulado.</div></div><button class="secondary" onclick="go('performance')">Abrir histórico completo</button></div>${simEvolutionHtml()}<div class="section-title" style="margin-top:28px"><div><h2>Atalhos de estudo</h2><div class="muted">Revise por padrão de erro, tema ou histórico.</div></div></div><div class="homegrid"><div class="card pad"><h3 style="margin-top:0">Questões erradas</h3><p class="muted">Abra qualquer prova finalizada, veja o comentário e classifique a causa de cada erro.</p><div class="row">${EXAM_IDS.filter(id=>states[id].finished).map(id=>`<button class="secondary" onclick="openExam('${id}',{status:'wrong'})">${EXAMS[id].label}</button>`).join('')||'<span class="muted">Finalize uma prova para liberar.</span>'}</div></div><div class="card pad"><h3 style="margin-top:0">Revisão por tema</h3><p class="muted">Agrupa as ${TOTAL_BANK_QUESTIONS} questões do banco e permite separar provas oficiais dos simulados.</p><button class="primary" onclick="go('topics')">Abrir temas</button></div><div class="card pad methodbox"><h3 style="margin-top:0">Como usar os simulados 6–8</h3><p class="muted"><b>6:</b> calibrador difícil, próximo/acima do ENARE. <b>7:</b> diagnóstico muito difícil para expor lacunas. <b>8:</b> prova-alvo final, novamente calibrada para o nível da prova. Comentários aparecem após a correção.</p></div></div>`;setNav();setCloud(currentUser?'Sincronizado':'Somente local',currentUser?'ok':'')}

function go(v){if(v==='home')return renderHome();if(v==='performance')return renderPerformance();if(v==='topics')return renderTopics()}
function openTopicsFiltered(source='all',scope='all'){topicsSource=source;topicsScope=scope;renderTopics()}
function setNav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function openExam(id,opts={}){currentExamId=id;view='exam';const s=states[id];if(opts.status)s.statusFilter=opts.status;if(opts.topic)s.topicFilter=opts.topic;const vis=visibleQuestions(id);if(vis.length&&!vis.some(q=>q.number===s.current))s.current=vis[0].number;saveState(id,{skipCloud:true,preserveTime:true});renderExam();setNav()}
function visibleQuestions(id){const e=EXAMS[id],s=states[id],sc=score(id);return e.questions.filter(q=>{if(s.topicFilter!=='all'&&q.topic!==s.topicFilter)return false;if(s.statusFilter==='unanswered'&&s.answers[q.number])return false;if(s.statusFilter==='review'&&!s.review[q.number])return false;if(s.statusFilter==='wrong'&&(!s.finished||!(q.answer&&s.answers[q.number]&&s.answers[q.number]!==q.answer)))return false;return true})}
function renderExam(){const id=currentExamId,e=EXAMS[id],s=states[id],vis=visibleQuestions(id);if(!vis.length){s.current=1}else if(!vis.some(q=>q.number===s.current))s.current=vis[0].number;const q=e.questions.find(x=>x.number===s.current)||e.questions[0];const sc=score(id),topics=[...new Set(e.questions.map(x=>x.topic))].sort();$('#app').innerHTML=`<div class="exam-layout"><section><div class="card question ${s.finished?'finished':''}">${q.answer?'':`<div class="banner">Questão anulada no gabarito oficial — não entra na nota.</div>`}<div class="qmeta"><div><div class="qnum">Questão ${q.number} · ${e.label}</div><div class="area">${esc(q.area)}</div><div class="topic">${esc(q.topic)}</div></div><button class="reviewbtn" onclick="toggleReview()">${s.review[q.number]?'★ Marcada':'☆ Marcar para revisar'}</button></div><div class="stem">${esc(q.stem)}</div><div id="opts"></div>${s.finished&&q.explanation?`<div class="explanation"><b>Comentário pós-correção</b><br>${esc(q.explanation)}</div>`:''}${errorReasonHtml(id,q)}<div class="actions"><button class="secondary" onclick="move(-1)">← Anterior</button><button class="primary" onclick="move(1)">Próxima →</button></div></div>${s.finished?resultHtml(id):''}</section><aside class="card side"><div class="row space"><b>Filtros</b><span class="badge">${vis.length} questões</span></div><div class="filters" style="margin-top:10px"><select onchange="setTopic(this.value)"><option value="all">Todos os temas</option>${topics.map(t=>`<option ${s.topicFilter===t?'selected':''} value="${esc(t)}">${esc(t)}</option>`).join('')}</select><div class="filterchips">${[['all','Todas'],['unanswered','Não respondidas'],['review','Revisar'],['wrong','Erradas']].map(([v,l])=>`<button class="secondary ${s.statusFilter===v?'active':''}" ${v==='wrong'&&!s.finished?'disabled title="Disponível após finalizar"':''} onclick="setStatus('${v}')">${l}</button>`).join('')}</div></div><div class="grid">${vis.map(x=>`<button class="qbtn ${s.answers[x.number]?'answered':''} ${s.review[x.number]?'reviewed':''} ${x.number===s.current?'current':''} ${!x.answer?'anulada':''}" onclick="jump(${x.number})">${x.number}</button>`).join('')}</div><div class="footerBtns">${!s.finished?'<button class="primary" onclick="finishExam()">Finalizar e corrigir</button>':`<button class="secondary" onclick="retryWrong()">Refazer somente as erradas</button><button class="secondary" onclick="newAttempt()">Nova tentativa completa</button>`}<button class="secondary" onclick="syncAll()">Sincronizar agora</button></div><div class="tiny">Respondidas: ${answeredCount(id)}/${e.questions.length} · Revisar: ${reviewedCount(id)}. Questões anuladas não entram no cálculo.</div>${e.sourceNote?`<div class="source-note">${esc(e.sourceNote)}</div>`:''}</aside></div>`;
const box=$('#opts');for(const [letter,text] of Object.entries(q.options)){const d=document.createElement('div');d.className='opt'+(s.answers[q.number]===letter?' selected':'');if(s.finished&&q.answer===letter)d.classList.add('correct');if(s.finished&&s.answers[q.number]===letter&&q.answer&&letter!==q.answer)d.classList.add('wrong');d.innerHTML=`<div class="letter">${letter}</div><div>${esc(text)}</div>`;if(!s.finished)d.onclick=()=>answer(letter);box.appendChild(d)}setCloud(currentUser?'Sincronizado':'Somente local',currentUser?'ok':'')}

function resultHtml(id){const sc=score(id),s=states[id];return `<div class="card result"><div class="muted">Resultado desta tentativa</div><div class="score">${sc.correct}/${sc.total} · ${sc.pct}%</div><div class="split">${Object.entries(sc.areas).map(([a,x])=>`<div class="mini"><b>${esc(a)}</b><div>${x.correct}/${x.total} · ${x.total?Math.round(x.correct/x.total*100):0}%</div></div>`).join('')}</div>${errorProfileBox(id)}${SIM_IDS.includes(id)?'<div class="tiny" style="margin-top:10px">Este resultado entra automaticamente no quadro de evolução dos 8 simulados.</div>':''}<div class="row" style="margin-top:12px"><button class="secondary" onclick="go('performance')">Ver histórico</button><button class="secondary" onclick="go('topics')">Desempenho por tema</button>${sc.wrong.length?`<button class="secondary" onclick="setStatus('wrong')">Classificar meus erros</button>`:''}</div></div>`}

function answer(letter){const id=currentExamId,s=states[id];s.answers[s.current]=letter;saveState(id);renderExam()}
function toggleReview(){const s=states[currentExamId];s.review[s.current]=!s.review[s.current];saveState(currentExamId);renderExam()}
function jump(n){states[currentExamId].current=n;saveState(currentExamId);renderExam();window.scrollTo({top:0,behavior:'smooth'})}
function move(dir){const vis=visibleQuestions(currentExamId),s=states[currentExamId],i=Math.max(0,vis.findIndex(q=>q.number===s.current));if(!vis.length)return;const ni=Math.min(vis.length-1,Math.max(0,i+dir));s.current=vis[ni].number;saveState(currentExamId);renderExam();window.scrollTo({top:0,behavior:'smooth'})}
function setStatus(v){states[currentExamId].statusFilter=v;const vis=visibleQuestions(currentExamId);if(vis.length)states[currentExamId].current=vis[0].number;saveState(currentExamId);renderExam()}
function setTopic(v){states[currentExamId].topicFilter=v;const vis=visibleQuestions(currentExamId);if(vis.length)states[currentExamId].current=vis[0].number;saveState(currentExamId);renderExam()}
async function finishExam(){const id=currentExamId,e=EXAMS[id],s=states[id],unanswered=e.questions.filter(q=>q.answer&&!s.answers[q.number]).length;if(unanswered&&!confirm(`Ainda há ${unanswered} questão(ões) válidas sem resposta. Finalizar mesmo assim?`))return;s.finished=true;s.finishedAt=new Date().toISOString();if(!s.attemptId)s.attemptId=crypto.randomUUID();saveState(id);await recordAttempt(id);renderExam()}
async function recordAttempt(id){const s=states[id],sc=score(id),attempt={id:s.attemptId,user_id:currentUser?.id||null,quiz_id:id,attempt_type:s.attemptType||'full',score:sc.correct,total:sc.total,percentage:sc.pct,section_scores:sc.areas,topic_scores:sc.topics,finished_at:s.finishedAt||new Date().toISOString()};const i=attempts.findIndex(a=>a.id===attempt.id);if(i>=0)attempts[i]=attempt;else attempts.unshift(attempt);saveAttemptsLocal();if(sb&&currentUser){const payload={...attempt,user_id:currentUser.id};const{error}=await sb.from('quiz_attempts').upsert(payload,{onConflict:'id'});if(error)console.warn('Histórico cloud:',error.message)}}
async function ensureAttempt(id){const s=states[id];if(s.finished&&!s.attemptId){s.attemptId=crypto.randomUUID();s.finishedAt=s.finishedAt||new Date().toISOString();saveState(id);await recordAttempt(id)}}
function retryWrong(){const id=currentExamId,s=states[id],wrong=score(id).wrong;if(!wrong.length)return alert('Não há questões erradas para refazer.');for(const n of wrong)delete s.answers[n];s.finished=false;s.attemptId=null;s.attemptType='retry_wrong';s.finishedAt=null;s.statusFilter='unanswered';s.topicFilter='all';s.current=wrong[0];s.errorReasons={};saveState(id);renderExam()}
function newAttempt(){if(!confirm('Iniciar uma nova tentativa completa? O resultado anterior permanecerá no histórico, inclusive as causas de erro já classificadas.'))return;const id=currentExamId,old=states[id],fresh=defaultState();fresh.errorHistory=Array.isArray(old.errorHistory)?old.errorHistory:[];states[id]=fresh;saveState(id);renderExam()}
async function loadAttempts(){if(!sb||!currentUser)return;try{const{data,error}=await sb.from('quiz_attempts').select('*').eq('user_id',currentUser.id).order('finished_at',{ascending:false}).limit(100);if(error)throw error;const cloudIds=new Set((data||[]).map(a=>a.id));const pending=attempts.filter(a=>a?.id&&!cloudIds.has(a.id));for(const a of pending){const payload={...a,user_id:currentUser.id};const{error:upErr}=await sb.from('quiz_attempts').upsert(payload,{onConflict:'id'});if(upErr)console.warn('Histórico cloud:',upErr.message)}const map=new Map(attempts.map(a=>[a.id,a]));for(const a of data||[])map.set(a.id,a);for(const a of pending)map.set(a.id,{...a,user_id:currentUser.id});attempts=[...map.values()].sort((a,b)=>Date.parse(b.finished_at)-Date.parse(a.finished_at));saveAttemptsLocal()}catch(e){console.warn('Tabela de histórico ainda não configurada:',e.message)}}
function renderPerformance(){view='performance';currentExamId=null;const rows=[...attempts].sort((a,b)=>Date.parse(b.finished_at)-Date.parse(a.finished_at));$('#app').innerHTML=`${authBoxHtml()}<div class="section-title"><div><h2>Histórico de desempenho</h2><div class="muted">Cada finalização fica registrada. O perfil dos erros usa as classificações feitas após a correção.</div></div></div><div class="card pad tablewrap">${rows.length?`<table class="table"><thead><tr><th>Data</th><th>Prova</th><th>Tipo</th><th>Nota</th><th>Otorrino</th><th>Cirurgia</th><th>Perfil dos erros</th></tr></thead><tbody>${rows.map(a=>{const sec=a.section_scores||{},ent=sec['Otorrinolaringologia'],surg=sec['Cirurgia Geral']||sec['Cirurgia Geral e Área Cirúrgica Básica'],wrong=Math.max(0,Number(a.total||0)-Number(a.score||0));return `<tr><td>${new Date(a.finished_at).toLocaleString('pt-BR')}</td><td>${EXAMS[a.quiz_id]?.label||a.quiz_id}</td><td><span class="badge">${a.attempt_type==='retry_wrong'?'Revisão de erradas':'Completa'}</span></td><td><b>${a.score}/${a.total} · ${Math.round(a.percentage)}%</b></td><td>${ent?ent.correct+'/'+ent.total:'—'}</td><td>${surg?surg.correct+'/'+surg.total:'—'}</td><td>${errorProfileCompact(a.id,wrong)}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Finalize uma prova para começar seu histórico.</div>'}</div>`;setNav();setCloud(currentUser?'Sincronizado':'Somente local',currentUser?'ok':'')}

function isOtoArea(area){return String(area||'').toLowerCase().startsWith('otorr')}
function areaMatchesScope(area,scope){if(scope==='all')return true;if(scope==='oto')return isOtoArea(area);return !isOtoArea(area)}
function sourceIds(source){return source==='official'?OFFICIAL_IDS:source==='sim'?SIM_IDS:EXAM_IDS}
function aggregateTopics(scope='all',source='all'){const out={};for(const id of sourceIds(source)){const e=EXAMS[id],s=states[id];for(const q of e.questions){if(!areaMatchesScope(q.area,scope))continue;if(!out[q.topic])out[q.topic]={total:0,answered:0,gradedAnswered:0,correct:0,exams:{}};const x=out[q.topic];if(q.answer)x.total++;if(s.answers[q.number]&&q.answer){x.answered++;if(s.finished){x.gradedAnswered++;if(s.answers[q.number]===q.answer)x.correct++}}if(!x.exams[id])x.exams[id]=0;x.exams[id]++}}return out}
function setTopicsScope(scope){topicsScope=scope;renderTopics()}
function setTopicsSource(source){topicsSource=source;renderTopics()}
function topicPct(x){return x.gradedAnswered?Math.round(x.correct/x.gradedAnswered*100):null}
function topicTone(p){if(p===null)return 'na';if(p>=70)return 'good';if(p>=50)return 'mid';return 'weak'}
function topicInitials(t){return t.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function topicScopeLabel(){return topicsScope==='oto'?'Otorrinolaringologia':topicsScope==='surg'?'Cirurgia Geral':'Global'}
function topicSourceLabel(){return topicsSource==='official'?'Provas oficiais':topicsSource==='sim'?'Simulados':'Todas as fontes'}
function renderTopics(){view='topics';currentExamId=null;const agg=aggregateTopics(topicsScope,topicsSource);const entries=Object.entries(agg).sort((a,b)=>{const pa=topicPct(a[1]),pb=topicPct(b[1]);if(pa===null&&pb===null)return a[0].localeCompare(b[0],'pt-BR');if(pa===null)return 1;if(pb===null)return -1;return pb-pa||a[0].localeCompare(b[0],'pt-BR')});const graded=entries.filter(([,x])=>x.gradedAnswered);const totalCorrect=graded.reduce((n,[,x])=>n+x.correct,0),totalGraded=graded.reduce((n,[,x])=>n+x.gradedAnswered,0);const overall=totalGraded?Math.round(totalCorrect/totalGraded*100):null;const best=graded.length?[...graded].sort((a,b)=>topicPct(b[1])-topicPct(a[1])||b[1].gradedAnswered-a[1].gradedAnswered)[0]:null;const critical=graded.length?[...graded].sort((a,b)=>topicPct(a[1])-topicPct(b[1])||b[1].gradedAnswered-a[1].gradedAnswered)[0]:null;const bestPct=best?topicPct(best[1]):null,criticalPct=critical?topicPct(critical[1]):null;$('#app').innerHTML=`${authBoxHtml()}<div class="topic-dashboard"><div class="section-title"><div><h2>Temas</h2><div class="muted">Seu desempenho por assunto. Separe área e fonte para não misturar a régua das provas oficiais com os simulados.</div></div><div class="scope-note">Visão atual: <b>${topicScopeLabel()} · ${topicSourceLabel()}</b></div></div><div class="topic-filter-stack"><div><div class="source-filter-label">Área</div><div class="topic-tabs"><button class="${topicsScope==='all'?'active':''}" onclick="setTopicsScope('all')">Global</button><button class="${topicsScope==='oto'?'active':''}" onclick="setTopicsScope('oto')">Otorrino</button><button class="${topicsScope==='surg'?'active':''}" onclick="setTopicsScope('surg')">Cirurgia Geral</button></div></div><div><div class="source-filter-label">Fonte</div><div class="topic-tabs"><button class="${topicsSource==='all'?'active':''}" onclick="setTopicsSource('all')">Todas</button><button class="${topicsSource==='official'?'active':''}" onclick="setTopicsSource('official')">Provas oficiais</button><button class="${topicsSource==='sim'?'active':''}" onclick="setTopicsSource('sim')">Simulados</button></div></div></div><div class="topic-summary-grid"><div class="card topic-summary-card"><div class="topic-summary-icon">↗</div><div><div class="topic-summary-label">Média geral</div><div class="topic-summary-value">${overall===null?'—':overall+'%'}</div><div class="topic-summary-sub">${totalGraded?`${totalCorrect}/${totalGraded} questões corrigidas`:'Finalize provas para calcular'}</div></div></div><div class="card topic-summary-card"><div class="topic-summary-icon">★</div><div><div class="topic-summary-label">Melhor tema</div><div class="topic-summary-value" style="font-size:${best&&best[0].length>18?'20':'24'}px">${best?esc(best[0]):'—'}</div><div class="topic-summary-sub">${best?bestPct+'% de acerto · '+best[1].gradedAnswered+' corrigidas':'Sem dados corrigidos'}</div></div></div><div class="card topic-summary-card critical"><div class="topic-summary-icon">!</div><div><div class="topic-summary-label">Tema crítico</div><div class="topic-summary-value" style="font-size:${critical&&critical[0].length>18?'20':'24'}px">${critical?esc(critical[0]):'—'}</div><div class="topic-summary-sub">${critical?criticalPct+'% de acerto · '+critical[1].gradedAnswered+' corrigidas':'Sem dados corrigidos'}</div></div></div></div><div class="card topic-list-card"><div class="topic-list-head"><div><h3>Desempenho por tema</h3><div class="muted" style="font-size:12px">Ordenado do maior para o menor percentual de acerto. Veja também o número de questões corrigidas para interpretar percentuais extremos.</div></div><span class="badge">${entries.length} temas</span></div>${entries.length?entries.map(([t,x])=>{const pct=topicPct(x),tone=topicTone(pct),w=pct===null?0:pct;return `<div class="topic-row ${tone}"><div class="topic-icon">${esc(topicInitials(t))}</div><div><div class="topic-name">${esc(t)}</div><div class="topic-meta">${x.gradedAnswered?`${x.correct}/${x.gradedAnswered} corrigidas · ${x.total} questões nesta fonte`:x.answered?`${x.answered} respondidas · finalize para corrigir`:`${x.total} questões nesta fonte · ainda não corrigidas`}</div><div class="topic-bar-track"><div class="topic-bar-fill" style="width:${w}%"></div></div></div><div class="topic-pct ${pct===null?'na':''}">${pct===null?'—':pct+'%'}</div><div class="topic-review">${sourceIds(topicsSource).filter(id=>x.exams[id]).map(id=>`<button class="secondary" onclick="openExam('${id}',{topic:${JSON.stringify(t)},status:'all'})">${EXAMS[id].label}</button>`).join('')}</div></div>`}).join(''):'<div class="empty">Ainda não há temas corrigidos nesta combinação de filtros.</div>'}</div>${critical?`<div class="topic-cta"><div><div style="font-size:12px;opacity:.8">Prioridade sugerida nesta visão</div><div>Revisar ${esc(critical[0])} · ${criticalPct}% de acerto</div></div><button class="secondary" onclick="openExam('${sourceIds(topicsSource).find(id=>critical[1].exams[id])}',{topic:${JSON.stringify(critical[0])},status:'all'})">Abrir questões →</button></div>`:''}</div>`;setNav();setCloud(currentUser?'Sincronizado':'Somente local',currentUser?'ok':'')}

function render(){if(view==='exam'&&currentExamId)return renderExam();if(view==='performance')return renderPerformance();if(view==='topics')return renderTopics();return renderHome()}
window.addEventListener('DOMContentLoaded',async()=>{renderHome();for(const id of EXAM_IDS)await ensureAttempt(id);await initAuth();render()});
</script></body></html>
