"explanation":"Falha do controle endoscópico em hemorragia ulcerosa importante exige escalonamento para embolização angiográfica ou cirurgia, conforme recursos e estabilidade.","difficulty":"hard","fragility":false},{"number":47,"area":"Cirurgia Geral","stem":"Paciente de 58 anos com câncer de cólon direito e história familiar de câncer colorretal precoce apresenta perda de expressão de MLH1/PMS2 na imunohistoquímica. Qual é um passo importante antes de atribuir automaticamente o caso à síndrome de Lynch?","options":{"A":"Realizar pesquisa de APC como único teste.","B":"Solicitar apenas CEA e, se normal, excluir Lynch.","C":"Investigar causas esporádicas de deficiência de MLH1, como hipermetilação do promotor/BRAF conforme o contexto, e então direcionar teste germinativo.","D":"Excluir predisposição hereditária porque o tumor é de cólon direito.","E":"Concluir Lynch sem qualquer teste adicional."},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"Perda de MLH1/PMS2 pode ocorrer esporadicamente. Testes de triagem para hipermetilação/BRAF ajudam a selecionar quem deve seguir para investigação germinativa de Lynch.","difficulty":"hard","fragility":true},{"number":48,"area":"Cirurgia Geral","stem":"Paciente de 33 anos apresenta centenas de pólipos adenomatosos colorretais e história familiar de colectomia precoce. Qual síndrome é mais provável?","options":{"A":"Polipose hiperplásica esporádica obrigatoriamente benigna.","B":"Polipose adenomatosa familiar associada ao gene APC.","C":"Síndrome de Lynch, que tipicamente causa centenas de pólipos.","D":"Doença de Crohn.","E":"Síndrome de Peutz-Jeghers sem pólipos hamartomatosos."},"answer":"B","topic":"Coloproctologia e Intestino","explanation":"Centenas a milhares de adenomas em idade jovem são clássicos de PAF por mutação germinativa em APC.","difficulty":"hard","fragility":false},{"number":49,"area":"Cirurgia Geral","stem":"Paciente com apendicite aguda não perfurada será operado. Qual afirmação sobre antibiótico é mais correta?","options":{"A":"Antifúngico profilático deve ser associado.","B":"Vancomicina isolada é o esquema padrão por cobrir anaeróbios.","C":"Nenhum antibiótico é necessário porque a cirurgia remove o foco.","D":"Antibiótico pós-operatório por 14 dias é obrigatório em todo caso.","E":"Antibioticoprofilaxia perioperatória com cobertura para gram-negativos e anaeróbios é indicada; após apendicectomia de caso não complicado, prolongamento rotineiro não é necessário."},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Na apendicite não complicada, antibiótico pré/perioperatório é indicado; terapia prolongada após controle cirúrgico não traz benefício rotineiro.","difficulty":"hard","fragility":true},{"number":50,"area":"Cirurgia Geral","stem":"Paciente com adenocarcinoma de reto médio localmente avançado, sem metástases, apresenta ameaça à margem circunferencial na RM. Qual exame é central para o estadiamento locorregional e planejamento?","options":{"A":"Enema opaco.","B":"Ultrassom de abdome total como único exame.","C":"Ressonância magnética de pelve com protocolo para reto.","D":"Radiografia simples de abdome.","E":"Cintilografia de tireoide."},"answer":"C","topic":"Coloproctologia e Intestino","explanation":"A RM de pelve é fundamental no câncer de reto por avaliar mesorreto, fáscia mesorretal, margem circunferencial e outras características que orientam terapia neoadjuvante/cirurgia.","difficulty":"hard","fragility":false},{"number":51,"area":"Cirurgia Geral","stem":"Após apendicectomia por quadro inicialmente interpretado como apendicite, o anatomopatológico revela adenocarcinoma de células caliciformes (goblet cell adenocarcinoma) invasivo do apêndice, sem disseminação peritoneal na imagem. Qual ampliação cirúrgica oncológica costuma ser discutida?","options":{"A":"Apendicectomia é sempre suficiente independentemente do estágio.","B":"Radioterapia pélvica isolada.","C":"Colectomia total obrigatória em todos os casos.","D":"Hemicolectomia direita oncológica com linfadenectomia regional em doença localizada e paciente candidato.","E":"Quimioterapia substitui qualquer ressecção do tumor primário localizado."},"answer":"D","topic":"Coloproctologia e Intestino","explanation":"Goblet cell adenocarcinoma do apêndice tem comportamento mais próximo de adenocarcinoma do que de tumor neuroendócrino clássico. Em doença localizada, costuma-se discutir hemicolectomia direita para tratamento e estadiamento linfonodal.","difficulty":"hard","fragility":true},{"number":52,"area":"Cirurgia Geral","stem":"Paciente com diverticulite aguda apresenta abscesso pericólico de 5 cm, sem peritonite difusa e hemodinamicamente estável. Qual estratégia costuma ser apropriada?","options":{"A":"Apenas laxativos e dieta rica em fibras.","B":"Colonoscopia durante a fase aguda com insuflação máxima para drenagem.","C":"Alta sem antibiótico.","D":"Colectomia total obrigatória imediata em todos os abscessos.","E":"Antibiótico e drenagem percutânea do abscesso quando tecnicamente factível, reservando cirurgia para falha ou complicações."},"answer":"E","topic":"Coloproctologia e Intestino","explanation":"Abscessos maiores em diverticulite complicada frequentemente são manejados com antibiótico e drenagem percutânea, se possível; cirurgia fica para falha, instabilidade ou outras indicações.","difficulty":"hard","fragility":false},{"number":53,"area":"Cirurgia Geral","stem":"Paciente com colelitíase apresenta icterícia, colúria e colangite. Ultrassom mostra colédoco dilatado e cálculo distal. Após estabilização e antibiótico, qual medida é prioritária para controle da obstrução?","options":{"A":"Esplenectomia.","B":"Drenagem biliar, tipicamente por CPRE terapêutica quando disponível e apropriada.","C":"Colonoscopia urgente.","D":"Colecistectomia eletiva isolada meses depois, sem descompressão.","E":"Biópsia hepática."},"answer":"B","topic":"Hepatobiliopancreática","explanation":"Colangite associada a obstrução requer antibiótico e drenagem biliar precoce conforme gravidade; CPRE é a via habitual quando factível.","difficulty":"hard","fragility":true},{"number":54,"area":"Cirurgia Geral","stem":"Paciente com suspeita intermediária de coledocolitíase, sem colangite, tem ultrassom sem cálculo evidente. Qual estratégia evita CPRE diagnóstica desnecessária?","options":{"A":"Realizar CPRE em todo paciente com colelitíase.","B":"Excluir coledocolitíase definitivamente porque o ultrassom não mostrou cálculo.","C":"Fazer laparotomia exploradora.","D":"Confirmar com método menos invasivo, como colangiorressonância ou ecoendoscopia, antes de CPRE terapêutica.","E":"Solicitar apenas radiografia simples."},"answer":"D","topic":"Hepatobiliopancreática","explanation":"Em probabilidade intermediária, MRCP ou EUS podem confirmar cálculo com menor risco. CPRE deve ser preferencialmente terapêutica.","difficulty":"hard","fragility":true},{"number":55,"area":"Cirurgia Geral","stem":"Durante colecistectomia laparoscópica, o cirurgião busca a “visão crítica de segurança”. Qual conjunto é essencial antes de seccionar estruturas?","options":{"A":"Expor obrigatoriamente toda a artéria hepática comum.","B":"Dissecar o colédoco circunferencialmente para confirmar anatomia.","C":"Identificar apenas uma estrutura e clipá-la rapidamente.","D":"Limpar o triângulo hepatocístico, descolar o terço inferior da vesícula do leito hepático e visualizar apenas duas estruturas entrando na vesícula.","E":"Realizar colangiografia antes de qualquer dissecção em todos os casos."},"answer":"D","topic":"Hepatobiliopancreática","explanation":"A visão crítica exige três elementos: clareamento do triângulo, descolamento da porção inferior da vesícula do leito e duas — apenas duas — estruturas entrando na vesícula.","difficulty":"hard","fragility":true},{"number":56,"area":"Cirurgia Geral","stem":"Paciente com pancreatite aguda biliar leve evolui bem, sem colangite nem obstrução persistente. Qual é o momento preferível para colecistectomia?","options":{"A":"Apenas se ocorrer segunda pancreatite.","B":"Nunca, porque a pancreatite contraindica colecistectomia.","C":"Somente após 6 meses em todos os casos.","D":"Antes de qualquer ressuscitação volêmica nas primeiras duas horas.","E":"Na mesma internação, após melhora clínica, para reduzir recorrência."},"answer":"E","topic":"Hepatobiliopancreática","explanation":"Na pancreatite biliar leve, colecistectomia na internação índice reduz eventos biliares recorrentes. Pancreatite grave/coleções pode exigir adiamento.","difficulty":"hard","fragility":false},{"number":57,"area":"Cirurgia Geral","stem":"Paciente com pancreatite crônica, dor incapacitante e ducto pancreático principal marcadamente dilatado ao longo do corpo/cauda, sem massa dominante de cabeça. Qual operação de drenagem é classicamente indicada?","options":{"A":"Pancreatojejunostomia longitudinal (procedimento de Partington-Rochelle/Puestow modificado).","B":"Colecistectomia como tratamento da dor pancreática.","C":"Colectomia esquerda.","D":"Esplenectomia isolada.","E":"Procedimento de Whipple em todos os casos."},"answer":"A","topic":"Hepatobiliopancreática","explanation":"Ducto principal dilatado difusamente, sem massa dominante de cabeça, favorece procedimento de drenagem longitudinal.","difficulty":"hard","fragility":true},{"number":58,"area":"Cirurgia Geral","stem":"Na TC de pancreatite necrosante, há coleção encapsulada com material sólido e líquido 5 semanas após o início. O paciente tem febre persistente e sinais de infecção. A nomenclatura e o princípio terapêutico mais adequados são:","options":{"A":"Coleção líquida aguda; não pode conter necrose.","B":"Pseudocisto simples; laparotomia imediata obrigatória.","C":"Necrose pancreática delimitada (walled-off necrosis); quando possível, abordagem step-up com drenagem e necrosectomia apenas se necessária.","D":"Abscesso hepático; hepatectomia.","E":"Ascite pancreática; apenas diurético."},"answer":"C","topic":"Hepatobiliopancreática","explanation":"Após ~4 semanas, coleção encapsulada contendo necrose é WON. Em infecção sintomática, estratégia step-up minimamente invasiva costuma ser preferida à necrosectomia aberta inicial.","difficulty":"hard","fragility":false},{"number":59,"area":"Cirurgia Geral","stem":"Homem com hérnia inguinal apresenta saco herniário lateral aos vasos epigástricos inferiores, entrando pelo anel inguinal profundo. Trata-se de:","options":{"A":"Hérnia femoral.","B":"Hérnia inguinal direta.","C":"Hérnia de Spiegel.","D":"Hérnia inguinal indireta.","E":"Hérnia obturatória."},"answer":"D","topic":"Hérnias e Parede Abdominal","explanation":"A hérnia indireta passa lateralmente aos vasos epigástricos inferiores pelo anel profundo; a direta é medial, no triângulo de Hesselbach.","difficulty":"hard","fragility":false},{"number":60,"area":"Cirurgia Geral","stem":"Paciente apresenta abaulamento doloroso na parede abdominal lateral, na linha semilunar, abaixo do nível do umbigo. A TC mostra defeito aponeurótico entre músculos da parede, com saco herniário interparietal. Qual diagnóstico é mais provável?","options":{"A":"Hérnia inguinal direta.","B":"Hérnia de Spiegel.","C":"Hérnia obturatória.","D":"Hérnia lombar de Petit.","E":"Hérnia femoral."},"answer":"B","topic":"Hérnias e Parede Abdominal","explanation":"A hérnia de Spiegel ocorre através da fáscia de Spiegel junto à linha semilunar, frequentemente abaixo da linha arqueada, e pode permanecer interparietal, tornando o exame físico menos evidente.","difficulty":"hard","fragility":false},{"number":61,"area":"Cirurgia Geral","stem":"Paciente com hérnia encarcerada apresenta segmento da borda antimesentérica do intestino preso no defeito, sem obstrução completa do lúmen, mas com risco de necrose focal. Esse padrão é:","options":{"A":"Hérnia de Richter.","B":"Hérnia de Spiegel.","C":"Hérnia de Littre.","D":"Hérnia de Maydl.","E":"Hérnia de Amyand."},"answer":"A","topic":"Hérnias e Parede Abdominal","explanation":"Na hérnia de Richter, apenas parte da circunferência intestinal está encarcerada; pode haver estrangulamento sem quadro clássico de obstrução completa.","difficulty":"hard","fragility":false},{"number":62,"area":"Cirurgia Geral","stem":"Na abordagem laparoscópica de hérnia inguinal, a “zona de perigo” lateral aos vasos gonadais, onde passam nervos importantes e se deve evitar fixação traumática, é conhecida como:","options":{"A":"Espaço de Retzius.","B":"Ligamento de Cooper.","C":"Triângulo da morte.","D":"Triângulo de Hesselbach.","E":"Triângulo da dor."},"answer":"E","topic":"Hérnias e Parede Abdominal","explanation":"O triângulo da dor contém nervos, enquanto o triângulo da morte contém vasos ilíacos; conhecimento dessas regiões reduz complicações de fixação.","difficulty":"hard","fragility":false},{"number":63,"area":"Cirurgia Geral","stem":"Paciente com hipertensão resistente, hipocalemia e relação aldosterona/renina elevada tem teste confirmatório compatível com hiperaldosteronismo primário. TC mostra nódulo adrenal unilateral de 1,2 cm. Em adulto candidato à cirurgia, qual exame frequentemente é necessário para definir lateralização funcional antes da adrenalectomia?","options":{"A":"Colonoscopia.","B":"Cintilografia de paratireoide.","C":"Amostragem venosa adrenal (adrenal venous sampling), salvo exceções bem selecionadas.","D":"PAAF da adrenal.","E":"Teste de supressão com dexametasona como único método de lateralização."},"answer":"C","topic":"Endócrino e Tireoide","explanation":"Nódulos adrenais incidentais são comuns; AVS é padrão para diferenciar produção unilateral de bilateral em muitos candidatos cirúrgicos.","difficulty":"hard","fragility":true},{"number":64,"area":"Cirurgia Geral","stem":"Mulher apresenta virilização rápida, massa adrenal de 9 cm, heterogênea, com sinais de invasão local e produção androgênica. Qual princípio cirúrgico é mais adequado?","options":{"A":"Realizar enucleação laparoscópica da massa.","B":"Fazer biópsia percutânea antes de excluir feocromocitoma em qualquer situação.","C":"Realizar adrenalectomia parcial fragmentando a lesão.","D":"Observar por 2 anos porque tumores funcionantes são benignos.","E":"Suspeitar carcinoma adrenocortical e realizar ressecção oncológica em bloco por via que minimize ruptura tumoral, geralmente aberta quando grande/invasiva."},"answer":"E","topic":"Endócrino e Tireoide","explanation":"Massa grande, heterogênea, invasiva e virilizante é altamente suspeita para carcinoma adrenocortical. Ruptura/fragmentação deve ser evitada; ressecção oncológica completa é objetivo.","difficulty":"hard","fragility":true},{"number":65,"area":"Cirurgia Geral","stem":"Paciente com nódulo tireoidiano de 2,8 cm, citologia Bethesda IV (neoplasia folicular/suspeita para neoplasia folicular), sem evidência de doença contralateral ou metástase. Qual operação diagnóstica é classicamente apropriada em muitos casos?","options":{"A":"Lobectomia tireoidiana do lado acometido, com decisão de complementação conforme histologia e fatores de risco.","B":"Tireoidectomia total obrigatória em todos os Bethesda IV.","C":"Repetir PAAF indefinidamente até Bethesda II.","D":"Esvaziamento cervical lateral profilático.","E":"Radioiodoterapia sem diagnóstico histológico."},"answer":"A","topic":"Endócrino e Tireoide","explanation":"Bethesda IV não permite distinguir adenoma de carcinoma folicular pela citologia, pois é necessária avaliação capsular/vascular; lobectomia diagnóstica é abordagem clássica em casos selecionados.","difficulty":"hard","fragility":true},{"number":66,"area":"Cirurgia Geral","stem":"Paciente com feocromocitoma funcionante será submetido a adrenalectomia eletiva. Qual preparação farmacológica clássica reduz risco de crise intraoperatória?","options":{"A":"Anticoagulação plena como preparo obrigatório.","B":"Beta-bloqueio isolado iniciado antes do alfa-bloqueio.","C":"Bloqueio alfa-adrenérgico adequado antes de eventual beta-bloqueio, associado a expansão volêmica conforme tolerância.","D":"Diurético agressivo para reduzir volume intravascular.","E":"Nenhum preparo porque manipulação tumoral reduz catecolaminas."},"answer":"C","topic":"Endócrino e Tireoide","explanation":"No feocromocitoma, alfa-bloqueio precede beta-bloqueio para evitar vasoconstrição alfa não oposta; expansão de volume ajuda a corrigir contração crônica.","difficulty":"hard","fragility":false},{"number":67,"area":"Cirurgia Geral","stem":"Paciente com massa retroperitoneal grande e ressecável, imagem sugestiva de sarcoma, sem metástases. Qual princípio cirúrgico é mais adequado?","options":{"A":"Enucleação intralesional para preservar todos os órgãos, mesmo violando o tumor.","B":"Drenagem percutânea como tratamento definitivo.","C":"Radioterapia isolada sempre substitui cirurgia.","D":"Ressecção oncológica macroscópica completa em bloco, incluindo órgãos adjacentes quando necessário para obter margem adequada.","E":"Biópsia excisional fragmentada por laparoscopia."},"answer":"D","topic":"Oncologia Cirúrgica","explanation":"Sarcomas retroperitoneais exigem planejamento multidisciplinar e ressecção em bloco visando controle local; ruptura e cirurgia não planejada prejudicam resultados.","difficulty":"hard","fragility":true},{"number":68,"area":"Cirurgia Geral","stem":"Homem de 27 anos apresenta massa testicular sólida. Antes de orquiectomia, quais marcadores séricos são tradicionalmente úteis para estadiamento e seguimento?","options":{"A":"Cromogranina A isolada.","B":"AFP, beta-hCG e LDH.","C":"CEA, CA 19-9 e CA-125.","D":"Calcitonina, PTH e tireoglobulina.","E":"PSA, fosfatase ácida e CA 15-3."},"answer":"B","topic":"Oncologia Cirúrgica","explanation":"AFP, beta-hCG e LDH fazem parte da avaliação de tumores germinativos testiculares; devem ser dosados antes da orquiectomia quando possível.","difficulty":"hard","fragility":true},{"number":69,"area":"Cirurgia Geral","stem":"Paciente com polipose adenomatosa familiar desenvolve tumor desmoide mesentérico. Qual afirmação é correta?","options":{"A":"São carcinomas metastáticos e exigem linfadenectomia.","B":"Não têm relação com FAP.","C":"Sempre devem ser ressecados de emergência, independentemente de sintomas ou anatomia.","D":"São tumores de músculo liso benignos sem risco de invasão local.","E":"Tumores desmoides não metastatizam, mas podem ser localmente agressivos e o tratamento deve ser individualizado, frequentemente evitando cirurgia mutilante quando possível."},"answer":"E","topic":"Oncologia Cirúrgica","explanation":"Desmoides são neoplasias fibroblásticas sem potencial metastático, porém infiltrativas e recidivantes; em FAP intra-abdominal, cirurgia pode ser complexa e estratégias não operatórias são relevantes.","difficulty":"hard","fragility":true},{"number":70,"area":"Cirurgia Geral","stem":"Biópsia gástrica mostra linfoma MALT localizado e teste para Helicobacter pylori é positivo. Qual tratamento inicial pode levar à regressão em muitos casos?","options":{"A":"Quimioterapia de alta dose obrigatória antes de tratar H. pylori.","B":"Erradicação do Helicobacter pylori.","C":"Gastrectomia total obrigatória.","D":"Colectomia direita.","E":"Radioiodoterapia."},"answer":"B","topic":"Oncologia Cirúrgica","explanation":"Linfoma MALT gástrico H. pylori-positivo pode regredir após erradicação bacteriana; cirurgia não é primeira linha rotineira.","difficulty":"hard","fragility":true},{"number":71,"area":"Cirurgia Geral","stem":"Paciente politraumatizado apresenta hipotensão, turgência jugular, ausência de murmúrio vesicular à direita e desvio traqueal. Qual conduta deve preceder exames de imagem?","options":{"A":"Descompressão imediata do hemitórax seguida de drenagem torácica, por suspeita de pneumotórax hipertensivo.","B":"Intubar e observar sem descompressão.","C":"Aguardar radiografia de tórax para confirmar.","D":"Solicitar TC de tórax contrastada.","E":"Realizar pericardiocentese como primeira medida."},"answer":"A","topic":"Trauma e Emergências","explanation":"Pneumotórax hipertensivo é diagnóstico clínico em paciente instável e deve ser descomprimido imediatamente; imagem não pode atrasar o tratamento.","difficulty":"hard","fragility":false},{"number":72,"area":"Cirurgia Geral","stem":"Paciente vítima de trauma abdominal fechado está hemodinamicamente estável. TC mostra lesão esplênica com extravasamento arterial ativo, sem peritonite. Em centro com recurso disponível, qual estratégia pode preservar o baço?","options":{"A":"Angioembolização esplênica associada a manejo não operatório monitorizado.","B":"Laparotomia apenas para suturar pele.","C":"Punção percutânea do hematoma.","D":"Alta imediata sem observação.","E":"Esplenectomia obrigatória em toda lesão com blush, mesmo estável."},"answer":"A","topic":"Trauma e Emergências","explanation":"Em pacientes estáveis, embolização pode complementar o manejo não operatório de lesões esplênicas com blush/risco de falha, conforme grau e protocolo.","difficulty":"hard","fragility":true},{"number":73,"area":"Cirurgia Geral","stem":"Paciente com TCE grave apresenta deterioração neurológica, anisocoria e sinais de herniação enquanto aguarda neurocirurgia. Qual medida temporizadora pode ser utilizada para reduzir rapidamente pressão intracraniana, sem substituir tratamento definitivo?","options":{"A":"Terapia hiperosmolar com solução salina hipertônica ou manitol, conforme contexto hemodinâmico e protocolo.","B":"Corticosteroide sistêmico para TCE grave.","C":"Infusão rotineira de solução glicosada hipotônica.","D":"Hipercapnia deliberada prolongada.","E":"Hipotensão permissiva profunda."},"answer":"A","topic":"Trauma e Emergências","explanation":"Terapia hiperosmolar pode temporizar hipertensão intracraniana/hernição. Hipotensão e hipoxemia devem ser evitadas; corticosteroide não melhora TCE e pode aumentar mortalidade.","difficulty":"hard","fragility":true},{"number":74,"area":"Cirurgia Geral","stem":"Paciente desnutrido grave inicia nutrição agressiva e, em 48 horas, desenvolve fraqueza, arritmia e hipofosfatemia importante. Qual síndrome é mais provável?","options":{"A":"Síndrome compartimental abdominal.","B":"Crise tireotóxica.","C":"Hipercalcemia da malignidade.","D":"Síndrome carcinoide.","E":"Síndrome de realimentação."},"answer":"E","topic":"Nutrição e Metabolismo","explanation":"A realimentação aumenta insulina e desloca fósforo, potássio e magnésio para o intracelular; hipofosfatemia é marca clássica e pode causar falência cardíaca/respiratória.","difficulty":"hard","fragility":true},{"number":75,"area":"Cirurgia Geral","stem":"Paciente cirúrgico com trato gastrointestinal funcionante necessita suporte nutricional por período prolongado. Em geral, qual via deve ser preferida quando possível?","options":{"A":"Jejum até recuperação completa.","B":"Apenas hidratação venosa sem calorias.","C":"Nutrição parenteral periférica indefinida.","D":"Nutrição enteral.","E":"Nutrição parenteral total obrigatória."},"answer":"D","topic":"Nutrição e Metabolismo","explanation":"Se o trato gastrointestinal é funcional e acessível, a via enteral é preferida por manter integridade intestinal e apresentar menos complicações infecciosas/metabólicas que a parenteral em muitos cenários.","difficulty":"hard","fragility":false},{"number":76,"area":"Cirurgia Geral","stem":"Paciente com choque séptico recebeu fluidos e noradrenalina, mas necessita doses crescentes para manter pressão arterial média adequada. Qual agente é frequentemente utilizado como vasopressor adjuvante para reduzir necessidade de catecolamina?","options":{"A":"Nitroprussiato para potencializar vasoconstrição.","B":"Vasopressina em baixa dose, adicionada à noradrenalina em paciente selecionado.","C":"Dobutamina como substituto obrigatório mesmo sem disfunção cardíaca.","D":"Furosemida como segundo vasopressor.","E":"Propranolol para elevar a pressão arterial."},"answer":"B","topic":"Inflamação, Infecção e Sepse","explanation":"Quando a noradrenalina isolada é insuficiente, vasopressina em baixa dose é um adjuvante frequente no choque séptico. Dobutamina é inotrópico e fica para situações de baixo débito/disfunção cardíaca, não como vasopressor universal.","difficulty":"hard","fragility":false},{"number":77,"area":"Cirurgia Geral","stem":"Paciente com dor desproporcional ao exame, edema rapidamente progressivo, bolhas e toxicidade sistêmica tem suspeita de fasciíte necrotizante. Qual é o componente mais importante do tratamento?","options":{"A":"Aguardar cultura antes de operar.","B":"Desbridamento cirúrgico urgente e amplo, associado a antibióticos de amplo espectro e suporte intensivo.","C":"Antibiótico oral isolado.","D":"Incisão pequena apenas para drenagem, sem exploração fascial.","E":"Corticoide em alta dose."},"answer":"B","topic":"Inflamação, Infecção e Sepse","explanation":"Fasciíte necrotizante é emergência cirúrgica. O prognóstico depende de reconhecimento e desbridamento precoces; antibiótico não substitui controle de foco.","difficulty":"hard","fragility":false},{"number":78,"area":"Cirurgia Geral","stem":"Adulto consciente, orientado e com capacidade decisória recusa transfusão sanguínea por convicção pessoal, mesmo após compreender risco de morte. Qual princípio deve orientar a equipe?","options":{"A":"Declarar incapacidade apenas porque a escolha parece arriscada.","B":"Transfundir sempre porque o médico decide o melhor tratamento.","C":"Respeitar a recusa informada de um paciente com capacidade, documentando adequadamente e oferecendo alternativas possíveis.","D":"Pedir autorização da família para anular a decisão do paciente.","E":"Omitir os riscos para tentar obter consentimento."},"answer":"C","topic":"Perioperatório e Ética","explanation":"Autonomia inclui direito de recusar tratamento quando o paciente tem capacidade e foi adequadamente informado, mesmo que a decisão aumente risco.","difficulty":"hard","fragility":true},{"number":79,"area":"Cirurgia Geral","stem":"Paciente submetido a bypass gástrico em Y de Roux apresenta dor abdominal intermitente pós-prandial, náuseas e TC com sinal de redemoinho dos vasos mesentéricos. Qual complicação deve ser fortemente considerada?","options":{"A":"Estenose pilórica hipertrófica.","B":"Apendicite crônica obrigatória.","C":"Síndrome de dumping tardio como única hipótese.","D":"Divertículo de Meckel não complicado.","E":"Hérnia interna com possível obstrução/ischemia."},"answer":"E","topic":"Cirurgia Bariátrica","explanation":"Após bypass em Y de Roux, defeitos mesentéricos podem causar hérnia interna; o swirl sign e dor intermitente elevam a suspeita, e atraso pode levar a isquemia.","difficulty":"hard","fragility":false},{"number":80,"area":"Cirurgia Geral","stem":"No quinto dia pós-operatório de laparotomia, paciente apresenta drenagem serossanguinolenta súbita pela ferida e sensação de “estalo”. Ao exame, há deiscência fascial. Qual conduta é mais apropriada?","options":{"A":"Cobrir a ferida com compressas estéreis umedecidas e providenciar reexploração cirúrgica urgente para fechamento da fáscia, conforme condições.","B":"Aguardar cicatrização por segunda intenção da fáscia sem avaliação.","C":"Retirar todos os curativos e estimular deambulação sem restrição.","D":"Prescrever antibiótico oral e alta.","E":"Fechar apenas a pele no leito."},"answer":"A","topic":"Cicatrização e Feridas","explanation":"Deiscência fascial pós-operatória é emergência cirúrgica pelo risco de evisceração. Deve-se proteger vísceras/ferida e reoperar quando apropriado.","difficulty":"hard","fragility":false}]},"simulado_ccp_07":{"id":"simulado_ccp_07","label":"Simulado 7 — ENARE CCP","subtitle":"Nível diagnóstico — muito difícil · 80 questões","localKey":"enare_ccp_simulado_07_v1","order":"1–40 Otorrinolaringologia · 41–80 Cirurgia Geral","sourceNote":"Simulado autoral/fortemente adaptado para preparação ENARE R+ CCP. Comentários aparecem somente após a correção. Questões 6–8 foram calibradas para maior dificuldade e poder diagnóstico.","questions":[{"number":1,"area":"Otorrinolaringologia","stem":"Paciente com crises breves de vertigem ao rolar na cama apresenta no supine roll test nistagmo horizontal apogeotrópico bilateral, mais intenso quando vira a cabeça para a direita. Considerando a regra de lateralização mais usada para a variante apogeotrópica, qual lado é mais provavelmente acometido?","options":{"A":"Não é possível lateralizar em nenhuma circunstância.","B":"Direito.","C":"Canal posterior direito.","D":"Esquerdo.","E":"Bilateral obrigatoriamente."},"answer":"D","topic":"Vestibulologia","explanation":"Na variante horizontal apogeotrópica, o lado afetado costuma corresponder ao nistagmo menos intenso; se é mais intenso à direita, a hipótese é acometimento à esquerda.","difficulty":"very_hard","fragility":true},{"number":2,"area":"Otorrinolaringologia","stem":"Mulher de 39 anos tem episódios espontâneos de vertigem de 2 a 5 horas associados a cefaleia pulsátil, fotofobia e fonofobia. Audiometria é normal entre as crises e não há plenitude auricular. Qual hipótese é mais provável?","options":{"A":"VPPB de canal posterior.","B":"Neurite vestibular recorrente.","C":"Fístula perilinfática obrigatória.","D":"Migrânea vestibular.","E":"Doença de Ménière definitiva."},"answer":"D","topic":"Vestibulologia","explanation":"A duração variável em horas e os sintomas migranosos, sem perda auditiva flutuante típica, favorecem migrânea vestibular.","difficulty":"hard","fragility":false},{"number":3,"area":"Otorrinolaringologia","stem":"Paciente de 50 anos apresenta duas crises de vertigem espontânea com duração de 3 horas, hipoacusia neurossensorial documentada em baixas frequências à esquerda, zumbido e plenitude auricular ipsilateral. Qual diagnóstico é mais compatível?","options":{"A":"Doença de Ménière.","B":"Vertigem cervicogênica.","C":"Neurite vestibular.","D":"Tontura perceptual postural persistente.","E":"VPPB."},"answer":"A","topic":"Vestibulologia","explanation":"Crises espontâneas de 20 min a 12 h associadas a perda auditiva neurossensorial flutuante de baixas/médias frequências e sintomas aurais são características de Ménière.","difficulty":"hard","fragility":false},{"number":4,"area":"Otorrinolaringologia","stem":"Após neurite vestibular, paciente permanece por meses com tontura não rotatória quase diária, pior em ortostatismo, movimento e ambientes visualmente complexos. Exames vestibulares atuais não explicam a intensidade dos sintomas. Qual hipótese deve ser lembrada?","options":{"A":"Tontura perceptual postural persistente (PPPD).","B":"Síndrome de Ramsay Hunt.","C":"Otosclerose.","D":"VPPB posterior obrigatória.","E":"Colesteatoma."},"answer":"A","topic":"Vestibulologia","explanation":"PPPD é síndrome crônica com sintomas persistentes exacerbados por postura ereta, movimento e estímulos visuais, frequentemente após evento vestibular precipitante.","difficulty":"hard","fragility":false},{"number":5,"area":"Otorrinolaringologia","stem":"Audiometria de paciente com otosclerose mostra entalhe da via óssea em torno de 2 kHz, sem representar verdadeira perda coclear. Esse achado é chamado de:","options":{"A":"Fenômeno de Tullio.","B":"Sinal de Hennebert.","C":"Entalhe de Carhart.","D":"Recrutamento de Metz.","E":"Efeito Lombard."},"answer":"C","topic":"Otologia e Audiologia","explanation":"O entalhe de Carhart é uma elevação artificial do limiar ósseo, classicamente em 2 kHz, associada à fixação do estribo na otosclerose.","difficulty":"hard","fragility":false},{"number":6,"area":"Otorrinolaringologia","stem":"Paciente apresenta vertigem desencadeada por sons intensos e pressão no ouvido, autofonia e aparente componente condutivo na audiometria apesar de orelha média normal. TC de alta resolução sugere defeito sobre o canal semicircular superior. O diagnóstico é:","options":{"A":"Neurite vestibular.","B":"Deiscência do canal semicircular superior.","C":"Otite média secretora.","D":"Otosclerose fenestral.","E":"Doença de Ménière."},"answer":"B","topic":"Otologia e Audiologia","explanation":"A “terceira janela” pela deiscência do canal superior pode causar fenômeno de Tullio, vertigem induzida por pressão, autofonia e gap aéreo-ósseo com orelha média normal.","difficulty":"hard","fragility":false},{"number":7,"area":"Otorrinolaringologia","stem":"Adulto apresenta otalgia intensa, vesículas no pavilhão/conduto e paralisia facial periférica ipsilateral, acompanhadas de vertigem. Qual síndrome é mais provável?","options":{"A":"Síndrome de Eagle.","B":"Otosclerose.","C":"Síndrome de Ramsay Hunt por reativação do vírus varicela-zóster no gânglio geniculado.","D":"Paralisia de Bell idiopática sem infecção viral.","E":"Síndrome de Gradenigo."},"answer":"C","topic":"Otologia e Audiologia","explanation":"Herpes zoster ótico com paralisia facial caracteriza Ramsay Hunt; pode haver envolvimento vestibulococlear.","difficulty":"hard","fragility":false},{"number":8,"area":"Otorrinolaringologia","stem":"Criança com otite média aguda evolui com dor retroauricular, protrusão do pavilhão e apagamento do sulco retroauricular. TC demonstra coalescência das células mastoideas. Qual complicação é essa?","options":{"A":"Otosclerose.","B":"Colesteatoma congênito sem infecção.","C":"Otite externa necrotizante.","D":"Pericondrite isolada.","E":"Mastoidite aguda coalescente."},"answer":"E","topic":"Otologia e Audiologia","explanation":"Mastoidite coalescente resulta de destruição dos septos mastoideos e pode exigir antibiótico IV e abordagem cirúrgica conforme presença de abscesso/complicações.","difficulty":"hard","fragility":false},{"number":9,"area":"Otorrinolaringologia","stem":"Paciente diabético idoso apresenta otalgia intensa desproporcional, otorreia e tecido de granulação no assoalho do conduto auditivo externo. Qual agente e diagnóstico são clássicos?","options":{"A":"Candida albicans em Ménière.","B":"Pseudomonas aeruginosa em otite externa necrotizante.","C":"Haemophilus influenzae em schwannoma vestibular.","D":"EBV em colesteatoma.","E":"Streptococcus pyogenes em otosclerose."},"answer":"B","topic":"Otologia e Audiologia","explanation":"Otite externa necrotizante ocorre sobretudo em diabéticos/imunossuprimidos; Pseudomonas é o agente clássico e pode causar osteomielite de base de crânio.","difficulty":"hard","fragility":false},{"number":10,"area":"Otorrinolaringologia","stem":"Paciente com perda auditiva neurossensorial súbita unilateral percebida ao acordar há 24 horas, sem causa identificável. Qual princípio de manejo é mais adequado?","options":{"A":"Tratar como urgência otológica, confirmar audiometricamente e considerar corticosteroide precoce, além de investigação conforme o caso.","B":"Aguardar 3 meses porque a maioria é condutiva.","C":"Considerar o quadro sempre psicogênico se a otoscopia for normal.","D":"Prescrever apenas ceruminolítico.","E":"Realizar estapedotomia imediata."},"answer":"A","topic":"Otologia e Audiologia","explanation":"Perda neurossensorial súbita é urgência; a janela terapêutica é relevante e corticoide sistêmico/intratimpânico é utilizado conforme contexto e contraindicações.","difficulty":"hard","fragility":false},{"number":11,"area":"Otorrinolaringologia","stem":"Paciente imunossuprimido com cetoacidose diabética apresenta dor facial, febre, crosta negra nasal e oftalmoplegia rapidamente progressiva. Qual conduta é mais apropriada?","options":{"A":"Corticoide sistêmico isolado.","B":"Aguardar cultura por vários dias antes de iniciar tratamento.","C":"Desbridamento cirúrgico urgente e repetido quando necessário, antifúngico sistêmico ativo contra Mucorales e correção do fator predisponente.","D":"Apenas fluconazol oral.","E":"Polipectomia eletiva sem antifúngico."},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Mucormicose invasiva é emergência angioinvasiva; manejo exige antifúngico apropriado, desbridamento e correção de acidose/imunossupressão.","difficulty":"hard","fragility":false},{"number":12,"area":"Otorrinolaringologia","stem":"Paciente apresenta rinorreia aquosa unilateral contínua que piora ao inclinar-se para frente após trauma de base de crânio. Qual marcador no líquido nasal é altamente específico para LCR?","options":{"A":"Troponina.","B":"Alfa-fetoproteína.","C":"CEA.","D":"Beta-2 transferrina.","E":"Procalcitonina."},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"Beta-2 transferrina é um marcador altamente específico para LCR e ajuda a confirmar fístula liquórica nasal.","difficulty":"hard","fragility":false},{"number":13,"area":"Otorrinolaringologia","stem":"Adulto com massa nasal unilateral, epistaxe e remodelamento ósseo apresenta biópsia compatível com papiloma invertido. Qual afirmação é correta?","options":{"A":"Tratamento é exclusivamente corticoide tópico.","B":"É uma lesão vascular em que biópsia é proibida.","C":"É sempre bilateral e não recidiva.","D":"Nunca sofre transformação maligna.","E":"Apresenta tendência à recorrência e associação com carcinoma epidermoide, devendo-se identificar e ressecar seu sítio de implantação."},"answer":"E","topic":"Rinologia e Rinossinusites","explanation":"Papiloma invertido costuma ser unilateral, recidivante, ligado à parede lateral nasal/seios e tem associação com carcinoma epidermoide.","difficulty":"hard","fragility":false},{"number":14,"area":"Otorrinolaringologia","stem":"Paciente com rinossinusite crônica sem pólipos mantém sintomas apesar de tratamento clínico adequado. Para planejamento de cirurgia endoscópica funcional, o exame de imagem de escolha é:","options":{"A":"PET-CT.","B":"Ressonância magnética obrigatória para todos os casos como primeira escolha anatômica.","C":"Tomografia computadorizada dos seios paranasais, idealmente após controle da fase aguda quando possível.","D":"Cintilografia óssea.","E":"Radiografia de Waters isolada."},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"A TC fornece excelente detalhamento ósseo e anatômico dos seios e vias de drenagem, sendo fundamental no planejamento da cirurgia endoscópica.","difficulty":"hard","fragility":true},{"number":15,"area":"Otorrinolaringologia","stem":"Criança com obstrução nasal unilateral e secreção fétida há alguns dias, sem febre importante, deve ser considerada portadora de:","options":{"A":"Angiofibroma juvenil típico em lactente.","B":"Adenoidite obrigatória.","C":"Corpo estranho nasal até prova em contrário.","D":"Rinite alérgica bilateral.","E":"Atresia coanal bilateral."},"answer":"C","topic":"Rinologia e Rinossinusites","explanation":"Secreção unilateral fétida em criança é pista clássica de corpo estranho nasal.","difficulty":"hard","fragility":false},{"number":16,"area":"Otorrinolaringologia","stem":"Homem de 24 anos após trauma nasal apresenta obstrução bilateral progressiva e abaulamento flutuante do septo, sem melhora com vasoconstritor. Qual conduta é necessária?","options":{"A":"Observar até reabsorção espontânea em algumas semanas.","B":"Fazer turbinectomia.","C":"Prescrever anti-histamínico.","D":"Drenagem urgente de hematoma septal e antibioticoterapia conforme protocolo para evitar necrose cartilaginosa/abscesso.","E":"Realizar apenas redução de fratura nasal após 1 mês."},"answer":"D","topic":"Rinologia e Rinossinusites","explanation":"Hematoma septal deve ser drenado rapidamente; pode comprometer nutrição da cartilagem e levar a abscesso e deformidade em sela.","difficulty":"hard","fragility":false},{"number":17,"area":"Otorrinolaringologia","stem":"Cantora profissional perde capacidade de alcançar notas agudas após tireoidectomia, mas as pregas vocais são móveis bilateralmente. Qual lesão neural é mais provável?","options":{"A":"Lesão do hipoglosso.","B":"Lesão do ramo externo do nervo laríngeo superior, com disfunção do músculo cricotireóideo.","C":"Lesão do ramo interno do laríngeo superior causando paralisia da prega.","D":"Lesão do nervo facial.","E":"Lesão bilateral completa dos nervos recorrentes."},"answer":"B","topic":"Laringologia e Voz","explanation":"O ramo externo do laríngeo superior inerva o cricotireóideo, importante para tensão e frequência aguda; a mobilidade pode permanecer aparentemente preservada.","difficulty":"hard","fragility":true},{"number":18,"area":"Otorrinolaringologia","stem":"Paciente com disfonia apresenta lesão unilateral polipoide em borda livre de prega vocal, após episódio de abuso vocal, enquanto a prega contralateral não tem lesão simétrica. O diagnóstico mais provável é:","options":{"A":"Nódulos vocais típicos.","B":"Papilomatose laríngea obrigatória.","C":"Laringomalácia.","D":"Paralisia recorrencial.","E":"Pólipo vocal."},"answer":"E","topic":"Laringologia e Voz","explanation":"Pólipos vocais são frequentemente unilaterais e associados a fonotrauma; nódulos clássicos são bilaterais e simétricos.","difficulty":"hard","fragility":true},{"number":19,"area":"Otorrinolaringologia","stem":"Paciente com carcinoma glótico restrito a uma prega vocal, sem alteração da mobilidade e sem linfonodos clínicos, pergunta por que lesões glóticas iniciais costumam ter baixa incidência de metástase linfonodal. A melhor explicação é:","options":{"A":"A glote não possui circulação sanguínea.","B":"A glote verdadeira tem rede linfática relativamente escassa.","C":"Todos os tumores glóticos são in situ.","D":"A cartilagem tireoide impede qualquer disseminação.","E":"Tumores glóticos não são carcinomas epidermoides."},"answer":"B","topic":"Laringologia e Voz","explanation":"A escassez relativa de drenagem linfática nas pregas vocais verdadeiras contribui para menor risco nodal em câncer glótico inicial.","difficulty":"hard","fragility":false},{"number":20,"area":"Otorrinolaringologia","stem":"Paciente com estridor inspiratório e disfonia após tireoidectomia apresenta ambas as pregas vocais imóveis próximas da linha mediana. Qual complicação deve ser priorizada?","options":{"A":"Presbifonia.","B":"Paralisia bilateral de pregas vocais com risco de obstrução de via aérea.","C":"Lesão isolada do ramo externo do laríngeo superior.","D":"Edema de Reinke sem urgência.","E":"Nódulos vocais."},"answer":"B","topic":"Laringologia e Voz","explanation":"Paralisia bilateral em posição paramediana pode manter voz relativamente preservada, mas comprometer gravemente a via aérea e requer avaliação urgente.","difficulty":"hard","fragility":false},{"number":21,"area":"Otorrinolaringologia","stem":"Paciente com AOS grave e IMC elevado permanece sintomático apesar de uso aparentemente regular de CPAP. Antes de concluir “falha do CPAP”, qual informação é particularmente importante?","options":{"A":"Radiografia de tórax.","B":"Dados objetivos de adesão, vazamento e índice residual registrados pelo aparelho.","C":"Somente a opinião do acompanhante.","D":"Presença de desvio septal mínimo como prova de falha.","E":"Cor do aparelho."},"answer":"B","topic":"Sono e Via Aérea Superior","explanation":"CPAP pode falhar por baixa adesão, fuga, pressão inadequada ou eventos residuais; os dados objetivos do dispositivo devem ser revisados antes de mudar estratégia.","difficulty":"hard","fragility":false},{"number":22,"area":"Otorrinolaringologia","stem":"Adulto com AOS e retrognatia pergunta sobre aparelho intraoral de avanço mandibular. Qual perfil tende a ser mais apropriado?","options":{"A":"AOS leve a moderada ou intolerância ao CPAP em paciente com dentição/condições adequadas, após avaliação especializada.","B":"Paciente edêntulo sem possibilidade de retenção em qualquer dispositivo.","C":"Criança com hipertrofia adenotonsilar importante como primeira opção.","D":"Qualquer AOS grave com hipoxemia profunda como substituto obrigatório do CPAP.","E":"AOS central pura."},"answer":"A","topic":"Sono e Via Aérea Superior","explanation":"Appliances de avanço mandibular têm papel sobretudo em AOS leve/moderada ou intolerância ao CPAP, com seleção odontológica apropriada.","difficulty":"hard","fragility":false},{"number":23,"area":"Otorrinolaringologia","stem":"Polissonografia de adulto mostra IAH 18/h. Na ausência de outra peculiaridade, essa AOS é classificada como:","options":{"A":"Não classificável sem DISE.","B":"Moderada.","C":"Leve.","D":"Grave.","E":"Normal."},"answer":"B","topic":"Sono e Via Aérea Superior","explanation":"Em adultos: leve 5–14,9; moderada 15–29,9; grave ≥30 eventos/h.","difficulty":"hard","fragility":false},{"number":24,"area":"Otorrinolaringologia","stem":"Paciente com AOS considera cirurgia multinível. Qual exame endoscópico sob sedação pode ajudar a caracterizar padrão e nível de colapso dinâmico em casos selecionados?","options":{"A":"Drug-induced sleep endoscopy (DISE).","B":"Eletrococleografia.","C":"Nasofibroscopia com teste calórico.","D":"Broncoscopia rígida obrigatória em vigília.","E":"Audiometria."},"answer":"A","topic":"Sono e Via Aérea Superior","explanation":"DISE permite observar colapso da via aérea superior durante sedação semelhante ao sono e pode orientar seleção de procedimentos em casos apropriados.","difficulty":"hard","fragility":false},{"number":25,"area":"Otorrinolaringologia","stem":"Paciente apresenta placa branca oral que não se destaca à raspagem, sem causa irritativa evidente. Qual definição clínica é mais apropriada para leucoplasia oral?","options":{"A":"Lesão que nunca apresenta displasia.","B":"Sinônimo obrigatório de carcinoma invasivo.","C":"Toda placa branca removível por raspagem.","D":"Lesão específica causada sempre por Candida.","E":"Lesão/placa predominantemente branca que não pode ser caracterizada clinicamente ou patologicamente como outra doença definida, exigindo avaliação de risco e frequentemente biópsia."},"answer":"E","topic":"Cavidade Oral e Faringologia","explanation":"Leucoplasia é diagnóstico clínico de exclusão e tem potencial de displasia/malignização variável; lesões suspeitas precisam de avaliação histológica.","difficulty":"hard","fragility":false},{"number":26,"area":"Otorrinolaringologia","stem":"Paciente com tonsilite aguda evolui com dor cervical, rigidez, febre persistente e trombose da veia jugular interna após infecção orofaríngea. Qual síndrome é mais provável?","options":{"A":"Síndrome de Eagle.","B":"Síndrome de Lemierre.","C":"Síndrome de Ramsay Hunt.","D":"Síndrome de Gradenigo.","E":"Síndrome de Cogan."},"answer":"B","topic":"Cavidade Oral e Faringologia","explanation":"Lemierre associa infecção orofaríngea, tromboflebite séptica da jugular interna e possíveis êmbolos sépticos, classicamente por Fusobacterium necrophorum.","difficulty":"hard","fragility":false},{"number":27,"area":"Otorrinolaringologia","stem":"Paciente apresenta lesão eritroplásica persistente em assoalho oral. Em comparação com leucoplasia homogênea, qual afirmação é correta?","options":{"A":"Eritroplasia tem maior probabilidade de conter displasia grave/carcinoma e deve ser biopsiada com baixa tolerância à observação.","B":"Nunca está associada a carcinoma.","C":"É sempre causada por trauma dentário.","D":"Só deve ser investigada se causar dor.","E":"É considerada lesão de risco menor que candidíase."},"answer":"A","topic":"Cavidade Oral e Faringologia","explanation":"Eritroplasia é uma lesão potencialmente maligna de alto risco; histologia frequentemente mostra displasia grave, carcinoma in situ ou invasivo.","difficulty":"hard","fragility":false},{"number":28,"area":"Otorrinolaringologia","stem":"Criança com febre alta, odinofagia, sialorreia, posição em tripé e estridor apresenta suspeita de epiglotite. Qual princípio de manejo é essencial?","options":{"A":"Enviar para casa com anti-inflamatório.","B":"Priorizar via aérea em ambiente controlado com equipe experiente, evitando manipulação desnecessária da orofaringe em criança instável.","C":"Realizar tonsilectomia imediata.","D":"Deprimir a língua repetidamente no consultório para confirmar.","E":"Aguardar radiografia se houver sinais claros de obstrução."},"answer":"B","topic":"Cavidade Oral e Faringologia","explanation":"Epiglotite pode deteriorar rapidamente; assegurar via aérea em ambiente controlado precede exames que possam agitar/manipular o paciente.","difficulty":"hard","fragilit
